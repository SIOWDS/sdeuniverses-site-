<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChatPrim · 小学自学伙伴（四五六年级 · 语文 数学 英语）</title>
<meta name="description" content="ChatPrim：给小学四、五、六年级孩子的课程自学伙伴。语文、数学、英语。不报答案、不代写作文，一步一问，让道理从孩子自己手上长出来。学习档案只存在孩子自己的浏览器里。用家长自己的国内大模型 Key 运行。">
<link rel="canonical" href="https://sdeuniverses.com/education/chatprim/">
<meta property="og:title" content="ChatPrim · 小学自学伙伴">
<meta property="og:description" content="四五六年级 · 语文 数学 英语。不报答案，一步一问，让孩子自己学会。">
<meta name="theme-color" content="#FFF8EC">
<style>
:root{
  --paper:#FFF8EC; --paper2:#FFFFFF; --paper3:#FFF1D6; --ink:#2B2A33; --ink2:#6E6A7A;
  --edge:rgba(43,42,51,.14); --edge2:rgba(43,42,51,.07);
  --sky:#2E7DD1; --peach:#E8734A; --leaf:#3C9A6A; --sun:#E9A32B;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.85;
  display:flex;flex-direction:column;overflow:hidden}
a{color:var(--sky);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit}
.wrap{max-width:820px;margin:0 auto;width:100%;padding:0 20px}

.top{border-bottom:1px solid var(--edge);flex:none;background:rgba(255,248,236,.96);z-index:30}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-size:20px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
.brand em{font-style:normal;color:var(--ink2);font-size:12px;letter-spacing:.14em;margin-left:9px;font-weight:400}
.top .sp{margin-left:auto}
.ico{border:1px solid var(--edge);background:var(--paper2);color:var(--ink2);border-radius:10px;
  height:34px;padding:0 10px;cursor:pointer;line-height:1;font-size:13.5px}
.ico:hover{border-color:var(--sky);color:var(--ink)}
.tlink{font-size:13px;color:var(--ink2)}

#log{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:24px 0 12px;-webkit-overflow-scrolling:touch}
.hero{border:1px solid var(--edge);background:var(--paper2);border-radius:16px;padding:22px 22px 18px;margin-bottom:20px}
.hero h1{font-size:26px;margin:0 0 2px;font-weight:700}
.hero .sub{font-size:13px;letter-spacing:.12em;color:var(--peach);margin-bottom:10px;font-family:var(--mono)}
.hero p{margin:0 0 8px;font-size:15px;color:#4E4A5C}
.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 0}
.pick .lb{font-size:13px;color:var(--ink2);width:52px;flex:none}
.pill{border:1.5px solid var(--edge);background:var(--paper);color:var(--ink);border-radius:999px;
  padding:5px 16px;cursor:pointer;font-size:15px}
.pill.on{border-color:var(--sky);background:rgba(46,125,209,.1);color:var(--sky);font-weight:600}
.pill.on.zh{border-color:var(--peach);background:rgba(232,115,74,.1);color:var(--peach)}
.pill.on.ma{border-color:var(--leaf);background:rgba(60,154,106,.12);color:var(--leaf)}
.pill.on.en{border-color:var(--sun);background:rgba(233,163,43,.14);color:#B8791A}
#nick{border:1.5px solid var(--edge);border-radius:999px;background:var(--paper);padding:5px 14px;font:inherit;font-size:15px;width:150px;outline:none}
#nick:focus{border-color:var(--sky)}
.seeds{display:grid;gap:8px;margin-top:16px}
.seed{border:1px solid var(--edge);background:var(--paper3);color:#4E4A5C;border-radius:12px;
  font-size:14.5px;padding:9px 14px;cursor:pointer;text-align:left;line-height:1.6}
.seed:hover{border-color:var(--sky);color:var(--ink);background:#fff}

.msg{margin:0 0 20px;display:flex;gap:10px}
.msg .av{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:2px}
.msg.u .av{background:rgba(46,125,209,.12)}
.msg.p .av{background:rgba(232,115,74,.14)}
.msg .body{flex:1 1 auto;min-width:0}
.msg .nm{font-size:12px;color:var(--ink2);margin-bottom:3px}
.bd{font-size:16.5px;word-break:break-word;background:var(--paper2);border:1px solid var(--edge2);border-radius:14px;padding:11px 15px}
.msg.u .bd{white-space:pre-wrap;background:rgba(46,125,209,.06)}
.bd p{margin:0 0 .8em}
.bd p:last-child{margin-bottom:0}
.bd ul,.bd ol{margin:0 0 .8em;padding-left:1.4em}
.bd li{margin:.2em 0}
.bd code{font-family:var(--mono);font-size:.92em;background:rgba(43,42,51,.06);padding:1px 5px;border-radius:4px}
.bd pre{background:var(--paper3);border:1px solid var(--edge2);padding:10px 13px;overflow-x:auto;margin:0 0 .8em;border-radius:8px}
.bd pre code{background:none;padding:0}
.bd strong{font-weight:700}
.bd h2,.bd h3,.bd h4{margin:.8em 0 .4em;font-size:1.05em}
.bd blockquote{margin:0 0 .8em;padding:2px 0 2px 12px;border-left:3px solid var(--edge);color:#4E4A5C}
.bd table{border-collapse:collapse;margin:0 0 .8em;font-size:14.5px}
.bd th,.bd td{border:1px solid var(--edge);padding:5px 9px}
.cursor{display:inline-block;width:7px;height:16px;background:var(--peach);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.wait{color:var(--ink2);font-family:var(--mono);font-size:13px}
.learned{margin-top:7px;font-size:12.5px;color:var(--leaf)}
.tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tools button{border:1px solid transparent;background:transparent;color:var(--ink2);font-size:12px;padding:2px 8px;cursor:pointer;border-radius:8px}
.tools button:hover{color:var(--ink);border-color:var(--edge)}
.err{color:var(--peach);font-size:13.5px;margin-top:6px;line-height:1.6}

.dock{flex:none;border-top:1px solid var(--edge);background:rgba(255,248,236,.98);padding:12px 0 14px}
.ctx{font-size:12.5px;color:var(--ink2);margin:0 0 8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctx b{color:var(--ink);font-weight:600}
.ctx button{border:0;background:transparent;color:var(--sky);cursor:pointer;font-size:12.5px;padding:0}
.box{display:flex;gap:10px;align-items:flex-end;border:1.5px solid var(--edge);background:var(--paper2);border-radius:16px;padding:9px 12px}
.box:focus-within{border-color:var(--sky)}
#q{flex:1 1 auto;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16.5px;outline:none;resize:none;max-height:180px;line-height:1.7}
#q::placeholder{color:#A9A4B5}
#go{flex:none;border:0;background:var(--sky);color:#fff;font-size:15px;padding:8px 18px;cursor:pointer;border-radius:12px;font-weight:600}
#go:hover:not(:disabled){background:#2568B0}
#go:disabled{opacity:.45;cursor:default}
#go.stop{background:var(--peach)}
.foot{margin-top:8px;font-size:11.5px;color:var(--ink2);line-height:1.7}

.mask{position:fixed;inset:0;background:rgba(43,42,51,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--paper2);border-radius:18px;padding:24px}
.panel h2{font-size:20px;margin:0 0 4px}
.panel .note{font-size:13px;color:var(--ink2);margin:0 0 16px;line-height:1.7}
.fld{margin:0 0 14px}
.fld label{display:block;font-size:12px;letter-spacing:.1em;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select{width:100%;background:var(--paper);border:1.5px solid var(--edge);border-radius:10px;color:var(--ink);font:inherit;font-size:15px;padding:8px 11px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--sky)}
.fld .hint{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.6}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.row button{border:1.5px solid var(--edge);background:var(--paper);color:var(--ink);font-size:14.5px;padding:7px 16px;cursor:pointer;border-radius:10px}
.row button.pri{background:var(--sky);border-color:var(--sky);color:#fff}
.row .sp2{margin-left:auto}
.pingmsg{font-size:13px;margin-top:10px;font-family:var(--mono);line-height:1.7}
.ok{color:var(--leaf)}.bad{color:var(--peach)}
.prof h3{font-size:14px;margin:12px 0 4px;color:var(--ink2);font-weight:600}
.prof ul{margin:0;padding-left:1.3em;font-size:14.5px}
.prof .empty{font-size:14px;color:var(--ink2)}
@media(max-width:640px){ .wrap{padding:0 12px} #log{padding-top:14px} .hero{padding:16px 14px 14px} .brand em{display:none} body{font-size:16px} }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="brand" href="/education/">ChatPrim<em>小学自学伙伴</em></a>
  <span class="sp"></span>
  <a class="tlink" href="/education/">教育专栏</a>
  <button class="ico" id="btnProf" type="button" title="学习档案">📒 档案</button>
  <button class="ico" id="btnNew" type="button" title="新对话">✧ 新对话</button>
  <button class="ico" id="btnSet" type="button" title="家长设置">⚙</button>
</div></header>

<div id="log"><div class="wrap" id="feed">
  <div class="hero" id="hero">
    <div class="sub">四五六年级 · 语文 · 数学 · 英语</div>
    <h1>你好，我是 ChatPrim 🌱</h1>
    <p>我不报答案，也不替你写作文。你先说说你是怎么想的，卡在哪一步，我陪你一步一步把它弄明白——弄明白的东西才是你自己的。</p>
    <div class="pick"><span class="lb">年级</span>
      <button class="pill" data-g="4" type="button">四年级</button>
      <button class="pill" data-g="5" type="button">五年级</button>
      <button class="pill" data-g="6" type="button">六年级</button>
    </div>
    <div class="pick"><span class="lb">学科</span>
      <button class="pill" data-s="chinese" type="button">语文</button>
      <button class="pill" data-s="math" type="button">数学</button>
      <button class="pill" data-s="english" type="button">英语</button>
    </div>
    <div class="pick"><span class="lb">叫我</span><input id="nick" type="text" maxlength="12" placeholder="你的昵称（不用真名）" autocomplete="off"></div>
    <div class="seeds" id="seeds"></div>
  </div>
</div></div>

<div class="dock"><div class="wrap">
  <div class="ctx" id="ctx"></div>
  <div class="box">
    <textarea id="q" rows="1" placeholder="把题目、句子或你的想法写在这里……（Enter 发送，Shift+Enter 换行）" aria-label="输入"></textarea>
    <button id="go" type="button">发送</button>
  </div>
  <p class="foot">用<strong>家长自己的</strong>国内大模型 API Key 运行（DeepSeek／智谱／Kimi／千问／MiniMax），Key 和学习档案只存在这台设备的浏览器里，本站不保存也看不到。 · 不代写作业，不问真名。 · <a href="https://sdeuniverses.com/">SDE Universes</a></p>
</div></div>

<script>
(function(){
"use strict";
var feed=document.getElementById("feed"), log=document.getElementById("log"), hero=document.getElementById("hero"),
    q=document.getElementById("q"), go=document.getElementById("go"), ctx=document.getElementById("ctx"),
    nickEl=document.getElementById("nick"), seedsEl=document.getElementById("seeds");
var HIST=[], busy=false, ctrl=null;

var VENDORS={deepseek:{n:"DeepSeek",a:"platform.deepseek.com"},zhipu:{n:"智谱 GLM",a:"open.bigmodel.cn"},
             kimi:{n:"Kimi",a:"platform.moonshot.cn"},qwen:{n:"千问 Qwen",a:"bailian.console.aliyun.com"},
             minimax_cn:{n:"MiniMax（国内）",a:"platform.minimaxi.com"}};
var SUBJ={chinese:{n:"语文",c:"zh"},math:{n:"数学",c:"ma"},english:{n:"英语",c:"en"}};
var SEEDS={
  chinese:["这个词「恍然大悟」是什么意思？我在课文里看到的。","老师让写「我最难忘的一件事」，我不知道写什么。","这段课文的中心思想我说不出来。","「春眠不觉晓」这首诗背不下来。"],
  math:["3/4 和 5/8 哪个大？我比不出来。","一道应用题：小明有 24 颗糖，分给 6 个同学……我算错了。","小数点为什么要对齐？","长方形的面积公式我记得，但换成组合图形就不会了。"],
  english:["there 和 their 我老是搞混。","What are you doing? 这句为什么用 doing？","我造了一句：I go to school yesterday. 对吗？","这个单词 beautiful 老是记不住。"]
};
function ls(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function KEY(){ return ls("sde_wds_key",""); }
function VND(){ var v=ls("sde_wds_vendor","deepseek"); return VENDORS[v]?v:"deepseek"; }
function MDL(){ return ls("sde_prim_model",""); }
function GRADE(){ var g=ls("sde_prim_grade","5"); return /^[456]$/.test(g)?g:"5"; }
function SUB(){ var s=ls("sde_prim_subject","math"); return SUBJ[s]?s:"math"; }
function NICK(){ return ls("sde_prim_nick",""); }
function pkey(){ return "sde_prim_profile_"+GRADE()+"_"+SUB(); }
function PROF(){ try{ var p=JSON.parse(ls(pkey(),"{}")); return (p&&typeof p==="object")?p:{}; }catch(e){ return {}; } }
function saveProf(p){ lset(pkey(),JSON.stringify(p)); }

/* ── 年级／学科／昵称 ── */
function paintPick(){
  var ps=hero.querySelectorAll(".pill");
  for(var i=0;i<ps.length;i++){
    var b=ps[i], on=(b.dataset.g&&b.dataset.g===GRADE())||(b.dataset.s&&b.dataset.s===SUB());
    b.className="pill"+(on?(" on "+(b.dataset.s?SUBJ[b.dataset.s].c:"")):"");
  }
  nickEl.value=NICK();
  var sd=SEEDS[SUB()], h="";
  for(var k=0;k<sd.length;k++) h+='<button class="seed" type="button">'+esc(sd[k])+"</button>";
  seedsEl.innerHTML=h;
  var ss=seedsEl.querySelectorAll(".seed");
  for(var j=0;j<ss.length;j++) ss[j].onclick=function(){ ask(this.textContent); };
  paintCtx();
}
function paintCtx(){
  ctx.innerHTML='<span><b>'+["","","","","四","五","六"][+GRADE()]+'年级</b> · <b>'+SUBJ[SUB()].n+'</b>'+
    (NICK()?(' · '+esc(NICK())):'')+((PROF().done||[]).length?(' · ✨ 已做成 <b>'+(PROF().done||[]).length+'</b> 件'):'')+'</span><button type="button" id="ctxChg">换一换</button>';
  document.getElementById("ctxChg").onclick=function(){ if(busy) return; if(HIST.length&&!confirm("换年级或学科会开一场新对话，好吗？")) return; newChat(); };
}
hero.addEventListener("click",function(e){
  var b=e.target.closest(".pill"); if(!b) return;
  if(b.dataset.g) lset("sde_prim_grade",b.dataset.g);
  if(b.dataset.s) lset("sde_prim_subject",b.dataset.s);
  paintPick();
});
nickEl.addEventListener("change",function(){ lset("sde_prim_nick",nickEl.value.trim().slice(0,12)); paintPick(); });

/* ── 设置（家长） ── */
function settings(){
  var mask=document.createElement("div"); mask.className="mask";
  var vopt=""; for(var k in VENDORS){ vopt+='<option value="'+k+'"'+(k===VND()?" selected":"")+">"+VENDORS[k].n+"</option>"; }
  mask.innerHTML=
    '<div class="panel" role="dialog" aria-label="家长设置">'+
    '<h2>家长设置</h2>'+
    '<p class="note">ChatPrim 用<strong>家长自己的</strong>国内大模型 API Key 运行。Key 只写在这台设备的浏览器里，每次提问随请求发给你选的那家厂商，本站不保存、不记录、也读不到。到厂商网站申请，几分钟就能拿到，费用按用量计，一天的学习通常几分钱到几毛钱。</p>'+
    '<div class="fld"><label>厂商</label><select id="sv">'+vopt+'</select><div class="hint" id="sa"></div></div>'+
    '<div class="fld"><label>API Key</label><input id="sk" type="password" placeholder="sk-…" value="'+KEY().replace(/"/g,"&quot;")+'" autocomplete="off" spellcheck="false"></div>'+
    '<div class="fld"><label>模型（可留空，用默认）</label><input id="sm" type="text" placeholder="留空即可" value="'+MDL().replace(/"/g,"&quot;")+'" autocomplete="off" spellcheck="false"><div class="hint">默认用各家的轻快型号。型号名会过时，失效时在这里填一个当前可用的。</div></div>'+
    '<div class="pingmsg" id="pm"></div>'+
    '<div class="row"><button id="sp" type="button">测试连接</button><span class="sp2"></span><button id="sc" type="button">取消</button><button id="ss" type="button" class="pri">保存</button></div></div>';
  document.body.appendChild(mask);
  var sv=mask.querySelector("#sv"), sk=mask.querySelector("#sk"), sm=mask.querySelector("#sm"), pm=mask.querySelector("#pm"), sa=mask.querySelector("#sa");
  function apply(){ sa.innerHTML='到 <a href="https://'+VENDORS[sv.value].a+'" target="_blank" rel="noopener">'+VENDORS[sv.value].a+"</a> 申请。"; }
  apply(); sv.onchange=apply;
  function close(){ try{ document.body.removeChild(mask); }catch(e){} }
  mask.addEventListener("click",function(e){ if(e.target===mask) close(); });
  mask.querySelector("#sc").onclick=close;
  mask.querySelector("#ss").onclick=function(){
    lset("sde_wds_key",sk.value.trim()); lset("sde_wds_vendor",sv.value); lset("sde_prim_model",sm.value.trim());
    close(); q.focus();
  };
  mask.querySelector("#sp").onclick=function(){
    var k=sk.value.trim();
    if(k.length<8){ pm.className="pingmsg bad"; pm.textContent="先把 Key 填上。"; return; }
    pm.className="pingmsg"; pm.textContent="正在试…";
    fetch("/api/wds/ping",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({vendor:sv.value,key:k,model:sm.value.trim()})})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.ok){ pm.className="pingmsg ok"; pm.textContent="通了 · "+j.name+" · "+j.model; }
        else{ pm.className="pingmsg bad"; pm.textContent={bad_key:"这把 Key 没通过校验。",no_credit:"余额不足。",bad_model:"模型名不对，换一个。"}[j.code]||("没通过："+(j.msg||j.code||"未知")); }
      }).catch(function(){ pm.className="pingmsg bad"; pm.textContent="网络没通，稍后再试。"; });
  };
  setTimeout(function(){ sk.focus(); },40);
}
document.getElementById("btnSet").onclick=settings;

/* ── 学习档案 ── */
function profPanel(){
  var p=PROF(), mask=document.createElement("div"); mask.className="mask";
  function li(a){ if(!a||!a.length) return '<p class="empty">还没有。</p>'; var h="<ul>"; for(var i=0;i<a.length;i++) h+="<li>"+esc(a[i])+"</li>"; return h+"</ul>"; }
  mask.innerHTML='<div class="panel prof" role="dialog" aria-label="学习档案"><h2>📒 学习档案</h2>'+
    '<p class="note">'+["","","","","四","五","六"][+GRADE()]+'年级 · '+SUBJ[SUB()].n+' · 一起学过 '+(p.turns||0)+' 轮。档案只存在这台设备的浏览器里，用来记住你会了什么、卡在哪，下次接着学。</p>'+
    '<h3>已经会了</h3>'+li(p.done)+'<h3>还卡着的</h3>'+li(p.stuck)+'<h3>喜欢的例子</h3>'+(p.like?('<p>'+esc(p.like)+'</p>'):'<p class="empty">还没有。</p>')+
    '<div class="row"><button id="pc" type="button">清空这份档案</button><span class="sp2"></span><button id="px" type="button" class="pri">关闭</button></div></div>';
  document.body.appendChild(mask);
  function close(){ try{ document.body.removeChild(mask); }catch(e){} }
  mask.addEventListener("click",function(e){ if(e.target===mask) close(); });
  mask.querySelector("#px").onclick=close;
  mask.querySelector("#pc").onclick=function(){ if(confirm("清空后就从头开始记了，确定吗？")){ saveProf({}); close(); } };
}
document.getElementById("btnProf").onclick=profPanel;

function newChat(){
  HIST=[]; var ms=feed.querySelectorAll(".msg"); for(var i=0;i<ms.length;i++) feed.removeChild(ms[i]);
  hero.hidden=false; paintPick(); q.focus();
}
document.getElementById("btnNew").onclick=function(){ if(busy) return; if(HIST.length&&!confirm("清空当前对话，开一场新的？")) return; newChat(); };

/* 剥出末尾的 【档案】{…} 行：正文与档案分家。流式中也剥，免得孩子看到半截 JSON。 */
var PROF_RE=/\n?\s*【档案】\s*(\{[\s\S]*)$/;
function splitProf(acc){
  var m=acc.match(PROF_RE); if(!m) return {text:acc,prof:null};
  var js=null; try{ js=JSON.parse(m[1].trim()); }catch(e){}
  return {text:acc.slice(0,m.index).replace(/\s+$/,""),prof:js};
}
function mergeProf(js){
  var p=PROF(); p.done=p.done||[]; p.stuck=p.stuck||[]; p.turns=(p.turns||0)+1;
  var got=[];
  function add(list,arr){ if(!Array.isArray(arr)) return; for(var i=0;i<arr.length;i++){ var s=String(arr[i]||"").trim().slice(0,40); if(!s) continue;
    if(list.indexOf(s)<0){ list.push(s); got.push(s); } if(list.length>12) list.shift(); } }
  if(js){
    add(p.done,js.done); add(p.stuck,js.stuck);
    /* 会了的东西从「卡着」里划掉 */
    if(Array.isArray(js.done)) p.stuck=p.stuck.filter(function(s){ return js.done.indexOf(s)<0; });
    if(js.like&&String(js.like).trim()) p.like=String(js.like).trim().slice(0,60);
  }
  saveProf(p); return got;
}

/* ── 极简 Markdown ── */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,function(_,a){return "<code>"+a+"</code>";});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  return s;
}
function md(src){
  var lines=String(src).replace(/\r/g,"").split("\n"), out=[], inCode=false, code=[], stack=[];
  function flushList(){ while(stack.length){ out.push(stack.pop()==="ul"?"</ul>":"</ol>"); } }
  for(var i=0;i<lines.length;i++){
    var L=lines[i], m;
    if(/^```/.test(L)){ if(inCode){ out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>"); code=[]; inCode=false; } else { flushList(); inCode=true; } continue; }
    if(inCode){ code.push(L); continue; }
    if(/^\s*$/.test(L)){ flushList(); continue; }
    if((m=L.match(/^(#{1,4})\s+(.*)$/))){ flushList(); out.push("<h3>"+inline(m[2])+"</h3>"); continue; }
    if((m=L.match(/^\s*>\s?(.*)$/))){ flushList(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); continue; }
    if((m=L.match(/^\s*[-*·]\s+(.*)$/))){ if(stack[stack.length-1]!=="ul"){ flushList(); out.push("<ul>"); stack.push("ul"); } out.push("<li>"+inline(m[1])+"</li>"); continue; }
    if((m=L.match(/^\s*\d+[.)、]\s+(.*)$/))){ if(stack[stack.length-1]!=="ol"){ flushList(); out.push("<ol>"); stack.push("ol"); } out.push("<li>"+inline(m[1])+"</li>"); continue; }
    flushList(); out.push("<p>"+inline(L)+"</p>");
  }
  if(inCode&&code.length) out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");
  flushList(); return out.join("");
}

/* ── 消息 ── */
function addMsg(cls,name,av){
  var d=document.createElement("div"); d.className="msg "+cls;
  var a=document.createElement("div"); a.className="av"; a.textContent=av;
  var body=document.createElement("div"); body.className="body";
  var n=document.createElement("div"); n.className="nm"; n.textContent=name;
  var b=document.createElement("div"); b.className="bd";
  body.appendChild(n); body.appendChild(b); d.appendChild(a); d.appendChild(body); feed.appendChild(d);
  return {box:d,body:body,bd:b};
}
function bottom(){ log.scrollTop=log.scrollHeight; }
function grow(){ q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,180)+"px"; }
function stopBtn(on){ busy=on; go.textContent=on?"停止":"发送"; go.className=on?"stop":""; }

function ask(text,redo){
  if(busy) return;
  text=String(text||"").trim(); if(!text) return;
  if(KEY().length<8){ settings(); return; }
  hero.hidden=true;
  if(!redo){ addMsg("u",NICK()||"我","🙋").bd.textContent=text; HIST.push({role:"user",content:text}); }
  q.value=""; grow(); stopBtn(true); bottom();

  var m=addMsg("p","ChatPrim","🌱"), acc="";
  var cur=document.createElement("span"); cur.className="cursor"; m.bd.appendChild(cur);
  ctrl=new AbortController();
  function paint(){ m.bd.innerHTML=md(splitProf(acc).text); m.bd.appendChild(cur); bottom(); }
  function finish(ok){
    try{ m.bd.removeChild(cur); }catch(e){}
    var sp=splitProf(acc); m.bd.innerHTML=md(sp.text);
    var tools=document.createElement("div"); tools.className="tools";
    function mk(label,fn){ var b=document.createElement("button"); b.type="button"; b.textContent=label; b.onclick=fn; tools.appendChild(b); return b; }
    if(ok&&sp.text){
      var got=mergeProf(sp.prof);
      if(got.length){ var l=document.createElement("div"); l.className="learned"; l.textContent="📒 记进档案："+got.join("；"); m.body.appendChild(l); }
      paintCtx();
      mk("重答",function(){ if(busy) return; feed.removeChild(m.box); if(HIST.length&&HIST[HIST.length-1].role==="assistant") HIST.pop();
        ask(HIST.length?HIST[HIST.length-1].content:"",true); });
      HIST.push({role:"assistant",content:sp.text});
    } else {
      mk("重试",function(){ if(busy) return; feed.removeChild(m.box); ask(HIST.length?HIST[HIST.length-1].content:"",true); });
    }
    m.body.appendChild(tools);
    stopBtn(false); ctrl=null; q.focus(); bottom();
  }
  function fail(msg){ var e=document.createElement("div"); e.className="err"; e.textContent="⚠ "+msg; m.body.appendChild(e); finish(false); }

  fetch("/api/prim/chat",{method:"POST",headers:{"content-type":"application/json"},signal:ctrl.signal,
    body:JSON.stringify({messages:HIST,key:KEY(),vendor:VND(),model:MDL(),grade:GRADE(),subject:SUB(),nick:NICK(),profile:PROF()})
  }).then(function(r){
    if(!r.ok||!r.body){ return r.json().then(function(j){ throw new Error((j&&j.msg)||("HTTP "+r.status)); },function(){ throw new Error("HTTP "+r.status); }); }
    var rd=r.body.getReader(), dec=new TextDecoder(), buf="", fin=false, errMsg="";
    function pump(){
      return rd.read().then(function(s){
        if(s.done||fin) return;
        buf+=dec.decode(s.value,{stream:true});
        var nl;
        while((nl=buf.indexOf("\n"))>=0){
          var line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
          if(!line||line.indexOf("data:")!==0) continue;
          var pay=line.slice(5).trim();
          if(pay==="[DONE]"){ fin=true; buf=""; break; }
          try{ var j=JSON.parse(pay);
            if(j.t==="d"&&j.v){ acc+=j.v; paint(); }
            else if(j.t==="beat"&&!acc){ m.bd.innerHTML='<span class="wait">想一想… '+j.v+"s</span>"; m.bd.appendChild(cur); }
            else if(j.t==="error"){ errMsg=j.v; }
          }catch(e){}
        }
        if(fin) return; return pump();
      });
    }
    return pump().then(function(){
      if(errMsg&&!acc) throw new Error(errMsg);
      if(errMsg){ var e=document.createElement("div"); e.className="err"; e.textContent="⚠ "+errMsg; m.body.appendChild(e); }
      finish(true); });
  }).catch(function(err){
    if(err&&err.name==="AbortError"){ if(acc) finish(true); else { try{feed.removeChild(m.box);}catch(e){} stopBtn(false); } return; }
    fail((err&&err.message)||"网络中断了，请再试一次。");
  });
}

go.onclick=function(){ if(busy){ if(ctrl) ctrl.abort(); return; } ask(q.value); };
q.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); if(!busy) ask(q.value); } });
q.addEventListener("input",grow);
paintPick();
q.focus();
})();
