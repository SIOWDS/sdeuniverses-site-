<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>住在线上｜睡眠专栏｜王德生</title><meta name="description" content="睡与醒之间不是一条无厚度的线，而可能是一片承担功能、却没有自己字段的界带。"><meta name="author" content="王德生">
<style>html,body{margin:0;min-height:100%;background:#070b14;color:#eef3fb;font-family:Georgia,'Noto Serif SC',serif}.load{min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center}.moon{width:68px;height:68px;border:1px solid #f3d99b;border-radius:50%;display:grid;place-items:center;margin:auto;color:#f3d99b;box-shadow:0 0 45px rgba(243,217,155,.2);animation:p 1.8s ease-in-out infinite}h1{font-size:clamp(1.8rem,6vw,3rem);margin:1.4rem 0 .5rem}p{color:#aebbd0;line-height:1.8}@keyframes p{50%{transform:scale(1.08);opacity:.65}}</style></head>
<body><main class="load"><div><div class="moon">☾</div><h1>住在线上</h1><p>正在展开完整论文与夜间阅读界面……</p><noscript><p>本页需要 JavaScript 才能展开全文。</p></noscript></div></main>
<script>
(async()=>{
 const parts=["page-01.b64", "page-02.b64", "page-03.b64"];
 try{
  const chunks=await Promise.all(parts.map(p=>fetch(p,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})));
  const s=chunks.join('').replace(/\s+/g,'');
  const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window))throw new Error('browser');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){document.querySelector('.load').innerHTML='<div><div class="moon">☾</div><h1>页面没有完整展开</h1><p>请刷新页面，或使用最新版 Chrome、Edge、Safari、Firefox 浏览器。</p><p><a href="/sleep/" style="color:#f3d99b">返回睡眠专栏</a></p></div>'}
})();
</script></body></html>
