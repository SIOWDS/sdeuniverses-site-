<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首屏诊断 · SDE</title>
<style>
body{margin:0;background:#0c0818;color:#eee;font-family:system-ui,"Songti SC",serif;padding:20px;line-height:1.7}
h1{color:#E7C86B;font-size:20px}h2{color:#7FB4FF;font-size:15px;margin-top:22px;border-bottom:1px solid #333;padding-bottom:6px}
.ok{color:#7CE38B}.bad{color:#ff8080;font-weight:700}.warn{color:#E7C86B}
pre{background:#161122;padding:12px;border-radius:6px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.box{border:1px solid #333;border-radius:8px;padding:14px;margin:10px 0;background:#12101c}
button{background:#E7C86B;color:#111;border:0;padding:10px 18px;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;margin:6px 6px 6px 0}
</style></head><body>
<h1>SDE 首屏诊断页</h1>
<p style="color:#999;font-size:13px">这个页面会把你浏览器里的真实情况打印出来。请<b style="color:#E7C86B">截图整页</b>发回。</p>

<div class="box"><h2>① 本页服务时间戳（验证是否走缓存）</h2>
<pre id="stamp">读取中…</pre>
<p style="font-size:12px;color:#999">连点两次刷新，若下面时间戳每次都变→无缓存问题；若不变→是缓存。</p>
<button onclick="location.reload()">刷新本页</button>
</div>

<div class="box"><h2>② 抓取线上首页 / 并检查今日三句能否渲染</h2>
<button onclick="probe()">开始检测线上首页</button>
<pre id="probe">点上面按钮开始…</pre>
</div>

<div class="box"><h2>③ 你的浏览器环境</h2>
<pre id="env">读取中…</pre>
</div>

<script>
// ① 时间戳
fetch('/fresh',{cache:'no-store'}).then(r=>{
  document.getElementById('stamp').textContent =
    '本地时间: '+new Date().toISOString()+'\n'+
    'x-served-at 头: '+(r.headers.get('x-served-at')||'(无此头，可能未部署最新Worker)')+'\n'+
    'cache-control 头: '+(r.headers.get('cache-control')||'(无)');
}).catch(e=>document.getElementById('stamp').textContent='fetch /fresh 失败: '+e.message);

// ③ 环境
document.getElementById('env').textContent =
  'UA: '+navigator.userAgent+'\n'+
  '视口: '+window.innerWidth+' × '+window.innerHeight+'\n'+
  'devicePixelRatio: '+window.devicePixelRatio+'\n'+
  'JS已启用: 是（否则你看不到这行）\n'+
  'localStorage可用: '+(function(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return '是';}catch(e){return '否 '+e.message;}})();

// ② 抓首页并在隐藏iframe里渲染，读回今日三句状态
function probe(){
  var out=document.getElementById('probe');
  out.textContent='正在抓取 / 首页…';
  fetch('/?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(html=>{
    var report='';
    report+='首页HTML长度: '+html.length+' 字符\n';
    report+='含 id="dq-cards": '+(html.includes('id="dq-cards"')?'是':'否')+'\n';
    report+='含 DQ_pickForDate: '+(html.includes('DQ_pickForDate')?'是':'否')+'\n';
    report+='含 dq-orna(饰环): '+(html.includes('dq-orna')?'是':'否')+'\n';
    report+='含今日三句标题: '+(html.includes('今日三句')?'是':'否')+'\n';
    report+='\n构建戳: '+((html.match(/name="build" content="([^"]*)"/)||[])[1]||'未找到')+'\n';
    // 真渲染
    var ifr=document.createElement('iframe');
    ifr.style.cssText='width:1200px;height:700px;border:2px solid #E7C86B;margin-top:10px;background:#000';
    ifr.srcdoc=html;
    ifr.onload=function(){
      setTimeout(function(){
        try{
          var doc=ifr.contentDocument;
          var cards=doc.getElementById('dq-cards');
          report+='\n=== iframe内真实渲染结果 ===\n';
          report+='dq-cards存在: '+(!!cards)+'\n';
          report+='卡片数: '+(cards?cards.children.length:'N/A')+'\n';
          report+='日期文本: '+(doc.getElementById('dq-date')?doc.getElementById('dq-date').textContent:'N/A')+'\n';
          report+='星星数: '+(doc.getElementById('dq-stars')?doc.getElementById('dq-stars').children.length:'N/A')+'\n';
          if(cards&&cards.children.length>0){
            report+='首卡文字: '+(cards.querySelector('.dq-text')?cards.querySelector('.dq-text').textContent.slice(0,30):'')+'…\n';
            report+='\n结论: ✅ 页面在你的浏览器里能正常渲染三句';
          }else{
            report+='\n结论: ❌ 三句卡在你的浏览器里没渲染出来——问题锁定在运行时';
          }
          out.textContent=report;
        }catch(e){ out.textContent=report+'\n\niframe读取异常: '+e.message; }
      },1500);
    };
    out.textContent=report+'\n(正在隐藏iframe里真实渲染，1.5秒后出结果…)';
    document.body.appendChild(ifr);
  }).catch(e=>out.textContent='抓取失败: '+e.message);
}
</script>

<script>window.WDS_READ={};</script>
<script src="/taste/wds-companion/wds-read.js?v=20260817c" defer></script>
</body></html>
