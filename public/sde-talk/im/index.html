<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SDE 私聊 · 和学员一对一 | SDE Universes</title>
<meta name="description" content="SDE Universes 私聊：像微信一样和学员一对一沟通——会话列表、通讯录、未读提醒、实时消息、图片与表情，Google 账号登录即用，无需安装。">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#F7F3E9;--surface:#F1EBDC;--card:#FBF8F0;--card2:#F4EEDF;
  --border:#D8CBAA;--border2:#E4DAC2;
  --text:#2A2318;--text2:#6B6050;--muted:#9A8F7A;
  --gold:#8A6817;--gold2:#A8842B;
  --disc:#3B4E9C;--disc2:#5162B4;--disc-soft:rgba(59,78,156,0.08);
  --red:#C0603F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Noto Serif SC',Georgia,'Songti SC',serif;background:var(--surface);color:var(--text);line-height:1.75;-webkit-tap-highlight-color:transparent}
a{color:var(--disc)}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 24px rgba(0,0,0,0.07)}
/* 顶栏 */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:0.75rem 1rem;background:var(--card2);border-bottom:1px solid var(--border2);min-height:52px}
.top .ttl{font-weight:800;font-size:1.02rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{font-size:1.25rem;color:var(--disc);cursor:pointer;line-height:1;padding:0 4px;user-select:none}
.top .rt{font-size:0.76rem;color:var(--text2);display:flex;align-items:center;gap:6px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#B9AE93;flex:none}
.dot.on{background:#2FA36B}.dot.off{background:var(--red)}
.top a.home{font-size:0.76rem;color:var(--text2);text-decoration:none;flex:none}
/* 主体 */
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* 会话 / 通讯录 列表 */
.row{display:flex;align-items:center;gap:12px;padding:0.85rem 1rem;background:var(--card);border-bottom:1px solid var(--border2);cursor:pointer}
.row:active{background:var(--card2)}
.av{flex:none;width:42px;height:42px;border-radius:8px;background:var(--disc);color:#F5F2E8;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;position:relative}
.av.g{background:var(--gold)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:0.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;font-family:system-ui,sans-serif}
.rmain{flex:1;min-width:0}
.rname{font-weight:700;font-size:0.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlast{font-size:0.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rtime{flex:none;font-size:0.7rem;color:var(--muted);align-self:flex-start;padding-top:3px}
.chip{display:inline-block;font-size:0.66rem;color:var(--disc);background:var(--disc-soft);border:1px solid var(--disc);border-radius:20px;padding:0 7px;margin-left:6px;vertical-align:1px;font-family:system-ui,sans-serif}
.hint{padding:1.6rem 1.4rem;color:var(--text2);font-size:0.9rem;text-align:center;line-height:1.85}
.hint b{color:var(--text)}
.sec{padding:0.5rem 1rem;font-size:0.7rem;letter-spacing:0.2em;color:var(--muted);background:var(--surface);text-transform:uppercase}
.search{padding:0.6rem 1rem;background:var(--card2);border-bottom:1px solid var(--border2)}
.search input{width:100%;font:inherit;font-size:0.9rem;padding:0.45rem 0.7rem;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none}
.search input:focus{border-color:var(--disc)}
/* 聊天窗 */
.msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.6rem;background:var(--bg)}
.msg{display:flex;flex-direction:column;max-width:80%;align-self:flex-start}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:0.7rem;color:var(--muted);margin:0 5px 3px}
.msg .bub{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:0.5rem 0.8rem;font-size:0.95rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.msg.mine .bub{background:var(--disc);border-color:var(--disc);color:#F5F2E8}
.msg .tm{font-size:0.66rem;color:var(--muted);margin:2px 6px 0}
.msg .tm .rc{color:inherit;opacity:0.75;text-decoration:underline;cursor:pointer}
.msg.bot .bub{background:#FBF6E9;border-color:var(--gold);color:var(--text)}
.msg.bot .who{color:var(--gold2);font-weight:700}
.bub.bub-img{padding:4px;overflow:hidden}
.bub.recalled{background:transparent;border:1px dashed var(--border);color:var(--muted);font-style:italic}
.msg.mine .bub.recalled{background:transparent;color:var(--muted)}
.cimg{max-width:min(220px,58vw);max-height:270px;border-radius:8px;display:block;cursor:pointer;object-fit:cover}
.cap{font-size:0.9rem;line-height:1.5;padding:5px 6px 2px;white-space:pre-wrap;word-break:break-word}
.msg.mine .cap{color:#F5F2E8}
.typing{align-self:flex-start;font-size:0.82rem;color:var(--muted);font-style:italic;padding:2px 8px}
.newpill{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;background:var(--disc);color:#F5F2E8;font-size:0.76rem;padding:5px 15px;border-radius:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.18);display:none;z-index:3}
.foot{flex:none;border-top:1px solid var(--border2);padding:0.6rem 0.8rem;background:var(--card2)}
.epanel{display:none;flex-wrap:wrap;gap:2px;max-height:126px;overflow-y:auto;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:6px;margin-bottom:8px}
.epanel.on{display:flex}
.epanel span{font-size:1.25rem;cursor:pointer;padding:3px 5px;border-radius:6px;line-height:1}
.inbar{display:flex;gap:6px;align-items:flex-end}
.inbar textarea{flex:1;font:inherit;font-size:0.95rem;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.7rem;resize:none;height:40px;max-height:110px;line-height:1.5;outline:none}
.inbar textarea:focus{border-color:var(--disc)}
.ib{font-size:1.05rem;background:transparent;border:1px solid var(--border);border-radius:8px;height:40px;width:40px;flex:none;cursor:pointer;padding:0;line-height:1}
.ib.w{background:#FBF6E9;border-color:var(--gold)}
.ib:disabled{opacity:0.5}
.send{font:inherit;font-size:0.9rem;font-weight:700;padding:0 1.1rem;height:40px;border-radius:8px;border:1px solid var(--disc);background:var(--disc);color:#F5F2E8;cursor:pointer;flex:none}
.send:disabled{opacity:0.5}
.note{font-size:0.74rem;color:var(--muted);min-height:1em;margin-top:5px}
/* 底部 tab */
.tabs{flex:none;display:flex;border-top:1px solid var(--border2);background:var(--card2);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:0.5rem 0 0.55rem;font-size:0.68rem;color:var(--text2);cursor:pointer;position:relative;letter-spacing:0.06em}
.tab i{display:block;font-size:1.2rem;font-style:normal;line-height:1.35}
.tab.on{color:var(--disc);font-weight:700}
.tab .tb{position:absolute;top:2px;left:50%;margin-left:4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:0.66rem;display:none;align-items:center;justify-content:center;padding:0 4px;font-family:system-ui,sans-serif;font-weight:700}
.tab .tb.on{display:flex}
/* 登录闸 */
#gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem 1.5rem;text-align:center}
#gate h2{font-size:1.3rem;font-weight:800}
#gate p{font-size:0.9rem;color:var(--text2);max-width:340px}
.me-card{padding:1.4rem 1.2rem}
.me-card .nm{font-size:1.15rem;font-weight:800}
.me-card .uid{font-size:0.72rem;color:var(--muted);font-family:ui-monospace,monospace;margin-top:2px}
.me-list{margin-top:1.2rem}
.me-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0.8rem 1rem;background:var(--card);border:1px solid var(--border2);border-radius:9px;margin-bottom:0.6rem;font-size:0.88rem}
.me-item button{font:inherit;font-size:0.78rem;padding:0.3rem 0.9rem;border-radius:16px;border:1px solid var(--disc);background:transparent;color:var(--disc);cursor:pointer}
.me-item a{text-decoration:none}
</style>
</head>
<body>
<div id="app">

  <div class="top">
    <span class="back" id="t-back" style="display:none">‹</span>
    <span class="ttl" id="t-ttl">SDE 私聊</span>
    <span class="rt" id="t-rt"><span class="dot" id="t-dot"></span><span id="t-stat"></span></span>
    <a class="home" href="/sde-talk/">群聊 ›</a>
  </div>

  <div class="body">

    <!-- 登录闸 -->
    <div class="view on" id="v-gate">
      <div id="gate">
        <h2>SDE 私聊</h2>
        <p>像微信一样一对一沟通：会话列表、通讯录、未读提醒、实时消息、图片与表情。用 Google 账号登录即用，无需安装。</p>
        <div id="gsi"></div>
        <p style="font-size:0.78rem;color:var(--muted)">私聊只有你和对方看得见——别人打不开你们的会话。</p>
      </div>
    </div>

    <!-- ① 会话列表 -->
    <div class="view" id="v-chats">
      <div class="scroll" id="chat-list"><div class="hint">正在加载会话…</div></div>
    </div>

    <!-- ② 通讯录 -->
    <div class="view" id="v-book">
      <div class="search"><input id="q" placeholder="搜名字…" autocomplete="off"></div>
      <div class="scroll" id="book-list"><div class="hint">正在加载通讯录…</div></div>
    </div>

    <!-- ③ 聊天窗 -->
    <div class="view" id="v-talk" style="position:relative">
      <div class="msgs" id="msgs"></div>
      <div class="newpill" id="newpill">有新消息 ↓</div>
      <div class="foot">
        <div class="epanel" id="epanel"></div>
        <div class="inbar">
          <button class="ib" id="b-emoji" type="button" title="表情">😊</button>
          <button class="ib" id="b-img" type="button" title="发图片">🖼️</button>
          <input type="file" id="file" accept="image/*" style="display:none">
          <button class="ib w" id="b-wds" type="button" title="问 WDS 智能体">🤖</button>
          <textarea id="text" maxlength="500" placeholder="说点什么…（Enter 发送）"></textarea>
          <button class="send" id="b-send">发送</button>
        </div>
        <div class="note" id="note"></div>
      </div>
    </div>

    <!-- ④ 我 -->
    <div class="view" id="v-me">
      <div class="scroll">
        <div class="me-card">
          <div class="nm" id="me-nm">—</div>
          <div class="uid" id="me-uid"></div>
          <div class="me-list">
            <div class="me-item"><span>新消息桌面提醒</span><button id="b-notify">开启</button></div>
            <div class="me-item"><span>SDE 讨论（群聊）</span><a href="/sde-talk/"><button>进入</button></a></div>
            <div class="me-item"><span>SDE 会议室</span><a href="/meeting/"><button>进入</button></a></div>
            <div class="me-item"><span>退出登录</span><button id="b-out">退出</button></div>
          </div>
          <p style="font-size:0.8rem;color:var(--muted);margin-top:1rem;line-height:1.9">
            通讯录里是所有在本站登录过的人——学员一登录就会出现，你就能直接私聊。<br>
            私聊里同样可以 <b>@WDS</b> 提问，答案只出现在你们两人的会话里。<br>
            消息 2 分钟内可撤回；图片压缩后发送。
          </p>
        </div>
      </div>
    </div>

  </div>

  <div class="tabs" id="tabs" style="display:none">
    <div class="tab on" data-go="chats"><i>💬</i>聊天<span class="tb" id="tb-unread"></span></div>
    <div class="tab" data-go="book"><i>👥</i>通讯录</div>
    <div class="tab" data-go="me"><i>👤</i>我</div>
  </div>

</div>

<script>
(function(){
"use strict";
function el(id){return document.getElementById(id)}
var GCID="985037699618-de3smmqf2rer0pfhf4mrtrj3rgahgu5u.apps.googleusercontent.com";
var CRED="",ME=null,contacts=[],chats=[],roster={},unread=0;
var cur=null,ws=null,connected=false,tries=0,usePoll=false,pollT=null,lastId=0,seen={},nodes={},pendingNew=0,inboxT=null,notifyOn=false;
var TITLE="SDE 私聊 · 和学员一对一 | SDE Universes";

/* ── 小工具 ── */
function note(s){el("note").textContent=s||""}
function pad(x){return(x<10?"0":"")+x}
function fmtT(ts){var d=new Date(ts),n=new Date();
  if(d.toDateString()===n.toDateString())return pad(d.getHours())+":"+pad(d.getMinutes());
  var y=new Date(n.getTime()-86400000);
  if(d.toDateString()===y.toDateString())return "昨天 "+pad(d.getHours())+":"+pad(d.getMinutes());
  return (d.getMonth()+1)+"/"+d.getDate();}
function initial(nm){nm=String(nm||"?").trim();return nm?nm.slice(0,1):"?"}
function api(op,extra){
  var body={credential:CRED,op:op};
  if(extra)for(var k in extra)body[k]=extra[k];
  return fetch("/api/im",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})});
}
function setStat(state){var d=el("t-dot"),s=el("t-stat");
  if(!cur){d.className="dot";s.textContent="";return;}
  d.className="dot"+(state==="online"?" on":state==="offline"?" off":"");
  s.textContent=state==="online"?"在线":state==="offline"?"重连中…":"连接中…";}

/* ── 视图切换 ── */
function show(v){
  ["gate","chats","book","talk","me"].forEach(function(x){el("v-"+x).classList.toggle("on",x===v)});
  el("tabs").style.display=(v==="gate")?"none":"flex";
  el("t-back").style.display=(v==="talk")?"block":"none";
  el("t-rt").style.display=(v==="talk")?"flex":"none";
  if(v!=="talk"){el("t-ttl").textContent="SDE 私聊";}
  var map={chats:"chats",book:"book",me:"me"};
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){t.classList.toggle("on",map[v]===t.getAttribute("data-go"))});
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
  t.onclick=function(){var g=t.getAttribute("data-go");closeTalk();show(g);if(g==="chats")loadInbox();if(g==="book")loadContacts();};
});
el("t-back").onclick=function(){closeTalk();show("chats");loadInbox();};

/* ── 登录 ── */
try{var stg=JSON.parse(sessionStorage.getItem("sde_gauth")||"null");if(stg&&stg.exp>Date.now()){CRED=stg.cred;}}catch(e){}
window.__sdeImCb=function(resp){
  try{CRED=resp.credential;
    var p=JSON.parse(atob(resp.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    var nm=(p.name||(p.email||"").split("@")[0]||"").slice(0,20);
    try{sessionStorage.setItem("sde_gauth",JSON.stringify({cred:CRED,name:nm,exp:Date.now()+50*60*1000}));}catch(e){}
    afterLogin();
  }catch(e){el("gsi").textContent="登录信息解析失败，请重试。";}
};
function bootGsi(){
  if(!(window.google&&google.accounts&&google.accounts.id)){el("gsi").textContent="Google 登录组件加载失败，请检查网络后刷新。";return;}
  google.accounts.id.initialize({client_id:GCID,callback:window.__sdeImCb,auto_select:true});
  google.accounts.id.renderButton(el("gsi"),{theme:"outline",size:"large",text:"signin_with",shape:"pill"});
}
function logout(){CRED="";ME=null;try{sessionStorage.removeItem("sde_gauth")}catch(e){}closeTalk();show("gate");}
el("b-out").onclick=logout;

function afterLogin(){
  api("contacts").then(function(x){
    if(x.s===401||!x.d||!x.d.ok){logout();return;}
    ME=x.d.me;contacts=x.d.contacts||[];
    el("me-nm").textContent=ME.name;el("me-uid").textContent="ID "+ME.uid;
    show("chats");loadInbox();renderContacts();
    if(inboxT)clearInterval(inboxT);
    inboxT=setInterval(function(){loadInbox(true)},15000);
  }).catch(function(){el("gsi").textContent="网络异常，请稍后重试。"});
}

/* ── ① 会话列表 ── */
function setUnread(n){
  unread=n||0;var b=el("tb-unread");
  b.textContent=unread>99?"99+":String(unread);
  b.classList.toggle("on",unread>0);
  document.title=(unread>0?"("+unread+") ":"")+TITLE;
}
function loadInbox(quiet){
  if(!CRED)return;
  return api("inbox").then(function(x){
    if(!x.d||!x.d.ok)return;
    var before={};chats.forEach(function(c){before[c.peer]=c.unread||0});
    chats=x.d.chats||[];setUnread(x.d.unread||0);
    if(!cur)renderChats();
    if(quiet&&notifyOn){
      chats.forEach(function(c){
        if((c.unread||0)>(before[c.peer]||0)&&(!cur||cur.peer!==c.peer)){
          try{new Notification(c.name+" 发来消息",{body:c.last||"",tag:"sde-im-"+c.peer});}catch(e){}
        }
      });
    }
  }).catch(function(){});
}
function renderChats(){
  var L=el("chat-list");L.textContent="";
  if(!chats.length){
    var h=document.createElement("div");h.className="hint";
    h.innerHTML="还没有私聊。<br>去 <b>通讯录</b> 选一个人，开始第一句。";
    L.appendChild(h);return;
  }
  chats.forEach(function(c){L.appendChild(rowFor(c.name,c.last,c.lastTs,c.unread,function(){openTalk(c.peer,c.name)}))});
}
function rowFor(name,last,ts,un,onclick){
  var r=document.createElement("div");r.className="row";r.onclick=onclick;
  var a=document.createElement("div");a.className="av";a.textContent=initial(name);
  if(un>0){var b=document.createElement("span");b.className="badge";b.textContent=un>99?"99+":String(un);a.appendChild(b);}
  var m=document.createElement("div");m.className="rmain";
  var n=document.createElement("div");n.className="rname";n.textContent=name;
  if(roster[name]){var c=document.createElement("span");c.className="chip";c.textContent="学员";n.appendChild(c);}
  m.appendChild(n);
  if(last!==undefined&&last!==null&&last!==""){var l=document.createElement("div");l.className="rlast";l.textContent=last;m.appendChild(l);}
  r.appendChild(a);r.appendChild(m);
  if(ts){var t=document.createElement("div");t.className="rtime";t.textContent=fmtT(ts);r.appendChild(t);}
  return r;
}

/* ── ② 通讯录 ── */
function loadContacts(){
  if(!CRED)return;
  api("contacts").then(function(x){if(x.d&&x.d.ok){contacts=x.d.contacts||[];renderContacts();}}).catch(function(){});
}
function renderContacts(){
  var L=el("book-list"),q=(el("q").value||"").trim().toLowerCase();
  L.textContent="";
  var list=contacts.filter(function(c){return !q||String(c.name||"").toLowerCase().indexOf(q)>=0});
  if(!list.length){
    var h=document.createElement("div");h.className="hint";
    h.innerHTML=contacts.length?"没有匹配的名字。":"通讯录暂时是空的。<br>学员在本站用 Google 登录一次，就会出现在这里。";
    L.appendChild(h);return;
  }
  var s=document.createElement("div");s.className="sec";s.textContent="登录过本站的人 · "+list.length+" 位";L.appendChild(s);
  list.forEach(function(c){
    var r=rowFor(c.name,"最近活跃 "+fmtT(c.ts),0,0,function(){openTalk(c.uid,c.name)});
    L.appendChild(r);
  });
}
el("q").addEventListener("input",renderContacts);

/* ── ③ 聊天窗 ── */
function closeTalk(){
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}ws=null}
  if(pollT){clearInterval(pollT);pollT=null}
  connected=false;usePoll=false;tries=0;cur=null;lastId=0;seen={};nodes={};pendingNew=0;
  el("msgs").textContent="";el("newpill").style.display="none";note("");setStat("");
}
function openTalk(peer,name){
  closeTalk();
  cur={peer:peer,name:name,room:""};
  el("t-ttl").textContent=name;
  show("talk");setStat("connecting");
  api("open",{peer:peer}).then(function(x){
    if(!x.d||!x.d.ok||!x.d.room){note((x.d&&x.d.msg)||"打不开这个会话。");return;}
    cur.room=x.d.room;connect();
    api("read",{peer:peer}).then(function(){loadInbox()});
  }).catch(function(){note("网络异常。")});
}
function wsSend(o){try{ws.send(JSON.stringify(o))}catch(e){}}
function connect(){
  if(!cur||!cur.room||usePoll)return;
  var url=(location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/chat?room="+encodeURIComponent(cur.room);
  try{ws=new WebSocket(url);}catch(e){reconnect();return;}
  ws.onopen=function(){connected=true;tries=0;setStat("online");wsSend({t:"auth",cred:CRED});};
  ws.onmessage=function(ev){
    var d;try{d=JSON.parse(ev.data)}catch(e){return}
    if(d.t==="needauth"){wsSend({t:"auth",cred:CRED});}
    else if(d.t==="history"){(d.items||[]).forEach(addMsg);toBottom();}
    else if(d.t==="msg"){addMsg(d);if(cur)api("read",{peer:cur.peer});}
    else if(d.t==="authed"){note("");}
    else if(d.t==="recall"){onRecall(d.id)}
    else if(d.t==="typing"){showTyping()}
    else if(d.t==="err"){
      if(d.m==="no-access"){note("你不在这个私聊里。");}
      else if(d.m==="login"){note("登录已过期，请重新登录。");logout();}
      else note(d.m||"发送失败。");
    }
  };
  ws.onclose=function(){connected=false;if(usePoll||!cur)return;setStat("offline");reconnect();};
  ws.onerror=function(){try{ws.close()}catch(e){}};
}
function reconnect(){tries++;if(tries>=5){startPoll();return;}setTimeout(function(){if(cur)connect()},Math.min(1000*tries,5000));}
function startPoll(){
  if(usePoll||!cur)return;usePoll=true;setStat("online");el("t-stat").textContent="已连接（兼容模式）";
  function tick(){
    if(!cur)return;
    fetch("/api/chat?room="+encodeURIComponent(cur.room),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({credential:CRED,op:"poll",since:lastId})})
    .then(function(r){return r.json()}).then(function(d){
      if(!d)return;
      if(d.items)d.items.forEach(addMsg);
      if(d.recalls)d.recalls.forEach(onRecall);
    }).catch(function(){});
  }
  tick();pollT=setInterval(tick,3000);
}
function nearBottom(){var s=el("msgs");return s.scrollHeight-s.scrollTop-s.clientHeight<60}
function toBottom(){var s=el("msgs");s.scrollTop=s.scrollHeight;pendingNew=0;el("newpill").style.display="none";}
el("newpill").onclick=toBottom;
el("msgs").addEventListener("scroll",function(){if(nearBottom()){pendingNew=0;el("newpill").style.display="none";}});
function renderRecalled(b){b.textContent="[消息已撤回]";b.className="bub recalled";}
function addMsg(m){
  if(m.id&&seen[m.id])return; if(m.id){seen[m.id]=1;if(m.id>lastId)lastId=m.id;}
  var mine=(ME&&m.name===ME.name),bot=(m.bot||m.name==="WDS智能体");
  if(bot)hideTyping();
  var wasNear=nearBottom();
  var w=document.createElement("div");w.className="msg"+(bot?" bot":(mine?" mine":""));
  var who=document.createElement("div");who.className="who";who.textContent=(bot?"🤖 ":"")+m.name;
  var b=document.createElement("div");b.className="bub";
  var tm=document.createElement("div");tm.className="tm";tm.textContent=fmtT(m.ts);
  w.appendChild(who);w.appendChild(b);w.appendChild(tm);
  if(m.recalled){renderRecalled(b);}
  else if(m.img){
    b.className="bub bub-img";
    var im=document.createElement("img");im.className="cimg";im.loading="lazy";
    im.src="/api/chat/img?room="+encodeURIComponent(cur.room)+"&id="+m.id+(m.tok?("&tok="+encodeURIComponent(m.tok)):"");
    im.onclick=function(){window.open(im.src,"_blank","noopener")};
    im.onerror=function(){b.className="bub";b.textContent="[图片打不开]"};
    b.appendChild(im);
    if(m.text){var c=document.createElement("div");c.className="cap";c.textContent=m.text;b.appendChild(c);}
  }
  else{b.textContent=m.text;}
  if(mine&&!bot&&!m.recalled){
    var age=Date.now()-m.ts;
    if(age<120000){
      var rc=document.createElement("a");rc.className="rc";rc.textContent="撤回";
      rc.onclick=function(){doRecall(m.id)};
      tm.appendChild(document.createTextNode(" · "));tm.appendChild(rc);
      setTimeout(function(){if(rc.parentNode)rc.parentNode.removeChild(rc)},120000-age);
    }
  }
  if(m.id)nodes[m.id]=b;
  el("msgs").appendChild(w);
  if(wasNear||mine)toBottom();
  else{pendingNew++;var p=el("newpill");p.textContent="有 "+pendingNew+" 条新消息 ↓";p.style.display="block";}
}
function onRecall(id){var b=nodes[id];if(b&&!/recalled/.test(b.className))renderRecalled(b);}
function doRecall(id){
  if(usePoll){
    fetch("/api/chat?room="+encodeURIComponent(cur.room),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({credential:CRED,op:"recall",id:id})})
    .then(function(r){return r.json()}).then(function(d){if(!d||!d.ok)note((d&&d.msg)||"撤回失败。")}).catch(function(){note("网络异常。")});
  }else{
    if(!(ws&&connected)){note("正在重连，请稍候…");return;}
    wsSend({t:"recall",id:id});
  }
}
function doSend(){
  var t=el("text").value.trim();
  if(t.length<1||!cur||!cur.room)return;
  if(usePoll){
    el("b-send").disabled=true;
    fetch("/api/chat?room="+encodeURIComponent(cur.room),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({credential:CRED,text:t})})
    .then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})}).then(function(x){
      el("b-send").disabled=false;
      if(x.d&&x.d.ok){el("text").value="";note("");el("text").style.height="40px";}
      else if(x.s===401){note("登录已过期，请重新登录。");logout();}
      else note((x.d&&x.d.msg)||"发送失败。");
    }).catch(function(){el("b-send").disabled=false;note("网络异常。")});
  }else{
    if(!(ws&&connected)){note("正在重连，请稍候…");return;}
    wsSend({t:"msg",text:t});el("text").value="";note("");el("text").style.height="40px";
  }
}
el("b-send").onclick=doSend;
el("text").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();}});
el("text").addEventListener("input",function(){this.style.height="40px";this.style.height=Math.min(this.scrollHeight,110)+"px";});
el("b-wds").onclick=function(){var t=el("text");if(!/^@\s*wds/i.test(t.value))t.value="@WDS "+t.value;t.focus();if(t.value.trim().length>5)doSend();};

/* 表情 */
(function(){
  var EMOJI="😀 😃 😄 😁 😆 😊 🙂 😉 😍 🥰 😘 😜 🤪 🤔 🤨 😐 😴 😷 😎 🥳 🤗 🙄 😮 😲 😳 😭 😢 😱 😡 🥲 👍 👎 👏 🙏 💪 🤝 👌 ✌️ 🙌 🎉 🔥 💯 ❤️ 💔 ⭐ ✅ ❌ 🌹 ☕ 🍵 🎂 👀".split(" ");
  var panel=el("epanel"),btn=el("b-emoji");
  EMOJI.forEach(function(e){var s=document.createElement("span");s.textContent=e;s.onclick=function(){
    var t=el("text"),a=t.selectionStart||0,b=t.selectionEnd||0,v=t.value;
    t.value=v.slice(0,a)+e+v.slice(b);t.selectionStart=t.selectionEnd=a+e.length;t.focus();
  };panel.appendChild(s)});
  btn.onclick=function(ev){ev.stopPropagation();panel.classList.toggle("on")};
  document.addEventListener("click",function(ev){if(panel.classList.contains("on")&&ev.target!==btn&&!panel.contains(ev.target))panel.classList.remove("on")});
})();

/* 图片 */
(function(){
  var f=el("file"),btn=el("b-img");
  btn.onclick=function(){if(cur&&cur.room)f.click();};
  f.onchange=function(){var file=f.files&&f.files[0];f.value="";if(!file)return;
    if(!/^image\//.test(file.type)){note("请选择图片文件。");return;}
    note("图片处理中…");
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){URL.revokeObjectURL(url);
      var mx=1000,w=img.width,h=img.height;
      if(w>mx||h>mx){if(w>=h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
      function draw(sw,sh){var c=document.createElement("canvas");c.width=sw;c.height=sh;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,sw,sh);x.drawImage(img,0,0,sw,sh);return c;}
      var c=draw(w,h),q=0.6,data=c.toDataURL("image/jpeg",q);
      while(data.length>165000&&q>0.35){q-=0.1;data=c.toDataURL("image/jpeg",q);}
      if(data.length>165000){var c2=draw(Math.round(w*0.7),Math.round(h*0.7));data=c2.toDataURL("image/jpeg",0.5);}
      if(data.length>172000){note("这张图压缩后还是太大，换一张小点的。");return;}
      note("图片上传中…");btn.disabled=true;
      fetch("/api/chat/img?room="+encodeURIComponent(cur.room),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({credential:CRED,data:data,caption:el("text").value.trim()})})
      .then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})}).then(function(x){btn.disabled=false;
        if(x.d&&x.d.ok){el("text").value="";note("");}
        else if(x.s===401){note("登录已过期，请重新登录。");logout();}
        else note((x.d&&x.d.msg)||"图片发送失败。");
      }).catch(function(){btn.disabled=false;note("网络异常，图片没发出去。")});
    };
    img.onerror=function(){URL.revokeObjectURL(url);note("图片读取失败。")};
    img.src=url;
  };
})();
