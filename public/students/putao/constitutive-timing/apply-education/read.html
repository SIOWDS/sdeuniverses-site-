<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>重开构成窗口：让能力真正长出来的课堂与家庭操作手册 · 翻页阅读 | SDE Universes</title>
<style>
:root{--accent:#3f5b76;--head:#26303a;--accent2:#8fb3d0;--paper:#fffdf8;--room:#e9e4d8;--room2:#f3efe6;--ink:#2a2620;--mut:#8a8072}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 120% at 50% 0%,var(--room2) 0%,var(--room) 78%);color:var(--ink);font-family:"Songti SC","Noto Serif SC",Georgia,serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.bar{position:fixed;top:0;left:0;right:0;z-index:30;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:14px;background:linear-gradient(rgba(243,239,230,0.92),rgba(243,239,230,0.66));backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,0.06)}
.bar .bk{color:var(--mut);text-decoration:none;font-size:13px;letter-spacing:.05em;white-space:nowrap;transition:color .2s}
.bar .bk:hover{color:var(--accent)}
.bar .ttl{flex:1;text-align:center;font-size:14px;color:var(--head);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar .dl{color:var(--accent);text-decoration:none;font-size:12.5px;border:1px solid rgba(10,102,194,.4);padding:5px 13px;border-radius:20px;white-space:nowrap;transition:all .2s}
.bar .dl:hover{background:var(--accent);color:#fff}
.scene{position:fixed;top:52px;bottom:70px;left:0;right:0;display:flex;align-items:center;justify-content:center;perspective:2400px;padding:22px 8px}
.book{position:relative;height:100%;max-height:100%;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
.leaf{position:relative;height:100%;background:var(--paper);border-radius:3px 6px 6px 3px;box-shadow:0 22px 60px rgba(40,30,15,.28),0 4px 14px rgba(40,30,15,.16);overflow:hidden;transform-origin:left center;will-change:transform,opacity}
.leaf::before{content:"";position:absolute;top:0;bottom:0;left:0;width:26px;background:linear-gradient(90deg,rgba(0,0,0,.10),rgba(0,0,0,0) 70%);pointer-events:none;z-index:3}
.leaf::after{content:"";position:absolute;top:0;bottom:0;right:0;width:14px;background:linear-gradient(270deg,rgba(0,0,0,.05),transparent);pointer-events:none}
canvas{display:block;height:100%;width:auto;max-width:100%}
.leaf.turn-next{animation:tn .52s cubic-bezier(.4,.05,.25,1)}
.leaf.turn-prev{animation:tp .52s cubic-bezier(.4,.05,.25,1)}
@keyframes tn{0%{transform:rotateY(0);opacity:1}45%{transform:rotateY(-16deg);box-shadow:-30px 22px 60px rgba(40,30,15,.34)}55%{transform:rotateY(14deg)}100%{transform:rotateY(0);opacity:1}}
@keyframes tp{0%{transform:rotateY(0)}45%{transform:rotateY(16deg)}55%{transform:rotateY(-14deg)}100%{transform:rotateY(0)}}
.tapz{position:fixed;top:52px;bottom:70px;width:26%;z-index:12;cursor:pointer;display:flex;align-items:center;opacity:0;transition:opacity .25s}
.tapz.l{left:0;justify-content:flex-start;padding-left:14px}
.tapz.r{right:0;justify-content:flex-end;padding-right:14px}
.tapz:hover{opacity:1}
.chev{width:44px;height:44px;border-radius:50%;background:rgba(255,253,248,.9);box-shadow:0 6px 18px rgba(40,30,15,.2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;line-height:1}
.dock{position:fixed;bottom:0;left:0;right:0;z-index:30;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:linear-gradient(rgba(243,239,230,0),rgba(243,239,230,.85) 40%)}
.prog{width:min(560px,74vw);height:4px;background:rgba(0,0,0,.09);border-radius:3px;overflow:hidden;cursor:pointer}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px;transition:width .35s}
.pgrow{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--mut);letter-spacing:.04em}
.pgrow button{background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;font-family:inherit;padding:2px 8px;border-radius:4px;transition:background .2s}
.pgrow button:hover:not(:disabled){background:rgba(10,102,194,.1)}
.pgrow button:disabled{opacity:.3;cursor:default}
.pgrow .cur{color:var(--head);font-weight:600;font-size:14px}
.load{position:fixed;inset:52px 0 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--mut)}
.sp{width:38px;height:38px;border:3px solid rgba(10,102,194,.22);border-top-color:var(--accent);border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{position:fixed;inset:52px 0 70px;display:flex;align-items:center;justify-content:center;text-align:center;color:#9a3b3b;padding:30px;line-height:1.9}
.err a{color:var(--accent)}
@media(max-width:640px){.bar .ttl{font-size:12.5px}.tapz{width:32%;opacity:.5}.chev{width:38px;height:38px;font-size:19px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="bar">
  <a class="bk" href="/students/putao/constitutive-timing/apply-education/">‹ 返回文章</a>
  <div class="ttl">重开构成窗口：让能力真正长出来的课堂与家庭操作手册</div>
  <a class="dl" href="apply-education.pdf" target="_blank">下载 PDF</a>
</div>
<div class="scene"><div class="book" id="book"></div></div>
<div class="tapz l" id="tl"><div class="chev">‹</div></div>
<div class="tapz r" id="tr"><div class="chev">›</div></div>
<div class="dock">
  <div class="prog" id="prog"><div class="fill" id="fill"></div></div>
  <div class="pgrow">
    <button id="prev">‹ 上一页</button>
    <span><span class="cur" id="cur">1</span> / <span id="tot">3</span></span>
    <button id="next">下一页 ›</button>
  </div>
</div>
<div class="load" id="load"><div class="sp"></div><div style="font-size:14px">正在展开书页…<br><span style="font-size:12.5px;opacity:.8">3 页 · 首次载入一两秒</span></div></div>
<div class="err" id="err" style="display:none"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var PDF="apply-education.pdf",book=document.getElementById('book'),load=document.getElementById('load'),err=document.getElementById('err');
var cur=1,total=3,doc=null,rendering=false,dpr=Math.min(window.devicePixelRatio||1,2.2);
function sceneH(){return document.querySelector('.scene').clientHeight-44;}
async function render(n,dir){
  if(!doc||rendering)return; rendering=true;
  try{
    var page=await doc.getPage(n);
    var h=sceneH(),vp0=page.getViewport({scale:1}),scale=h/vp0.height,vp=page.getViewport({scale:scale*dpr});
    var cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    cv.style.height=h+'px';cv.style.width=(vp.width/dpr)+'px';
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    var leaf=document.createElement('div');leaf.className='leaf';leaf.appendChild(cv);
    book.innerHTML='';book.appendChild(leaf);
    if(dir){leaf.classList.add(dir==='next'?'turn-next':'turn-prev');}
    document.getElementById('cur').textContent=n;
    document.getElementById('fill').style.width=(total<=1?100:(n-1)/(total-1)*100)+'%';
    document.getElementById('prev').disabled=(n<=1);
    document.getElementById('next').disabled=(n>=total);
  }catch(e){console.error(e);}
  rendering=false;
}
function go(n,dir){ if(n<1||n>total||n===cur||rendering)return; cur=n; render(cur,dir); }
document.getElementById('next').onclick=function(){go(cur+1,'next')};
document.getElementById('prev').onclick=function(){go(cur-1,'prev')};
document.getElementById('tr').onclick=function(){go(cur+1,'next')};
document.getElementById('tl').onclick=function(){go(cur-1,'prev')};
document.getElementById('prog').onclick=function(e){var r=this.getBoundingClientRect();var p=(e.clientX-r.left)/r.width;go(Math.max(1,Math.min(total,Math.round(p*(total-1))+1)));};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1,'next');}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1,'prev');}
  else if(e.key==='Home'){go(1);}else if(e.key==='End'){go(total);}
});
var tsx=0,tsy=0;
document.querySelector('.scene').addEventListener('touchstart',function(e){tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
document.querySelector('.scene').addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)){ if(dx<0)go(cur+1,'next'); else go(cur-1,'prev'); }
},{passive:true});
window.addEventListener('resize',function(){clearTimeout(window._rz);window._rz=setTimeout(function(){render(cur);},220);});
(async function(){
  try{
    doc=await pdfjsLib.getDocument(PDF).promise; total=doc.numPages;
    document.getElementById('tot').textContent=total;
    load.style.display='none';
    await render(1);
  }catch(e){
    load.style.display='none';
    err.style.display='flex';
    err.innerHTML='书页展开失败。你可以<a href="'+PDF+'" target="_blank">直接打开 PDF</a>，或<a href="/students/putao/constitutive-timing/apply-education/">返回文章页</a>阅读长文版。';
  }
})();
</script>

<script>window.WDS_PDF={url:"apply-education.pdf",curSel:"#cur",curAttr:"text"};</script>

<script src="/wds-mode.js?v=20260731h" defer></script>
</body></html>
