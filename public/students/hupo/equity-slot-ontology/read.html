<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>股票是什么？ · 在线 PDF | 琥珀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1b1f2a;color:#E9EBF2;font-family:"PingFang SC","Noto Sans SC",-apple-system,sans-serif}
.bar{position:sticky;top:0;z-index:10;background:#141822;border-bottom:1px solid rgba(233,235,242,.14);
padding:9px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;font-size:13px}
.bar a,.bar button{color:#E9EBF2;background:transparent;border:1px solid rgba(233,235,242,.28);
border-radius:2px;padding:4px 11px;cursor:pointer;font-size:12.5px;text-decoration:none;font-family:inherit}
.bar button:hover,.bar a:hover{border-color:#C89BAF;color:#C89BAF}
#pg{width:56px;text-align:center;background:transparent;color:#E9EBF2;border:1px solid rgba(233,235,242,.28);border-radius:2px;padding:4px}
#box{display:flex;justify-content:center;padding:16px 8px 40px}
canvas{max-width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5);background:#fff}
.hint{text-align:center;color:#8A93A6;font-size:12px;padding:0 16px 24px}
</style></head><body>
<div class="bar">
<a href="./">← 长文阅读</a>
<button id="prev">‹ 上一页</button>
<input id="pg" value="1"> <span id="tot">/ …</span>
<button id="next">下一页 ›</button>
<button id="zin">＋</button><button id="zout">－</button>
<a href="equity-slot-ontology.pdf">⬇ 下载</a>
<a href="/students/hupo/works/">全部文章</a>
</div>
<div id="box"><canvas id="cv"></canvas></div>
<div class="hint">键盘 ← → 翻页，点击画面左右两侧也可翻页</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var pdfDoc=null,page=1,scale=1.35,cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function draw(n){pdfDoc.getPage(n).then(function(p){
var vp=p.getViewport({scale:scale});cv.width=vp.width;cv.height=vp.height;
p.render({canvasContext:ctx,viewport:vp});document.getElementById("pg").value=n;});}
pdfjsLib.getDocument("equity-slot-ontology.pdf").promise.then(function(d){pdfDoc=d;
document.getElementById("tot").textContent="/ "+d.numPages;draw(page);});
function go(n){if(!pdfDoc)return;if(n<1||n>pdfDoc.numPages)return;page=n;draw(page);window.scrollTo(0,0);}
document.getElementById("prev").onclick=function(){go(page-1)};
document.getElementById("next").onclick=function(){go(page+1)};
document.getElementById("zin").onclick=function(){scale=Math.min(scale+0.25,3);draw(page)};
document.getElementById("zout").onclick=function(){scale=Math.max(scale-0.25,0.6);draw(page)};
document.getElementById("pg").addEventListener("change",function(){go(parseInt(this.value)||1)});
document.addEventListener("keydown",function(e){if(e.key==="ArrowLeft")go(page-1);if(e.key==="ArrowRight")go(page+1);});
cv.addEventListener("click",function(e){var r=cv.getBoundingClientRect();
if(e.clientX-r.left<r.width/2)go(page-1);else go(page+1);});
</script></body></html>
