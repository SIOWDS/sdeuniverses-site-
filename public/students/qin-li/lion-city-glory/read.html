<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var SRC = "lcg" + ".pdf";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var pdfDoc=null, pageNum=1, rendering=false, pending=null, scale=1.3;
var canvas=document.getElementById('pdfCanvas'), ctx=canvas.getContext('2d');
function $(id){return document.getElementById(id);}
function render(num){
  rendering=true;
  pdfDoc.getPage(num).then(function(page){
    var vp=page.getViewport({scale:scale});
    var ratio=window.devicePixelRatio||1;
    canvas.width=vp.width*ratio; canvas.height=vp.height*ratio;
    canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
    ctx.setTransform(ratio,0,0,ratio,0,0);
    page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
      rendering=false;
      if(pending!==null){var n=pending;pending=null;render(n);}
    });
  });
  $('pageInput').value=num;
  $('prev').disabled=(num<=1);
  $('next').disabled=(num>=pdfDoc.numPages);
}
function queue(num){ if(rendering) pending=num; else render(num); }
function go(n){ if(!pdfDoc)return; pageNum=Math.min(Math.max(1,n),pdfDoc.numPages); queue(pageNum); window.scrollTo({top:0,behavior:'smooth'}); }
pdfjsLib.getDocument(SRC).promise.then(function(pdf){
  pdfDoc=pdf;
  $('totalPages').textContent=pdf.numPages;
  $('pageInput').max=pdf.numPages;
  $('loading').style.display='none';
  $('canvas-wrap').style.display='block';
  render(pageNum);
}).catch(function(err){
  $('loading').style.display='none';
  $('error').style.display='block';
  $('error').innerHTML='全书暂时无法在线载入，请稍后刷新重试。<br>你也可以先<a href="preview.html" style="color:#8A6817">选读前三章</a>。<br><span style="font-size:12px;color:#8A7B54">（'+err.message+'）</span>';
});
$('prev').onclick=function(){go(pageNum-1);};
$('next').onclick=function(){go(pageNum+1);};
$('tapLeft').onclick=function(){go(pageNum-1);};
$('tapRight').onclick=function(){go(pageNum+1);};
$('pageInput').onchange=function(e){go(parseInt(e.target.value)||1);};
$('jump').onchange=function(e){var v=parseInt(e.target.value); if(v){go(v);} e.target.selectedIndex=0;};
$('zoomIn').onclick=function(){scale=Math.min(scale+0.2,3);queue(pageNum);};
$('zoomOut').onclick=function(){scale=Math.max(scale-0.2,0.6);queue(pageNum);};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')go(pageNum-1);
  if(e.key==='ArrowRight')go(pageNum+1);
});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
canvas.addEventListener('dragstart',function(e){e.preventDefault();});
</script>
