<div class="poem">
  <div class="kicker">诗 · POEM</div>
  <h1>雨夜</h1>
  <div class="by">秦 莉</div>
  <div class="rule"></div>
  <div class="stz">雨落在旧街 落在青石板上<br>落在伞下 撑起了夜的孤独</div>
<div class="stz">风推开一扇窗<br>远方的灯光摇曳<br>像遥不可及的问候 徘徊</div>
<div class="stz">思念在雨中交错<br>是失魂落魄的回音</div>
<div class="stz">夜那么深 雨未停<br>梦里握不住的手 冰凉</div>
<div class="stz">我在湿润的夜里等一场洗礼<br>等微光再现<br>等你 落在我掌心。</div>
