<div class="poem">
  <div class="kicker">诗 · POEM</div>
  <h1>起初之爱</h1>
  <div class="by">秦 莉</div><div class="pubdate" style="font-size:12.5px;color:#6B6047;letter-spacing:.06em;margin-top:6px">发表于2026年7月13日</div>
  <div class="rule"></div>
  <div class="stz">夜深了<br>我为你哭泣<br>不为那颈项的珍珠<br>不为那千年的地契<br>也不为那流逝的青春<br>仅仅是<br>每一次相聚<br>是翘首<br>也是落幕<br>……</div>
<div class="stz">曾忆否<br>你扶犁而憩<br>四月的麦浪笑了<br>如今<br>一场醉生梦死的交易</div>
<div class="stz">谁人掳掠了你的灵魂<br>毒蜂一样的软语盘踞我心<br>千年一日<br>一日千年<br>我要乘风归去<br>权能者却叫我全然释放<br>归回那起初之爱<br>骨中的骨<br>肉中的肉</div>
<div class="dateline">（2015.9.23·新加坡）</div>
