  <div class="kicker">诗 · POEM</div>
  <h1>山那边</h1>
  <div class="by">秦 莉</div><div class="pubdate" style="font-size:12.5px;color:#6B6047;letter-spacing:.06em;margin-top:6px">发表于2026年7月13日</div>
  <div class="rule"></div>
  <div class="stz">外婆在山的那边<br>妈妈在山的这边<br>一走就是一个甲子<br>无数个日日夜夜<br>天上星星碎了<br>地上花儿谢了<br>门前的枣熟了</div>
<div class="stz">母亲简单的行囊<br>她行一天的路<br>寻找太阳的影子<br>抬起头看山看水<br>星星和月亮在一起<br>云和雨相伴<br>一条路系着山的里里外外<br>从此温柔的人有福了</div>
<div class="dateline">（2023.3.1）</div>
