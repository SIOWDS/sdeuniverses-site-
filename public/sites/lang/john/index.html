<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>与 John 对话 · 语言发生学</title>
<meta name="description" content="语言发生对话智能体：把一句「说不上来就是不对」交给它，顺着 John（胡志英）的路子往下追。语感、语法、语言教学与语言学习。">
<link rel="canonical" href="https://lang.sdeuniverses.com/john/">
<meta property="og:title" content="与 John 对话 · 语言发生学">
<meta property="og:description" content="把一句「说不上来就是不对」交给它，顺着 John 的路子往下追。">
<meta name="theme-color" content="#0B0E14">
<style>
:root{
  --night:#0B0E14; --night2:#121722; --bone:#E8E4DA; --bone2:#8E94A3;
  --edge:rgba(232,228,218,.16);
  --indigo:#6E9BD8; --vermilion:#D2604A; --jade:#6FA98C;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--sans);
  font-size:16px;line-height:1.8;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;width:100%;padding:0 20px}

.top{border-bottom:1px solid var(--edge);flex:none;
  background:rgba(11,14,20,.9);backdrop-filter:saturate(140%) blur(8px)}
.top .wrap{display:flex;align-items:baseline;gap:16px;height:56px}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.14em;color:var(--bone)}
.brand em{font-style:normal;color:var(--bone2);font-size:11px;letter-spacing:.24em;margin-left:9px}
.top nav{margin-left:auto;display:flex;gap:18px;font-size:13px;color:var(--bone2)}
.top nav a:hover{color:var(--indigo)}

#log{flex:1 1 auto;overflow-y:auto;padding:26px 0 8px}
.intro{border:1px solid var(--edge);background:var(--night2);padding:22px 22px 18px;margin-bottom:24px}
.intro h1{font-family:var(--serif);font-size:22px;letter-spacing:.1em;margin:0 0 8px;font-weight:600;color:#F4F2EC}
.intro p{margin:0 0 10px;font-size:14.5px;color:#B2B8C6}
.intro p:last-of-type{margin-bottom:0}
.seeds{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.seed{border:1px solid var(--edge);background:rgba(255,255,255,.03);color:#C3C9D6;
  font:inherit;font-size:13px;padding:7px 12px;cursor:pointer;text-align:left;line-height:1.5}
.seed:hover{border-color:var(--indigo);color:#F4F2EC}

.msg{margin:0 0 22px;display:flex;gap:13px;align-items:flex-start}
.who{flex:none;width:34px;height:34px;border:1px solid var(--edge);display:flex;
  align-items:center;justify-content:center;font-family:var(--serif);font-size:13.5px;
  letter-spacing:.04em;color:var(--bone2);margin-top:2px}
.msg.u .who{border-color:rgba(110,155,216,.5);color:var(--indigo)}
.msg.j .who{border-color:rgba(210,96,74,.5);color:var(--vermilion)}
.bd{flex:1 1 auto;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
.msg.u .bd{color:#C9CEDA}
.msg.j .bd{color:#EDEBE4}
.bd b{color:#F4F2EC;font-weight:600}
.cursor{display:inline-block;width:7px;height:16px;background:var(--vermilion);
  vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.err{color:var(--vermilion);font-size:14px;font-family:var(--mono)}

.compose{margin:0 0 22px;border:1px solid var(--edge);background:var(--night2)}
.compose .hd{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--edge)}
.compose .hd b{font-family:var(--serif);font-size:15px;letter-spacing:.12em;color:#F4F2EC;font-weight:600}
.compose .hd span{font-family:var(--mono);font-size:11px;color:var(--bone2);margin-left:auto}
.compose .bd2{padding:18px 18px 20px;white-space:pre-wrap;word-break:break-word;font-size:15.5px;
  color:#EDEBE4;font-family:var(--serif);line-height:1.95}
.compose .act{display:flex;gap:10px;padding:0 16px 16px;flex-wrap:wrap}
.compose .act button{border:1px solid var(--edge);background:rgba(255,255,255,.04);color:#C3C9D6;
  font:inherit;font-size:12.5px;padding:6px 13px;cursor:pointer;font-family:var(--mono)}
.compose .act button:hover{border-color:var(--indigo);color:#F4F2EC}
.bar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px;align-items:center}
.bar .lb{font-family:var(--mono);font-size:11.5px;color:var(--bone2);letter-spacing:.14em}
.bar button{border:1px solid var(--edge);background:rgba(255,255,255,.03);color:#C3C9D6;
  font:inherit;font-size:13px;padding:7px 14px;cursor:pointer}
.bar button:hover:not(:disabled){border-color:var(--jade);color:#F4F2EC}
.bar button:disabled{opacity:.4;cursor:default}
.bar button em{font-style:normal;color:var(--bone2);font-size:11.5px;margin-left:6px;font-family:var(--mono)}
.dock{flex:none;border-top:1px solid var(--edge);background:rgba(11,14,20,.96);padding:14px 0 18px}
.box{display:flex;gap:10px;align-items:flex-end;border:1px solid var(--edge);
  background:var(--night2);padding:10px 12px}
.box:focus-within{border-color:var(--indigo)}
#q{flex:1 1 auto;border:0;background:transparent;color:var(--bone);font:inherit;font-size:15.5px;
  outline:none;resize:none;max-height:180px;line-height:1.7}
#q::placeholder{color:#6A7183}
#go{flex:none;border:1px solid var(--edge);background:rgba(110,155,216,.14);color:var(--bone);
  font:inherit;font-size:14px;padding:7px 16px;cursor:pointer;font-family:var(--serif);letter-spacing:.1em}
#go:hover:not(:disabled){border-color:var(--indigo);background:rgba(110,155,216,.24)}
#go:disabled{opacity:.45;cursor:default}
.foot{margin-top:9px;font-size:11.5px;color:#6A7183;font-family:var(--mono);line-height:1.7}
.foot a{color:#8E9AB0;border-bottom:1px solid var(--edge)}
button:focus-visible,#q:focus-visible,a:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
@media(max-width:640px){
  #log{padding-top:18px}
  .intro{padding:18px 16px 15px}
  .msg{gap:10px}
  .who{width:30px;height:30px;font-size:12px}
}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="brand" href="/">语言发生学<em>与 John 对话</em></a>
  <nav>
    <a href="/">首页</a>
    <a href="/all/">全部篇目</a>
  </nav>
</div></header>

<div id="log"><div class="wrap">
  <div class="intro">
    <h1>与 John 对话</h1>
    <p>我是 John（胡志英）。这里谈语言——语感、语法、语言教学与语言学习。</p>
    <p>最好的开头是<b>一句具体的话</b>：你觉得别扭的那一句、学生写错的那一句、你自己怎么改都不对劲的那一句。抽象地问「怎么提高语感」，我大概只能抽象地答。</p>
    <div class="seeds">
      <button class="seed" type="button">「他对这件事情进行了一个认真的思考。」——每条规则都对，为什么还是不对？</button>
      <button class="seed" type="button">学生语法全会，一开口还是生硬，问题出在哪？</button>
      <button class="seed" type="button">语感到底能不能教？</button>
      <button class="seed" type="button">我的课堂气氛很好、学生也答得出，为什么换个场景他们就不会了？</button>
    </div>
  </div>
</div></div>

<div class="dock"><div class="wrap">
  <div class="bar" id="bar" hidden>
    <span class="lb">概括成文</span>
    <button type="button" data-kind="paper">论文<em>约 1 万字</em></button>
    <button type="button" data-kind="essay">散文<em>约 4000 字</em></button>
    <button type="button" data-kind="wechat">公众号文章<em>约 2000 字</em></button>
  </div>
  <div class="box">
    <textarea id="q" rows="1" placeholder="说一句具体的话……（Enter 发送，Shift+Enter 换行）" aria-label="输入你的问题"></textarea>
    <button id="go" type="button">发送</button>
  </div>
  <p class="foot">依据王德生《SDE 语言发生学》与站上已发表文本生成，<b>不代表胡志英本人的即时观点</b>。 ·
    <a href="https://sdeuniverses.com/">SDE Universes</a> 语言分站</p>
</div></div>

<script>
(function(){
  var log=document.getElementById("log"), q=document.getElementById("q"), go=document.getElementById("go");
  var wrap=log.querySelector(".wrap");
  var HIST=[], busy=false;

  // 分站页面的自家链接写的是分站根。若从主站以 /sites/lang/… 预览，就地补前缀。
  var B="/sites/lang", pre=(location.pathname.indexOf(B)===0)?B:"";
  if(pre){ var as=document.querySelectorAll('a[href^="/"]');
    for(var i=0;i<as.length;i++){ var hh=as[i].getAttribute("href");
      if(hh.indexOf("/sites/")!==0) as[i].setAttribute("href",pre+hh); } }

  function el(cls,who){
    var d=document.createElement("div"); d.className="msg "+cls;
    var w=document.createElement("div"); w.className="who"; w.textContent=who;
    var b=document.createElement("div"); b.className="bd";
    d.appendChild(w); d.appendChild(b); wrap.appendChild(d);
    return b;
  }
  function bottom(){ log.scrollTop=log.scrollHeight; }
  function grow(){ q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,180)+"px"; }

  function ask(text){
    if(busy) return;
    text=String(text||"").trim(); if(!text) return;
    busy=true; go.disabled=true; q.value=""; grow();
    el("u","你").textContent=text;
    HIST.push({role:"user",content:text});
    var out=el("j","John");
    var cur=document.createElement("span"); cur.className="cursor"; out.appendChild(cur);
    bottom();

    var acc="";
    function put(t){ acc+=t; out.textContent=acc; out.appendChild(cur); bottom(); }
    function stop(){ try{out.removeChild(cur);}catch(e){} busy=false; go.disabled=false; q.focus(); }

    fetch(pre?"/api/john":"/api/john",{
      method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({messages:HIST})
    }).then(function(r){
      if(!r.ok||!r.body){
        return r.json().then(function(j){ throw new Error((j&&j.msg)||("HTTP "+r.status)); },
                             function(){ throw new Error("HTTP "+r.status); });
      }
      var rd=r.body.getReader(), dec=new TextDecoder(), buf="", fin=false;
      function pump(){
        return rd.read().then(function(s){
          if(s.done||fin){ return; }
          buf+=dec.decode(s.value,{stream:true});
          var nl;
          while((nl=buf.indexOf("\n"))>=0){
            var line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
            if(!line||line.indexOf("data:")!==0) continue;
            var pay=line.slice(5).trim();
            if(pay==="[DONE]"){ fin=true; buf=""; break; }
            try{ var j=JSON.parse(pay);
              if(j.t==="d"&&j.v) put(j.v);
              else if(j.t==="error"){ var e=document.createElement("div"); e.className="err";
                e.textContent="⚠ "+j.v; out.parentNode.appendChild(e); }
            }catch(e){}
          }
          if(fin) return;
          return pump();
        });
      }
      return pump();
    }).then(function(){
      if(acc){ HIST.push({role:"assistant",content:acc}); showBar(); }
      else { var e=document.createElement("div"); e.className="err"; e.textContent="⚠ 这一轮没有收到回答，请再问一次。"; out.parentNode.appendChild(e); }
      stop();
    }).catch(function(err){
      var e=document.createElement("div"); e.className="err";
      e.textContent="⚠ "+((err&&err.message)||"网络中断了，请再试一次。");
      out.parentNode.appendChild(e); stop(); bottom();
    });
  }

  // ── 概括成文 ───────────────────────────────────────────────
  // 段数必须与后端 JOHN_COMPOSE 一致；两处对不上就会缺段或空转。
  var KINDS={paper:{n:4,label:"论文",total:"约一万字"},
             essay:{n:2,label:"散文",total:"约四千字"},
             wechat:{n:1,label:"公众号文章",total:"约两千字"}};
  var bar=document.getElementById("bar");
  function showBar(){ if(HIST.length>=4) bar.hidden=false; }

  function compose(kind){
    if(busy) return;
    var K=KINDS[kind]; if(!K) return;
    busy=true; go.disabled=true;
    var bs=bar.querySelectorAll("button");
    for(var i=0;i<bs.length;i++) bs[i].disabled=true;

    var box=document.createElement("div"); box.className="compose";
    var hd=document.createElement("div"); hd.className="hd";
    var t=document.createElement("b"); t.textContent=K.label;
    var st=document.createElement("span"); st.textContent="正在写…";
    hd.appendChild(t); hd.appendChild(st);
    var bd=document.createElement("div"); bd.className="bd2";
    box.appendChild(hd); box.appendChild(bd); wrap.appendChild(box); bottom();

    var full="", part=1;

    function done(){
      st.textContent=full.replace(/\s/g,"").length+" 字";
      var act=document.createElement("div"); act.className="act";
      var b1=document.createElement("button"); b1.type="button"; b1.textContent="复制全文";
      b1.onclick=function(){
        function ok(){ b1.textContent="已复制"; setTimeout(function(){b1.textContent="复制全文";},1600); }
        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(full).then(ok,fallback); }
        else fallback();
        function fallback(){ var ta=document.createElement("textarea"); ta.value=full;
          ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
          try{ document.execCommand("copy"); ok(); }catch(e){}
          document.body.removeChild(ta); }
      };
      var b2=document.createElement("button"); b2.type="button"; b2.textContent="下载 .md";
      b2.onclick=function(){
        var blob=new Blob([full],{type:"text/markdown;charset=utf-8"});
        var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
        a.download=(K.label+"-"+new Date().toISOString().slice(0,10)+".md");
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
      };
      act.appendChild(b1); act.appendChild(b2); box.appendChild(act);
      busy=false; go.disabled=false;
      for(var i=0;i<bs.length;i++) bs[i].disabled=false;
      bottom();
    }

    function run(){
      if(K.n>1) st.textContent="第 "+part+" / "+K.n+" 段 · 正在写…";
      var got="";
      fetch("/api/john/compose",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({messages:HIST,kind:kind,part:part,prev:full.slice(-800)})
      }).then(function(r){
        if(!r.ok||!r.body){ return r.json().then(function(j){ throw new Error((j&&j.msg)||("HTTP "+r.status)); },
                                                function(){ throw new Error("HTTP "+r.status); }); }
        var rd=r.body.getReader(), dec=new TextDecoder(), buf="", fin=false;
        function pump(){
          return rd.read().then(function(s){
            if(s.done||fin) return;
            buf+=dec.decode(s.value,{stream:true});
            var nl;
            while((nl=buf.indexOf("\n"))>=0){
              var line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
              if(!line||line.indexOf("data:")!==0) continue;
              var pay=line.slice(5).trim();
              if(pay==="[DONE]"){ fin=true; buf=""; break; }
              try{ var j=JSON.parse(pay);
                if(j.t==="d"&&j.v){ got+=j.v; full+=j.v; bd.textContent=full; bottom(); }
                else if(j.t==="beat"&&!got){ st.textContent=(K.n>1?("第 "+part+" / "+K.n+" 段 · "):"")+"思考中 "+j.v+"s"; }
                else if(j.t==="note"||j.t==="error"){
                  var e=document.createElement("div"); e.className="err"; e.style.padding="0 18px 12px";
                  e.textContent="⚠ "+j.v; box.appendChild(e); }
              }catch(e){}
            }
            if(fin) return;
            return pump();
          });
        }
        return pump();
      }).then(function(){
        if(part<K.n&&got){ part++; full+="\n\n"; run(); }
        else done();
      }).catch(function(err){
        var e=document.createElement("div"); e.className="err"; e.style.padding="0 18px 12px";
        e.textContent="⚠ "+((err&&err.message)||"网络中断，请重试。"); box.appendChild(e);
        done();
      });
    }
    run();
  }
  var kb=bar.querySelectorAll("button");
  for(var bi=0;bi<kb.length;bi++){
    kb[bi].addEventListener("click",function(){ compose(this.getAttribute("data-kind")); });
  }

  go.addEventListener("click",function(){ ask(q.value); });
  q.addEventListener("input",grow);
  q.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); ask(q.value); }
  });
  var seeds=document.querySelectorAll(".seed");
  for(var k=0;k<seeds.length;k++){
    seeds[k].addEventListener("click",function(){ ask(this.textContent.trim()); });
  }
  q.focus();
})();
</script>
</body></html>
