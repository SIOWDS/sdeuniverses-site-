<!-- 入口层：同步引入 hm-portal.js（**不得 defer/async**——它要赶在 <body> 落地前把页面
     按住、只放三角这一层出来，否则会先闪一下下面的静态门再盖上）。hm-portal.js 克隆自主站

<style>
  :root{
    --paper:#F1F3EF; --card:#FAFBF9; --ink:#14201B; --ink2:#5B6B62; --ink3:#8A968E;
    --line:#C7D0C9; --line2:#DBE1DB; --pine:#1E4D3E; --gold:#A8842B; --chop:#A63A2B;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper);color:var(--ink);min-height:100%}
  body{font-family:var(--serif);line-height:1.8;display:flex;align-items:center;
       justify-content:center;padding:7vh 5vw}
  .wrap{max-width:720px;width:100%}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.34em;color:var(--gold);
           text-transform:uppercase;margin-bottom:1.1rem}
  h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:600;letter-spacing:.08em;color:var(--pine)}
  h1 em{font-style:normal;font-family:var(--mono);font-size:.44em;letter-spacing:.26em;
        color:var(--ink3);margin-left:.9em;vertical-align:.28em}
  .sub{color:var(--ink2);margin-top:.7rem;font-size:.96rem;letter-spacing:.02em}
  .three{display:grid;grid-template-columns:1fr;gap:.8rem;margin:2.3rem 0 1.5rem}
  @media(min-width:640px){.three{grid-template-columns:repeat(3,1fr)}}
  .three a{display:block;padding:1.05rem 1.15rem 1.15rem;text-decoration:none;color:var(--ink);
    border:1px solid var(--line);border-radius:3px;background:var(--card);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
  .three a:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,32,27,.12)}
  .three a .mk{font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;color:var(--ink3);
    text-transform:uppercase;display:block;margin-bottom:.5rem}
  .three a b{display:block;font-size:1.16rem;font-weight:600;letter-spacing:.03em}
  .three a span{display:block;font-size:.8rem;color:var(--ink2);margin-top:.4rem;line-height:1.65}
  .three a.c1{border-top:3px solid var(--pine)}
  .three a.c2{border-top:3px solid var(--gold)}
  .three a.c3{border-top:3px solid var(--chop)}
  .three a.c1:hover{border-color:var(--pine)}
  .three a.c2:hover{border-color:var(--gold)}
  .three a.c3:hover{border-color:var(--chop)}
  .line{font-size:.9rem;color:var(--ink2);border-left:3px solid var(--line);padding-left:.85rem;
        margin:.2rem 0 1.6rem}
  .line b{color:var(--pine);font-weight:600}
  .more{font-size:.84rem;color:var(--ink3)}
  .more a{color:var(--pine);text-decoration:none;margin:0 .42rem;white-space:nowrap}
  .more a:hover{text-decoration:underline}
  .more a.out{font-family:var(--mono);font-size:.78rem}
  .chop{float:right;width:52px;height:52px;border:2px solid var(--chop);border-radius:5px;
        color:var(--chop);font-family:var(--serif);display:flex;align-items:center;justify-content:center;
        font-size:1.5rem;transform:rotate(-4deg);opacity:.9;margin-top:.2rem}
  @media(max-width:520px){.chop{width:44px;height:44px;font-size:1.25rem}}
</style>
