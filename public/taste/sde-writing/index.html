<style>

.fruit button:hover{color:var(--wgold)}

.sbd .pstrip{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}

.sS{color:var(--s)}.sD{color:var(--d)}.sE{color:var(--e)}

.lab{display:grid;grid-template-columns:1fr 420px;gap:14px;margin:22px 0 0}

.ed blockquote{margin:0 0 .8em;padding-left:12px;border-left:2px solid var(--wgold);color:var(--wdim)}

.ed td,.ed th{border:1px solid var(--wline);padding:5px 9px}
textarea.src{flex:1;min-height:380px;background:var(--wbg2);color:var(--wtx);border:0;padding:16px 18px;font:13px/1.75 ui-monospace,Menlo,Consolas,monospace;resize:none;outline:none}
.rtb{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--wline)}
.rtb button{background:var(--wfill);border:1px solid var(--wline);color:var(--wdim);font-size:12px;padding:5px 9px;border-radius:6px}
.rtb button:hover{color:var(--wgold);border-color:var(--wgold)}
/* 五台智能体 */
.ags{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--wline);flex-wrap:wrap}
.ags button{flex:1;min-width:104px;background:transparent;border:1px solid var(--wline);color:var(--wdim);font-size:13px;padding:8px 6px;border-radius:8px}

.agdesc{font-size:12.5px;color:var(--wdim2);padding:8px 14px;border-bottom:1px solid var(--wline);line-height:1.7}
.ms{flex:1;overflow:auto;padding:12px 14px;min-height:220px}
.row{margin:0 0 13px}
.row.me{text-align:right}
.row.me .bb{display:inline-block;background:var(--wfill);border-radius:12px 12px 3px 12px;padding:7px 11px;font-size:13.5px;text-align:left;max-width:88%;white-space:pre-wrap;word-break:break-word}
.row.wds .bb{font-size:14px;line-height:1.85}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.row .acts button{background:none;border:1px solid var(--wline);color:var(--wdim);font-size:11.5px;padding:4px 8px;border-radius:6px}
.row .acts button:hover{color:var(--wgold);border-color:var(--wgold)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.quick button{background:var(--wfill);border:1px solid var(--wline);color:var(--wdim);font-size:11.5px;padding:5px 10px;border-radius:999px}
.quick button:hover{color:var(--wgold);border-color:var(--wgold)}
.inb{display:flex;gap:8px;padding:8px 12px 12px;align-items:flex-end;border-top:1px solid var(--wline)}
.inb textarea{flex:1;min-height:40px;max-height:130px;background:var(--wbg2);color:var(--wtx);border:1px solid var(--wline);border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px;resize:none;outline:none}
.inb textarea:focus{border-color:var(--wgold)}
#note{font-size:12.5px;color:var(--wgold);padding:0 14px 8px;min-height:1.2em;line-height:1.7}
.diagx{font-size:11.5px;color:var(--wdim2)}
.foot{border-top:1px solid var(--wline);padding:24px 0 60px;font-size:13px;color:var(--wdim2)}
.foot a{color:var(--wdim)}
.note{margin:18px 0 0;padding:13px 16px;background:var(--wpanel);border-left:2px solid var(--wgold);font-size:13.5px;color:var(--wdim)}
.note b{color:var(--wtx)}
h2.sec{font-size:19px;margin:32px 0 8px;letter-spacing:.04em;border-bottom:1px solid var(--wline);padding-bottom:7px}
.dl{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:13.5px;color:var(--wdim);margin:10px 0 0}
.dl span b{color:var(--wtx)}
@media(max-width:560px){h1{font-size:26px}.thesis{font-size:15.5px}}
</style>
</head>

<header><div class="w">

<div class="w hero">

  <p class="one" id="one">想写点什么？<b>先别管怎么写</b>——把你想说的事说一句给我听，剩下的一起弄。</p>

<div class="w foot">
  <p>五台智能体都用<b>你自己的大模型 Key</b>（与全站同一把，只存浏览器本地，服务器不经手）。稿子存在本机；要跨设备留存请「⇧ 存进知识库」。</p>

<script src="/assets/wds-rte.js?v=1"></script>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ══════════ 六路径：这台机器的内核 ══════════════════════
     作文＝用文本建造一个具体的 SDE。于是：
       **落点**（终点那一维）＝这一篇要交出的果子，也是唯一的验收判据；
       **起手**（起点那一维）＝从哪儿下笔；
       **中项**＝把起手换算成落点的转换器 —— 中项写虚了，全篇就在起手那一维原地打转。
     这不是给六条路径各贴一个文体标签，是**从落点反推验收、从起手定笔法、从中项定推进**。 */
  var PATHS = [
    { id: "SDE", seq: ["S", "D", "E"], name: "见闻 → 行动 → 感怀",
      fruit: "E", start: "S", mid: "D",
      types: "记叙文 · 通讯与纪实 · 人物特写 · 游记",
      how: "先把场面写实到能被复述（S），再写人在这场面里做了什么（D），最后落在关系被改动的那一刻（E）。",
      pit: "写完场面直接抒情——中项 D 被跳过，读者不知道凭什么被打动。",
      check: "读完，他和谁（或什么）之间的关系变了？说得出具体是哪一处变了才算落地。" },
    { id: "SED", seq: ["S", "E", "D"], name: "现象 → 处境 → 对策",
      fruit: "D", start: "S", mid: "E",
      types: "时评 · 问题报道 · 社会评论 · 调查手记",
      how: "先摆出可核对的现象（S），再写它把人卷进了什么处境、谁被谁牵住（E），最后给出能照着做的对策（D）。",
      pit: "现象之后直接开药方——中项 E 被跳过，对策就没有承受者，读起来像隔空喊话。",
      check: "读完能不能照着做一遍？给不出「先动什么、看到什么再动下一步」就是没落地。" },
    { id: "DSE", seq: ["D", "S", "E"], name: "操作 → 效果 → 意义",
      fruit: "E", start: "D", mid: "S",
      types: "说明文 · 教程 · 案例复盘 · 工艺记",
      how: "先讲怎么做（D），再把做出来的样子摆给人看（S），最后说它改动了什么关系（E）。",
      pit: "讲完步骤直接升华——中项 S 被跳过，读者没见过成品，意义就是空的。",
      check: "读完关系有没有变？「做了这件事之后，谁和谁不一样了」要写得出来。" },
    { id: "DES", seq: ["D", "E", "S"], name: "实践 → 影响 → 新面貌",
      fruit: "S", start: "D", mid: "E",
      types: "策论 · 方案书 · 改革论 · 提案",
      how: "先提出做法（D），再论它会牵动谁、谁会不干（E），最后把改完之后的样子描出来（S）。",
      pit: "只写做法与好处，不写它牵动谁——中项 E 一虚，方案就只在纸上成立。",
      check: "读完能不能复述成一个画面？描不出「改完之后是什么样」就是没落地。" },
    { id: "ESD", seq: ["E", "S", "D"], name: "处境 → 征象 → 出路",
      fruit: "D", start: "E", mid: "S",
      types: "议论文 · 批评文 · 诊断文 · 论辩",
      how: "先指认一种关系或处境（E），再举出它看得见的征象（S），最后给出路（D）。",
      pit: "指认完处境直接下结论——中项 S 被跳过，判断没有可核对的落点，怎么说都对。",
      check: "读完能不能照着做？只写出「应当重视」的，等于把问题重复了一遍。" },
    { id: "EDS", seq: ["E", "D", "S"], name: "牵动 → 行动 → 见证",
      fruit: "S", start: "E", mid: "D",
      types: "抒情散文 · 书信 · 演讲 · 回忆与悼念",
      how: "从被牵动写起（E），写因此做了什么（D），最后落在一个画面上（S）——不是落在一句感慨上。",
      pit: "从情绪起、又落在情绪上，中间没有 D——通篇是心情，没有事。",
      check: "读完记住的是不是一个画面？记住的若只是一种情绪，就还没落地。" }
  ];
  var DIM = { S: { n: "显露", t: "让人看见", c: "sS" }, D: { n: "发生", t: "让人会做", c: "sD" }, E: { n: "纠缠", t: "让人被牵动", c: "sE" } };

  /* ══════════ 五台智能体 ══════════════════════════════════
     分工必须硬：**共创动脑、修改动内容、编辑动文字**。
     混成一台，读者永远拿不准"它这次会不会把我的判断改掉"。 */
  var AGENTS = [
    { k: "co", n: "🤝 与 WDS 共创", d: "只讨论，不动你的稿子。写卡住了、拿不准方向、想找个反例，问它。它答得短，也会反问你。",
      quick: ["接下去怎么写", "这一段站得住吗", "给我三个方向", "这里缺什么", "谁已经说过这件事", "举一个具体例子"],
      sys: "你是【与 WDS 共创】。\n\n**首要职责：带一个不懂理论的人把这一篇写出来。**他多半只知道\"我想说点什么\"，对 S/D/E、六路径一无所知，也不需要知道。所以：\n① **一上来先用大白话把他要说的事问清楚**——想说的是哪件事、说给谁听、你希望他读完之后怎样。一次只问一两个，问到能判了就停，别做问卷。\n② **绝不对他讲 S/D/E、落点、中项这些词**，除非他自己问起。要讲就讲人话：\"这一篇的活儿是让人看见\"／\"是让人会做\"／\"是让人心里被牵动一下\"。\n③ 判得出来之后，在**回话的最末一行**单独写一行回执：〔SDE路径：XXX〕，XXX 只能是 SDE／SED／DSE／DES／ESD／EDS 六个之一。这一行是给程序看的，你不要解释它，也不要在别处提它。判不了就**别写这一行**，接着问。\n④ 定了之后立刻给他**第一段怎么起手**——一句具体的、他可以照着写下去的话，不是\"可以从……入手\"。\n\n此后规矩五条：①**只讨论，绝不代写全文**——除非他明说「写一段」；②答得短，一句能说清就别写三段；③**可以反问**，问不清楚就先问回去；④凡给方向必须**具体**（一个例子、一句可以直接用的话、一个能查的判据），不许说「可以从多个角度考虑」；⑤时刻记着这一篇的**落点**是哪一维——你的建议必须帮它更接近那个落点，而不是让它更漂亮。" },
    { k: "rev", n: "✎ WDS 修改", d: "动内容：判断、结构、论证、落点。它会**交回改好的整篇**，落成一个新版本，原版还在，可以退回去。",
      quick: ["按落点改一遍", "中项写虚了，补实它", "把结论改成可被推翻的", "删掉万能话", "补一个反例", "结构重排"],
      sys: "你是【WDS 修改】。你动的是**内容**：判断、结构、论证、落点，不是遣词造句（那是【WDS 编辑】的活）。规矩五条：①**只输出改好的整篇正文，不要解说、不要前后缀**；②保住作者的判断与他的话语风格——你是改稿不是重写，凡是你改动的判断，必须是原来站不住的那几处；③**盯着落点改**：这一篇要交出的果子若是 S 就要能被复述成画面、是 D 就要能照着做、是 E 就要读完关系有变；④中项写虚的地方要补实——那是全篇原地打转的真原因；⑤删掉万能话（永远对因而永远没用的句子）与情态词堆砌。改不动就直说改不动，不要为了交差硬改。" },
    { k: "on", n: "✒ WDS 接着写", d: "接着你写的往下写**一段**就停，然后把笔交回给你，并告诉你下一段该写什么。它写的会直接接到正文末尾、落成一个新版本，退得回去。",
      quick: ["接着写一段", "换一种写法接着写", "从我们刚讨论的那句起", "只写一两句就停", "把上一段收个尾", "开个新段"],
      sys: "你是【WDS 接着写】。你的活儿是**替他把卡住的地方推过去一小步**，不是替他写完。\n\n硬规矩六条：\n① **最多写一段**（三到六句）。宁可少写，绝不多写。写完就停，不许接着往下写第二段。\n② **接着他的上文写**：人称、时态、语气、称呼、详略，一律随他，不许换成你自己的腔调；他写得糙就跟着糙。\n③ 不许在这一段里下总结、升华、点题——那是他的活儿。\n④ **写完另起一行，写一句 `〔接着你写〕`，然后用一句话告诉他下一段该写什么**——要具体到能落笔（\"接下来写他把剪下来的指甲收进一个铁盒\"），不是\"你可以继续展开\"。这一行之前的内容会被直接接进他的正文，之后的内容只给他看。\n⑤ 盯着这一篇的**落点**推进：落在让人看见就往画面上推，落在让人会做就往做法上推，落在让人被牵动就往关系上推。\n⑥ 接不下去（上文太少、方向不明）就**别硬写**：只写那一行 `〔接着你写〕` 和一句反问，问清楚再说。" },
    { k: "ed", n: "🖉 WDS 编辑", d: "动文字：语句、段落、衔接、体例、标题、冗余、术语统一。**不动你的判断**。同样交回整篇并落成新版本。",
      quick: ["通篇编校", "理顺长句", "统一术语", "拟三个标题", "分段与小标题", "去掉冗余"],
      sys: "你是【WDS 编辑】。你动的是**文字**不是判断：语句、段落、衔接、体例、标题、冗余、术语一致、标点与数字格式。规矩五条：①**一个判断都不许改**——发现内容有问题，改完之后在末尾另起一节「编辑存疑」列出来，不要动手；②**只输出编校后的整篇正文**（存疑那一节除外），不要解说；③长句拆短、重复删净、代词指代明确、术语前后统一；④标题与小标题要**是判断不是话题词**；⑤保住作者的语感——编校不是把所有人改成同一种腔调。" },
    /* 第五台。它补的是前四台都不管的那一面：前四台管**怎么写**，它管**哪些不写**。
       依据是作文的定位——文本是「与读者合作出」的一个 SDE，**并不是都陈显出来**：
       说尽了，读者就没有可组织的空间，那个 SDE 也就不在读者与作者之间发生了。
       判据只有一句、机械可查：删掉这一段，读者补得出来吗？ */
    { k: "gap", n: "◇ WDS 留白审计", d: "不改你的字。逐段问一句：**删掉它，读者补得出来吗？** 补得出来的，是你在替读者干活；补不出来的，才是承重的。",
      quick: ["通篇留白审计", "哪几段可以删", "哪一句是承重的", "结尾是不是说尽了", "开头交代得太多吗"],
      sys: "你是【WDS 留白审计】。你只做一件事：判这一篇**哪些地方说尽了**。\n\n**为什么要判这个**：一篇文章是作者和读者合作建成的一个东西，作者只负责搭出结构与那几处关键的显露，剩下的由读者在自己那儿组织起来。**全部陈显出来，读者就没有可组织的空间**，文章就只剩下被读一遍，不会在谁那儿发生什么。\n\n**唯一的判据（逐段问，不要换别的标准）**：把这一段整个删掉，一个认真的读者靠上下文补得出来吗？\n· **补得出来** → 这一段在替读者干活，是可以删的。**并且要说出他靠什么补得出来**——指得出是靠前面哪一句、哪个例子。说不出来就不算数，别凭感觉判。\n· **补不出来** → 承重，一个字都别动。\n\n**产物格式**：一张表，每段一行——〔段首几个字〕｜可删／承重｜凭什么（补得出来的靠什么补；承重的是因为哪一处只有它有）。表后一段话：这一篇最该省的一处、和最不能省的一句。\n\n**四条禁止**：\n① **绝不代删、绝不交回改好的稿子**——删哪几段是作者的判断，你只报读数。他说「照你说的删」，你也只回一句「哪几段你自己定，我这只是读数」。\n② **别把留白当简洁**。留白不是写得少：该显的地方要显足，不足的地方你也要报出来（读者补不出来又没写的，那是断裂不是留白）。所以这张表要**两头都报**。\n③ **稿子没写完就不要做这件事**——半截稿子删什么都补不出来，这时如实说「等写完再审，现在报的都不作数」。\n④ 不许说「可以适当精简」「略显冗长」这类话。每一条都要**指得出是哪一段、凭什么**。" }
  ];

  /* ══════════ 状态 ══════════════════════════════════════ */
  var LS = "sde_writing_v1";
  /* ⚠ 每台的对话槽**从 AGENTS 派生**，不写死一份列表：
     加第四台时我就漏了这里（`ST.chat.on` 是 undefined，一点就 push 报错），
     端到端干跑当场抓到。凡"每台一份"的结构，一律照 AGENTS 生成。 */
  function emptyChat() { var o = {}; AGENTS.forEach(function (a) { o[a.k] = []; }); return o; }
  var ST = { path: "", vers: [""], vi: 0, chat: emptyChat(), agent: "co", rich: true, diff: false, busy: false };
  function save() {
    try { localStorage.setItem(LS, JSON.stringify({ path: ST.path, vers: ST.vers, vi: ST.vi, chat: ST.chat, agent: ST.agent })); } catch (e) {}
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(LS) || "null");
      if (!o) return;
      ST.path = o.path || "";
      ST.vers = (Array.isArray(o.vers) && o.vers.length) ? o.vers : [""];
      ST.vi = (typeof o.vi === "number" && o.vi < ST.vers.length) ? o.vi : 0;
      ST.chat = (o.chat && typeof o.chat === "object") ? o.chat : emptyChat();
      AGENTS.forEach(function (a) { if (!Array.isArray(ST.chat[a.k])) ST.chat[a.k] = []; });
      ST.agent = o.agent || "co";
    } catch (e) {}
  }
  function cur() { return ST.vers[ST.vi] || ""; }
  function pathOf() { for (var i = 0; i < PATHS.length; i++) if (PATHS[i].id === ST.path) return PATHS[i]; return null; }
  function note(h) { $("note").innerHTML = h || ""; }

  /* ══════════ 路径面板 ══════════════════════════════════ */
  function paintPaths() {
    /* 选单只画在弹层里（#paths 现在长在 #sbd 中）；首屏只留一行"这一篇的活儿是什么"。 */
    var box = $("paths");
    if (box) {
      box.innerHTML = PATHS.map(function (p) {
        return '<button class="pchip' + (p.id === ST.path ? " on" : "") + '" data-p="' + p.id + '">' +
          '<span class="sq">' + p.seq.join("→") + '</span>' + p.name + "</button>";
      }).join("");
    }
    var p = pathOf();
    var f = $("fruit");
    if (!f) return;
    if (!p) { f.style.display = "none"; return; }
    f.style.display = "";
    f.innerHTML = "这一篇的活儿：<b>" + DIM[p.fruit].t + "</b>　·　" + esc(p.check) +
      '<button id="pchg">换一个</button>';
    var cb = document.getElementById("pchg");
    if (cb) cb.onclick = function () { $("mask").classList.add("on"); };
  }
  /* ⚠ 委托挂在 #sbd 上，不能挂 #paths：#paths 现在是 paintSheet 后生成的，
     每次重画都是新元素，挂在它身上的监听会随之失效（且会一层层累加）。 */
  $("sbd").addEventListener("click", function (ev) {
    var c = ev.target.closest && ev.target.closest(".pchip");
    if (!c) return;
    ST.path = c.getAttribute("data-p"); save(); paintPaths();
    note("已换成 " + esc(c.textContent.trim()) + "。");
  });

  /* 弹层里的说明**全部由 PATHS/AGENTS 现算**，不另抄一份文案：
     抄一份，改了表就一定和说明漂开，而这台机器的价值全在那张表上。 */
  function paintSheet() {
    var rows = PATHS.map(function (p) {
      return "<tr><td style='white-space:nowrap'><b>" + p.seq.join("→") + "</b><br><span style='color:var(--wdim2);font-size:12px'>" + p.name + "</span></td>" +
        "<td><b>" + p.fruit + "</b> · " + DIM[p.fruit].t + "</td>" +
        "<td>" + esc(p.types) + "</td>" +
        "<td style='color:var(--wdim2)'>" + esc(p.pit) + "</td></tr>";
    }).join("");
    $("sbd").innerHTML =
      "<h3>一句话</h3><p style='font-size:16px;color:var(--wtx)'><b>作文，是用文本（文）来建造（作）一个具体的 SDE。</b></p>" +
      "<p>不同的 SDE 显现出的果子不一样：有的聚焦 <b>S · 显露</b>（要让人<b>看见</b>）、有的聚焦 <b>D · 发生</b>（要让人<b>会做</b>）、有的聚焦 <b>E · 纠缠</b>（要让人<b>被牵动</b>）。于是 SDE 方法论的六条路径就不是六个口号，而是<b>六种文章类别与六套行文方式</b>。</p>" +
      "<h3>三分：落点 · 起手 · 中项</h3>" +
      "<p><b>落点</b>（序列末项）＝这一篇要交出的果子，<b>也是唯一的验收判据</b>：<br>" +
      "· 落在 <b>S</b>：读完能不能<b>复述成一个画面</b>？<br>" +
      "· 落在 <b>D</b>：读完能不能<b>照着做一遍</b>？<br>" +
      "· 落在 <b>E</b>：读完<b>关系有没有变</b>？</p>" +
      "<p><b>起手</b>（首项）＝从哪一维下笔：从 S 起＝一个看得见的场景／物；从 D 起＝一个动作或过程；从 E 起＝一段关系或处境。</p>" +
      "<p><b>中项</b>（中项）＝把起手那一维换算成落点那一维的<b>转换器</b>。中项写虚了，全篇就会在起手那一维原地打转——<b>这是作文最常见的失败，不是「没有文采」</b>。</p>" +
      "<h3>六路径 · 六种文章</h3>" +
      "<p style='color:var(--wdim2);font-size:13px'>不必先选。<b>共创会照着你要说的事替你判</b>；判完这里会亮起来，也可以在这儿手动换一条。</p>" +
      "<div class='pstrip' id='paths'></div>" +
      "<table><tr><th>路径</th><th>落点／果子</th><th>文体</th><th>最常见的失败</th></tr>" + rows + "</table>" +
      "<h3>五台智能体各干什么</h3>" +
      "<table><tr><th>台</th><th>动什么</th><th>产物</th></tr>" +
      AGENTS.map(function (a) {
        /* ⚠ 这里原来是二选一的三元式，凡不是 co/rev 的一律落进"动文字"——
           加第四台（接着写）时它就已经报错了，加第五台会再错一次。改成按 k 查表，
           **表里没有的一律留空而不是硬塞一个说法**（宁可缺，不许错报）。 */
        var WHAT = { co: "动脑（只讨论，绝不代写）", rev: "动<b>内容</b>：判断、结构、论证、落点",
          ed: "动<b>文字</b>：语句、段落、体例、标题；<b>一个判断都不许改</b>",
          on: "动<b>篇幅</b>：顺着你的落点往下写", gap: "什么都不动：只判<b>哪些说尽了</b>" };
        var OUT = { co: "话——要不要用你说了算", rev: "改好的整篇，<b>自动落成新版本</b>（原版还在，可退回、可比对）",
          ed: "改好的整篇，<b>自动落成新版本</b>（原版还在，可退回、可比对）",
          on: "续写的部分，自动落成新版本", gap: "一张表：每段可删／承重，以及凭什么。<b>不改你的稿子</b>" };
        var what = WHAT[a.k] || "", out = OUT[a.k] || "";
        return "<tr><td style='white-space:nowrap'>" + a.n + "</td><td>" + what + "</td><td>" + out + "</td></tr>";
      }).join("") + "</table>" +
      "<h3>为什么这几台要分开</h3>" +
      "<p>混成一台，你永远拿不准「它这次会不会把我的判断改掉」——于是就不敢让它碰稿子。分开之后：想找灵感找<b>共创</b>（它不动你的字），想动判断找<b>修改</b>，只想把文字理顺找<b>编辑</b>（它不动你的判断）。<b>留白审计</b>又在另一头：它连字都不动，只告诉你哪几段是你在替读者干活——因为这一篇是你和读者合作建成的，说尽了就没人跟你合作了。</p>";
  }
  function paintTable() {
    if (!$("ptable")) return;      // 第三节已收进弹层，容器不在了
    $("ptable").innerHTML = '<table style="border-collapse:collapse;font-size:13.5px;width:100%">' +
      '<tr><th style="border:1px solid var(--wline);padding:7px 10px;text-align:left">路径</th>' +
      '<th style="border:1px solid var(--wline);padding:7px 10px;text-align:left">落点／果子</th>' +
      '<th style="border:1px solid var(--wline);padding:7px 10px;text-align:left">文体</th>' +
      '<th style="border:1px solid var(--wline);padding:7px 10px;text-align:left">最常见的失败</th></tr>' +
      PATHS.map(function (p) {
        return '<tr><td style="border:1px solid var(--wline);padding:7px 10px;white-space:nowrap">' +
          p.seq.join("→") + '<br><span style="color:var(--wdim2);font-size:12px">' + p.name + '</span></td>' +
          '<td style="border:1px solid var(--wline);padding:7px 10px">' + p.fruit + " · " + DIM[p.fruit].t + '</td>' +
          '<td style="border:1px solid var(--wline);padding:7px 10px;color:var(--wdim)">' + p.types + '</td>' +
          '<td style="border:1px solid var(--wline);padding:7px 10px;color:var(--wdim2)">' + esc(p.pit) + '</td></tr>';
      }).join("") + '</table>';
  }

  /* ══════════ 编辑器 ══════════════════════════════════ */
  function rteOk() { return !!(window.WDSRte && window.WDSRte.VERSION >= 1); }
  function paintEd() {
    var text = cur();
    if (ST.diff) {
      $("ed").style.display = ""; $("src").style.display = "none"; $("rtb").style.display = "none";
      $("ed").removeAttribute("contenteditable");
      var prev = ST.vers[ST.vi - 1];
      $("ed").innerHTML = (typeof prev !== "string")
        ? '<p style="color:var(--wdim2)">只有一版，没有可比的上一版。</p>'
        : (window.WDSDiff ? window.WDSDiff.html(prev, text, { tSame: "… 未改 {n} 行 …" }) : "");
      return;
    }
    $("ed").setAttribute("contenteditable", "true");
    if (ST.rich && rteOk()) {
      $("ed").style.display = ""; $("src").style.display = "none"; $("rtb").style.display = "";
      $("ed").innerHTML = window.WDSRte.toHtml(text);
    } else {
      $("ed").style.display = "none"; $("src").style.display = ""; $("rtb").style.display = "none";
      $("src").value = text;
    }
    $("mRich").className = "gh" + (ST.rich ? " on" : "");
    $("mSrc").className = "gh" + (ST.rich ? "" : " on");
    $("verTag").textContent = (ST.vi + 1) + "/" + ST.vers.length;
    $("wc").textContent = text.replace(/\s/g, "").length + " 字";
  }
  // 取当前编辑区的内容（富文本要序列化回 markdown —— 版本链与导出全建在 markdown 上）
  function grab() {
    if (ST.diff) return cur();
    if (ST.rich && rteOk()) return window.WDSRte.toMd($("ed").innerHTML);
    return $("src").value;
  }
  function commit(text, why) {
    text = String(text == null ? "" : text);
    if (text === ST.vers[ST.vers.length - 1]) return false;
    ST.vers.push(text); ST.vi = ST.vers.length - 1;
    if (ST.vers.length > 40) { ST.vers.shift(); ST.vi = ST.vers.length - 1; }
    save(); paintEd();

  }
  function syncFromEditor() { ST.vers[ST.vi] = grab(); save(); $("wc").textContent = cur().replace(/\s/g, "").length + " 字"; }
  $("ed").addEventListener("input", function () { if (!ST.diff) syncFromEditor(); });

  $("mRich").onclick = function () { if (!ST.diff) ST.vers[ST.vi] = grab(); ST.rich = true; ST.diff = false; paintEd(); };
  $("mSrc").onclick = function () { if (!ST.diff) ST.vers[ST.vi] = grab(); ST.rich = false; ST.diff = false; paintEd(); };
  $("verDiff").onclick = function () { if (!ST.diff) ST.vers[ST.vi] = grab(); ST.diff = !ST.diff; paintEd(); };
  $("verPrev").onclick = function () { if (ST.vi > 0) { if (!ST.diff) ST.vers[ST.vi] = grab(); ST.vi--; save(); paintEd(); } };

  var RTB = [["标题", "formatBlock", "<h1>"], ["小标", "formatBlock", "<h2>"], ["小小标", "formatBlock", "<h3>"],

  /* ══════════ Key ══════════════════════════════════ */
  /* ⚠ Key 的存储键名**逐字照抄 wds-mode.js 的 VENDORS[].ks**，不许自己拼。

  var VENDORS = [["ds", "DeepSeek", "sde_ds_key"], ["glm", "智谱 GLM", "sde_glm_key"],
    ["kimi", "Kimi", "sde_kimi_key"], ["qwen", "千问 Qwen", "sde_qwen_key"], ["mm", "MiniMax", "sde_mm_key"]];
  function vKs(v) { for (var i = 0; i < VENDORS.length; i++) if (VENDORS[i][0] === v) return VENDORS[i][2]; return VENDORS[0][2]; }
  function vKey(v) {
    try {
      var k = (localStorage.getItem(vKs(v)) || "").trim();
      // 老读者可能还留着最早那个不分厂商的键
      if (!k && v === "ds") k = (localStorage.getItem("sde_wds_key") || "").trim();
      return k;
    } catch (e) { return ""; }
  }
  function keyGet() {
    var v = "";
    try { v = localStorage.getItem("sde_wds_vendor") || "ds"; } catch (e) { v = "ds"; }
    var k = vKey(v);
    if (k.length >= 8) return { key: k, vendor: v, model: (function () { try { return localStorage.getItem("sde_wds_model_" + v) || ""; } catch (e) { return ""; } })() };
    for (var i = 0; i < VENDORS.length; i++) { var kk = vKey(VENDORS[i][0]); if (kk.length >= 8) return { key: kk, vendor: VENDORS[i][0], model: "" }; }

  }

    var kv = keyGet();
    note(kv
      ? ("现在用的是 <b>" + esc((VENDORS.filter(function (x) { return x[0] === kv.vendor; })[0] || ["", kv.vendor])[1]) + "</b>。要换 Key 或换厂商，去 <a href='/taste/chatsde/' target='_blank'>ChatSDE</a> 的设置里改一次，全站通用。")
      : "还没配 Key。去 <a href='/taste/chatsde/' target='_blank'>ChatSDE</a> 填一次，本页与全站共用同一把（只存你的浏览器本地）。");
  };

  /* ══════════ 五台智能体 ══════════════════════════════ */
  function ag() { for (var i = 0; i < AGENTS.length; i++) if (AGENTS[i].k === ST.agent) return AGENTS[i]; return AGENTS[0]; }
  function paintAgs() {

  $("ags").addEventListener("click", function (ev) {

  function paintMs() {
    var log = ST.chat[ST.agent] || [];
    if (!log.length) {
      $("ms").innerHTML = '<p style="color:var(--wdim2);font-size:13.5px;line-height:1.8">' +
        (ST.agent === "co"

          : ST.agent === "on"
          ? "点「接着写一段」，它接着你写的往下推<b style=\"color:var(--wtx)\">一段</b>就停，直接接到正文末尾并落成新版本（退得回去），然后告诉你下一段写什么。"
          : "点上面的快捷动作，或直接告诉它怎么改。<b style=\"color:var(--wtx)\">它会交回改好的整篇，落成一个新版本</b>，原版还在。") + "</p>";
      return;
    }
    $("ms").innerHTML = log.map(function (m, i) {
      var bb = (m.r === "me")
        ? '<div class="bb">' + esc(m.t) + "</div>"
        : '<div class="bb">' + (window.WDSRte ? window.WDSRte.toHtml(m.t || "…") : esc(m.t)) + (m.on ? " ▊" : "") + "</div>";
      var acts = (m.r === "wds" && !m.on && m.t)
        ? '<div class="acts"><button data-a="ins" data-i="' + i + '">⤵ 插入正文</button>' +
          '<button data-a="ver" data-i="' + i + '">⟳ 落成新版本</button>' +
          '<button data-a="cp" data-i="' + i + '">复制</button></div>'

  }
  $("ms").addEventListener("click", function (ev) {
    var a = ev.target.getAttribute && ev.target.getAttribute("data-a");
    if (!a) return;

    if (!m) return;
    if (a === "cp") { try { navigator.clipboard.writeText(m.t); note("已复制。"); } catch (e) {} return; }
    if (a === "ver") { commit(m.t, ag().n); return; }
    if (a === "ins") {
      var b = grab();
      ST.vers[ST.vi] = (b ? b.replace(/\s+$/, "") + "\n\n" : "") + m.t;

    }
  });

  /* 每一轮都带着现场去问：路径、落点、验收判据、正文、选中的一段。 */
  function ctxOf() {
    var p = pathOf();
    var body = grab();
    var sel = "";
    try {
      var g = window.getSelection && window.getSelection();
      if (g && !g.isCollapsed && g.anchorNode && $("ed").contains(g.anchorNode.nodeType === 1 ? g.anchorNode : g.anchorNode.parentNode)) sel = String(g.toString()).trim();
    } catch (e) {}

    if (p) {
      out += "【这一篇要建造的 SDE】路径 " + p.seq.join("→") + "（" + p.name + "）\n";
      out += "落点＝" + p.fruit + "（" + DIM[p.fruit].t + "）；起手＝" + p.start + "；中项＝" + p.mid + "\n";
      out += "验收判据：" + p.check + "\n";
      out += "这条路径最常见的失败：" + p.pit + "\n\n";
    } else {
      out += "【还没选路径】——若他的问题需要落点才答得了，先反问他这一篇要落在哪一维（S 让人看见／D 让人会做／E 让人被牵动）。\n\n";
    }
    out += "【当前正文】（第 " + (ST.vi + 1) + "/" + ST.vers.length + " 版）\n" + (body || "（还是空的，一个字都没写）").slice(0, 9000) + "\n";
    if (sel) out += "\n【他选中的一段】\n" + sel.slice(0, 1500) + "\n";
    return out;
  }

  var abortC = null;
  function ask(q, retry) {
    q = String(q || "").trim();
    if (!q || ST.busy) return;
    var kv = keyGet();
    if (!kv) { note("还没配大模型 Key。去 <a href='/taste/chatsde/' target='_blank'>ChatSDE</a> 填一次，全站共用。"); return; }
    ST.vers[ST.vi] = grab();
    var A = ag();
    var log = ST.chat[A.k] || (ST.chat[A.k] = []);   // 再兜一道：老留存里没有新台的槽
    log.push({ r: "me", t: q });
    var cell = { r: "wds", t: "", on: 1 };
    log.push(cell);
    ST.busy = true; $("go").textContent = "停"; paintMs(); note("");

    var hist = [];
    log.forEach(function (m) { if (m.on) return; hist.push({ role: m.r === "me" ? "reader" : "wds", text: String(m.t).slice(0, 3000) }); });
    hist = hist.slice(-8); hist.pop();

    /* 诊断回执：把三类失败分开说，否则线上出问题查不下去（ChatSDE 那边吃过这个亏）。 */
    var diag = { http: 0, ev: {}, bytes: 0, err: "", chunks: 0, ended: "", t0: Date.now() };
    function diagLine() {
      var ks = Object.keys(diag.ev).map(function (k) { return k + "×" + diag.ev[k]; });
      return "HTTP " + (diag.http || "?") + " · " + diag.bytes + " B · " + diag.chunks + " 块 · "
        + (ks.length ? ks.join(" ") : "无事件")
        + " · " + (diag.ended || "?") + " · " + Math.round((Date.now() - diag.t0) / 100) / 10 + "s"
        + (diag.err ? " · " + diag.err : "");
    }
    try { abortC = new AbortController(); } catch (e) { abortC = null; }
    var wd = setTimeout(function () { diag.err = "watchdog"; try { if (abortC) abortC.abort(); } catch (e) {} }, 90000);

    fetch("/api/wds/chat", {
      method: "POST", headers: { "content-type": "application/json" },
      signal: abortC ? abortC.signal : undefined,
      body: JSON.stringify({
        q: A.sys + "\n\n" + ctxOf() + "\n【他的话】\n" + q,
        history: hist, umem: "", key: kv.key, vendor: kv.vendor, model: kv.model || "",
        mode: "std", web: 0, skey: "", about: "", lang: "zh", tool: "",
        /* nosite：这四台改的是读者自己的稿子，不需要全站检索。
           那一段是最重的（一次基底调用 ＋ 逐分片取索引 ＋ 知识库），
           线上诊断回执 `48 B · quota×1 · done · 2.6s` 正落在那里。 */
        nosite: 1
      })
    }).then(function (resp) {
      diag.http = resp.status;
      if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
      var rd = resp.body.getReader(), dec = new TextDecoder(), buf = "";
      function pump() {
        return rd.read().then(function (r) {
          /* ⚠ 「怎么结束的」必须记下来：`done`（对端关流）与 `[DONE]`（正常收尾）
             是两件完全不同的事，收敛成一句话就再也分不出来了。 */
          if (r.done) { diag.ended = "done"; return; }
          diag.chunks++;
          clearTimeout(wd); wd = setTimeout(function () { diag.err = "watchdog"; try { if (abortC) abortC.abort(); } catch (e) {} }, 90000);
          diag.bytes += (r.value && r.value.length) || 0;
          buf += dec.decode(r.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf("\n")) >= 0) {
            var line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
            if (line.slice(0, 5) !== "data:") continue;
            var pp = line.slice(5).trim();
            if (pp === "[DONE]") { diag.ended = "DONE"; return; }
            var j; try { j = JSON.parse(pp); } catch (e) { diag.ev["坏json"] = (diag.ev["坏json"] || 0) + 1; continue; }
            var t0 = String(j.t || "?"); diag.ev[t0] = (diag.ev[t0] || 0) + 1;
            // ⚠ 正文事件名是 token（照 ChatSDE 主流程核对过，不许凭印象写 text/delta）
            if (j.t === "token") { cell.t += j.v; paintMs(); }
            else if (j.t === "error") {
              var ev2 = String(j.v || "");
              if (/1211|模型不存在|model.*not.*(exist|found)|invalid.*model/i.test(ev2)) ev2 = "这一家说这个型号不存在——多半是默认型号过时或你的账号没开通。去 ChatSDE 的模型选择器换一个型号。";
              cell.t = ev2 || "出错了。"; paintMs();
            }
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      clearTimeout(wd); delete cell.on; ST.busy = false; $("go").textContent = "送"; abortC = null;
      /* 空正文自动重问一次 —— 与站上 llmText 那条中央修复同一条做法。
         只重一次：重两次就成了自动烧额度。重之前把这一轮的空回话撤掉，
         否则历史里会留下一条空的 wds 发言，下一轮喂回去反而更糟。 */
      if (!cell.t && !retry) {
        var idx0 = log.indexOf(cell);
        if (idx0 >= 0) log.splice(idx0, 1);
        var idx1 = log.lastIndexOf(log.filter(function (m) { return m.r === "me"; }).pop());
        if (idx1 >= 0) log.splice(idx1, 1);
        note("第一次一个字都没回来，自动重问一次…〔" + diagLine() + "〕");
        paintMs();
        setTimeout(function () { ask(q, 1); }, 400);
        return;
      }
      if (!cell.t) cell.t = "问了两次都没吐出字来。多半是这一档基底那边的事——换一档或换一家试试。\n\n〔诊断回执：" + diagLine() + "〕";
      /* 修改与编辑交回的是整篇 —— 直接落成新版本，不必再按一次。共创**绝不**自动落版。 */
      if (A.k === "co") {
        var tk = takePath(cell.t);
        cell.t = tk.t;
        if (tk.hit) setPath(tk.hit, "共创判的");
      }
      /* 修改／编辑交回的是整篇 ⇒ 直接落版。门槛只用来挡「它说改不动」那种拒绝，
         ⚠ 但**挡掉了要说一声**：原来门槛是 30 字且一声不吭，短稿被静默丢掉，
         读者看着回话在、版本却没多，只会以为功能坏了。 */
      /* 【接着写】的产物**不是整篇**，是接在末尾的一段。所以它自己一条路：
         `〔接着你写〕` 之前的接进正文并落成新版本，之后的只留在对话里当引导。
         这是唯一一台会自动改动正文的 —— 因为读者点它就是在说"你来写一段"；
         但仍落成**新版本**（退得回去），绝不覆盖当前版。 */
      if (A.k === "on") {
        var cut = cell.t.indexOf(GO_MARK);
        var para = stripFence(cut >= 0 ? cell.t.slice(0, cut) : cell.t).trim();
        var guide = cut >= 0 ? cell.t.slice(cut + GO_MARK.length).trim() : "";
        // 它写多了就只收前两块 —— 硬截半句更坏，所以按空行切块，并如实说一声
        var blocks = para.split(/\n{2,}/).filter(function (x) { return x.trim(); });
        var trimmed = blocks.length > 2;
        if (trimmed) para = blocks.slice(0, 2).join("\n\n");
        if (para) {
          var base0 = grab();
          commit((base0 ? base0.replace(/\s+$/, "") + "\n\n" : "") + para, A.n);
          note((trimmed ? "它一次写多了，只接了前两段。" : "已接到正文末尾并落成新版本。") +
            (guide ? "" : " 它没给下一段的提示。"));
        } else {
          note("它没写出可以接的段落（多半是上文太少，先跟它说两句）。");
        }
        cell.t = (para ? "（已接进正文）\n\n" : "") + (guide || cell.t);
      }
      if (A.k === "rev" || A.k === "ed") {
        var body2 = stripFence(cell.t);
        if (body2.length >= 24) commit(body2, A.n);
        else note("它没有交回整篇（多半是说改不动）。<b>没有落成新版本</b>——要留就按回话下面的「⟳ 落成新版本」。");
      }
      save(); paintMs();
    }, function (e) {
      clearTimeout(wd); delete cell.on; ST.busy = false; $("go").textContent = "送"; abortC = null;
      diag.err = String((e && e.message) || e || "").slice(0, 120);
      diag.ended = "throw";
      if (!cell.t) cell.t = ((diag.err === "watchdog" || /abort/i.test(diag.err)) ? "等了 90 秒一个字节都没来。" : "没答上来（网络或额度）。") +
        "\n\n〔诊断回执：" + diagLine() + "〕";
      save(); paintMs();
    });
  }
  /* 共创判出落点后会在末行留一句回执〔SDE路径：XXX〕。
     ⚠ 三件事：①只认六个合法 id，别的一律不认（基底会瞎写）；
     ②设完要**把那一行从显示里抹掉**——它是给程序看的，露在脸上就成了乱码；
     ③**只在共创台认**：修改/编辑交回的是整篇正文，正文里出现这一行只能是它抄错了，不该被当成指令。 */
  var PATH_RE = /〔\s*SDE路径\s*[:：]\s*([A-Za-z]{3})\s*〕/;
  function takePath(text) {
    var m = PATH_RE.exec(String(text || ""));
    if (!m) return { t: text, hit: "" };
    var id = m[1].toUpperCase();
    var okId = PATHS.some(function (p) { return p.id === id; });
    return { t: String(text).replace(PATH_RE, "").replace(/\n{3,}/g, "\n\n").trim(), hit: okId ? id : "" };
  }
  function setPath(id, why) {
    if (!id || ST.path === id) return;
    ST.path = id; save(); paintPaths();
    var p = pathOf();
    if (p) note("这一篇的活儿定了：<b>" + DIM[p.fruit].t + "</b>" + (why ? "（" + esc(why) + "）" : "") + "。你接着写就是。");
  }

  var GO_MARK = "〔接着你写〕";
  function stripFence(s) {
    var m = String(s || "").trim().match(/^```[A-Za-z0-9_+-]*[ \t]*\r?\n([\s\S]*?)```\s*$/);
    return m ? m[1].trim() : String(s || "").trim();
  }
  $("go").onclick = function () {
    if (ST.busy) { try { if (abortC) abortC.abort(); } catch (e) {} return; }
    var v = $("in").value; $("in").value = ""; $("in").style.height = "auto";
    ask(v);
  };
  $("in").onkeydown = function (ev) { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("go").onclick(); } };
  $("in").oninput = function () { $("in").style.height = "auto"; $("in").style.height = Math.min($("in").scrollHeight, 130) + "px"; };

  function seedGo() {
    var v = ($("seed").value || "").trim();
    if (v.length < 2) { $("seed").focus(); return; }
    ST.agent = "co"; paintAgs(); paintMs();
    $("start").style.display = "none";
    $("one").innerHTML = "先跟它说说你要写的事，它会带着你往下走。<b>不用管理论</b>。";
    ask("我想写的是：" + v + "\n\n我没写过什么，也不懂那些方法。你先问我几句，然后告诉我这一篇该怎么起手。");
  }
  if ($("seedgo")) $("seedgo").onclick = seedGo;
  if ($("seed")) $("seed").onkeydown = function (ev) { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); seedGo(); } };

  var _judge = $("judge");
  if (_judge) _judge.onclick = function () {
    ST.agent = "co"; paintAgs();
    ask("我不确定这一篇该走六路径里的哪一条。看看我已经写的（可能还很少）与我想写的，替我判一条，并说清：落点是哪一维、为什么不是相邻那条、以及第一段该怎么起手。判不了就反问我。");
  };

  /* ══════════ 弹层与主题 ══════════════════════════════ */
  $("whatb").onclick = function () { $("mask").classList.add("on"); };
  $("mx").onclick = function () { $("mask").classList.remove("on"); };
  $("mask").addEventListener("click", function (ev) { if (ev.target === $("mask")) $("mask").classList.remove("on"); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") $("mask").classList.remove("on"); });

  /* 明暗跟全站同一个开关（sde_wds_theme），没设过就跟系统。
     ⚠ 键名与 wds-mode.js 逐字一致 —— 各存各的，读者切一次要切两回。 */
  var LS_THEME = "sde_wds_theme";
  function themeLight() {
    var m = ""; try { m = localStorage.getItem(LS_THEME) || ""; } catch (e) {}
    if (m === "light") return true;
    if (m === "dark") return false;
    try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches); } catch (e) { return false; }
  }
  function themeApply() {
    try { document.documentElement.classList[themeLight() ? "add" : "remove"]("wdsm-lt"); } catch (e) {}
  }
  $("themeb").onclick = function () {
    try { localStorage.setItem(LS_THEME, themeLight() ? "dark" : "light"); } catch (e) {}
    themeApply();
  };
  themeApply();

  /* ══════════ 启动 ══════════════════════════════════ */
  load();
  paintSheet(); paintPaths(); paintTable(); paintAgs(); paintMs(); paintEd();
  // 已经动过手的人，重进不该再被问一遍"你想说什么"
  if (cur().trim() || (ST.chat.co || []).length) {
    $("start").style.display = "none";
    $("one").innerHTML = "接着上次写。<b>不用管理论</b>——卡住了就问右边的共创。";
  }
  if (!rteOk()) note("排版模块没拉到，已退回源码模式（内容一个字都不会少）。");
})();
</script>
