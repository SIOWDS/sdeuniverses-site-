<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="下帷者 题图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a06"/><stop offset="0.55" stop-color="#241d10"/><stop offset="1" stop-color="#3a2e18"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e6c2" stop-opacity="0.95"/><stop offset="0.7" stop-color="#caa96a" stop-opacity="0.35"/><stop offset="1" stop-color="#caa96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b08d57" stop-opacity="0.55"/><stop offset="1" stop-color="#6a5228" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#sky)"/>
  <!-- 月 -->
  <circle cx="960" cy="150" r="130" fill="url(#moon)"/>
  <circle cx="960" cy="150" r="52" fill="#f3e6c2" opacity="0.9"/>
  <circle cx="988" cy="138" r="52" fill="#241d10" opacity="0.55"/>
  <!-- 星 -->
  <g fill="#f3e6c2">
    <circle cx="140" cy="70" r="1.6" opacity="0.8"/><circle cx="300" cy="120" r="1.2" opacity="0.6"/><circle cx="220" cy="200" r="1.4" opacity="0.7"/>
    <circle cx="520" cy="80" r="1.3" opacity="0.7"/><circle cx="640" cy="150" r="1.1" opacity="0.5"/><circle cx="80" cy="180" r="1.5" opacity="0.6"/>
    <circle cx="410" cy="60" r="1.2" opacity="0.6"/><circle cx="1120" cy="90" r="1.4" opacity="0.7"/><circle cx="1050" cy="210" r="1.2" opacity="0.55"/>
    <circle cx="720" cy="70" r="1.3" opacity="0.6"/><circle cx="180" cy="130" r="1.1" opacity="0.5"/>
  </g>
  <!-- 大字「天」淡底 -->
  <text x="600" y="330" text-anchor="middle" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="300" fill="#b08d57" opacity="0.06" font-weight="700">天</text>
  <!-- 帷幕：竖向褶皱，半垂 -->
  <g>
    <rect x="0" y="0" width="1200" height="30" fill="#4a3a1c"/>
    <g stroke="url(#veil)" stroke-width="2" opacity="0.9">
      <line x1="40" y1="30" x2="40" y2="420"/><line x1="90" y1="30" x2="86" y2="400"/><line x1="140" y1="30" x2="148" y2="410"/>
      <line x1="190" y1="30" x2="184" y2="392"/><line x1="240" y1="30" x2="248" y2="404"/><line x1="290" y1="30" x2="286" y2="388"/>
      <line x1="1160" y1="30" x2="1160" y2="420"/><line x1="1110" y1="30" x2="1114" y2="400"/><line x1="1060" y1="30" x2="1052" y2="410"/>
      <line x1="1010" y1="30" x2="1016" y2="392"/><line x1="960" y1="30" x2="952" y2="404"/>
    </g>
    <path d="M0,30 Q160,120 330,60 L330,0 L0,0 Z" fill="#2c2211" opacity="0.85"/>
    <path d="M1200,30 Q1040,120 870,60 L870,0 L1200,0 Z" fill="#2c2211" opacity="0.85"/>
  </g>
  <!-- 帷后一盏灯 + 独坐的身影 -->
  <circle cx="600" cy="380" r="120" fill="url(#lamp)" opacity="0.5"/>
  <g fill="#0d0a06" opacity="0.92">
    <!-- 案 -->
    <rect x="520" y="430" width="160" height="10" rx="2"/>
    <rect x="528" y="440" width="8" height="34"/><rect x="664" y="440" width="8" height="34"/>
    <!-- 坐着的人：头、身、拱手 -->
    <ellipse cx="600" cy="360" rx="26" ry="28"/>
    <path d="M558,430 Q560,372 600,372 Q640,372 642,430 Z"/>
    <path d="M572,412 Q600,398 628,412 L620,428 L580,428 Z" fill="#20190f"/>
  </g>
  <!-- 灯焰 -->
  <ellipse cx="600" cy="424" rx="4" ry="9" fill="#ffd98a" opacity="0.95"/>
  <!-- 底部渐隐 -->
  <rect x="0" y="470" width="1200" height="50" fill="#0d0a06" opacity="0.5"/>
</svg>
