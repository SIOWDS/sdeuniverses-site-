<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线翻页阅读 · 符号提前结算与创新阻断 | SDE Universes</title>
<style>
:root{--gold:#d4b25e;--paper:#f5efe0;--muted:#9b8d70;--bg:#0f0b07}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--paper);font-family:"Noto Serif SC","Songti SC",Georgia,serif}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;background:rgba(15,11,7,.96);border-bottom:1px solid rgba(212,178,94,.25);backdrop-filter:blur(8px)}
.title{max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold);font-size:15px}.title a{margin-right:14px;color:var(--muted);font-size:13px;text-decoration:none}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{padding:7px 14px;border:1px solid rgba(212,178,94,.45);border-radius:4px;background:rgba(212,178,94,.12);color:var(--gold);font:14px inherit;cursor:pointer;text-decoration:none}.btn:hover:not(:disabled){background:rgba(212,178,94,.24)}.btn:disabled{opacity:.35;cursor:not-allowed}
.pagebox{display:flex;align-items:center;gap:6px;font-size:14px}.pagebox input{width:55px;padding:6px;border:1px solid rgba(212,178,94,.4);border-radius:4px;background:#1a1410;color:var(--gold);text-align:center;font:14px inherit}.total{color:var(--muted)}
.stage{display:flex;justify-content:center;min-height:70vh;padding:28px 16px 62px}#page-wrap{position:relative;display:none;overflow:hidden;background:#fff;border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,.6)}canvas{display:block}.textLayer{position:absolute;inset:0;z-index:3;overflow:hidden;line-height:1}.textLayer span{position:absolute;white-space:pre;color:transparent;cursor:text;transform-origin:0 0}.textLayer ::selection{background:rgba(61,165,165,.42)}
.loading,.error{padding:80px 20px;text-align:center;color:var(--muted);line-height:1.8}.spinner{width:40px;height:40px;margin:0 auto 20px;border:3px solid rgba(212,178,94,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error a{color:var(--gold)}
.hint{position:fixed;right:0;bottom:0;left:0;z-index:15;padding:10px;text-align:center;color:var(--muted);font-size:12px;background:linear-gradient(transparent,rgba(15,11,7,.94));pointer-events:none}
@media(max-width:680px){.title{max-width:100%;width:100%}.topbar{justify-content:center}.controls{justify-content:center}.btn{padding:7px 10px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="title"><a href="./">← 返回文章</a>符号提前结算与创新阻断</div>
  <div class="controls">
    <button class="btn" id="prev" disabled>← 上一页</button>
    <label class="pagebox"><input id="pageInput" type="number" min="1" value="1" aria-label="页码"><span class="total">/ <span id="totalPages">—</span></span></label>
    <button class="btn" id="next" disabled>下一页 →</button>
    <button class="btn" id="zoomOut" aria-label="缩小">−</button>
    <button class="btn" id="zoomIn" aria-label="放大">＋</button>
    <a class="btn" href="borrowed-light.pdf" download>下载 PDF</a>
  </div>
</header>
<main class="stage" id="stage">
  <div id="loading" class="loading"><div class="spinner"></div>正在载入 31 页精排全文……</div>
  <div id="page-wrap"><canvas id="pdfCanvas"></canvas><div class="textLayer" id="textLayer"></div></div>
  <div id="error" class="error" hidden></div>
</main>
<div class="hint">方向键翻页 · 页码可直接跳转 · 正文文字可选中</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const PDF_URL="borrowed-light.pdf";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pdfDoc=null,pageNum=1,rendering=false,pending=null,baseScale=1.3,currentPageText="";
const $=id=>document.getElementById(id),canvas=$("pdfCanvas"),ctx=canvas.getContext("2d"),wrap=$("page-wrap"),textLayer=$("textLayer");
function drawTextLayer(content,viewport){
  textLayer.innerHTML="";const frag=document.createDocumentFragment(),fix=[];
  content.items.forEach(item=>{if(!item.str)return;const m=pdfjsLib.Util.transform(viewport.transform,item.transform),size=Math.hypot(m[2],m[3]);if(!size)return;
    const angle=Math.atan2(m[1],m[0]),span=document.createElement("span");span.textContent=item.str;
    span.style.cssText=`left:${m[4].toFixed(2)}px;top:${(m[5]-size).toFixed(2)}px;font-size:${size.toFixed(2)}px;${Math.abs(angle)>.01?`transform:rotate(${angle}rad);`:""}`;
    frag.appendChild(span);fix.push([span,item.width*viewport.scale,angle]);
  });textLayer.appendChild(frag);
  fix.forEach(([span,target,angle])=>{const real=span.getBoundingClientRect().width;if(real>1&&target){const sx=target/real;if(sx>.1&&sx<10)span.style.transform=`${Math.abs(angle)>.01?`rotate(${angle}rad) `:""}scaleX(${sx.toFixed(3)})`;}})
}
async function render(num){
  rendering=true;const page=await pdfDoc.getPage(num),unit=page.getViewport({scale:1}),available=$("stage").clientWidth-36;
  let scale=baseScale;if(unit.width*scale>available&&available>120)scale=available/unit.width;
  const viewport=page.getViewport({scale}),ratio=Math.min(devicePixelRatio||1,2.5);
  canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=viewport.width+"px";canvas.style.height=viewport.height+"px";
  wrap.style.width=viewport.width+"px";wrap.style.height=viewport.height+"px";ctx.setTransform(ratio,0,0,ratio,0,0);
  await page.render({canvasContext:ctx,viewport}).promise;const content=await page.getTextContent();currentPageText=content.items.map(x=>x.str).join(" ");drawTextLayer(content,viewport);
  $("pageInput").value=num;$("prev").disabled=num<=1;$("next").disabled=num>=pdfDoc.numPages;rendering=false;if(pending!==null){const p=pending;pending=null;render(p)}
}
function queue(n){rendering?pending=n:render(n)}function go(n){if(!pdfDoc)return;pageNum=Math.min(Math.max(1,n),pdfDoc.numPages);queue(pageNum);scrollTo({top:0,behavior:"smooth"})}
pdfjsLib.getDocument(PDF_URL).promise.then(pdf=>{pdfDoc=pdf;$("totalPages").textContent=pdf.numPages;$("pageInput").max=pdf.numPages;$("loading").hidden=true;wrap.style.display="inline-block";render(1)}).catch(err=>{$("loading").hidden=true;$("error").hidden=false;$("error").innerHTML=`在线翻页暂时无法载入。<br><a href="${PDF_URL}">直接打开或下载 PDF</a><br><small>${err.message}</small>`});
$("prev").onclick=()=>go(pageNum-1);$("next").onclick=()=>go(pageNum+1);$("pageInput").onchange=e=>go(parseInt(e.target.value)||1);$("zoomIn").onclick=()=>{baseScale=Math.min(3,baseScale+.2);queue(pageNum)};$("zoomOut").onclick=()=>{baseScale=Math.max(.6,baseScale-.2);queue(pageNum)};
addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;if(e.key==="ArrowLeft")go(pageNum-1);if(e.key==="ArrowRight")go(pageNum+1)});addEventListener("resize",()=>{clearTimeout(window._resize);window._resize=setTimeout(()=>queue(pageNum),220)});
window.WDS_READ={title:"符号提前结算与创新阻断",bodyEl:()=>wrap,docTextFn:()=>currentPageText};
</script>
<script src="/taste/wds-companion/wds-read.js?v=20260802b" defer></script>
<script src="/wds-mode.js?v=20260812m" defer></script>
</body>
</html>
