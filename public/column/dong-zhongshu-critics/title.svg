<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="被告席上的两千年 题图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0906"/><stop offset="0.6" stop-color="#1f1810"/><stop offset="1" stop-color="#332812"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.5"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0d99a" stop-opacity="0.55"/><stop offset="1" stop-color="#f0d99a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <!-- 星/时间 -->
  <g fill="#e9d9b0">
    <circle cx="120" cy="60" r="1.5" opacity="0.7"/><circle cx="300" cy="40" r="1.1" opacity="0.5"/><circle cx="520" cy="70" r="1.2" opacity="0.6"/>
    <circle cx="700" cy="46" r="1.3" opacity="0.6"/><circle cx="900" cy="64" r="1.1" opacity="0.5"/><circle cx="1080" cy="50" r="1.4" opacity="0.7"/>
    <circle cx="1140" cy="150" r="1.1" opacity="0.5"/><circle cx="60" cy="150" r="1.2" opacity="0.5"/>
  </g>
  <!-- 大字「審」淡底 -->
  <text x="600" y="360" text-anchor="middle" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="330" fill="#b08d57" opacity="0.05" font-weight="700">審</text>
  <!-- 审判之光：自上而下的光束 -->
  <path d="M600,0 L470,520 L730,520 Z" fill="url(#beam)"/>
  <ellipse cx="600" cy="470" rx="180" ry="46" fill="url(#pool)"/>
  <!-- 两侧证人剪影（一排，愈远愈淡） -->
  <g fill="#0a0705">
    <!-- 左侧一排 -->
    <g opacity="0.9"><ellipse cx="360" cy="352" rx="20" ry="22"/><path d="M328,470 Q330,378 360,378 Q390,378 392,470 Z"/></g>
    <g opacity="0.7"><ellipse cx="270" cy="362" rx="18" ry="20"/><path d="M242,470 Q244,390 270,390 Q296,390 298,470 Z"/></g>
    <g opacity="0.5"><ellipse cx="190" cy="372" rx="16" ry="18"/><path d="M166,470 Q168,400 190,400 Q212,400 214,470 Z"/></g>
    <g opacity="0.32"><ellipse cx="120" cy="380" rx="14" ry="16"/><path d="M100,470 Q102,410 120,410 Q138,410 140,470 Z"/></g>
    <!-- 右侧一排 -->
    <g opacity="0.9"><ellipse cx="840" cy="352" rx="20" ry="22"/><path d="M808,470 Q810,378 840,378 Q870,378 872,470 Z"/>
      <!-- 一只指着的手臂 -->
      <path d="M820,392 L748,372 L744,384 L818,406 Z"/></g>
    <g opacity="0.7"><ellipse cx="930" cy="362" rx="18" ry="20"/><path d="M902,470 Q904,390 930,390 Q956,390 958,470 Z"/></g>
    <g opacity="0.5"><ellipse cx="1010" cy="372" rx="16" ry="18"/><path d="M986,470 Q988,400 1010,400 Q1032,400 1034,470 Z"/></g>
    <g opacity="0.32"><ellipse cx="1080" cy="380" rx="14" ry="16"/><path d="M1060,470 Q1062,410 1080,410 Q1098,410 1100,470 Z"/></g>
  </g>
  <!-- 中央：被告，独坐光下 -->
  <g fill="#1a130b">
    <rect x="556" y="452" width="88" height="8" rx="2" opacity="0.85"/>
    <ellipse cx="600" cy="360" rx="27" ry="29"/>
    <path d="M556,452 Q558,374 600,374 Q642,374 644,452 Z"/>
    <path d="M574,414 Q600,400 626,414 L618,432 L582,432 Z" fill="#241a0e"/>
  </g>
  <rect x="0" y="474" width="1200" height="46" fill="#0c0906" opacity="0.55"/>
</svg>
