<div class="item" data-ch="c1"><div class="n">之九十一 · 三学科交叉：机器学习 × 免疫学 × 神经科学</div><h2><a href="/confluence/borrowed-clarity/">借清</a></h2><p class="sub">学会一件事，不是记住它同时忘掉别的，而是把有限的清晰度从相邻处搬了过来</p><p class="hk">学会一件事时，对没在学的东西发生了什么？机器学习把它当作要消除的干扰，免疫学把它当作学会本身的产物（学得越牢、对近邻变体越认不出、且难改写），神经科学把它当作一道独立的主动清除工序。三家共享一个从未被单独说出的前提——学与对别处的影响是两件可分开的事。撤掉它，剩下的是同一个动作的两端：<b>学会就是把有限的清晰度从相邻区域搬到目标区域，没有搬走就没有学会</b>。读数是借清率；二维辨别表指认最危险的一格——搬走的清晰度不可回写、又落在你将要用到的近邻上，学得越好失能越深。</p><p class="rdmore"><a href="/confluence/borrowed-clarity/">读全文 →</a></p><p class="meta">约 1.4 万字 · 网页长文 · 作者 王德生 ＋ Claude · 发表于2026年8月11日</p></div>
