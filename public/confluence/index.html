<div class="item" data-ch="c1"><div class="n">之九十二 · 三学科交叉：认知教育 × 伦理人类学 × 法哲学（三家源为站内学员论文）</div><h2><a href="/confluence/branch-deleted/">步骤留下，岔路删除</a></h2><p class="sub">论选择次数何以在全部现行读数上不可见，及删除的顺序为何由可结算性而非后果重要性决定——附一次在职业数据上的预注册检验</p><p class="hk">现代组织正在极快地取消人在工作中的选择，而所有现行的记录方式都读不出这件事。原因不在监测不足，在删除的形态：被取消的是岔路，不是步骤。岗位仍在，工序仍在，工作量甚至上升，唯一减少的是那些「本来可以走另一条」的位置。本文命名这个量为带责分叉，给出三条同时成立才算数的判据——路真的分开、行动者知道并被允许走、选错的后果落在他本人身上且不至于将他废掉——并以单位工时内的分叉次数与对系统给定值的越建议率作为读数。本文进一步论证一条反直觉的命题：删除的顺序不由该不该删决定，而由可结算性决定，而可结算性与后果重要性是两条正交的轴。文中在职业信息网络数据库（O*NET 29.1，n=879）上做了一次预注册检验（预注册文本哈希已公开）：自动化程度与可结算性相关 0.466，与后果重量在控制可结算性后完全无关；时间压力与决策自由度近乎正交（0.017），证实忙与选是两笔账；自动化程度与决策频次无关（0.042），与决策自由度显著负相关（−0.199）——这一对系数正是「步骤留下、岔路删除」的字面读数。第三条预言部分不成立，本文据此收回一条过强主张；一次纵向检验失败，失败原因写在正文里。最后指出：人的监督条款所要的接管能力只能由带责分叉生产，而自动化设计的标准实现方式恰好把它降到零；现行法规要求人能够不采纳系统输出，却既不要求记录否决率，也不分配否决的责任。</p><div class="trio"><div><b>认知教育 · 陈晓艳《接缝思维》</b><a href="https://sdeuniverses.com/students/chen-xiaoyan/seam-thinking/">不可通约处如何成为生产性的认知立足点</a></div><div><b>伦理人类学 · 张琼《伦理空转项》</b><a href="https://sdeuniverses.com/students/zhang-qiong/ethical-idling/">中国伦理人类学田野采集的诊断</a></div><div><b>法哲学 · 高鹏《使人成为主体的规则》</b><a href="https://sdeuniverses.com/students/gao-peng/rules-that-make-subjects/">论禁止性规则与期待型规则所安装的两种主体结构</a></div></div><p class="rdmore"><a href="/confluence/branch-deleted/">读全文 →</a></p><p class="meta">约 1.5 万字 · 网页长文 · 作者 王德生 ＋ Claude · 发表于2026年8月11日</p></div>
