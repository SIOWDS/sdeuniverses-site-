<div class="item" data-ch="c6"><div class="n">之八十九 · 三学科交叉：权力社会学 × 教育制度批判 × 科学技术与社会</div><h2><a href="/confluence/painless-zone/">制造无痛区</a></h2><p class="sub">格式化表单如何在行动发生之前取消学习者的自我出面</p><p class="hk">一名学生第一次写实验报告时会回看自己的录像、停顿并修改，第二次拿到标准表单后却更快、更平静、更合规。福柯会把这解释为规范化判断，伊利奇会说制度收走了工具定义权，拉图尔会说表单作为铭写装置裁剪三维行动；但三家都预言某种残余、反弹或返回，而案例的危险之处恰是<b>什么也没有回来</b>。本文把共同前提前移：制度不只是压迫一个已经出面的自我，也可能在行动发生之前，用可填写、可比较、可归档的标准形状替代其形成条件。由此提出<b>自我疑存</b>与<b>测度信道制度独立度</b>两条正交轴，建立四象限、微动作代理、十五天反转实验、竞争解释和明确证伪条件。核心预测是：自我出面恢复后，迟疑、回看与修订可以回弹，而合规和得分不必下降。</p><div class="trio"><div><b>权力社会学 · 规范化判断、考试与可见性结构</b><a href="https://www.penguinrandomhouse.com/books/55026/discipline-and-punish-by-michel-foucault-and-alan-sheridan/" target="_blank" rel="noopener">Michel Foucault《规训与惩罚》→</a></div><div><b>教育制度批判 · 制度化价值与工具定义权</b><a href="https://shikshantar.org/library/library-books/deschooling-society" target="_blank" rel="noopener">Ivan Illich《去学校化社会》→</a></div><div><b>科学技术与社会 · 铭写装置、转译与不可变动体</b><a href="https://www.bruno-latour.fr/node/293.html" target="_blank" rel="noopener">Bruno Latour〈Visualization and Cognition〉→</a></div></div><p class="rdmore"><a href="/confluence/painless-zone/">读全文 →</a></p><p class="meta">约 2.0 万字 · 网页长文 · 作者 王德生 · 发表于2026年8月9日</p></div>
