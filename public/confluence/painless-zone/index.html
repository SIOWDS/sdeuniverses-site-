<p class="byline">作者：王德生　｜　2026年8月9日　｜　理论建构与可证伪研究设计</p>
<p class="abstract">本文从福柯的规范化判断、伊利奇的制度性工具批判与拉图尔的铭写装置共同失效的那一格出发，提出“自我疑存”与“测度信道制度独立度”二维模型，完成四象限判别、微动作代理、反转实验、竞争解释与证伪条件。核心判断是：制度制造的“无痛区”，未必来自冲突被解决，也可能来自能够把冲突认作“我的冲突”的内部程序尚未形成。</p>

</main>
<script>
(async function(){
  const status=document.getElementById('status');
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('当前浏览器不支持流式解压');
    const files=['part1.b64','part2.b64','part3.b64','part4.b64'];
    const chunks=await Promise.all(files.map(async function(file){
      const r=await fetch(file+'?v=20260809a',{cache:'no-store'});
      if(!r.ok) throw new Error(file+'：HTTP '+r.status);
      return r.text();
    }));
    const b64=chunks.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const zipped=Uint8Array.from(bin,function(c){return c.charCodeAt(0);});
    const stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
    const raw=await new Response(stream).arrayBuffer();
    if(window.crypto&&crypto.subtle){
      const digest=await crypto.subtle.digest('SHA-256',raw);
      const hex=Array.from(new Uint8Array(digest),function(b){return b.toString(16).padStart(2,'0');}).join('');
      if(hex!=='cab41cce6b59be35ba5f8a6671823473e27384e84c8121d9ce994992fde0b053') throw new Error('全文完整性校验未通过');
    }
    const html=new TextDecoder('utf-8').decode(raw);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    status.innerHTML='全文载入失败。请刷新页面，或返回<a href="/confluence/">“学科通融”专栏</a>。<br><small>'+String(err&&err.message||err)+'</small>';
  }
})();
</script>
