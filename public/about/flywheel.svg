<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" role="img" aria-label="文明增长飞轮：知识、智能体、对话、共同体与成果的持续回写">
<title>文明增长飞轮 · 爱思乐园</title>
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#0A0D16"/><stop offset="0.6" stop-color="#0C0A07"/><stop offset="1" stop-color="#090C13"/>
  </linearGradient>
  <radialGradient id="halo2" cx="50%" cy="42%" r="46%">
    <stop offset="0" stop-color="#E0B65C" stop-opacity=".14"/><stop offset="1" stop-color="#E0B65C" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="fS" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#3E93E0"/><stop offset="1" stop-color="#13396E"/></radialGradient>
  <radialGradient id="fD" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#4FC07A"/><stop offset="1" stop-color="#125A32"/></radialGradient>
  <radialGradient id="fE" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#F0A03C"/><stop offset="1" stop-color="#8A4A0C"/></radialGradient>
  <radialGradient id="fC" cx="38%" cy="26%" r="82%"><stop offset="0" stop-color="#1C2842"/><stop offset="1" stop-color="#080B12"/></radialGradient>
  <marker id="ar2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#C9A63E"/>
  </marker>
  <marker id="ar3" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#8A7B58"/>
  </marker>
</defs>

<style><![CDATA[
  .zh{font-family:"Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","Songti SC",serif}
  .sa{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Heiti SC",sans-serif}
  .lat{font-family:Georgia,"Times New Roman",serif}
  .gold{fill:#E8C86A}.ink{fill:#F1EADA}.mut{fill:#9FB0BE}.dim{fill:#6E7A88}
  .st{font-weight:700;font-size:20px}
  .sd{font-size:13.5px}
  .num{font-family:Georgia,serif;font-weight:700;font-size:21px;fill:#0C0A07}
]]></style>

<rect width="1200" height="1400" fill="url(#bg2)"/>
<rect width="1200" height="1400" fill="url(#halo2)"/>

<text class="zh gold" x="600" y="78" font-size="54" text-anchor="middle" letter-spacing="10" font-weight="700">文明增长飞轮</text>
<text class="zh mut" x="600" y="116" font-size="19" text-anchor="middle" letter-spacing="3">爱思乐园：一个会成长的智慧文明系统</text>

<!-- 飞轮轨道 -->
<ellipse cx="600" cy="590" rx="300" ry="270" fill="none" stroke="#C9A63E" stroke-opacity=".32" stroke-width="2" stroke-dasharray="9 11"/>
<g fill="none" stroke="#C9A63E" stroke-opacity=".8" stroke-width="2.4" marker-end="url(#ar2)">
  <path d="M660 336 A300 270 0 0 1 852 452"/>
  <path d="M888 700 A300 270 0 0 1 726 838"/>
  <path d="M468 834 A300 270 0 0 1 314 692"/>
  <path d="M312 480 A300 270 0 0 1 474 342"/>
</g>

<!-- 中心三顶点 -->
<circle cx="600" cy="590" r="74" fill="url(#fC)" stroke="#E0B65C" stroke-opacity=".5" stroke-width="1.6"/>
<text class="lat gold" x="600" y="582" font-size="33" text-anchor="middle" font-weight="700" letter-spacing="3">SDE</text>
<text class="zh ink" x="600" y="610" font-size="16" text-anchor="middle">本体论</text>

<circle cx="600" cy="452" r="52" fill="url(#fS)" stroke="#7FC0FF" stroke-opacity=".4"/>
<text class="lat" x="600" y="446" font-size="27" text-anchor="middle" fill="#EAF4FF" font-weight="700">S</text>
<text class="sa" x="600" y="468" font-size="12.5" text-anchor="middle" fill="#C6E1F8">智能网站</text>

<circle cx="486" cy="670" r="52" fill="url(#fD)" stroke="#8CE8AE" stroke-opacity=".4"/>
<text class="lat" x="486" y="664" font-size="27" text-anchor="middle" fill="#EAFFF1" font-weight="700">D</text>
<text class="sa" x="486" y="686" font-size="12.5" text-anchor="middle" fill="#BCEFD1">ChatSDE</text>

<circle cx="714" cy="670" r="52" fill="url(#fE)" stroke="#FFCE8C" stroke-opacity=".4"/>
<text class="lat" x="714" y="664" font-size="27" text-anchor="middle" fill="#FFF4E4" font-weight="700">E</text>
<text class="sa" x="714" y="686" font-size="12.5" text-anchor="middle" fill="#F6DCB4">SDE 微信</text>

<g fill="none" stroke="#7C8894" stroke-width="1.5" stroke-opacity=".65">
  <path d="M558 502 L524 622"/><path d="M642 502 L676 622"/><path d="M540 684 H660"/>
</g>
<g class="sa dim" font-size="12" text-anchor="middle">
  <text x="506" y="566" transform="rotate(-74 506 566)">知识调用</text>
  <text x="694" y="566" transform="rotate(74 694 566)">知识连接</text>
  <text x="600" y="714">共同体反馈</text>
</g>

<!-- 八步 -->
<g class="sa">
  <!-- 1 顶 -->
  <circle cx="470" cy="196" r="17" fill="#E8C86A"/><text class="num" x="470" y="204" text-anchor="middle">1</text>
  <text class="zh ink st" x="496" y="204">知识生产与沉淀</text>
  <text class="mut sd" x="496" y="232">学员、教师与智能体产出论文、专著、课程、代码与作品</text>
  <text class="mut sd" x="496" y="254">经编校、核验与授权确认后进入网站</text>

  <!-- 2 右上 -->
  <circle cx="930" cy="352" r="17" fill="#E8C86A"/><text class="num" x="930" y="360" text-anchor="middle">2</text>
  <text class="zh ink st" x="956" y="360">知识宇宙扩大</text>
  <text class="mut sd" x="956" y="388">变宽的不只是页数，还有</text>
  <text class="mut sd" x="956" y="410">概念网络与跨学科连接</text>

  <!-- 3 右中 -->
  <circle cx="930" cy="580" r="17" fill="#E8C86A"/><text class="num" x="930" y="588" text-anchor="middle">3</text>
  <text class="zh ink st" x="956" y="588">智能体能力提升</text>
  <text class="mut sd" x="956" y="616">更厚的语境、更准的检索、</text>
  <text class="mut sd" x="956" y="638">更清楚的错误模式</text>

  <!-- 4 右下 -->
  <circle cx="930" cy="808" r="17" fill="#E8C86A"/><text class="num" x="930" y="816" text-anchor="middle">4</text>
  <text class="zh ink st" x="956" y="816">对话更聪明</text>
  <text class="mut sd" x="956" y="844">ChatSDE 调得动更强的</text>
  <text class="mut sd" x="956" y="866">智能体，拆得更深</text>

  <!-- 5 底 -->
  <circle cx="424" cy="972" r="17" fill="#E8C86A"/><text class="num" x="424" y="980" text-anchor="middle">5</text>
  <text class="zh ink st" x="450" y="980">共同体更强大</text>
  <text class="mut sd" x="450" y="1008">碰撞更深、分工更清楚，形成更高质量的集体智慧</text>

  <!-- 6 左下 -->
  <circle cx="270" cy="808" r="17" fill="#E8C86A"/><text class="num" x="270" y="816" text-anchor="middle">6</text>
  <text class="zh ink st" x="244" y="816" text-anchor="end">发生更多成果</text>
  <text class="mut sd" x="244" y="844" text-anchor="end">新论文、新专著、新技术、</text>
  <text class="mut sd" x="244" y="866" text-anchor="end">新课程与新作品</text>

  <!-- 7 左中 -->
  <circle cx="270" cy="580" r="17" fill="#E8C86A"/><text class="num" x="270" y="588" text-anchor="middle">7</text>
  <text class="zh ink st" x="244" y="588" text-anchor="end">回写与沉淀</text>
  <text class="mut sd" x="244" y="616" text-anchor="end">过闸的成果回写网站，成为</text>
  <text class="mut sd" x="244" y="638" text-anchor="end">可复用的知识资产</text>

  <!-- 8 左上 -->
  <circle cx="270" cy="352" r="17" fill="#E8C86A"/><text class="num" x="270" y="360" text-anchor="middle">8</text>
  <text class="zh ink st" x="244" y="360" text-anchor="end">文明持续跃迁</text>
  <text class="mut sd" x="244" y="388" text-anchor="end">长出来的不只是内容量，</text>
  <text class="mut sd" x="244" y="410" text-anchor="end">还有解题深度与可继承性</text>
</g>

<!-- 底部：链条 -->
<path d="M46 1046 H1154" stroke="#B5860F" stroke-opacity=".3"/>
<text class="zh gold" x="600" y="1086" font-size="22" text-anchor="middle" letter-spacing="6">三位一体 · 协同进化 · 自我增强 · 持续循环</text>
<g class="sa" text-anchor="middle">
  <rect x="46" y="1108" width="200" height="70" rx="10" fill="#12161F" stroke="#2A3446"/>
  <text class="ink" x="146" y="1138" font-size="16">SDE 智能网站</text>
  <text class="dim" x="146" y="1160" font-size="13">显露 · 生产 · 沉淀</text>

  <rect x="274" y="1108" width="200" height="70" rx="10" fill="#12161F" stroke="#2A3446"/>
  <text class="ink" x="374" y="1138" font-size="16">ChatSDE</text>
  <text class="dim" x="374" y="1160" font-size="13">发生 · 创新 · 生成</text>

  <rect x="502" y="1108" width="200" height="70" rx="10" fill="#12161F" stroke="#2A3446"/>
  <text class="ink" x="602" y="1138" font-size="16">SDE 微信共同体</text>
  <text class="dim" x="602" y="1160" font-size="13">连接 · 协作 · 进化</text>

  <rect x="730" y="1108" width="200" height="70" rx="10" fill="#12161F" stroke="#2A3446"/>
  <text class="ink" x="830" y="1138" font-size="16">新知识 · 新文明</text>
  <text class="dim" x="830" y="1160" font-size="13">回写网站 · 再次出发</text>

  <rect x="958" y="1108" width="196" height="70" rx="10" fill="#1A1508" stroke="#B5860F" stroke-opacity=".6"/>
  <text class="gold" x="1056" y="1138" font-size="16">持续循环</text>
  <text x="1056" y="1160" font-size="13" fill="#B49B62">增长不止步</text>
</g>
<g stroke="#8A7B58" stroke-width="1.6" marker-end="url(#ar3)" fill="none">
  <path d="M250 1143 H268"/><path d="M478 1143 H496"/><path d="M706 1143 H724"/><path d="M934 1143 H952"/>
</g>

<g class="sa" text-anchor="middle">
  <text class="ink" x="600" y="1236" font-size="15.5">核心价值：知识持续生产　·　智能体持续增强　·　共同体持续创造　·　系统持续自校　·　文明持续生长</text>
  <text class="zh gold" x="600" y="1288" font-size="21" letter-spacing="3">我们不是使用 AI，我们与 AI 一起创造未来文明</text>
  <text class="dim" x="600" y="1330" font-size="12.5">飞轮成立的前提是质量增长快于噪声增长——治理是飞轮的一环，不是它的对面。</text>
</g>
</svg>
