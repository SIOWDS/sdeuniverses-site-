<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1360" role="img" aria-label="爱思乐园：SDE 三位一体智慧系统">
<title>爱思乐园 · SDE 三位一体智慧系统</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#0A0F18"/><stop offset="0.55" stop-color="#0C0A07"/><stop offset="1" stop-color="#0A0D14"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="42%" r="52%">
    <stop offset="0" stop-color="#E0B65C" stop-opacity=".16"/><stop offset="1" stop-color="#E0B65C" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cS" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#3E93E0"/><stop offset="1" stop-color="#13396E"/></radialGradient>
  <radialGradient id="cD" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#4FC07A"/><stop offset="1" stop-color="#125A32"/></radialGradient>
  <radialGradient id="cE" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#F0A03C"/><stop offset="1" stop-color="#8A4A0C"/></radialGradient>
  <radialGradient id="cC" cx="38%" cy="26%" r="82%"><stop offset="0" stop-color="#1B2740"/><stop offset="1" stop-color="#080B12"/></radialGradient>
  <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#8A7B58"/>
  </marker>
</defs>

<style><![CDATA[
  .zh{font-family:"Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","Songti SC",serif}
  .sa{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Heiti SC",sans-serif}
  .lat{font-family:Georgia,"Times New Roman",serif}
  .gold{fill:#E8C86A}.ink{fill:#F1EADA}.mut{fill:#8A9BA8}.dim{fill:#6E7A88}
  .ttl{font-weight:700}
]]></style>

<rect width="1200" height="1360" fill="url(#bg)"/>
<rect width="1200" height="1360" fill="url(#halo)"/>

<!-- 顶部题头 -->
<text class="zh ttl gold" x="600" y="92" font-size="74" text-anchor="middle" letter-spacing="10">爱思乐园</text>
<text class="lat mut" x="600" y="130" font-size="19" text-anchor="middle" letter-spacing="9">— AIS PARK —</text>
<text class="zh ink" x="600" y="184" font-size="31" text-anchor="middle" letter-spacing="3">让知识、技术与艺术持续发生</text>
<text class="sa mut" x="600" y="220" font-size="17.5" text-anchor="middle" letter-spacing="2">面向高端思考者的智慧共同体　·　sdeuniverses.com</text>
<path d="M470 244 H730" stroke="#B5860F" stroke-opacity=".45" stroke-width="1.4"/>

<!-- 三顶点连线 -->
<g fill="none" stroke="#8A7B58" stroke-opacity=".65" stroke-width="2.2" marker-end="url(#ar)">
  <path d="M517 372 C430 448 372 528 356 612"/>
  <path d="M480 748 C560 786 640 786 720 748"/>
  <path d="M844 612 C828 528 770 448 683 372"/>
</g>
<g class="sa dim" font-size="16" text-anchor="middle">
  <text x="392" y="486" transform="rotate(-52 392 486)">显露 → 发生</text>
  <text x="600" y="806">共同创造</text>
  <text x="808" y="486" transform="rotate(52 808 486)">回写 → 沉淀</text>
</g>

<!-- 中心：SDE 本体论 -->
<circle cx="600" cy="560" r="132" fill="url(#cC)" stroke="#E0B65C" stroke-opacity=".55" stroke-width="2"/>
<text class="lat ttl gold" x="600" y="536" font-size="60" text-anchor="middle" letter-spacing="6">SDE</text>
<text class="zh ink" x="600" y="574" font-size="25" text-anchor="middle" letter-spacing="4">本体论</text>
<g class="sa mut" font-size="15" text-anchor="middle">
  <text x="600" y="606">统一理论</text><text x="600" y="628">统一智能体</text><text x="600" y="650">统一知识发生</text>
</g>

<!-- S 顶点 -->
<circle cx="600" cy="300" r="94" fill="url(#cS)" stroke="#7FC0FF" stroke-opacity=".45" stroke-width="1.6"/>
<text class="lat ttl" x="600" y="288" font-size="52" text-anchor="middle" fill="#EAF4FF">S</text>
<text class="zh" x="600" y="322" font-size="20" text-anchor="middle" fill="#EAF4FF">SDE 浏览</text>
<text class="sa" x="600" y="346" font-size="14" text-anchor="middle" fill="#B9D8F5">网站 · 知识宇宙</text>

<!-- D 顶点 -->
<circle cx="390" cy="700" r="94" fill="url(#cD)" stroke="#8CE8AE" stroke-opacity=".45" stroke-width="1.6"/>
<text class="lat ttl" x="390" y="688" font-size="52" text-anchor="middle" fill="#EAFFF1">D</text>
<text class="zh" x="390" y="722" font-size="20" text-anchor="middle" fill="#EAFFF1">SDE 对话</text>
<text class="sa" x="390" y="746" font-size="14" text-anchor="middle" fill="#B6EBCB">ChatSDE</text>

<!-- E 顶点 -->
<circle cx="810" cy="700" r="94" fill="url(#cE)" stroke="#FFCE8C" stroke-opacity=".45" stroke-width="1.6"/>
<text class="lat ttl" x="810" y="688" font-size="52" text-anchor="middle" fill="#FFF4E4">E</text>
<text class="zh" x="810" y="722" font-size="20" text-anchor="middle" fill="#FFF4E4">SDE 微信</text>
<text class="sa" x="810" y="746" font-size="14" text-anchor="middle" fill="#F4D3A6">共同体</text>

<!-- 三段说明 -->
<g class="sa">
  <text class="zh" x="742" y="266" font-size="21" fill="#8FC4F2">知识显露</text>
  <g fill="#9FB0BE" font-size="15.5">
    <text x="742" y="296">· 专栏、专著、学员论文、课程</text>
    <text x="742" y="322">· 全站检索与近邻索引</text>
    <text x="742" y="348">· 智能体就装在知识旁边</text>
  </g>

  <text class="zh" x="46" y="596" font-size="21" fill="#7FD8A2">知识发生</text>
  <g fill="#9FB0BE" font-size="15">
    <text x="46" y="626">· 调用通用基底</text>
    <text x="46" y="652">· 按 SDE 方法拆题</text>
    <text x="46" y="678">· 调度智能体协同</text>
    <text x="46" y="704">· 发生新知识与作品</text>
  </g>

  <text class="zh" x="952" y="596" font-size="21" fill="#F2B96B">知识纠缠</text>
  <g fill="#9FB0BE" font-size="15">
    <text x="952" y="626">· 人与人</text>
    <text x="952" y="652">· 人与 AI</text>
    <text x="952" y="678">· AI 与 AI</text>
    <text x="952" y="704">· 长期共同创造</text>
  </g>
</g>

<!-- 持续循环 -->
<text class="zh gold" x="600" y="880" font-size="25" text-anchor="middle" letter-spacing="6">三位一体 · 持续循环</text>
<g>
  <g class="sa">
    <rect x="46" y="906" width="190" height="66" rx="10" fill="#12161F" stroke="#2A3446"/>
    <text class="zh ink" x="141" y="936" font-size="17" text-anchor="middle">SDE 浏览</text>
    <text x="141" y="958" font-size="13.5" text-anchor="middle" fill="#8FC4F2">获取知识</text>

    <rect x="264" y="906" width="190" height="66" rx="10" fill="#12161F" stroke="#2A3446"/>
    <text class="zh ink" x="359" y="936" font-size="17" text-anchor="middle">SDE 对话</text>
    <text x="359" y="958" font-size="13.5" text-anchor="middle" fill="#7FD8A2">发生新知</text>

    <rect x="482" y="906" width="190" height="66" rx="10" fill="#12161F" stroke="#2A3446"/>
    <text class="zh ink" x="577" y="936" font-size="17" text-anchor="middle">SDE 微信</text>
    <text x="577" y="958" font-size="13.5" text-anchor="middle" fill="#F2B96B">共同创造</text>

    <rect x="700" y="906" width="190" height="66" rx="10" fill="#12161F" stroke="#2A3446"/>
    <text class="zh ink" x="795" y="936" font-size="17" text-anchor="middle">新知识回写</text>
    <text x="795" y="958" font-size="13.5" text-anchor="middle" fill="#C9B27A">知识沉淀</text>

    <rect x="918" y="906" width="236" height="66" rx="10" fill="#141A12" stroke="#3A4A2E"/>
    <text class="zh ink" x="1036" y="936" font-size="17" text-anchor="middle">SDE 浏览</text>
    <text x="1036" y="958" font-size="13.5" text-anchor="middle" fill="#8FC4F2">再次启发</text>
  </g>
  <g stroke="#8A7B58" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <path d="M240 939 H258"/><path d="M458 939 H476"/><path d="M676 939 H694"/><path d="M894 939 H912"/>
  </g>
</g>

<!-- 站内实况（可核验） -->
<path d="M46 1002 H1154" stroke="#B5860F" stroke-opacity=".3"/>
<g class="sa" text-anchor="middle">
  <text class="lat ttl gold" x="156" y="1054" font-size="34">4588 万</text>
  <text class="ink" x="156" y="1080" font-size="14.5">检索字符数</text>
  <text class="dim" x="156" y="1102" font-size="12.5">全站索引实测</text>

  <text class="lat ttl gold" x="378" y="1054" font-size="34">1773</text>
  <text class="ink" x="378" y="1080" font-size="14.5">入索引文档</text>
  <text class="dim" x="378" y="1102" font-size="12.5">全站 2729 页</text>

  <text class="lat ttl gold" x="600" y="1054" font-size="34">15</text>
  <text class="ink" x="600" y="1080" font-size="14.5">可点开的智能体</text>
  <text class="dim" x="600" y="1102" font-size="12.5">另有内部产线编排</text>

  <text class="lat ttl gold" x="822" y="1054" font-size="34">51</text>
  <text class="ink" x="822" y="1080" font-size="14.5">在线专著</text>
  <text class="dim" x="822" y="1102" font-size="12.5">books/m 系列</text>

  <text class="lat ttl gold" x="1044" y="1054" font-size="34">36</text>
  <text class="ink" x="1044" y="1080" font-size="14.5">在册学员</text>
  <text class="dim" x="1044" y="1102" font-size="12.5">名录公开可查</text>
</g>
<text class="sa dim" x="600" y="1132" font-size="13" text-anchor="middle">口径：2026-08-01 全站检索索引与名录实测，随内容增长滚动更新；此处不作估算与外推。</text>

<!-- 我们与世界的不同 -->
<text class="zh gold" x="600" y="1186" font-size="23" text-anchor="middle" letter-spacing="5">我们与世界的不同</text>
<g class="sa" text-anchor="middle">
  <rect x="46" y="1206" width="258" height="104" rx="12" fill="#12161F" stroke="#2A3446"/>
  <text class="ink" x="175" y="1240" font-size="19">Google</text>
  <text x="175" y="1268" font-size="15" fill="#9FB0BE">连接信息</text>
  <text class="dim" x="175" y="1292" font-size="13">找到已有的信息</text>

  <rect x="320" y="1206" width="258" height="104" rx="12" fill="#12161F" stroke="#2A3446"/>
  <text class="ink" x="449" y="1240" font-size="19">微信</text>
  <text x="449" y="1268" font-size="15" fill="#9FB0BE">连接人与人</text>
  <text class="dim" x="449" y="1292" font-size="13">维系社交关系</text>

  <rect x="594" y="1206" width="258" height="104" rx="12" fill="#12161F" stroke="#2A3446"/>
  <text class="ink" x="723" y="1240" font-size="19">GPT 等通用基底</text>
  <text x="723" y="1268" font-size="15" fill="#9FB0BE">连接人与 AI</text>
  <text class="dim" x="723" y="1292" font-size="13">获得智能回答</text>

  <rect x="868" y="1206" width="286" height="104" rx="12" fill="#1A1508" stroke="#B5860F" stroke-opacity=".6"/>
  <text class="gold" x="1011" y="1240" font-size="19">爱思乐园</text>
  <text x="1011" y="1268" font-size="15" fill="#E4D6AE">连接知识、AI 与人</text>
  <text x="1011" y="1292" font-size="13" fill="#B49B62">使三者持续发生新知识</text>
</g>

<text class="zh mut" x="600" y="1344" font-size="16" text-anchor="middle" letter-spacing="2">爱思乐园 —— 一个持续发生知识、技术与艺术的智慧文明系统</text>
</svg>
