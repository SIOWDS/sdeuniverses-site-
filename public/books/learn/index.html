<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>专著学习系统 · 德麦国际</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0B0E12;--fg:#E6E4DE;--dim:#8C949C;--gold:#D9A441;--line:#232A31;--card:#11161B;--ok:#6DBE8C;--warn:#E0B24A;--bad:#E08A7A;--navy:#9fc0e6}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.9 "Noto Serif CJK SC","Songti SC",Georgia,serif}
a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:.8rem;align-items:center;padding:.55rem 1rem;background:rgba(11,14,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font:14px/1.4 "Noto Sans CJK SC",sans-serif}
.bar .sp{margin-left:auto}
.bar button,.btn{font:inherit;cursor:pointer;color:var(--fg);background:none;border:1px solid var(--line);border-radius:6px;padding:.35rem .8rem}
.btn{display:inline-block;padding:.55rem 1.1rem;font-size:15px}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold:hover,.bar button:hover,.btn:hover{background:rgba(217,164,65,.1);text-decoration:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.wrap{max-width:900px;margin:0 auto;padding:1.6rem 1.1rem 4rem}
h1{font-size:1.9rem;margin:.2rem 0 .3rem;letter-spacing:.02em}
h2{font-size:1.25rem;margin:2rem 0 .8rem;color:var(--gold);font-weight:600}
h3{font-size:1.05rem;margin:1.2rem 0 .4rem}
.dim{color:var(--dim)}.small{font-size:.88rem}
.thesis{border-left:3px solid var(--gold);padding-left:.9rem;margin:1rem 0;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin:.8rem 0}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:1rem 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem}
.stat b{display:block;font-size:1.5rem;color:var(--gold);line-height:1.3}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.node{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.75rem .9rem;color:var(--fg);line-height:1.6}
.node:hover{border-color:var(--gold);text-decoration:none}
.node .no{font:12px/1 "Noto Sans CJK SC",sans-serif;color:var(--dim);letter-spacing:.08em}
.node .t{display:block;font-size:.98rem;margin:.25rem 0}
.node.lit{border-color:var(--ok)}.node.lit .no{color:var(--ok)}
.node.cur{border-color:var(--gold)}
.tag{display:inline-block;font:12px/1.6 "Noto Sans CJK SC",sans-serif;border:1px solid var(--line);border-radius:4px;padding:0 .4rem;color:var(--dim);margin-right:.3rem}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.gold{color:var(--gold);border-color:var(--gold)}
.steps{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0}
.steps a{font:13px/1 "Noto Sans CJK SC",sans-serif;padding:.45rem .7rem;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
.steps a.on{border-color:var(--gold);color:var(--gold)}.steps a.done{color:var(--ok);border-color:var(--ok)}
.steps a.off{opacity:.4;pointer-events:none}
textarea,input[type=text]{width:100%;background:#0d1217;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;font:inherit;line-height:1.8}
textarea{min-height:7rem;resize:vertical}
textarea:focus,input:focus{outline:1px solid var(--gold)}
.quote{border-left:2px solid var(--line);padding:.1rem 0 .1rem .8rem;margin:.5rem 0;color:var(--dim);font-size:.95rem}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;margin:.5rem 0;cursor:pointer;line-height:1.7}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.right{border-color:var(--ok);background:rgba(109,190,140,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(224,138,122,.1)}
.opt[disabled]{cursor:default}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:.4rem 0 1rem}
.prog i{display:block;height:100%;background:var(--gold)}
.chk{display:flex;gap:.6rem;align-items:flex-start;margin:.4rem 0}
.chk input{margin-top:.55rem;flex:none}
details{margin:.4rem 0}summary{cursor:pointer;color:var(--gold)}
.part{margin:1.2rem 0 .3rem;display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.chl{display:flex;gap:.6rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.chl .n{color:var(--dim);min-width:3.2rem;font:13px "Noto Sans CJK SC",sans-serif}
.chl .ti{flex:1;min-width:12rem}
.cert{border:2px solid var(--gold);border-radius:10px;padding:2rem 1.4rem;text-align:center;margin:1.2rem 0;background:linear-gradient(180deg,#141a21,#0f1419)}
.cert h2{margin-top:0;font-size:1.6rem}
.flip{min-height:9rem;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;padding:1.2rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:.5rem 1rem;border-radius:6px;font-size:14px;z-index:9}
@media print{.bar,.noprint{display:none!important}body{background:#fff;color:#000}.cert{border-color:#000;background:#fff;color:#000}.cert h2,.cert .dim{color:#000}}
</style>
</head>
<body>
<div class="bar noprint"><a id="back" href="/books/">← 书籍</a><a id="home" href="#/">学习首页</a><span class="sp"></span><button id="exp">导出进度</button><button id="imp">导入进度</button><input id="impf" type="file" accept="application/json" hidden></div>
<div class="wrap" id="app"><p class="dim">载入学习包……</p></div>
<script>
(function(){
"use strict";
var NO=(new URLSearchParams(location.search).get('b')||'152').replace(/[^0-9]/g,'')||'152';
var KEY='wds_learn_'+NO;
var L=null,S={},CH={},PT={},PR={};
var FRONT={s2:'前言',s3:'导读',s4:'导论'};
var BOX=[1,3,7,21,60];
var Q=null; // transient quiz state

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function norm(){S.p=S.p||{};S.c=S.c||{};S.t=S.t||{};S.k=S.k||{};S.f=S.f||{};S.i=S.i||{}}
function ymd(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function today(){return ymd(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function toast(t){var o=document.querySelector('.toast');if(o)o.remove();var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},1800)}
function pst(id){S.p[id]=S.p[id]||{s:1,a1:'',a2:'',t:'',r:[],read:{},done:false};return S.p[id]}
function href(c){return L.book.read+'#'+c}
function chLabel(c){if(FRONT[c])return FRONT[c];var x=CH[c];return x?('第'+x.n+'章 '+x.title):c}
function srcLink(ev){return '<a href="'+esc(href(ev.c))+'" target="_blank" rel="noopener">'+esc(chLabel(ev.c))+'</a>'}
function evHtml(ev){return '<div class="quote">“'+esc(ev.q)+'”<br><span class="small">出自 '+srcLink(ev)+'</span></div>'}
function litCount(){return L.problems.filter(function(p){return pst(p.id).done}).length}
function dueCards(){var t=today(),r=[];L.chapters.forEach(function(c){if(!S.c[c.id])return;c.cards.forEach(function(cd,i){var k=S.k[c.id+':'+i];if(k&&k.due<=t)r.push({key:c.id+':'+i,cd:cd,ch:c})})});return r}
function ensureCards(cid){var c=CH[cid];c.cards.forEach(function(cd,i){var k=c.id+':'+i;if(!S.k[k])S.k[k]={b:0,due:today()}})}
function nextProblem(){
  var cand=L.problems.filter(function(p){return !pst(p.id).done});
  for(var i=0;i<cand.length;i++){if(cand[i].depends.every(function(d){return pst(d).done}))return cand[i]}
  return cand[0]||null;
}
function tier(r){return r>=0.8?['ok','站住了']:(r>=0.5?['warn','半懂']:['bad','回头读'])}

/* ---------- views ---------- */
function vHome(){
  var lit=litCount(),tested=Object.keys(S.c).length,due=dueCards().length,np=nextProblem();
  var h='<h1>'+esc(L.book.title)+'</h1><div class="dim">'+esc(L.book.sub)+' · '+esc(L.book.author)+' 著 · 学习系统</div>';
  h+='<div class="thesis">全书一句话：'+esc(L.book.thesis)+'<div class="dim small">先别急着背，读完再回来看这句话是什么意思。</div></div>';
  h+='<div class="stats"><div class="stat"><b>'+lit+' / '+L.problems.length+'</b>难题已点亮</div><div class="stat"><b>'+tested+' / '+L.chapters.length+'</b>章已自测</div><div class="stat"><b>'+Object.keys(S.t).length+' / '+L.parts.length+'</b>编测已做</div><div class="stat"><b>'+due+'</b>张复习卡到期</div></div>';
  h+='<div class="prog"><i style="width:'+Math.round(lit*10)+'%"></i></div>';
  h+='<div class="row">';
  if(!S.i.done)h+='<a class="btn gold" href="#/intake">先做入门诊断（3 个问题）</a>';
  if(np)h+='<a class="btn '+(S.i.done?'gold':'')+'" href="#/p/'+np.id+'">'+(lit?'继续：':'开始：')+esc(np.id+' '+np.title)+'</a>';
  if(due)h+='<a class="btn" href="#/cards">复习 '+due+' 张卡</a>';
  h+='<a class="btn" href="'+esc(L.book.read)+'" target="_blank" rel="noopener">打开全文</a></div>';
  if(S.i.done&&S.i.start)h+='<p class="dim small">入门诊断建议你从 '+esc(S.i.start)+' 开始'+(S.i.pace?('；节奏：'+esc(S.i.pace)):'')+'。<a href="#/intake">重做</a></p>';
  h+='<h2>十大难题</h2><p class="dim small">每个难题是一个读者真会问的问题。先用自己的话答，再带着问去读，读完再答，最后对照。顺序是建议，不是锁。</p><div class="map">';
  L.problems.forEach(function(p){
    var st=pst(p.id),ready=p.depends.every(function(d){return pst(d).done});
    var cls=st.done?'lit':(st.a1||st.s>1?'cur':'');
    h+='<a class="node '+cls+'" href="#/p/'+p.id+'"><span class="no">'+p.id+(st.done?' · 已点亮':(st.a1||st.s>1?' · 学习中':''))+'</span><span class="t">'+esc(p.q)+'</span>';
    if(!st.done&&!ready)h+='<span class="small dim">建议先学 '+esc(p.depends.join('、'))+'</span>';
    h+='</a>';
  });
  h+='</div><h2>按章学习与自测</h2><p class="dim small">每章 5 题，每编 8 题。选错的题会告诉你错在哪个常见想法，并指回原文那一句。</p>';
  L.parts.forEach(function(pt){
    var ptT=S.t[pt.id];
    h+='<div class="part"><b>'+esc(pt.title)+'</b>'+(ptT?'<span class="tag '+tier(ptT.r)[0]+'">编测：'+tier(ptT.r)[1]+'</span>':'')+'<a class="small" href="#/q/part/'+pt.id+'">做编测</a></div>';
    pt.chapters.forEach(function(cid){
      var c=CH[cid],r=S.c[cid];
      h+='<div class="chl"><span class="n">第'+c.n+'章</span><span class="ti"><a href="'+esc(c.href)+'" target="_blank" rel="noopener">'+esc(c.title)+'</a></span>'+(r?'<span class="tag '+tier(r.r)[0]+'">'+tier(r.r)[1]+'</span>':'')+'<a class="small" href="#/q/ch/'+cid+'">'+(r?'再测':'章测')+'</a></div>';
    });
  });
  var ready2=lit===L.problems.length;
  h+='<h2>全书结业</h2><div class="card"><div>点亮全部 10 个难题，再答两道开放题。'+(ready2?'':'<span class="dim"> 还差 '+(L.problems.length-lit)+' 个难题。</span>')+'</div><div class="row" style="margin-top:.6rem"><a class="btn '+(ready2?'gold':'')+'" href="#/final">去结业</a></div></div>';
  return h;
}

function vIntake(){
  var h='<h1>入门诊断</h1><p class="dim">三个问题，只用来推荐起点和节奏，不打分。</p>';
  L.intake.questions.forEach(function(q){
    h+='<div class="card"><b>'+esc(q.q)+'</b>';
    q.opts.forEach(function(o,i){
      var on=(S.i.pick&&S.i.pick[q.id]===i);
      h+='<label class="chk"><input type="radio" name="iq_'+q.id+'" data-act="pick" data-q="'+q.id+'" data-i="'+i+'"'+(on?' checked':'')+'><span>'+esc(o.t)+'</span></label>';
    });
    h+='</div>';
  });
  h+='<button class="btn gold" data-act="intakeDone">得到建议</button>';
  return h;
}

function vProblem(id){
  var p=PR[id];if(!p)return '<p>没有这个难题。</p>';
  var st=pst(id),step=parseInt(((location.hash.match(/\/p\/[^/]+\/(\d)/)||[])[1]),10)||st.s||1;
  if(step>st.s)step=st.s;
  var h='<div class="dim small"><a href="#/">学习首页</a> › '+p.id+'</div><h1>'+esc(p.q)+'</h1><p class="dim">'+esc(p.why)+'</p>';
  var names=['先答','带问读','再答','对照','迁移'];
  h+='<div class="steps">';
  names.forEach(function(n,i){var k=i+1,cl=(k===step?'on':(k<st.s||st.done?'done':(k>st.s?'off':'')));h+='<a class="'+cl+'" href="#/p/'+id+'/'+k+'">'+k+' '+n+'</a>'});
  h+='</div>';
  if(step===1){
    h+='<div class="card"><b>第一步：先答。</b><p class="dim small">不翻书，凭直觉写一两句。想不出就写“不知道”，这也是一个起点。</p><textarea data-f="a1" data-id="'+id+'" placeholder="我的第一反应是……">'+esc(st.a1)+'</textarea></div><button class="btn gold" data-act="step" data-id="'+id+'" data-to="2">下一步：带着问题去读</button>';
  }else if(step===2){
    h+='<div class="card"><b>第二步：带问读。</b><p class="dim small">只读下面这几节就够了。“主读”要细看，“略读”扫一遍，“对照”拿来比较。读完一节勾一下。</p>';
    p.anchors.forEach(function(a){
      var on=st.read&&st.read[a.c];
      h+='<label class="chk"><input type="checkbox" data-act="read" data-id="'+id+'" data-c="'+a.c+'"'+(on?' checked':'')+'><span><span class="tag gold">'+esc(a.role)+'</span><a href="'+esc(href(a.c))+'" target="_blank" rel="noopener">'+esc(chLabel(a.c))+'</a><br><span class="dim small">'+esc(a.note)+'</span></span></label>';
    });
    h+='</div><button class="btn gold" data-act="step" data-id="'+id+'" data-to="3">读完了，再答一次</button>';
  }else if(step===3){
    h+='<div class="card"><div class="dim small">你的第一次回答</div><div>'+(st.a1?esc(st.a1).replace(/\n/g,'<br>'):'<span class="dim">（没写）</span>')+'</div></div>';
    h+='<div class="card"><b>第三步：再答。</b><p class="dim small">现在重写同一个问题。不要抄书，用自己的话。</p><textarea data-f="a2" data-id="'+id+'" placeholder="读完之后，我的回答是……">'+esc(st.a2)+'</textarea></div><button class="btn gold" data-act="step" data-id="'+id+'" data-to="4">下一步：和书的回答对照</button>';
  }else if(step===4){
    var chk=st.r||[],n=p.rubric.filter(function(_,i){return chk[i]}).length,r=n/p.rubric.length,t=tier(r);
    h+='<div class="row" style="align-items:stretch"><div class="card" style="flex:1;min-width:240px"><div class="dim small">你的第一次回答</div><div>'+(st.a1?esc(st.a1).replace(/\n/g,'<br>'):'<span class="dim">（没写）</span>')+'</div></div><div class="card" style="flex:1;min-width:240px"><div class="dim small">你的第二次回答</div><div>'+(st.a2?esc(st.a2).replace(/\n/g,'<br>'):'<span class="dim">（没写）</span>')+'</div></div></div>';
    h+='<div class="card"><b>书的回答</b><p>'+esc(p.answer)+'</p><details><summary>原文依据（'+p.ev.length+' 处）</summary>'+p.ev.map(evHtml).join('')+'</details></div>';
    h+='<div class="card"><b>自我核对</b><p class="dim small">对照上面的回答，你的第二次回答里有没有这些要点？诚实地勾。</p>';
    p.rubric.forEach(function(x,i){h+='<label class="chk"><input type="checkbox" data-act="rub" data-id="'+id+'" data-i="'+i+'"'+(chk[i]?' checked':'')+'><span>'+esc(x)+'</span></label>'});
    h+='<p><span class="tag '+t[0]+'">'+t[1]+'</span> '+(r>=0.8?'你的回答和书的要点对上了。':(r>=0.5?'大体在路上，对照没勾的要点补一补。':'先回到下面几节再读一遍，然后改写第二次回答。'))+'</p>';
    if(r<0.5)h+='<div class="small">'+p.anchors.filter(function(a){return a.role==='主读'}).map(function(a){return '<a href="'+esc(href(a.c))+'" target="_blank" rel="noopener">'+esc(chLabel(a.c))+'</a>'}).join(' · ')+'</div>';
    h+='</div><div class="card"><b>三个容易踩的想法，你有没有中过招？</b>';
    p.misreadings.forEach(function(m){h+='<div style="margin:.6rem 0"><span class="tag bad">常见想法</span>'+esc(m.m)+'<div class="dim small" style="margin-left:.2rem">书怎么说：'+esc(m.fix)+'</div></div>'});
    h+='</div><div class="row"><a class="btn" href="#/p/'+id+'/3">回去改第二次回答</a><button class="btn gold" data-act="step" data-id="'+id+'" data-to="5">下一步：用到自己身上</button></div>';
  }else{
    h+='<div class="card"><b>第五步：迁移。</b><p>'+esc(p.transfer)+'</p><textarea data-f="t" data-id="'+id+'" placeholder="写几句，越具体越好">'+esc(st.t)+'</textarea></div>';
    if(st.done){
      var nx=nextProblem();
      h+='<p><span class="tag ok">已点亮</span> '+(nx?'下一个建议：<a href="#/p/'+nx.id+'">'+esc(nx.id+' '+nx.title)+'</a>':'十个难题全部点亮了，去<a href="#/final">结业</a>。')+'</p>';
    }else{
      h+='<button class="btn gold" data-act="light" data-id="'+id+'">点亮这个难题</button> <span class="dim small">至少写 10 个字</span>';
    }
  }
  return h;
}

/* ---------- quiz ---------- */
function startQuiz(type,id){
  var src=type==='ch'?CH[id]:PT[id];
  Q={type:type,id:id,list:src.quiz.slice(),i:0,res:[],ans:null,say:{},fixSelf:null};
}
function qTitle(){return Q.type==='ch'?('第'+CH[Q.id].n+'章 '+CH[Q.id].title):PT[Q.id].title+' · 编测'}
function vQuiz(type,id){
  if(!Q||Q.type!==type||Q.id!==id)startQuiz(type,id);
  if(Q.i>=Q.list.length)return vResult();
  var q=Q.list[Q.i],k=Q.i+1,tot=Q.list.length;
  var care=(Q.type==='ch'&&CH[Q.id].care)?'<div class="card" style="border-color:var(--gold)">'+esc(CH[Q.id].care)+'</div>':'';
  var h=care+'<div class="dim small"><a href="#/">学习首页</a> › '+esc(qTitle())+'</div><div class="prog"><i style="width:'+Math.round((k-1)/tot*100)+'%"></i></div><div class="dim small">第 '+k+' / '+tot+' 题 · '+({mc:'选择',fix:'判断改错',say:'大白话复述'}[q.t])+'</div>';
  h+='<h3 style="font-size:1.12rem">'+esc(q.q)+'</h3>';
  if(q.t==='mc'){
    q.o.forEach(function(o,i){
      var cls='',dis='';
      if(Q.ans!==null){dis=' disabled';if(i===q.a)cls=' right';else if(i===Q.ans)cls=' wrong'}
      h+='<button class="opt'+cls+'" data-act="ans" data-i="'+i+'"'+dis+'>'+'ABCD'[i]+'．'+esc(o)+'</button>';
    });
    if(Q.ans!==null){
      var ok=Q.ans===q.a;
      h+='<div class="card"><span class="tag '+(ok?'ok':'bad')+'">'+(ok?'答对了':'再想想')+'</span> '+esc(q.why);
      if(!ok)h+='<div class="dim small" style="margin-top:.5rem">这个选项踩的常见想法：'+esc(q.misread)+'</div>';
      h+=evHtml(q.ev)+'</div><button class="btn gold" data-act="next">'+(k<tot?'下一题':'看结果')+'</button>';
    }
  }else if(q.t==='fix'){
    if(!Q.reveal){
      h+='<p class="dim small">这句话里有一处错。先想一想错在哪，再点“看答案”。</p><button class="btn gold" data-act="reveal">看答案</button>';
    }else{
      h+='<div class="card"><div class="dim small">改正后</div>'+esc(q.a)+'<div style="margin-top:.5rem">'+esc(q.why)+'</div>'+evHtml(q.ev)+'</div>';
      if(Q.fixSelf===null)h+='<div class="row"><span>你自己找对了吗？</span><button class="btn" data-act="self" data-v="1">找对了</button><button class="btn" data-act="self" data-v="0">没找对</button></div>';
      else h+='<button class="btn gold" data-act="next">'+(k<tot?'下一题':'看结果')+'</button>';
    }
  }else{
    if(!Q.reveal){
      h+='<textarea data-sayf="1" placeholder="用大白话写几句，不用术语"></textarea><p class="dim small">写完再看要点，核对自己讲到了几条。</p><button class="btn gold" data-act="reveal">看要点</button>';
    }else{
      h+='<div class="card"><div class="dim small">你的复述</div><div>'+(Q.sayTxt?esc(Q.sayTxt).replace(/\n/g,'<br>'):'<span class="dim">（没写）</span>')+'</div></div><div class="card"><b>要点，你讲到了几条？</b>';
      q.points.forEach(function(x,i){h+='<label class="chk"><input type="checkbox" data-act="sp" data-i="'+i+'"'+(Q.say[i]?' checked':'')+'><span>'+esc(x)+'</span></label>'});
      h+=evHtml(q.ev)+'</div><button class="btn gold" data-act="next">'+(k<tot?'下一题':'看结果')+'</button>';
    }
  }
  return h;
}
function vResult(){
  var n=Q.res.length,sum=0,miss=[],seen={};
  Q.res.forEach(function(x){sum+=x.s;if(x.s<1&&!seen[x.c]){seen[x.c]=1;miss.push(x.c)}});
  var r=sum/n,t=tier(r),rec={r:r,at:today()};
  var prev=(Q.type==='ch'?S.c:S.t)[Q.id];
  if(!prev||r>=prev.r)(Q.type==='ch'?S.c:S.t)[Q.id]=rec;
  if(Q.type==='ch')ensureCards(Q.id);
  save();
  var h='<div class="dim small"><a href="#/">学习首页</a> › '+esc(qTitle())+'</div><h1><span class="tag '+t[0]+'" style="font-size:1rem">'+t[1]+'</span></h1>';
  h+='<p>'+(r>=0.8?'这一部分你站住了。':(r>=0.5?'这一部分读懂了一半，下面几处值得回头看一眼。':'这一部分还没读透，建议先回头读下面几节，再来一遍。'))+'</p>';
  if(miss.length){h+='<div class="card"><b>回头读哪节</b>';miss.forEach(function(c){h+='<div>· <a href="'+esc(href(c))+'" target="_blank" rel="noopener">'+esc(chLabel(c))+'</a></div>'});h+='</div>'}
  if(Q.type==='ch')h+='<p class="dim small">本章 '+CH[Q.id].cards.length+' 张闪卡已加入复习，会按 1、3、7、21 天的间隔提醒你。</p>';
  var cid=Q.id,ty=Q.type;
  h+='<div class="row"><button class="btn" data-act="again" data-ty="'+ty+'" data-id="'+cid+'">再做一遍</button>';
  if(ty==='ch'){var nxt=L.chapters[CH[cid].n];if(nxt)h+='<a class="btn gold" href="#/q/ch/'+nxt.id+'">下一章章测</a>'}
  h+='<a class="btn" href="#/">回首页</a></div>';
  return h;
}

/* ---------- cards ---------- */
var CD=null;
function vCards(){
  var due=dueCards();
  if(!CD){CD={list:due,i:0,flip:false}}
  if(!CD.list.length)return '<div class="dim small"><a href="#/">学习首页</a></div><h1>复习卡</h1><div class="card">今天没有到期的卡。做完章测，那一章的卡就会进来。</div>';
  if(CD.i>=CD.list.length){var n=CD.list.length;CD=null;return '<div class="dim small"><a href="#/">学习首页</a></div><h1>今天的卡复习完了</h1><p class="dim">'+n+' 张。忘了的卡明天还会再来。</p><a class="btn gold" href="#/">回首页</a>'}
  var c=CD.list[CD.i];
  var h='<div class="dim small"><a href="#/">学习首页</a> › 复习卡</div><div class="prog"><i style="width:'+Math.round(CD.i/CD.list.length*100)+'%"></i></div><div class="dim small">'+(CD.i+1)+' / '+CD.list.length+' · 第'+c.ch.n+'章 '+esc(c.ch.title)+'</div>';
  h+='<div class="card flip">'+esc(CD.flip?c.cd.b:c.cd.f)+'</div>';
  if(!CD.flip)h+='<button class="btn gold" data-act="flip">翻面</button>';
  else h+=evHtml(c.cd.ev)+'<div class="row"><button class="btn" data-act="cardr" data-v="0">忘了</button><button class="btn gold" data-act="cardr" data-v="1">记得</button></div>';
  return h;
}

/* ---------- final ---------- */
function fst(i){S.f['q'+i]=S.f['q'+i]||{a:'',r:[],done:false};return S.f['q'+i]}
function vFinal(){
  var lit=litCount(),h='<div class="dim small"><a href="#/">学习首页</a></div><h1>全书结业</h1>';
  h+='<div class="card"><div>'+(lit===L.problems.length?'<span class="tag ok">已完成</span>':'<span class="tag warn">未完成</span>')+'十个难题已点亮：'+lit+' / '+L.problems.length+'</div></div>';
  var allOpen=true;
  L.final.open.forEach(function(o,i){
    var s=fst(i),n=o.rubric.filter(function(_,j){return s.r[j]}).length,okq=(n>=Math.ceil(o.rubric.length/2))&&s.a.replace(/\s/g,'').length>=20;
    if(!okq)allOpen=false;
    h+='<div class="card"><b>开放题 '+(i+1)+'</b><p>'+esc(o.q)+'</p><textarea data-ff="'+i+'" placeholder="写你的回答（至少 20 个字）">'+esc(s.a)+'</textarea>';
    h+='<details'+(s.show?' open':'')+'><summary data-act="fshow" data-i="'+i+'">对照要点</summary>';
    if(s.show){o.rubric.forEach(function(x,j){h+='<label class="chk"><input type="checkbox" data-act="frub" data-i="'+i+'" data-j="'+j+'"'+(s.r[j]?' checked':'')+'><span>'+esc(x)+'</span></label>'});h+=o.ev.map(evHtml).join('')}
    h+='</details>'+(okq?'<span class="tag ok">通过</span>':'<span class="dim small">写够 20 字并勾中至少一半要点，算通过。</span>')+'</div>';
  });
  var all=lit===L.problems.length&&allOpen;
  if(all){
    h+='<div class="cert"><div class="dim">德麦国际 · 专著学习系统</div><h2>结业</h2><p>已完成《'+esc(L.book.title)+'》的学习：十个难题全部点亮，开放题通过。</p><p class="dim small">全书一句话：'+esc(L.book.thesis)+'</p><div style="max-width:18rem;margin:1rem auto"><input type="text" id="who" placeholder="你的名字（只存在这台设备）" value="'+esc(S.who||'')+'"></div><div class="dim small">'+today()+'</div></div><div class="row noprint"><button class="btn gold" data-act="print">打印 / 存为 PDF</button></div>';
  }else h+='<p class="dim">完成以上条件后，这里会出现结业页。</p>';
  return h;
}

/* ---------- router ---------- */
function render(){
  var app=document.getElementById('app'),hs=location.hash||'#/',m,h;
  window.scrollTo(0,0);
  if(!/^#\/q\//.test(hs))Q=null;
  if(hs.indexOf('#/cards')!==0)CD=null;
  if(m=hs.match(/^#\/p\/(P\d+)/))h=vProblem(m[1]);
  else if(m=hs.match(/^#\/q\/(ch|part)\/(\w+)/)){if(!(m[1]==='ch'?CH[m[2]]:PT[m[2]])){h='<p>没有这一章。</p>'}else h=vQuiz(m[1],m[2])}
  else if(hs.indexOf('#/cards')===0)h=vCards();
  else if(hs.indexOf('#/final')===0)h=vFinal();
  else if(hs.indexOf('#/intake')===0)h=vIntake();
  else h=vHome();
  app.innerHTML=h;
}
function rerender(){var y=window.scrollY;var app=document.getElementById('app');var hs=location.hash||'#/',m;
  if(m=hs.match(/^#\/p\/(P\d+)/))app.innerHTML=vProblem(m[1]);
  else if(m=hs.match(/^#\/q\/(ch|part)\/(\w+)/))app.innerHTML=vQuiz(m[1],m[2]);
  else if(hs.indexOf('#/cards')===0)app.innerHTML=vCards();
  else if(hs.indexOf('#/final')===0)app.innerHTML=vFinal();
  else if(hs.indexOf('#/intake')===0)app.innerHTML=vIntake();
  else app.innerHTML=vHome();
  window.scrollTo(0,y)}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a==='step'){var p=pst(id),to=+el.getAttribute('data-to');if(to>p.s)p.s=to;save();location.hash='#/p/'+id+'/'+to;render()}
  else if(a==='read'){pst(id).read[el.getAttribute('data-c')]=el.checked;save()}
  else if(a==='rub'){pst(id).r[+el.getAttribute('data-i')]=el.checked;save();rerender()}
  else if(a==='light'){var p2=pst(id);if(p2.t.replace(/\s/g,'').length<10){toast('再多写几个字，至少 10 个');return}p2.done=true;p2.s=5;save();rerender();toast('已点亮：'+id)}
  else if(a==='pick'){S.i.pick=S.i.pick||{};S.i.pick[el.getAttribute('data-q')]=+el.getAttribute('data-i');save()}
  else if(a==='intakeDone'){
    var pk=S.i.pick||{},qs=L.intake.questions,start=null,pace=null;
    qs.forEach(function(q){var i=pk[q.id];if(i==null)return;var o=q.opts[i];if(o.start&&!start&&q.id==='why')start=o.start;if(o.start&&!start)start=o.start;if(o.pace)pace=o.pace});
    S.i.done=true;S.i.start=start||'P1';S.i.pace=pace||'';save();location.hash='#/';render()}
  else if(a==='ans'){if(Q.ans!==null)return;var q=Q.list[Q.i];Q.ans=+el.getAttribute('data-i');rerender()}
  else if(a==='reveal'){var ta=document.querySelector('[data-sayf]');if(ta)Q.sayTxt=ta.value;Q.reveal=true;rerender()}
  else if(a==='self'){Q.fixSelf=+el.getAttribute('data-v');rerender()}
  else if(a==='sp'){Q.say[+el.getAttribute('data-i')]=el.checked}
  else if(a==='next'){
    var qq=Q.list[Q.i],s=0;
    if(qq.t==='mc')s=(Q.ans===qq.a)?1:0;
    else if(qq.t==='fix')s=Q.fixSelf?1:0;
    else{var c=0;qq.points.forEach(function(_,i){if(Q.say[i])c++});s=(c/qq.points.length)>=0.5?1:0}
    Q.res.push({s:s,c:qq.ev.c});Q.i++;Q.ans=null;Q.reveal=false;Q.fixSelf=null;Q.say={};Q.sayTxt='';
    rerender();window.scrollTo(0,0)}
  else if(a==='again'){startQuiz(el.getAttribute('data-ty'),el.getAttribute('data-id'));rerender()}
  else if(a==='flip'){CD.flip=true;rerender()}
  else if(a==='cardr'){
    var c2=CD.list[CD.i],k=S.k[c2.key],v=el.getAttribute('data-v')==='1';
    if(v){k.b=Math.min(k.b+1,BOX.length-1);k.due=addDays(BOX[k.b])}else{k.b=0;k.due=addDays(1)}
    save();CD.i++;CD.flip=false;rerender()}
  else if(a==='fshow'){e.preventDefault();var f=fst(+el.getAttribute('data-i'));f.show=!f.show;save();rerender()}
  else if(a==='frub'){fst(+el.getAttribute('data-i')).r[+el.getAttribute('data-j')]=el.checked;save();rerender()}
  else if(a==='print'){window.print()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-f')){pst(t.getAttribute('data-id'))[t.getAttribute('data-f')]=t.value;save()}
  else if(t.hasAttribute('data-ff')){fst(+t.getAttribute('data-ff')).a=t.value;save()}
  else if(t.hasAttribute('data-sayf')){Q.sayTxt=t.value}
  else if(t.id==='who'){S.who=t.value;save()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute('data-ff')){rerender()}
});
window.addEventListener('hashchange',render);
document.getElementById('exp').onclick=function(){
  var b=new Blob([JSON.stringify({no:NO,exported:today(),data:S})],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='learn-'+NO+'-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()};
document.getElementById('imp').onclick=function(){document.getElementById('impf').click()};
document.getElementById('impf').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);if(!j||j.no!==NO||typeof j.data!=='object')throw 0;S=j.data;norm();save();render();toast('进度已导入')}catch(x){toast('这不是这本书的进度文件')}};
  r.readAsText(f)};

/* ---------- boot ---------- */
document.getElementById('back').href='/books/m/'+NO+'/';
fetch('/books/m/'+NO+'/learn.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  L=d;S=lsGet();norm();
  L.chapters.forEach(function(c){CH[c.id]=c});L.parts.forEach(function(p){PT[p.id]=p});L.problems.forEach(function(p){PR[p.id]=p});
  document.title='学习 · '+L.book.title+' · 德麦国际';
  render();
}).catch(function(){document.getElementById('app').innerHTML='<h1>这本书还没有学习包</h1><p class="dim">学习系统正在逐本上线。你可以先去<a href="/books/m/'+NO+'/">读这本书</a>。</p>'});
})();
</script>
