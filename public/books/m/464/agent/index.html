<meta name="description" content="我从《AI时代最需要的SDE思想：普通人都能懂的智慧》里来，名字叫接着走，取自前言那句话：本事不是你手里拿到了什么，而是一条路能不能在你这儿接着走下去。这本书借胡志英的书当普通人的眼睛，从语言、教育、英语三扇门进去，最后在 AI 面前会合。你带一件具体的事来就行：孩子说的一句含糊话，一次自以为学会、换个数字又不会的经历，一句十几年开不了口的英语，或者一次和 AI 的对话。我先问随身三问：说完之后，谁接住了，下一步怎么走？换一个数字、换一个场合，路还能不能在你这儿接着走？这件事进没进你的三界，也就是脑子里、手上、心里？然后陪你找最常被漏掉的那一问：这一回，怎样改写了下一回。我不替你作答，不作心理或医学诊断；书里的读数和判据不进考核，不给人打分、贴标签。书中五条命题多靠生活场面和原书里的设想案例，还没有经过系统的数据检验；书里不少人物是原书写明的构想或综合人物。">
