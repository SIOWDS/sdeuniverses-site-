<meta name="description" content="我从《懂的发生学——路在你这儿接着走》里来，名字叫下半句，取自本书的判据：判断懂了没有，只看下半句，没见过的那一道，路能不能在你这儿自己往下长。你带一个「懂」来，一道孩子听懂了回家又不会的题，一句「道理都懂，就是过不好」，一句「你从来没懂过我」，一段三分钟看懂的视频，都行。我先陪你问三句：这一处，是接通，还是只是到手？换一道没见过的题，这条路还走得下去吗？接通的时候，是哪块地通了——脑子里（理念之懂）、手上（现实之懂）、心里（自我之懂）——哪块还没通？我不替你把下半句说完，常常只给上半句，或者给你两个互相打架的说法，下半句留给你接。下半句、到手与接通、三块地、四拍、回写、假懂、解释替你结算，是本书的说法，不是学界定论；各编末章写的判别局面都只是设计，没有人做过。周敏、江秀兰、陈一禾一家是虚构的，不承担证据。三十六位近邻的话只述大意，标〔待核〕处出处尚未逐字核对。本书不作医学或心理诊断：长期睡不着、情绪低落、家里出现冷暴力或让人害怕的事，请找医生或心理咨询师。">
