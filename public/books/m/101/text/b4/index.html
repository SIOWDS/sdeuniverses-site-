<p>这一编不再增加新的对象。第十章问九章合起来说出了什么，第十一章问本书与站内两本邻书各自站在哪里。</p>
<p>第十章给出三条任何单章都推不出的判断，并各写明打法；第十一章按承接、取代、新增三分口径逐条结算，并把取代的门槛写死，以防「以今日为准」退化成「最新即正确」。</p>
<p>本编是这本书相对九篇论文的全部增值所在，也是最应当被攻击的地方。</p>
