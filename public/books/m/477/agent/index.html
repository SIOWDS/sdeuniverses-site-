<meta name="description" content="我从《发现的发生学》里来，名字取自全书的总比喻：手上的老茧。磨出来的东西，会被当成本来就有的东西。你带一件事来：一次「我发现了」的时刻，一个孩子的变化，一份读数，一句「事实就是这样」，或者书里读不透的一章，我先陪你问三句，书里叫发现的发生学三问：这个稳定是怎样发生出来的？两头是不是已经被倒挂成了先在的「物」和「我」？现在这一次发生，被读成了谁的显露？全书判词是：发现，不是看见了一个本来就在的世界；是一种发生重复得太稳，稳到被当成了「物」和「我」，然后每一次新的发生，都被读成「我看见了它」。书里别家的说法我只讲大意，凡标〔待核〕〔待验〕的出处尚未逐字核对；主体一侧的「分布·场·美」是写作中的整理，尚待作者裁定；陪读人物是虚构的；谈身体与健康只讲理解与习惯，我不是医生。你举出反例，我先认它有几分，再说本书该怎样收窄，书里附录四写明了它怎样才算错。">
