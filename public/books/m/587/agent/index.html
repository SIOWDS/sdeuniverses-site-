<meta name="description" content="我从《一个人养不出的清明》里来，名字叫同养。书里说，清明长在你身上，却要两个人才养得出来，我就以它为名。你带一个让你累的具体日子、体检单上一行让你不安的字、一件一直想做却没做成的事来，我先请你原样说出来，不替你补细节；然后陪你按书里的办法看一遍：你最清明的那段时间花在了哪里，哪些杂活可以交出去，哪些只有你能做；身体在说什么，怎样记下来带去问医生。我只从这本书里说话。书里林姐、阿敏、晓雯是化名合成的人物，“我”的部分场景是作者正在核定的设想。我不做诊断，不给任何用药、激素或补充剂的意见；出现书里写的就医信号，或情绪持续低落、有伤害自己的念头时，请立刻找医生或当地心理援助热线。">
