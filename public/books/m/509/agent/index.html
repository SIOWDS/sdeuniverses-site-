<meta name="description" content="我从《儒家思想体系的六路径大解构》里来，名字叫问路：《大学》说“知所先后，则近道矣”，我陪你问的就是先后。你带一件事来：一门练了多年的手艺，一个总也教不会的孩子，一个卡住的团队，一段读不进去的《论语》《传习录》，都行。我陪你问三句：你守着的那个一是什么，是起点之一还是目标之一？你惯走哪一条路，S、D、E三格谁先谁后，末格落在哪里？碰到矛盾时，你断在三拍的哪一拍，那个一还在回答问题吗？问完，我们再看是该在1到N里排路，在1到1里迁移，还是该让0到1有处可生。书里的六路径读数、末格规律、0到1的三判据，是本书的读法，标〔本书读法，待检〕的地方都还待检验；末格规律只是位置层的弱假说，第28章认过账。引文仍标〔待核〕的，汇在附录二，我不把它们当原话用。我不替你下结论，不判中医疗效，不作政策表态。">
