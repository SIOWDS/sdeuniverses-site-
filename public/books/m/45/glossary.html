<script>
const TERMS = [{"term": "天", "def": "全书底盘，也是最大的 S。经董仲舒重铸，\"天\"从西周的至上神（一个管辖有限的最高管理者）升格为\"万物之祖\"的发生本源。它在系统中一名两用：既是十端之首（一个部件），又是十端之全（系统总名）。定位：结构显露态 S 的顶层——它是整座意义大厦得以显露、得以命名、得以挂载的那块承重底盘。出处：《为人者天》《郊义》《顺命》《官制象天》十端说。装配含义：把\"1\"安放在天的位置，等于把合法性的根据放到任何王朝都搬不走、也陪葬不起的地方。", "group": "董学核心概念"}, {"term": "元", "def": "\"元者，始也\"（《春秋繁露·王道》、公羊义）。董仲舒把《春秋》开篇\"元年\"之\"元\"读作\"万物之始\"，使一部编年史获得宇宙论开端的分量。定位：S 的时间原点——它规定了整个显露序列从哪里起算。装配含义：给底盘装上\"零公里标\"，此后一切正朔、改制、受命都从这一点度量。", "group": "董学核心概念"}, {"term": "一（大一统）", "def": "\"《春秋》大一统者，天地之常经，古今之通谊也\"（《汉书·董仲舒传》引对策）。此处的\"一\"不是版图之一，而是本体之一：天下万事必须归于同一个根据。定位：贯穿 S·D·E 的母题本身——它既是显露的目标（S 要统于一），也是差异被允许展开的边界（D 不得溢出一），还是纠缠得以稳定的锚点（E 万象共绕一\"天\"）。装配含义：这是全书那句反直觉判断的技术表述——\"1\"一旦锁定在天，实例可换而内核不动。", "group": "董学核心概念"}, {"term": "名", "def": "\"名生于真，非其真弗以为名\"（《深察名号》）。名不是随意的标签，而是\"圣人所发天意\"的立法行为。定位：S 的符号层——名把混沌的差异切分为可指认、可裁断的显露单元；深察名号即是给系统写\"符号表\"。装配含义：命名即立法，谁掌握定名权，谁就掌握是非的度量衡；符号表上最深的一个空位，正为\"性\"之定名预留。", "group": "董学核心概念"}, {"term": "性", "def": "\"性者，天质之朴也；善者，王教之化也\"（《实性》）。\"性如禾，善如米\"（《深察名号》《实性》）——禾未必成米，性未必成善。定位：E 与 D 的交界处的原料——性是待加工的特征原料（E 侧），善是经王教这道工序（D 侧）产出的成品。装配含义：正因禾不自成米，王权（那道加工工序）才在本体论上成为必要——性论不是伦理插曲，而是王权必要性的推导前件。", "group": "董学核心概念"}, {"term": "王", "def": "\"古之造文者，三画而连其中谓之王。三画者，天地与人也；而连其中者，通其道也。取天地与人之中以为贯而参通之，非王者孰能当是\"（《王道通三》）。定位：S 中的一个接口（interface），而非顶点。\"王\"是连通天—地—人三画的那一竖，功率来自信道，不来自节点。装配含义：接口可以更换（此王去、彼王来），底盘不动——这正是\"倒掉的是天子、不是天\"的字形学证据。", "group": "董学核心概念"}, {"term": "副（人副天数）", "def": "\"为生不能为人，为人者天也……人之（形体）化天数而成\"（《为人者天》《人副天数》）。人在形体、性情、四肢百节上\"副\"天之数，是天的一个副本。定位：E 的耦合机制——它把\"人\"这一部件与\"天\"这块底盘焊接起来，使天意可以沿\"同类相动\"的信道传导到人身。装配含义：副本宇宙论是全书最尴尬也最承重的一道焊缝；焊缝的材料缺陷（比附的任意性）本书如实记录，但焊缝的功能——让抽象的天可被人身感知——不可或缺。", "group": "董学核心概念"}, {"term": "阴阳", "def": "\"阳尊阴卑\"（《阳尊阴卑》《基义》）；\"天道之常，一阴一阳\"（《阴阳义》）。定位：D 的编译规则——阴阳不是两种实体，而是把一切关系编译为\"主/辅\"的一套语法。装配含义：三纲（君臣、父子、夫妻）正是阳尊阴卑这条语法编译出的产物；一旦写进宇宙，便\"拆宇宙才能改\"。", "group": "董学核心概念"}, {"term": "五行", "def": "\"比相生而间相胜\"（《五行相生》《五行之义》）；\"土居中央……土者，五行之主也\"（《五行之义》）。定位：D 的运行时系统——相生排出部门供养的次序（序），相胜预装部门相互纠察的线（衡），顺逆为合规监控，变救为异常处理。装配含义：把一套看似迷信的配伍，读作国家机器的调度—监控—容错规程。", "group": "董学核心概念"}, {"term": "四时", "def": "\"庆赏罚刑，与春夏秋冬，以类相应也\"（《四时之副》《天辨在人》）。定位：D 的时间调度表——把政令的四种基本动作绑定到四季，使治理具有天然节律。装配含义：时间也要被立法；代价是政府与农时天象锁死，弹性被牺牲以换取正当性。", "group": "董学核心概念"}, {"term": "三统（三代改制质文）", "def": "\"王者必受命而后王……徙居处，更称号，改正朔，易服色\"（《三代改制质文》《楚庄王》）。定位：预装在底盘里的热更新接口——它规定了新王\"必须改的\"（正朔、服色、徽号）与\"绝不能动的\"（大纲、人伦、道理）。装配含义：宪法里写好的\"死亡与继承条款\"，使改朝换代成为受协议约束的版本更迭，而非系统崩溃。", "group": "董学核心概念"}, {"term": "灾异（灾异谴告）", "def": "\"国家将有失道之败，而天乃先出灾害以谴告之\"（《汉书·董仲舒传》《必仁且智》）。定位：E→S 的反馈信道——它给\"君权\"这个最高节点装上唯一一条自上而下的审计线。装配含义：中国由此发明了\"皇帝的检讨书\"；协议的漏洞在解释权——谁读天意，谁就握有审计权。", "group": "董学核心概念"}, {"term": "气／同类相动", "def": "\"气同则会，声比则应\"（《同类相动》）。定位：E 的传导介质——\"气\"是让天—人、类—类之间感应得以发生的物理担保。装配含义：没有\"气\"这条介质，\"人副天数\"的焊缝就是死焊；有了它，焊缝变成活的信道。", "group": "董学核心概念"}, {"term": "存在三态（混沌／介生／秩序）", "def": "全书隐含的状态本体论。秩序态：对象、环境、目标已稳定，可预测、调度、最优化；混沌态：旧对象、旧目标、旧规则共同失效，既有本体不再适用；介生态：新对象与新秩序尚未定型、候选本体并存与试验的发生空间。定位：三态是 S（结构显露）稳定程度的三个刻度——秩序态 S 高度显露且锁定，混沌态 S 崩解，介生态 S 正在重新显露。装配含义：董仲舒的总装把系统牢牢锁定在秩序态（第二十八章\"单1锁死\"），代价是丧失了进入混沌—介生—新秩序这一发生循环的能力。", "group": "发生学与总装隐喻"}, {"term": "母题", "def": "全书的脊梁判断，压缩为一句反直觉命题（\"倒掉的是天子，从来不是天\"）。定位：贯穿 S·D·E 的最高层显影——它是整部书所有分析共同\"绕\"的那个中心。装配含义：一部专著的成立，不在于罗列多少材料，而在于是否有一条母题把所有材料\"绕\"成一个不可拆散的整体；本书之为\"一本书\"而非\"一批文章\"，正因有此母题为轴。", "group": "发生学与总装隐喻"}, {"term": "显影", "def": "把一个一直存在、却未被看清的结构\"显影\"出来（如\"天子\"一词的接口构造、灾异说的审计协议构造）。定位：S 的认识论动作——显影不是发明新事物，而是让已在场的结构\"可见\"。装配含义：本书的方法本质上是\"读图\"与\"显影\"——它不给董学添加新内容，只把董学既有结构的装配逻辑显影出来。", "group": "发生学与总装隐喻"}, {"term": "反馈信道", "def": "系统中允许信息自下而上、或自外而内回传以纠错的通路（灾异谴告、谏诤、史鉴）。定位：E→S 的回写路径。装配含义：秦拆光了反馈信道（焚书、禁私学、以吏为师）故无刹车而速亡；董仲舒重装了一条（灾异谴告）故系统有了最低限度的自我纠错——反馈信道的有无，是\"有刹车\"与\"无刹车\"之别。", "group": "发生学与总装隐喻"}, {"term": "接口", "def": "系统中可被更换、而不影响底盘的功能位（\"王\"是天—地—人的接口，天子是 1 的挂载接口，春秋决狱是法家司法的伦理接口）。定位：S 中的可替换节点。装配含义：接口思维是全书的关键工具——把\"王/天子/王朝\"都读作接口而非本体，才能解释\"实例可换而内核不动\"。", "group": "发生学与总装隐喻"}, {"term": "编译／编译器", "def": "把一套底层语法（阴阳）自动转换为上层强制结构（三纲）的机制。定位：D 的生成规则。装配含义：伦理一旦成为编译产物，反对它就得先反对编译器（宇宙语法），强制力由此远超\"道德说教\"。", "group": "发生学与总装隐喻"}, {"term": "运行时系统", "def": "系统运行期间负责部门协作、制衡、合规、容错的机制（五行：相生—相胜—顺逆—变救）。定位：D 的执行层。装配含义：阴阳是内核语法（定主辅），五行是运行时（定协作与容错）——二者合成\"操作系统\"。", "group": "发生学与总装隐喻"}, {"term": "热更新", "def": "系统在不停机、不换底盘的前提下，允许被更新的受控机制（三统改制质文）。定位：D 中的受控变更协议。装配含义：把\"王朝更替\"从\"系统崩溃\"重定义为\"版本热更新\"，是内核不死的时间保证。", "group": "发生学与总装隐喻"}, {"term": "审计", "def": "对最高权力节点的合法性与行为进行外部核查的机制（灾异谴告）。定位：E→S 的监督回路。装配含义：审计协议是董仲舒最具宪制意义的发明，其漏洞（解释权）也是全书裂纹的源头。", "group": "发生学与总装隐喻"}, {"term": "封顶", "def": "系统因本体、符号、信道的三重锁定，而丧失继续向上发展之可能的状态（符号态封顶）。定位：S 的天花板。装配含义：封顶不是耻辱，是\"把 1 固定在天\"这一设计的必然上限——最好的天文数据也只能被读作天意告警，而非运动方程。", "group": "发生学与总装隐喻"}, {"term": "离散的 1", "def": "装配之前的状态：差异极丰富（百家并起）而缺乏能锚定差异的统一根据。定位：D 过剩而 S 缺位的发生学状态。装配含义：这是董仲舒总装的起点——正因\"1\"离散，才需要一次总装把它收拢为可运行的秩序；本书第一篇整篇诊断的，就是这个\"离散的 1\"。", "group": "发生学与总装隐喻"}, {"term": "实例／内核", "def": "全书最基础的一对区分。实例＝具体王朝（刘汉、李唐、赵宋、朱明），会腐败、会崩溃；内核＝1＝天这套合法性根据，被安放在实例触不到的位置。定位：内核属 S 的顶层（被锚定的根据），实例属 D 的层面（不断更迭的运行态）。装配含义：全书母题的技术表述——\"倒掉的是实例，从不是内核\"，即\"倒掉的是天子，从来不是天\"。", "group": "发生学与总装隐喻"}, {"term": "陪葬不起", "def": "内核被安放的位置所具有的性质：普遍到无处可逃、超越到无法被夺、可挂载到连造反者也要用它的语言。定位：S 顶层锚点的稳定性表征。装配含义：这三重性质，是\"1＝天\"方案得以自持两千年的全部秘密，也是它演化停滞的全部代价——稳定与停滞，同出一源。", "group": "发生学与总装隐喻"}, {"term": "读图", "def": "本书对自身工作的定位：不给董学添加新内容，只把董学既有结构的装配逻辑显影、读出。定位：S 的认识论动作（见\"显影\"条）。装配含义：本书自认是\"上一次总装的读图人\"，而非\"下一次总装的设计师\"——读懂图纸，是画下一份图纸的资格前提。", "group": "发生学与总装隐喻"}, {"term": "1＝发生", "def": "全书结语提出的、对董仲舒\"1＝天\"的根本反转：把\"一\"由一个被安放的固定锚点（名词），改读为差异被不断重新组织、结构被不断重新显露的持续过程（动词）。定位：贯穿 S·D·E 的动态母题——它主张稳定不必依赖某个不可动的锚点，而可依赖过程本身的持续再发生能力。装配含义：董仲舒把\"1\"固定在天，换来两千年的稳定与停滞；\"1＝发生\"则指向一种可能——把\"1\"设计为可持续再发生的，从而既保稳定、又不锁死第二引擎、第二符号表与第二土壤的生长空间。这是本书作为\"读图人\"，为\"下一次总装\"留下的唯一一条、也是最要紧的一条规格建议：不要再把一焊死在某处，而要让一持续地发生。", "group": "发生学与总装隐喻"}, {"term": "天志／天意", "def": "天所具有的意向与好恶（\"天，仁也\"；天\"任德不任刑\"）。定位：E 中被读取的价值信号——它是灾异审计协议的\"判据来源\"。装配含义：天意必须\"可读取\"（沉淀于《春秋》史事，可检索），否则审计无据；而\"谁来读天意\"的解释权问题，正是协议的裂纹。", "group": "董学核心概念"}, {"term": "正（正朔）", "def": "岁首与时间起算的确定权（\"王正月\"\"改正朔\"）。定位：S 的时间主权标记。装配含义：掌握\"正朔\"即掌握帝国的行动节律与时间主权；改正朔是新王受命的头等仪式（热更新协议的第一步）。", "group": "董学核心概念"}, {"term": "质文", "def": "王朝更替中\"尚质\"与\"尚文\"的交替规律（三统改制之一维）。定位：D 中的受控变更参数。装配含义：质文交替给\"变\"划定了合法轨道——变的是质文之尚，不变的是大纲人伦，是热更新协议的具体档位。", "group": "董学核心概念"}, {"term": "谶纬", "def": "两汉以降由天人感应粗糙化、神秘化而生的预言之学。定位：E 的退化产物——它是\"人副天数\"\"同类相动\"信道在失去约束后的畸变。装配含义：本书对谶纬取古史辨式的祛魅立场（第七、二十七章\"照录材料缺陷\"），视其为符号态封顶的病征之一，而非董学的承重部分。", "group": "董学核心概念"}, {"term": "道统", "def": "儒家关于\"道\"之传承谱系的建构（孔—孟—…—程朱）。定位：S 的合法性叙事。装配含义：道统是一套\"谁合法继承了内核\"的话语；理学把董仲舒逐出道统（第二十六章），正是以\"抹去继承对象\"来确立自身原创性的操作——恰反证了结构上的全盘继承。", "group": "董学核心概念"}];
const listEl=document.getElementById('list'), qEl=document.getElementById('q'), countEl=document.getElementById('count');
let curG='all', curQ='';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hi(s,q){ if(!q)return esc(s); const i=s.toLowerCase().indexOf(q.toLowerCase()); if(i<0)return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); }
function sdeMark(s){ return s.replace(/定位：/g,'<span class="sde">定位：</span>').replace(/装配含义：/g,'<span class="sde">装配含义：</span>'); }
function render(){
  const q=curQ.trim().toLowerCase();
  let shown=0, out='', lastG='';
  const groups=['董学核心概念','发生学与总装隐喻'];
  for(const g of groups){
    if(curG!=='all' && curG!==g) continue;
    const items=TERMS.filter(t=>t.group===g && (curG==='all'||t.group===curG) && (!q || t.term.toLowerCase().includes(q) || t.def.toLowerCase().includes(q)));
    if(!items.length) continue;
    out+='<div class="grp-label">'+(g==='董学核心概念'?'一 · 董学核心概念':'二 · 发生学与总装隐喻')+'</div>';
    for(const t of items){
      shown++;
      out+='<div class="term"><div class="t">〔'+hi(t.term,q)+'〕</div><div class="d">'+sdeMark(hi(t.def,q))+'</div></div>';
    }
  }
  listEl.innerHTML = shown? out : '<div class="empty">没有匹配的词条。试试「天」「灾异」「接口」「S」。</div>';
  countEl.textContent = shown+' / '+TERMS.length+' 词条';
}
qEl.addEventListener('input',e=>{curQ=e.target.value;render();});
document.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); curG=b.dataset.g; render();
}));
render();
</script>
