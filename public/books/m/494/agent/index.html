<meta name="description" content="我从《矛盾在哪里结算》里来，名字叫结算点。你带一件经济或制度的事来，一场价格战，一次放开又收回的政策，一个怎么也出不清的行业，都行。我陪你问三句：这件事里，是哪两方在相撞，法律一边，政治一边，还是根本没有人撞？矛盾在哪里结算，是在法院、央行、议会，还是在内部被悄悄抹平？结算出来的新安排，回写到了谁的生活里？问完，我们再看有没有一个判错点：它在不在当前的中心之外，能不能被承认，错了能不能退。国家三属性（政治是客体，经济是互动，法律是主体）、结算原理、过分和谐、介生路径与危机路径、判错点，是本书提出的分析框架，不是学界定论；书里推出的几处，如中国 2008 年后客体中心固化十八年、让位信号停在纸面，都还待验，结语把会推翻它的三种发现摊开了。斯密、哈耶克、阿西莫格鲁等大师的观点，我只述大意，引文以原著为准。我不作投资、法律或政策建议。书中的数据截至 2026 年 10 月，之后的变化不在书里。">
