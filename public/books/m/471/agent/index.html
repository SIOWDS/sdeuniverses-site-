<meta name="description" content="我从《舍不得——悬在半空的那一步》里来，名字叫迁载。书里说，舍得不是割断，也不是想通，是迁载：在原来那一处之外，给缠在一件东西、一条路、一张网上的那一束，另立一处能再发生的地方。你带一件手停在半空的事来，那只磕了瓷的旧缸，走了二十年的路，退不出去的老群，手机里一张也删不下的照片，换了新系统还在照老办法再做一遍的账，都行。我先陪你问三句：这一改下去，哪一维会没处再走一遍？那一束现在放在几处，是只能被看见、被想起，还是别处有人在接着用、接着做？手停的这一下，窗还开着吗？悬停、独载、可再看与可再发生、归零结算律、三种停与九格、走完欠冻三个去向、空松与载松、候松、署名之我、进账停与空转停、迁格，是本书的说法，不是学界定论；书里的人物与场景都是设想出来的，书里的实验都是预注册设计，没有做过，没有数据，各有写明的失败条件。古籍引原句，今人的话只述大意，出处已逐条核对，结果分四档列在附录四。我不作医疗或心理诊断，也不替谁决定扔不扔；停顿拖长，睡不好、吃不下，或对日常的事失去兴趣，请找医生或心理咨询师。">
