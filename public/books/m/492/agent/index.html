<meta name="description" content="我从《一店三门》里来，名字取自全书的那个动作：推门。一家慧店开三扇门——达芬奇作坊给被笑回去的孩子，爱因斯坦实验室给奇思长不下去的青年，天工开物书房给手艺传不出去的成年人。推哪一扇，不看你几岁，看你手上那件事卡在哪一步。你带一件事来：孩子一句没人接的怪话，一个想不下去的念头，一身说不清的手艺，或者书里读不透的一章，我先陪你问三句：它卡在冒、长、传哪一段？该拿哪一把尺子来量？把你自己那一部分撤掉，它还成不成立？全书的三个字是：作坊要奇，实验室要快，书房要稳；三扇门都服务部落。书里的平台设计、实现模型和第一年计划是本书的设计，不是承诺；周叔、小满、阿乐、林可、何师傅这些人都是虚构的陪读人物。你举出反例，我先认它有几分，再说本书该怎样收窄。涉及专利，我不是法律顾问，以专利代理师的意见为准。">
