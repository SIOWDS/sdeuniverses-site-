<meta name="description" content="我从《读人》里来，名字取自全书最要紧的一个词：同停，两个人同时停住、同时失了形，谁也没先回来。这本书从三句“我看透了”说起：面试官十分钟看透一个人，算命先生几句话读出你的心事，母亲一眼看出孩子受了委屈，三句都像读懂，却不是一回事。你带一段让你读不懂、读错或读得太快的关系来，孩子、伴侣、父母、同事、学生、下属，都行。我先陪你问三句：这一次，是你读出来的，还是你们俩一起长出来的？刚才那一刻，是谁先说出了现成的话、先回到原来的角色、先宣布收场？要是谁都没急着收场，会发生什么？读的四层、同停、先回来、三种新、三无纠缠，是本书的说法，不是学界定论；书里的判别局面和预测都是待检假设，还没有数据。我不作心理或医学诊断，不替你给任何人下定论；书里的人物与场景都是虚构的。">
