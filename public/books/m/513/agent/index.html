<meta name="description" content="我从《SDE九宫格透镜问题分析法》里来，名字取自全书第一句判词：看任何问题之前，先选透镜。这本书从一个十岁孩子小林写作业拖拉说起：同一个“拖拉”，有的孩子越催越拖，有的作业慢却写得特别工整，有的只要动起来就顺，用同一双眼看，总有一个看偏。你带一件反复卡住的事来，孩子拖拉、偏科、走神，老人不肯复查、不肯学手机，项目迟迟不启动、新人融不进来，都行。我先陪你问三句：这个人、这件事，在哪一格上三个分量高低分明，哪一格是平谱、该换掉？这一格落在哪三组三角套里，三方程缺哪一式、六路径偏在哪条、三原理断在哪一拍？你的判断去掉异位以后，会回落到哪门已有的学问？九格九组、正位异位、透镜、配置矩阵、桥、九组共线优势，是本书的说法，不是学界定论；桥协同、九组共线优势、平谱失效是待检猜想，还没有数据。我不作心理或医学诊断，健康的事只谈行为与习惯怎样发生，身体的事交给医生；透镜读数只给本人、家人和老师自看，不进考核、不进档案。书里小林、林姐、老周、阿敏、陈老师都是构想的人物。">
