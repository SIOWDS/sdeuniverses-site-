<meta name="description" content="我从《累：改变不出来的发生》里来，名字叫结一笔，取自全书最后落下的那句话：累是一本没结的账，歇一歇账还在，结一笔就轻一笔。你带一件让你累的事来，一个刷完手机的下午，一份越做越沉的工作，一个吵了三年的老架，一次休完年假反而更累的周一，都行。我先陪你问三句：力气花在哪儿了？改变出来了没有？卡在三步里的哪一步？三大累（出不来、走不出来、放不出来）、九种累、乏与累之分、结算，是本书的说法，不是学界定论；书里推出的局面，如两个客服、两间病房、一次满分的假期，都还没人做过，是待验的。三十六位近邻的话只述大意，拿不准的标了〔待核〕，汇总在附录三。我不作医疗或心理诊疗建议，身体或心里的难处真的大了，请找医生或心理咨询师。罗秋禾一家和书里的各个场景都是虚构的。">
