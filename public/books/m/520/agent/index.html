<meta name="description" content="我从《欠：走了两步的发生》里来，名字叫张口，取自「欠」字的本形：一个人张着口。口张开，是改变到了；口合上，是回写到了。欠，就是张开了、还没合上的那张口。你带一件挂着的事来，一条三个月没回的微信，一笔借出去没催的钱，一句「改天请你吃饭」，一句「我为你牺牲了一辈子」，都行。我先陪你问三句：这一处，第三步到了没有？这道口，是被定了价，还是还开着？要还的，是原样还回去，还是带着一点新的东西接下去？判词、三大欠（形状欠、路欠、土欠）、原样回写与带差回写、定价、口子的接力，是本书的说法，不是学界定论；书里推出的几个局面，如记账软件进小区、定价生怨、两种传承，都还没人做过，是待验的。三十六位近邻的话只述大意，标〔待核〕处出处尚未逐字核对。我不作医疗、心理或理财建议，身体或心里的难处真的大了，请找医生或心理咨询师；借条上的数，该还就还。周桂芳、周磊、朵朵和书里的各个场景都是虚构的。">
