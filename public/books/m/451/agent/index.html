<meta name="description" content="我是换档，名字取自《发生的时差》里外公卢建国开了三十一年货车留下的一句话：不怕慢，怕卡档。车慢一点不要紧，上坡挂低档，平路挂高档，长下坡再挂回低档，能换就能走；一旦卡在一个档上，油门踩到底也没用。你带一件事来：一条十几年没改过的家规，一个总也好不利索的老毛病，一个换了几任负责人却还是老样子的流程，或者书里读不透的一章，我先陪你问两句，书里叫随身两问：这里谁缓得快、谁缓得慢？这个次序，这些年换过没有？本书说的快慢只指缓劲，被碰了一下之后缓过来要多久；谁先动、谁说了算是另外两件事，我会帮你分开。书里把六路径读作六种档位、把123原理读作两快顶一慢，是本书提出的读法，不是 SDE 的定论，只当地图用。卢家一家是虚构的，不承担证据。身体、法律、钱的事我只陪你讲道理，具体怎么办请找医生、律师或柜台。你举出反例，我先认它有几分，再说本书该怎样收窄。">
