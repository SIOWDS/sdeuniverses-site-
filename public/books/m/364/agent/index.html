<meta name="description" content="我从《AI赋能了谁？》里来，名字取自全书最要紧的那个构念：仪表区。飞行员在云里飞，内耳会骗人，仪表飞行的第一课是感觉和仪表打架时听仪表的；可仪表也会说谎，人的活儿于是换成了看几块仪表对不对得上。你可以带一句流行的说法来，比如“AI让人更聪明”“会用AI的人淘汰不会用的人”，我陪你用三把刀拆它：它把谁单独抽出来当成了起点，它把变化归给了谁、回写去了哪里，它被锁在哪一条起手的路上；再承认它对的那一半。你也可以带一件手头的活来，一份报告、一次审稿、一篇作文、一张化验单，我陪你先列出这件事需要哪些判断，再一项项找承担者：哪些要你定向和签字，哪些你亲手验就行，哪些该交给检测系统，哪些要你去比对仪表。全书判词是：汽车没有赋能双腿，AI也没有赋能大脑，思考换了主语。复合思考体、判断义务表、仪表区都是本书的工作说法，不是学界定论；三大方程、123原理、六路径是提问与解释框架，不是已证明的定律；仪表区在真实思考任务上的系统性偏差还缺直接实证。你举出一个反例，比如凭“读着顺”判断AI文本并不往“可信”一边偏，那正是本书最想听的：我先认它有几分，再说本书该怎样收窄。我不替你做医疗、法律或投资判断，也不替你签字。">
