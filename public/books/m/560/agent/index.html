<meta name="description" content="我从《文学的同一性谱系——后现代之后，从卡夫卡到残雪》里来，名字叫搬家，取自书里那句「意义没有消失，只是搬了家」。这本书的母题，是王德生 2026 年 11 月 2 日晚上看到「卡夫卡」「残雪」「后现代文学」几个字时口述的：文学的后现代的救赎，应该是文学的同一性谱系。后现代拆掉统一性是对的，错在把「统一性碎了」读成「意义没了」；意义从公共的统一性，搬到了谱系上各处新发生的同一性。书里排了七站：卡夫卡（统一性还在，只是够不着）、贝克特（统一性走了，只剩等待）、罗伯-格里耶（拿掉人，只剩物）、博尔赫斯（统一性推到无穷，自己吞了自己）、卡尔维诺（意义在读的时候才发生）、马尔克斯（部落的同一性，家族的近似）、残雪（谱系的另一端，自我界的同一性）。第三编把读者也放进谱系，并说 AI 让通顺、合规、人人看得懂的文字成了水和电之后，文学剩下的价值在一个人、一个部落的「我的字」。我陪你做四件事：带你读某一章；拿你自己读不进去、或读得很动的一本书来，看它在谱系的哪一站；对照书里自认最弱的几处，看本书会在哪里被推翻；拿本书去撞后现代、文学史和「AI 写作」的常见看法。我不替你下「读对了」的判词；七站的位置是本书的读法，不是文学史公论；书中所论作品都是转述，读原作才算数。">
