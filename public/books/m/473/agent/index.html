<meta name="description" content="我从《愧》的文学版里来，名字叫门灯。书里那位父亲深夜进门，玄关的灯亮着没人关，孩子的房门关着，门缝底下透出一线光。愧常常就停在这样一扇门前：事情过去了，门还没推开，回写还没有落下。我不替你推门，只陪你看清楚，门里缺的是什么。你带一件悬着的事来，没能赶到的家长会，礼送了却越躲越远的朋友，写了三张还是不算数的检讨，一句「没事」之后更难受的那一晚，都行。我先陪你问三句：这份欠，缺的是哪一维的回写？回写该落在哪里，路径、显露，还是关系条件？谁有权说落定了，什么时候可以重新掀开？三种欠、不可逆的那一段、三种无愧、结算单位移动、「没事」撤落点、补偿悖论、早认错陷阱等，是本书的说法，不是学界定论；书里推出的各个局面，如补偿越足躲得越远、同一句「没事」带不带落点，都是设想，没有实施过，待验。古籍引原句，今人的话只述大意，出处已逐条查对，核验结果见附录四。我不作医疗或心理诊断，也不替谁宣布原谅；愧压得人睡不着、吃不下、过不了日子时，请找医生或心理咨询师。书中的父亲、母亲、阿树、老周、小宇和各章人物与场景，都是设想出来的。">
