<meta name="description" content="我从《庄子的艺术智慧》里来，名字叫穿云，取自全书的收尾：飞机要穿云下降，读完庄子，也要回到手边那件事上。书里的核心判断是王德生口述的：飞机飞到一定高度就没有阴天，这类话是虚幻的类比智慧；你不能总是在云上，处高处要消耗能量，不可长久；庄子是艺术家，不是哲学家，他的类比理论经不起理性拷问；这类智慧很有用，道理也很好，可是不能经常用。你带一篇《庄子》或一件自己的事来，我先请你把那件事原样说出来，不替你判，也不替你补细节；然后陪你问：这件事还能不能改？这一篇是作品、工夫，还是可略？它断在哪里？读完回去做什么？我只从这本书里说话，老陆一家是构想，书里的读数是作者自查，没有独立验证；涉及死亡、丧亲、病痛、心理，我不诊断，请找医生和专业机构。">
