$('next').onclick=()=>step(1);$('previous').onclick=()=>step(-1);$('page-input').onchange=e=>show(Number(e.target.value)||1);$('zoom').onchange=e=>{zoom=Number(e.target.value);applyZoom()};$('spread').onclick=()=>{two=!two;show(page)};$('theme').onclick=()=>{document.body.classList.toggle('day');localStorage.setItem('m286-day',document.body.classList.contains('day'))};if(localStorage.getItem('m286-day')==='true')document.body.classList.add('day');$('toc-open').onclick=()=>{$('toc-panel').hidden=false;$('search').focus()};$('toc-close').onclick=()=>{$('toc-panel').hidden=true;$('toc-open').focus()};$('fullscreen').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){$('status').textContent='当前浏览器不支持全屏'}};
function jump(n){show(n);$('toc-panel').hidden=true}
for(const t of TOC){const a=document.createElement('a');a.href='?page='+t.page;a.textContent=t.title+' · '+t.page;if(t.level===2)a.className='subitem';a.onclick=e=>{e.preventDefault();jump(t.page)};$('toc-items').append(a)}
$('search').addEventListener('input',async e=>{const q=e.target.value.trim(),token=++searchSerial;$('search-result').textContent='';if(q.length<2)return;try{if(!searchPages)searchPages=await fetch(BASE+'page-text.json').then(r=>{if(!r.ok)throw Error();return r.json()});if(token!==searchSerial)return;let hits=0;searchPages.forEach((text,i)=>{if(text.includes(q)&&hits<40){let a=document.createElement('a');a.href='?page='+(i+1);const k=text.indexOf(q);a.textContent='第'+(i+1)+'页：'+text.slice(Math.max(0,k-18),k+70).replaceAll('\n',' ');a.onclick=ev=>{ev.preventDefault();jump(i+1)};$('search-result').append(a);hits++}});if(!hits)$('search-result').textContent='本版未找到该词，请尝试更短的词语。'}catch(e){$('search-result').textContent='搜索暂未载入，请使用全文网页的浏览器查找。'}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}if(e.key==='Escape')$('toc-panel').hidden=true});let touch=null;stage.addEventListener('touchstart',e=>{touch=[e.changedTouches[0].clientX,e.changedTouches[0].clientY]},{passive:true});stage.addEventListener('touchend',e=>{if(!touch||zoom>1)return;const x=e.changedTouches[0].clientX-touch[0],y=e.changedTouches[0].clientY-touch[1];if(Math.abs(x)>80&&Math.abs(x)>Math.abs(y)*1.5)step(x<0?1:-1);touch=null},{passive:true});left.onerror=()=>{$('status').textContent='页面暂未载入，可使用上方全文或PDF入口。'};window.addEventListener('resize',()=>show(page));show(page);
</script></body></html>
