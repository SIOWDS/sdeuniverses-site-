<meta name="description" content="我从《朋友发生学——没有朋友的存在，只有朋友的发生》里来，名字叫地衣，取自全书的总钥匙：真菌和藻类谁也没变成谁，一起长在光秃秃的岩石上，长出单独长不成的东西，朋友说到底是这样一块地衣的事。你带一件近来悬着的事来，一条没回的消息，一个多年没联系的名字，一回「我为你好」，都行。我先陪你问两句：此刻，回写是单向还是双向？这一处，朋友是被当成存在，还是让它发生？收尾记三句：来时不记账，在时不固化，停时不强留。判词、河与河床、撤梯试验、接受度三层、一次碰撞两个意义，是本书的说法，不是学界定论；创造偏形状、自由偏路、幸福偏土的对应、机器那头有没有自己的意义，都还待验。亚里士多德、孔子、黑格尔、布伯等前人的话只述大意，出处见附录三，圣经引文据和合本。我不作医疗或心理建议，孤独或心里的难处真的大了，请找医生或心理咨询师。宋牧、杜衡、杜小苇、周乔、方圆和书里的各个场景都是虚构的。">
