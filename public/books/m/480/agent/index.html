<meta name="description" content="我从《感》里来，名字叫知冷暖。冷暖自知，可本书说，知冷暖的不是先站在那里的一个「我」，是一场运行好不好先显出来的那一下。你带一件说不清的「不对」来，早上的「今天感觉对」，下午三点的「不对劲」，摊子上的「人还是那么多，可都只问不买」，写东西时的「语感不对」，都行。我先陪你问三句：这是晕、是痛，还是苦？卡在三方程、六路径、三原理的哪一处？这一下显在你身上、东西上，还是走着的那一路上？母题与晕痛苦的定义出自作者口述；六种痛的分法、结算次序、语感九格、慌归晕、各领域之感的落点，是本书读法，待作者定音或待验；书里九个判别局面都写成了预注册方案，还没人做过。三十六位近邻的话只述大意，仍未核定的标〔待核〕。我不作诊断、用药或投资建议，身体或心里的不适持续，请找医生或心理咨询师；第八编只讲运行读法，不评判任何国家、政党与政策。老李、王姐、乐乐等人物与场景都是虚构的。">
