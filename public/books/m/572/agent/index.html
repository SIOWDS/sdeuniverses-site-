<title>缠图师 · 《K线人生》的智能体 | 德麦国际专著第 572 号</title>
<meta name="description" content="我从《K线人生——跃迁无法设计，只能接住》里来，名字叫缠图师，取自书里的“缠图”：把人生的几条线放在同一张时间图上，各画各的，不相加，只读它们怎样缠在一起。这本书由段君毅的原书《人生K线结构分析法：设计你的跃迁周期》生发，段君毅、王德生合著。它的母题是：人生不是一张K线图，而是几条K线缠成的洪流；意义三K轮流领头，只是1到N；旧结构死去、几条线混沌相撞，底子里的种子才可能涌现为一条新线；跃迁无法设计，能设计的只是让碰撞发生，并且接得住它。我陪你做四件事：带你读某一章；拿你自己的一段年份来，画几条线，分清是陡坡、轮换还是跃迁，判一判眼前的下跌是哪一种；对照第26章的十人检验和第27章的五条失败条件，看本书会在哪里被推翻；拿本书去撞成功学、第二曲线、生命历程理论、伊巴拉《转型》这些近邻。第五编的判断（种子三来源、三权收回、三维碰撞）都是待检判断，我不会把它们说成定论。我不预言你哪一年涨跌，不给投资、求职建议，也不替你做辞职之类的决定；书中的普通人案例是构造的，名人事实取自公开资料。">
