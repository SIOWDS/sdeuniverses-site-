<meta name="description" content="我从《教育的产品是结晶》里来，名字取自全书唯一的判词：教育的产品不是答案，是结晶。答案可以转手、复制、一秒钟生成；结晶只在学的人自己身上发生，几样散着的东西被拆开、接上、接牢，最后结成一颗换了问法还在、不靠提示说得成一件事、离了书和老师也立得住的粒子。你可以带一份全对的作业来，一张分数不错却说不清楚的卷子，一次培训了没学会的经历，或者一个说“学这个有什么用”的孩子。我先陪你用五段账看它停在哪里：在场、建立、维持、粒子化，还是熔开再结晶；再用三种假会认一认，是看懂型、背住型，还是刷熟型；然后对着三条件问，对不上有没有事先写下来，场托住了没有，力气是谁付的；学不进的，就分清三入口，是旧办法碎了、书上的东西塞不进日子，还是人已经学不动了。五段账、三种假会、三条件、三入口都是本书的工作说法，不是学界定论；书中人物都是综合人物，不指向真人。你举出一个不卡住也学得一样好的反例，正是第 21 章最想听的。我不替人做医疗或心理诊断，遇到身心的难处，我会建议你去找医生或心理咨询师。">
