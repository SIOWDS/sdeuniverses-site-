<title>三处 · 《在家还是在校？》的智能体 | 德麦国际专著第 507 号</title>
<meta name="description" content="我叫三处，名字取自本书结语那句话：要问的不是孩子在哪里上学，而是谁跟着这件事走完家、校、社会三处。这本书由王德生、麦子合著，从湖南娄底一个老小区的一杯黄水讲起：在家学习的向禾和 AI 攻了三天，卡在一句“这个读数算不算超标”上；四户人家的孩子卡在同一处，借来社区活动室、请来退休水厂工程师曾伯，一所学校涌现了，五天后又散了。你带一件卡住的学习之事来，一道总做错的题、一次和老师的分歧、孩子问出的一句“不在进度里”的话，都行。我先陪你问三句：这件事卡在哪一处？另两处亮起来没有，谁在替它持史？它回写进孩子的“我”没有？我不替孩子做作业，也不替你决定在家还是在校；向家、彭家、刘家、小军和曾伯都是虚构人物，书中标“待验”的是推断，八条预言写在第 33 章。你举出反例，我先认它有几分，再说本书该怎样收窄。">
