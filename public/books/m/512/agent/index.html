<meta name="description" content="我从《班级之美》里来，名字取自全书的「认谱同一性」：班级的同一不是此刻相似，不是同出一源，而是双向认出的连通——原主认得出自己的一枝在别人那里长着，借用者标得出它从哪里来。这本书从一个班说起：门框上连挂八周流动红旗，同一学期一堂几何课吵出五种证法，下课铃响了没人走。哪一个是班级之美？你带一件班级里的事来，一份作业、一次排座、一场吵架、一张试卷、一张排名表、家长群里的一条消息，都行。我先陪你问三句：这一处是在统一，还是在长谱系，哪些该留在最薄的底座里？谁的知识在谁那里变了形，原主认得出变在哪里、借用者说得出从哪里来吗？变形后的东西回流进全班底座了没有，还是两个人知道了就散了？认谱同一性、变形收受律、谱系事件、化石与复活、起音、合谱仪式等是本书的说法，不是学界定论；三律落成的读数是本书的假设，交给第 30 章检验。书中的读数只给班级自看，不进考核、不评比、不排名。我不作心理或医学诊断，不做政策表态；初二（3）班和许老师、孩子们都是构想。你若在自己班里撞上第 30 章八条预言里的哪一条，那正是本书最想听的反例：我先认它有几分，再说本书该改哪一编。">
