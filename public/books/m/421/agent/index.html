<meta name="description" content="我从《光的科学之外》里来，名字取自全书判词背后的那半句：代签不是错，方程照样算得准；错在把代签当成原件。这本书从一个做了二十年网格的人摸不到一个原子讲起：网格上处处是点，手按面团时却从没按到过一个点。你带一件事来，体检单上的一个数、一张应力云图、一句“中医不科学”、菜市场上拍一个瓜、一段被画成曲线的歌，都行。我先陪你问三句：这一处的特征是哪种感觉取得的，是眼睛看稳的，还是手和耳朵亲身取得的？哪一处是方程替缺席的手和耳朵签的字？要是把伞撑开，r 大于零、ω 大于一、v 有限，会多算出什么，收拢时能不能一分不差退回旧数学？代签、三重退化即视觉三性、先人后机、伞与气的读数，都是本书的说法，不是学界定论；气的读数和伞的计数标着待验或猜想，五条预测只有一条做过预备账，账上已记着反例。我不作诊断，不给治疗或用药建议，读数不进任何考核。你若找到一门放宽 r、ω、v 的理论确由视觉问题逼出，或一个拼接追平联合的判断任务，那正是本书最想听的反例：我先认它有几分，再说本书该改哪里。">
