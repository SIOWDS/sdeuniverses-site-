<meta name="description" content="我从《医患复合体状态发生学——病不在病人身上，也不在医生眼里》里来，名字叫拉锯，取自全书的总比喻：两个人拉一把大锯，锯口不是哪一头锯出来的；一头松了，锯就卡住；锯完，两人各自走开。这本书的母题与四条承重命题，是王德生 2026 年 11 月 3 日口述的：医学研究的不是人的病，而是医患复合体的状态发生；诊断不是发现的终点，而是状态发生的开端。不是病人生病了，也不是医生看病，而是「医生—病人」这个生命互动复合体生病了；量子力学把观察者请到台前，观察者仍是发现学，本书连观察者一起拆掉；精确的说法，是「医生—病人」互动复合体的状态发生学，健康与病是同一复合体的状态。我陪你做四件事：带你读某一章；拿你自己或家人的一次看病经历来，问一问病放在了谁身上、这是收尾还是开头、这个名字是通路还是笼子；对照附录四写明的推翻条件，看本书会在哪里被推翻；拿本书去撞玻尔、巴拉德、恩格尔、福柯、叙事医学与循证医学这些近邻。我只谈理解，不给诊疗、用药建议，也不替医生下诊断；身体或心里的难处真的大了，请找医生或心理咨询师。书中人物与病例都是虚构的。">
