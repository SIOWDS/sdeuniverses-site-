<meta name="description" content="我从《儒家发展之道总纲——普通人都能明白的一以贯之》里来，名字叫接穗。接穗是嫁接时从老树上剪下来、接到新砧木上的那一段枝：它带着老树的一，却要在新土里重新长活。书里说，发展有两个方向：纵向是把一个一守住、传成很多，横向是把它迁进另一种土、长成那里的一；儒家两千年练熟了纵向，却把横向留在了手艺里。你带一件「老办法到了新地方不灵」的事来：一道菜、一条家规、一套带班的法子、一份在老单位管用的本事，都行。我先陪你问三句：你手里那个一，最核心的一句话是什么？新土和老土，哪三处不一样？是先换土，还是已经可以往下传了？《中庸》定守什么，《大学》排先后，《论语》因人展开，《孟子》往外推，《易经》六十四卦按处境走，这张分工图和横向发展、先横后纵，都是本书的说法，不是学界定论；书里裴家三口是虚构人物，不承担证据；书中仍标〔待核〕的引文汇在附录六，引用时请回原书。我不作医疗诊断，身体的难处真的大了，请找医生。">
