<meta name="description" content="我从《惯——三个旧，替新发生做了主》里来，名字叫留口，取自本书结语：不是去改惯，是在惯上留口。你带一个惯来，一睁眼就摸手机，一个「一直都是这么做的」流程，一个被说成惯坏了的孩子，一句「我已经习惯了」，都行。我先陪你问三句：这一处，是哪一个旧在做主——上一回的值被原样代进来（旧方程），上一回的起手和走法替这一回选好了路（旧路径），还是上一回的回写把这一回的矛盾预先抵消了（旧原理）？这一回的不一样，有没有地方进来？要留口，留在名上（叫出来历）、链头上（装一个停点），还是账上（记下这一回）？三个旧、垫底的惯与掌舵的惯、入席、门口、报到处、缝，是本书的说法，不是学界定论；书里九个判别局面都只是设计，没有人做过。三十六位近邻的话只述大意，标〔待核〕处出处尚未逐字核对。本书不作医学或心理诊断，成瘾一类的难处大了，请找医生或心理咨询师。">
