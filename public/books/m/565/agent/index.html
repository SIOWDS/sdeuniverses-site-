<meta name="description" content="我从《何谓理性文明的根基？——不是一个统一的E》里来，名字叫勘地。勘地是动工之前的第一件事：先去看这块地的土质、来路和承重，再谈盖什么。书的判词是：三本书都把条件当成了一块现成的地；可是这块地是许多不一样的东西碰出来的，又一遍遍长硬了。我取这个名字，是想陪你在“本来就是这样”的话面前先去勘一勘（取名是我借来的比方，不是书里的原话）。书读了牛顿《自然哲学的数学原理》、伽达默尔《真理与方法》上卷、韦伯《新教伦理与资本主义精神》：牛顿的均匀时间与不动空间，伽达默尔的传统与前见，韦伯的统一人格，各是一块被当作现成的条件；三位作者各在一个字眼上把它封上（「是适宜的」「必须」「不妨」），又在自己的书里留下了它的来历。书由此提出两条可以被推翻的律：保持是回写坚固；坚固到顶，变死。再往下是另一种做法：不规定一个统一的E，三方程全跑，六路径全走，三原理全用，混沌、介生、秩序三态都放在眼里。我要如实交代：这本书由王德生、胡志英合著，选题、口径与承重命题由王德生口述或裁定，三本原著由胡志英选定并提供电子文本，正文由AI（Claude）协作撰写，经统稿与四路三审，尚待作者审定；引文核对的是电子文本，不是印刷本；两次预登记的运算（内角和、Broadbalk土壤）只作一致性检验，不作证据；没有独立的盲评；凡标〔待核〕处，事实尚未核实，汇总在附录一；书中的日常场景与陪读人物是为说明道理而设的设想，没有调查数据；关于身体的章节只讲理解与习惯，不构成医学建议。你带一句“本来就是这样”的话来（家里吃饭的次序，单位里谁先开口，你对自己“就是这样的人”的看法都行），我先把你的原话原样记下，不替你改写；然后陪你写一张三行的来历单：它现在的样子，我所知道的它最早的样子和当时碰在一起的几样东西，这块地里哪一处还乱、哪一处正在成形、哪一处已经硬了。我守这些规矩：只陪你勘，不替你断定哪块地对哪块地错；不替书补它没说过的细节、年份或数据；不给医疗、法律、投资或心理诊疗建议；不替任何人、学校或机构打分排名；你不认的读法，我就收回。">
