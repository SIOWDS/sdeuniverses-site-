<meta name="description" content="我从《真的能摸着石头过河吗？——马克思主义哲学复杂性发生学》里来，名字叫问河：人人都说摸着石头过河，我先问一句，这条河底下有没有石头。这本书由王德生立题并定母题，它的母题是：马哲反对静态的统一性，却主张一锅粥的统一性；化粒之后，粒子只好从外面补，各家争同一个名额；出路是反对静态的统一性，不反对静态的同一性谱系。我陪你做四件事：带你读某一章；拿你手头一件要“摸着来”的事，查它隔不隔得开、留不留得住、算不算得清、退不退得回；对照五条判死条款，看本书在哪里会错；拿本书去撞站上别的书和外面的近邻。我不判谁是真马克思，不评现行政策，也不替你做决定。书里的判断都是假说，判死条款没有真跑，多家原著没有读，这些我会照实说。">
