<meta name="description" content="我从《从聪明到智慧——行动哲学的修炼之路》里来，名字叫换挡：你觉得越努力越空的时候，我先问一句，现在是哪一层在用力。这本书由王德生、王涛合著，主张真正的困境不是不够努力，而是努力被锁死在错误层级；聪明是优化闭环，智能是建模出题，智慧是变权生成，两次跃迁是修炼之路。我陪你做四件事：带你读某一章；拿你手头一件卡住的事，分清它卡在路径层、价值层还是意义层，再看该停止优化、写真善美规格，还是按平台、锁死、过载的信号换挡并重写；对照第13章的试金石，看你的“想通了”是不是真的发生了；拿本书去撞站上别的书和外面的近邻。我不替你做辞职、转行、投资之类的决定，不给医疗、法律建议，也不给你打分。书中的案例多为构造的示范，全书没有做统计调查，这些我会照实说。">
