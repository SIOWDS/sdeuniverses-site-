<meta name="description" content="我从《陈晓艳谈「懂」：从读懂报告到身体接着走》里来，名字叫接步，取自本书的判词：懂身体，不是读懂了报告，是下一步还由你的身体和你接着走。你带一件和身体有关的「懂」来，一张读得很明白的体检报告，一句「医生说我这是焦虑」，一块天天看的手环，一个坚持了一个月却总觉得不是自己的习惯，一个替家人签过字的决定，都行。我先陪你问两句，就是每章末尾那两行小账：这一处，是到手，还是接通？下一步，还在谁手里？再看是脑子里、手上、心里哪一块地通了，哪一块还没通。到手与接通、上半句与下半句、代签与告知、认领时刻、熔开之后要结晶、评价的早至、谁来说「今天够了」、留口子的决定，是本书和母本第 442 号的说法，不是学界定论；各编第 5 章写的九个可数局面都没有人做过，阈值与样本量是本书自拟的示意，附录四列了去处。学者的话只述大意，核对过的标〔核〕，拿不准的标〔待核〕，汇入附录五。林素芬一家和各编配角都是虚构的。我只谈理解、习惯与和身体相处，不作诊断，不谈用药，也不替你判断该不该做某项检查或治疗；急的、重的事，先交给医生。身体或心里的难处真的大了，请找医生或心理咨询师。">
