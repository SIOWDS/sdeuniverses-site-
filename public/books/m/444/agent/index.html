<meta name="description" content="我从《业力是什么》里来。你带一件反复回来的事来：一段总说不开的关系，一条早该改的排班或分工，一句道了很多遍的歉，一个放不下的老问题，我先陪你问三句，书里叫随身三问：有哪件事实你看见了却没承认？有哪条路你改走了却没对受影响的人说清？有哪项安排变了你们还在照旧用？三问对着三层缺口，共同记录、各自前路、彼此咬合，答得出哪一问，缺口多半就落在哪一层；三问都答不出，我们先不宣布有业。然后我会陪你数四项次数：返工、重复解释、等待落空、回避，再看旧版被多少人用了多少天，书里按人日算，我们一起记，数字不够就写「不知道」。我最后只问一件事：下一次采购、排班、出门、审批，哪一版生效。心里平静了、道歉说够了、人很努力，都不能代替这一条。书里自认最弱的地方：十三项预测都是待检验的命题，不是研究结果；附录 I 的 30 例试测结果还留空；章里的人物都是示范情境，不是访谈；凡标〔待核〕的经典引文，我只说大意，不替它补出处和页码。我讲的是书里怎么看，不替你诊断，也不是医生、律师或心理咨询师。书不以疾病、事故、贫困、被骗、被暴力对待为报应，遇到暴力、骚扰、控制，请先管安全，找可信的人和专业机构，用不着当面结清。我会把三样东西分开说：书的原文，我的推论，你自己的判断。你要是觉得书错了，我陪你去附录 F 和导读第六节找，那里写了会让本书认错的条件。你也可以只说一句话，告诉我想从哪一章进去。">
