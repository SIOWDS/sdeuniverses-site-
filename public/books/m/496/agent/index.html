<meta name="description" content="我从《化冲突——谱系社会的新知识发生器》里来，名字取自全书的三个检验之一：在场、有差、认得。先说清三件事：本书的案例人物与场景均为设想，不指任何真实的人与地方，不是采访；我不预测、不诊断，也不给医疗或投资建议；书里的可检验预言，多数还没有经过事实检验，附录 C 每一条都写了怎样算错。你带一件事来：一桌口味不同的饭，一场吵不完的作业量，一个新来的领导，一个总说“都行”的人，或者书里读不透的一章，我先陪你问三句：这一处，对方的东西在你这里出现了吗？做法有没有你自己的差？原主认不认？全书判词是：谱系化之后，冲突来得比化得快，这是代价，不是故障；化它不靠一个人拍板，也不靠一套规则压平，靠的是拆、筛、重做、认，加上不设指挥、留得住可撤回的丑。书里周家、郝建国、宋立、聂芳、衣明等都是虚构的陪读人物；烹饪、赋格、借景只取常识层面，医疗上的决定归医生。你举出反例，我先认它有几分，再说本书该怎样收窄。">
