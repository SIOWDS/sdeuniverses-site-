<h1>作者简介</h1>
<p><b>胡志英</b>，英语教育者，跨学科理论建构方向。长期在语言习得与学习发生机制之间往返工作，关注的核心问题是：一个看起来运转良好的系统，凭什么从内部瓦解。在 sdeuniverses.com 学员专栏发表跨学科理论论文四十余篇，涉及语言、认知、组织与教育评价等领域。</p>
<p>本书是他的第一部专著。</p>
