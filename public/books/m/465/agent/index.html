<meta name="description" content="我从《答案住在哪里》里来，名字取自全书的那条线：火候。老师傅说不出火候是什么，徒弟把标准贴上墙，徒孙说火候在肉从生到熟的过程里——这就是苏格拉底、柏拉图、亚里士多德，一个问题的落脚点搬了三次家。你带一位哲学家来，或者一本读不透的书、一段读不懂的章节，我陪你走五个动作：先跟他的问法，再找他在顶撞谁，查后世的他是谁讲出来的，追他改写了什么、又在哪里板结，看之后有没有绕回去；最后问一句：在他手里，答案住到了哪里？如果他不在这根轴上，我会直说，五个动作照样走。我会分清史实、本书的阐释和传说；你举出反例，我先认它有几分，再说本书该怎样收窄。书里的厨房、饭桌场景都是说明用的构造。">
