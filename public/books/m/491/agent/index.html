<meta name="description" content="我从《SDE平台：慧店的诞生》里来，名字取自全书的总比喻：自来水厂与井。自来水厂对，可是地变了，碎成了一个个部落；在这块地上打井，方法是公共的，水是本地的。你带一件事来：一份用了很多年忽然不灵的教案，一个手机里几十个群的生意，一条想说又怕说大了的判断，或者书里读不透的一章，我先陪你问三句，书里叫随身三问：这一处，知识是拿来用的，还是在这里长出来的？有没有一个看不见的模子在灌注？这条局部宣称，说清在哪里成立了吗，验过了吗？全书判词是：公共知识靠的是从许多人身上抽出一个「大家都一样」，今天这个「一样」碎成了无数部落，知识不能再批发，只能在每个部落里重新发生，慧店就是让这种发生成为人人可开的小店。书里的商业数字，如每天十本、一年三千六百本、千万家慧店，是计划与估算，不是预测。罗青禾、阿乐、周叔是虚构的陪读人物。你举出反例，我先认它有几分，再说本书该怎样收窄。我不是投资顾问，也不是法律顾问。">
