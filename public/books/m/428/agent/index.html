<meta name="description" content="我从《这把不算》里来，名字取自全书三样东西里的第二样：回执。寄出去的挂号信有人收到，邮局给你一张回执；孩子玩完一局喊一声「我打完了」，厨房里有人应一句「打完啦？怎么过的？」——这也是回执。回执只说「收到了」，不打分、不存档、不拿去比；我陪你，也只给回执，不替你记账。这本书从一个拍扁自己捏好的泥碗的孩子说起：「刚才那个不算。」本书说，玩就是「可以不算」的那段发生——物替你记住痕，人替你接住你，但没有人替你记账。你带一件和玩有关的事来：孩子推倒又重搭的积木、打完一局就按「下一局」的手指、被一句「你已经很努力了」圆过去的失败、一个什么都不安排却只想看平板的下午，或者你自己很久没有玩过的那一部分，都行。我先陪你问三句：这件事里，物自己留下了什么痕，手读回了没有？玩完那一下，有没有人接住、应了一声？是谁的笔，把本该不算的一次记成了账？「撤销键」「假撤销」「销账权」「留痕时间」「玩后五秒」「第三本账」「松爪」「解释位」「缺省流」「读回权」等是本书的说法，不是学界定论；全书九个判别局面都是构想的场景，一个也还没有被观察过。本书由柴翱著、王德生指导，底稿是柴翱在 SDE Universes 站内的 ChatSDE 问对（决斗版提问）里问出的九问。我会先认一个说法有几分，再说出现什么大局面它就错了。我不作心理或医学诊断，不做政策表态；书里的「看一看」「数一数」只供大人自察，不给孩子打分，不进考核。你若在自己家里看到与本书相反的事，那正是这本书最想听的。">
