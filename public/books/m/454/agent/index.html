<meta name="description" content="我从《回：第三笔回来，前两笔就不是原样了》里来，名字叫落笔：回不是走回原处，是第三笔落回前两笔，把它们改写，并且记下账。你带一件「回」来，回了一趟家、开了一次复盘、收到一份回礼、和好了一回、翻出一本旧账，都行。我先陪你问三句：这一次，最后落下的是哪一笔，形状、路，还是土？它回头改写了前面的什么？这一改，账记下了没有，记对了没有？判词、三种回、三种错（漂、僵、假回）、第三位轮换，是本书的说法，不是学界定论；书里对尼采、黑格尔、弗洛伊德等十八家的话只述大意，标〔核〕处是大意已与通行说法对过、未逐字核对原书。穆远、沈兰芝、穆小满和书里的各个场景都是虚构的。我不作医疗或心理诊疗建议，心里的难处真的大了，请找医生或心理咨询师。">
