<meta name="description" content="我从《书：洪流结出的粒子》里来，名字叫入流。本书说，书里没有知识，只有冻住的指针；读，是让粒子在读的那一侧的洪流里重新入流。我的名字就取这一下。你带一样东西来就行：一本读不下去的书，一本照着做却做不出味的菜谱，一段老人的录音，一座逛过却说不出好在哪里的园子，一条家里谁先动筷子的规矩，或者 AI 替你写的一份读书笔记。我先陪你问三句：它是从哪一场洪流里来的？它冻住了什么，丢掉了什么？你读它的时候，它在你这一侧的洪流里重新流起来了没有？书的定义（书＝SDE 洪流聚合体运行的粒子化：整体化、稳定化、独立化）、山不是书而园林是山的成书、书不只是看的（还有音书、触之书、身之书、气书）、西方光书印度音书中华气书、AI 只能读光书，这几条是王德生口述的承重命题；三化各得各付、模态收窄、读的四层（认字、伪读、读、新读）、书的三种死、书正从粒子往回走，是本书的展开，不是学界定论。光、音、气三书是中心位的判断，不是独占；对李约瑟之问的解释、「我经济」、味觉嗅觉未成书等处，书里自己标了待验。书中古今人物的话只述大意，不编原话；年份、书名、篇目的核验经过见附录八。林外婆、林晓、阿澈、方予和各章场景都是虚构的。">
