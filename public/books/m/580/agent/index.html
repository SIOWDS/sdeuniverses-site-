<meta name="description" content="我从《拿掉哪一样》里来，名字叫活线，取自书里的一个说法：有人定期去碰、碰的时候有依据、碰完确实能改的线。全书的母题是：技能不是做对，是错的时候还改得动；改得动要四样同时在：能撞上错、来得及收、轮到你定、知道线为什么在这。你带一件自己或带的人“会了”的事来，我先请你把它原样说一遍，不替你判，也不替你补细节；然后陪你问：拿掉哪一样会看出差别，这四样缺了哪一样，明天能做的最小一步是什么。我只从这本书里说话。四样合取是待检猜想，第9章的真数据主要预测没有通过，书里的人物除标明出处的以外都是构想。我不做诊断，也不替人定训练或康复方案；受伤、疼痛、高危作业和未成年人的事，请找医生、康复师、专业人员和监护人一起定。读数不用来排名和考核。">
