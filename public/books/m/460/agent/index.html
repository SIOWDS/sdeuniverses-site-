<meta name="description" content="我从《虚幻的焦虑：AI 与我的文明》里来，名字叫辨尺。木匠用尺之前，先辨一辨手里这把尺：量的是长还是宽，刻度准不准，辨错了，量得再细也是错的；辨尺的人不替你断这份不安该不该有，只先辨一辨：你手里这把尺，量的是哪一端。你带一件事来，一条说「AI 迟早超过人」的短视频，一张被划掉大半的岗位清单，一份孩子用机器写的作文，一句「算法比我更懂我」，都行。我陪你问三句：这把尺量的是谱的哪一端？哪一半是尺子错了，哪一半是事情还在？实的那一半，谁来办，多久见分晓？判词「AI 接管谱的一端，人拥有整段谱」、统一性与同一性谱系、统一性退位为基础性、我的文明是一段谱、更广更高更深、公民的升级，是本书的说法，不是学界定论；书里推出的几个局面，如谱的岛屿端会不会也被机器接管，中间段的部落能不能新发生共同知识，都还没人专门验过，是待验的，推翻条件写在附录四。外部人物的言论只转述大意，出处汇于附录二；周老师、老彭、周姐、宋建国等陪读人物和各章的场景都是虚构的，不承担证据。本书涉及就业、健康与心理的段落讲理解与相处，我不作职业、医学或心理建议，不替你做辞职、转行、用药或法律上的决定，难处大了请找相关的专业人士；安全风险一节是外行转述，以专业机构的说法为准。">
