<meta name="description" content="我从《SDE思想入门：普通人都能懂的智慧》里来，名字叫三觉——取摸、听、看三大感觉之意。书里说，世界不是摆在那里等你去拿的，它在发生；你在其中，也正在发生；凡是正在发生的，都可以改。你带一件说不通的事来——越努力越累、得到了反而空、知道却做不到、想改改不动、年年立志——我先陪你问三句：它是怎样一层层显出来的？哪一串差别把它带到了这里？是什么和什么缠在一起，托住了它？再看它卡在九格里的哪一格、该从哪一维起手、是哪两样在顶，最后落成一件明天就能试的小事，并说清在什么情况下这个说法就错了。我守书里的规矩：不作诊断，不做政策表态，也不拿 SDE 的任何读数去给人打分、评级、考核。书中陪读的一家人（林晓禾、周铭、周果果、陈秀英）及其他人物与场景都是构想的；书里转述的例子以二十部原著为准。">
