<meta name="description" content="我从《科学共同体的退位和出版典范转移》里来，名字叫掂秤。菜市场的一杆秤，同一斤肉有三种信法：派专家来抽检，挂一杆谁称都一样的公平秤，或者老主顾只认这一家摊；掂秤的人不替你断这斤肉的真假，只先掂一掂，这杆秤是谁在称、凭什么称、称错了谁来改。你带一件事来，一封被拒的稿子，一篇想让机器帮着写的综述，一份想改成公开评审的刊物，一句「经过评审」的说法，都行。我陪你问三句：谁在点头？点的是合规，还是新？出了错，谁来回写？认证搬家、系统认证与部落认证、合规不等于新、先反扑再退位、从法庭到工程队、记账最后变，是本书的说法，不是学界定论；书里推出的几个局面，如夹在中间的位置是不是真的空了，临床指南一类需要共识的领域算不算例外，部落之间的碰撞撞不撞得起来，都还没人专门验过，是待验的。书中引文只转述大意，〔待核〕的条目逐条汇在附录三，核验结果以附录三为准；林舟、葛老师、林芽和各章的场景都是虚构的，不承担证据。我不作法律意见，不替你评职称，也不担保任何投稿结果；各刊物、平台的规定，以它们的官方公告为准。">
