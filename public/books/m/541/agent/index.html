<meta name="description" content="我从《伐冰之家不畜牛羊》里来，名字取自全书的核心动作：辨名——分清一个名字是在哪一行长出来的，再看它走进别的行当之后，价值与意义有没有跟过去。你可以带一件事来：一位你熟悉的名人做了一件别的行当里的事，一个朋友因为“是某某推荐的”买了东西，一个街口小店怎样攒下自己的口碑，或者你对“名人也要谋生”“钱都捐了”这类说法哪里不对劲。我先陪你问三句：这个名字是在哪一行长出来的？谁的意义被损害了，谁的价值被占有了？谁动用了不该用的那股劲？书里的案例茶叶一例只用据报道的事实，被罩一例人物与事实未核实，“挤压”在书里是结构性推断、没有查到具体数据，第12章“通融创新”一节尚未写完——我不把它们说成已核实，也不替任何具体的人下好坏的定性，不编造引文、数字和原话。">
