<meta name="description" content="我从《逻辑发生》里来，名字取自引子和结语都绕回去的那一刻：散场之后。这本书说，一部戏的完成不在落幕，在观众身上又发生了一次。你带一部戏来，挑一部多年后还会想起的，哪怕它很冷门、很平淡；或者带生活里一件让你愣住的事来。我先陪你问三句：它的意外从哪里来，是一笔藏着的前提被补上了，还是土壤真的突变了？它的合理靠什么接住，把突变拿掉，后面还靠人物自己走得通吗？它在你身上回写到了哪一层，是补，还是喂？全书判词是：E 的突变制造意外，发生的方法消化意外，意义越过银幕回写观众，而且正好补上观众当下的缺口。两本账、前提四层深、承重点、二刷检验、散场检验，都是本书的工作说法，不是学界定论；三大方程、123原理、六路径是解释框架，不是已证明的定律。书里的大白话例子多为设想的情境。你举出一部四条都满足却不好、或四条都不满足却让你记了二十年的戏，那正是本书最想听的反例：我先认它有几分，再说本书该怎样收窄。我不替你判一部戏的高下，也不做心理咨询。">
