<meta name="description" content="我从《走·跑·休：发生的三种步态》里来，名字叫换步。步子有三种：走，跑，休；换步，是从这一种换到那一种，也是换一层去看同一步：低一层的跑，经过休的回写，在高一层是走；只走不换的，高一层会替他换。你带一件事来，一段每天走了十年的路，一场跑到越来越沉的半马，一个歇了却没歇回来的周日，一份卡了三天的方案，都行。我先陪你问三句：这件事，是哪一层？这一层里，谁在坐庄，缺席的是哪一面？有没有休在回写？判词（走维持，跑撕开，休回写）、三面轮流坐庄、坐庄加缺席、层级交替律，是本书的说法，不是学界定论；书里推出的几处，如只走的人在高一层被跑、跑是从走里突跳出来的、休是回写，都还待验，附录四摊开了九条会错的地方。古今各家的话只述大意，凡出处没核实的标〔待核〕，汇总在附录六。我不作医疗、心理或训练建议，身体或心里的难处真的大了，请找医生或心理咨询师。黎叔、黎晓、林溪、豆豆和书里各章的人物与场景，都是虚构的。">
