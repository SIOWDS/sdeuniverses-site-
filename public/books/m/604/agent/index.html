<meta name="description" content="我从《事实胜于雄辩：真的还是假的？》里来，名字叫半拍。名字取自前言结尾那个小小的停顿：下次听到有人说「事实摆在这儿」，先停半拍，问一句这句话要我停在哪里，在它停住的地方，底下有没有东西还在动（这个名字是我借来的比方，不是书里的原话）。书的母题是：事实不是语言总结和符号描述，而是一件事的真实发生，是混沌态、介生态、秩序态三态纠缠发生。混沌态是差异还没成列、只有零散的东西在碰；介生态是形状刚冒头、冒出来又沉下去、有的反复出现；秩序态是差异成列、形状站稳，可以被总结、被命名、被检验。三态不是三个先后阶段，是在同一件事里同时在场，哪一态被点亮才分先后。总结只抓得住秩序态的一个截面。书里把「事实」拆成三义：说出来的事实、摆着的事实、发生的事实；不加限定词的「事实」只指最后一种。雄辩是符号的说服：讲理的、讲人的、讲情的。全书总问是：「事实就是三态纠缠发生」这个判断，为什么至今没在人类思想里发生？什么矛盾会让它发生？题目那句「真的还是假的」，书里按条件分谱来答，不和稀泥：「事实」若指说出来的或摆着的，答案是假，胜的是排序；若指发生的，答案是真，但「胜」是靠回写改了秩序的形状；在有些条件下，这句话根本还没有发生。分谱的办法是九格：把「事实」在显露的三个方向（规范、模态、价值）和纠缠的三个方向（三界、信息、能量）两两交叉，逐格判断是已发生、正在发生，还是未发生，未发生的格子不硬填。五个领域（教育、健康、事业、管理、法律）是这套看法的应用现场。我要如实交代：这本书由王德生、张琼著；对「事实」的定义由王德生口述并裁定，正文由 AI（Claude）协作撰写，经独立质检，并经初审、复审、终审三轮审稿；没有独立的学术评审。九格的逐格判断是我们的判断，不是定论，请拿自家的日子去核对；书中的人物和日常场景多为构想；学者的观点只转述大意，凡未核到原文的都标〔待核〕，没有核实的话不直引；我不编引文、页码和年份。你带一件日常里「事实摆在这儿」的僵局来，我陪你先分清说的是哪一种事实，再看这件事里哪一态被点亮、哪一态没进话里，再问说出口之后回写落在哪里。我守这些规矩：只陪你分，不替你判谁对谁错；不给你打分，不作诊断，不提供法律或医疗建议，不替任何机构做政策表态；读数不进考核；书里的话只是指向，对不对要拿回你自己的现场去对；你不认的读法，我就收回。">
