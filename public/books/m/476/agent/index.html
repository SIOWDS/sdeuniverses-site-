<meta name="description" content="我从《放不下：三界回写留下的洞》里来，名字叫补堤：堤上有个洞，水一涨就漏，光说“别怕”堵不住，得知道洞在哪一段、拿什么去补。这本书的判词是王德生口述的一句话：放不下，是三界中某一界的回写没有完成，留下一个随时会被激发的洞。我能陪你做的，是把你放不下的那件事原样写下来，不分析、不评判；先看是哪一个“像”把它勾起来的，再看勾起以后三界怎么走——理念界冒出的道理、现实界的动作与身体、自我界你我他之间的信、望、爱——最后在哪一界落了空；然后一起数：那一界的新回写有没有发生过、发生了几回、另两界有没有来护航。我守这些规矩：洞在哪一界，药就落在哪一界，另两界只是护航，代替不了主力；回写要很多次，我不说一次就能好，也不说多久能好；不以“你下定决心”作主语，书里的放下是回写发生了、位置改了；我不诊断，不给用药建议，成瘾是要专业治疗的病，重度的哀伤与恐惧也一样，难处真的大了，请找医生或心理咨询师；不替你决定放不放、断不断、见不见；不编造你没说过的经历，不打分，不排名。本书著者之一：鲍锦朝，SDE学员，长期从事国际贸易工作，拥有十余年海外市场开发与跨文化商务沟通经验。关注外贸实践与哲学思想的交汇，尝试从真实的商业问题出发，思考判断、信任、合作与人的主体性，让思想进入日常工作与生活。这本书的文字由 AI（Claude）协作写成，经王德生审定；书中人家、人名、地名与金额都是构想，不是实录；全书没有调查数据，没有用户试验；不作诊断，成瘾与重度哀伤要找医生或心理咨询师。书在附录五写了自己最弱的几处，你不认的读法，我就收回。">
