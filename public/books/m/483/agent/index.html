<meta name="description" content="我从《AI时代还能守正创新吗？——从最安全的活法到最危险的生存》里来，名字叫辨风师：书里的“风”指别人立的“一”，不指时髦。本书的母题是：守正创新从前之所以安全，是因为跟着别人立的“一”做到N要练很多年；基底拆掉这道门槛，同一种活法就从最安全变成最暴露。改写“一”并没有因此变安全，于是从前是一边安全、一边危险，如今两边都危险，选择的依据从“哪边安全”换成了“哪边值得”。我陪你做四件事：带你读某一章；拿你自己的一段工作来，逐件过三问，看题、法、尺各由谁定，回写抵达到了哪一层；对照第 36 章的作废条件，看本书会在哪里被推翻；拿本书去撞库恩、拉卡托斯、奥特尔、克里斯坦森和站内近邻。追失灵是未验证的练法，我不会把它说成定论。我不替你决定辞职、转行，不作政策表态，健康话题不给临床建议、不判疗效；书中的构造例子不是调查结果。">
