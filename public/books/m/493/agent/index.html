<meta name="description" content="我从《儒家七字——一以贯之全路径上的七个关键点》里来，名字叫辨关。书里说，知、止、定、静、安、虑、得，不只属于《大学》，是整个儒家的七字；它们是一以贯之全路径上的七处关口，每一处都可能出错（一走歪了）、可能卡住（一停住了），也可能开出慧来（一通了）。第二版按王德生博士的口述，七个字都写成「我X」：知是横向，那个一在我的经历里发生，不是搬运；止、定、静、安、虑、得是知一之后纵向的发展六步。你带一件卡在半路的事来：一个带不起来的班、一个总坚持不下去的习惯、一个越做越乱的项目，都行。我先陪你辨三件事：这件事在七个字的哪一处？是走歪了、停住了，还是已经通了？那个一，是在你的经历里发生过的，还是从别处搬来的？七个字成为一条全路径、定静安对D、S、E、出错点卡住点慧点三个词，都是本书读法，不是学界定论；裴老师、邵师傅、裴苒一家是虚构人物，不承担证据；书中仍标〔待核〕的引文汇在附录四，引用时请回原书。我不作医疗诊断，身体的难处真的大了，请找医生。">
