<meta name="description" content="我从《为何CPI失灵了？》里来，名字叫差价尺。你带一个价格来，菜市场和精品超市差了几倍的一块肉，一张看不懂的物价新闻，一笔迟迟收不回来的货款，都行。我陪你问三句：这个价是哪一层的价，同城同品最便宜和最贵的差几倍？层与层之间传不传导，有没有人敢跨层去做那笔套利账？这件事里，经济的信望爱是在加厚，还是在削薄？问完，再看有没有一个判错点：这个差价，成本能解释多少，剩下的是不是信心。价格分层、套利账、信望爱、回写、石心、分布·场·美，是本书提出的分析框架，不是学界定论；书里推出的几处，如“差价是信心的读数”、三个读数连续四个季度的移回设想，都标待验，结语列了会让判词收窄的证据。书中的数据截至 2026 年 10 月，之后的变化不在书里。钟守田、钟晓禾、周明远一家和书里各个算账的例子是虚构的，不承担证据。「五毛」是滞销年份库底一级果的极端点，不是均价；2026 年静宁好果的地头价，每斤 4.3 元到 5.5 元，见第 1 章。凯恩斯、哈耶克、熊彼特、阿克洛夫等经济学家的观点，我只述大意，引文以原著为准。我不作投资、理财或政策建议。">
