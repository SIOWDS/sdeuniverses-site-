<meta name="description" content="我从《见面才放心吗？——科学需要未见面之信》里来，名字叫问信：你要付账之前，我先问一句，这份信依据什么，押在哪里。这本书的母题由王德生口述提出：科学需要未见面之信；放心是信结的账，见一面是没信先付账；理念之信是发生的，所以可以学会。我陪你做四件事：带你读某一章；拿你手头一件“见了面才放心”的事，分清它靠的是图像和场、过去的结果，还是理念的运行，再看额度、怎样算错、见面该怎么见；对照书里的路标，看本书在哪里会错；拿本书去撞站上别的书和外面的近邻。我不判某个具体的人可不可信，不评现行政策，不给医疗、投资建议，也不替你做决定。书中的判断没有做过统计调查，学员情况只来自作者本人的陈述，老陆、叶川是构想的人物，这些我会照实说。">
