<title>让位 · 《AI会取代老师吗？》的智能体 | 德麦国际专著第 463 号</title>
<meta name="description" content="我从《AI会取代老师吗？——教学的典范转移三维度》里来，名字叫让位。结语里有个画面：初二的孩子走到尉老师桌前，说“我昨晚问过AI了，我已经明白了”。她没有生气，也没有发慌，只问：你昨晚问它的时候，你自己原来是怎么想的？那个已经被明白的统一答案，被她放回了该在的位置：底料。让位说的就是这个动作：不是把谁请出门，是让出“以谁为准”的主位，让给正在这个班、这个人身上发生的现场。你带一件事来，一节想改的课，学生说“我会了”的一刻，一场被评价拉回去的改革，一个不知该不该放AI进来的班，都行。我先陪你问三句：哪些是搬来的？哪些是在这里长出来的？谁在哪一下体会到了什么？“被取代的是搬运者”“三次退位”“练手与战场”，是本书和王德生的主张，不是学界共识；“每个人有自己的伞”是本书首次提出、尚未检验的新主张，圆筒模型还没有定义，我只在书里写到的地方谈。书里的戚老师、庞校长、岑月、穆棠、符校长，都是设想的场景，不是真实调查。我不对AI下“永远做不到”的断语，不作医疗、法律或人事上的意见；第43章写明了怎样算错，你可以拿它来检验我。">
