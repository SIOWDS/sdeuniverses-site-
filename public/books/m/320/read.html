    var vp0=pg.getViewport({scale:1});
    var sc=fit(vp0), vp=pg.getViewport({scale:sc});
    leaf.style.width=Math.round(vp.width)+'px';
    leaf.style.height=Math.round(vp.height)+'px';
    if(vector && svgEl && window.pdfjsLib && pdfjsLib.SVGGraphics){
      leaf.classList.add('vec');
      pg.getOperatorList().then(function(ops){
        var g=new pdfjsLib.SVGGraphics(pg.commonObjs, pg.objs);
        g.embedFonts=true;
        return g.getSVG(ops, vp);
      }).then(function(svg){
        vecOK++;
        svg.setAttribute('width', Math.round(vp.width));
        svg.setAttribute('height', Math.round(vp.height));
        svgEl.innerHTML=''; svgEl.appendChild(svg);
        if(tlEl) buildText(pg, vp, tlEl);
        cb&&cb();
      }).catch(function(){
        /* 逐页回退：这一页含矢量后端不支持的内容（多为位图封面、插图），只这一页用高清位图；
           其余页照旧矢量。连续失败过多才整本切到位图。 */
        vecFail++;
        if(vecFail>=6 && vecFail>vecOK){
          vector=false; $('btnVec').classList.remove('on'); $('btnVec').textContent='位图';
          hint('此文档的矢量渲染不可用，已切回高清位图');
        }
        leaf.classList.remove('vec');
        drawCanvas(pg, vp, canvasEl, tlEl, cb);
      });
    }else{
      leaf.classList.remove('vec');
      drawCanvas(pg, vp, canvasEl, tlEl, cb);
    }
  }).catch(function(){ cb&&cb(); });
}

function drawCanvas(pg, vp, canvasEl, tlEl, cb){
  var dpr=Math.min(window.devicePixelRatio||1, 3);
  canvasEl.width=Math.round(vp.width*dpr); canvasEl.height=Math.round(vp.height*dpr);
  canvasEl.style.width=Math.round(vp.width)+'px'; canvasEl.style.height=Math.round(vp.height)+'px';
  var ctx=canvasEl.getContext('2d',{alpha:false});
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#FBF7EE'; ctx.fillRect(0,0,vp.width,vp.height);
  pg.render({canvasContext:ctx, viewport:vp, intent:'display'}).promise.then(function(){
    if(tlEl) buildText(pg, vp, tlEl);
    cb&&cb();
  }).catch(function(){ cb&&cb(); });
}

function buildText(pg, vp, el){
  el.innerHTML='';
  pg.getTextContent().then(function(tc){
    try{ textCache[pg.pageNumber]=tc.items.map(function(x){return x.str;}).join(''); }catch(e){}
    var frag=document.createDocumentFragment();
    tc.items.forEach(function(it){
      if(!it.str) return;
      var tx=pdfjsLib.Util.transform(vp.transform, it.transform);
      var s=document.createElement('span');
      s.textContent=it.str;
      var h=Math.hypot(tx[2],tx[3]);
      s.style.left=tx[4]+'px'; s.style.top=(tx[5]-h)+'px';
      s.style.fontSize=h+'px'; s.style.fontFamily='sans-serif';
      frag.appendChild(s);
    });
    el.appendChild(frag);
  }).catch(function(){});
}

/* ── 展示当前跨页 ── */
function show(cb){
  if(rendering){ return; }
  rendering=true;
  document.getElementById('book').classList.toggle('single', !spread);
  $('leafR').style.display = spread?'':'none';
  var left = spread ? (cur%2===0?cur:cur-1) : cur;   // 偶数页在左，仿真书
  if(left<1) left=0;
  var right= left+1;
  var done=0, need=spread?2:1;
  function fin(){ if(++done>=need){ rendering=false; sync(); cb&&cb(); hideMsg(); } }
  if(spread){
    $('nL').textContent = left>=1&&left<=total ? (left-CFG.offset+1>0? (left-CFG.offset+1):'') : '';
    $('nR').textContent = right<=total ? (right-CFG.offset+1>0?(right-CFG.offset+1):'') : '';
    renderInto(left,  $('cL'), $('tL'), fin, $('sL'));
    renderInto(right, $('cR'), $('tR'), fin, $('sR'));
  }else{
    $('nL').textContent = cur-CFG.offset+1>0?(cur-CFG.offset+1):'';
    renderInto(cur, $('cL'), $('tL'), fin, $('sL'));
  }
}

function sync(){
  var printed = Math.max(1, cur-CFG.offset+1);
  $('pi').value = printed;
  $('pt').textContent = Math.max(1,total-CFG.offset+1);
  var r = (cur-1)/Math.max(1,total-1);
  $('fill').style.width=(r*100)+'%';
  $('knob').style.left=(r*100)+'%';
  try{ localStorage.setItem(CFG.key, String(cur)); }catch(e){}
  Array.prototype.forEach.call($('thumbs').children, function(c){
    c.classList.toggle('cur', +c.dataset.p===cur);
  });
}

/* ── 翻页（带动画） ── */
function step(dir){
  var n = spread?2:1;
  var t = cur + dir*n;
  if(t<1) t=1; if(t>total) t=total;
  if(t===cur) return;
  animate(dir, function(){ cur=t; show(); });
}
function animate(dir, after){
  var src = dir>0 ? $('leafR') : $('leafL');
  if(!spread || !src || src.style.display==='none'){ after(); return; }
  var fl=document.createElement('div');
  fl.className='flip'+(dir>0?'':' back');
  var w=src.offsetWidth, h=src.offsetHeight;
  fl.style.width=w+'px'; fl.style.height=h+'px';
  fl.style.left = dir>0 ? (w+'px') : '0px';
  var live = src.classList.contains('vec') ? src.querySelector('.svg svg') : src.querySelector('canvas');
  if(live){
    var cl = live.cloneNode(true);
    cl.style.width='100%'; cl.style.height='100%'; cl.style.display='block';
    fl.appendChild(cl);
  }
  $('book').appendChild(fl);
  requestAnimationFrame(function(){ fl.classList.add('go'); });
  setTimeout(function(){ fl.remove(); after(); }, 620);
}
function go(p){ p=Math.max(1,Math.min(total,p|0)); if(p===cur) return; cur=p; show(); }

/* ── 目录 ── */
/* 目录兜底：TOC 为空时从 PDF 书签生成（新迁入的书多半没有手工目录） */
function outlineToc(d){
  return d.getOutline().then(function(ol){
    var out=[]; if(!ol||!ol.length) return out;
    function walk(items,l){
      return items.reduce(function(p,it){
        return p.then(function(){
          var ds=it.dest;
          return (typeof ds==='string'? d.getDestination(ds) : Promise.resolve(ds))
            .then(function(x){ return x ? d.getPageIndex(x[0]) : null; })
            .then(function(ix){
              if(ix!=null){ var g=ix+1, pr=g-CFG.offset+1; out.push({t:it.title, p:pr>0?String(pr):'', g:g, l:l===1?1:2}); }
              if(it.items && it.items.length && l<2) return walk(it.items,l+1);
            }).catch(function(){});
        });
      }, Promise.resolve());
    }
    return walk(ol,1).then(function(){ return out; });
  }).catch(function(){ return []; });
}
function buildToc(){
  var box=$('dlist'); box.innerHTML='';
  TOC.forEach(function(e){
    var a=document.createElement('a');
    a.className = e.l===1?'l1':'l2';
    a.href='#'; a.innerHTML='<span>'+e.t.replace(/</g,'&lt;')+'</span><span class="n">'+e.p+'</span>';
    a.onclick=function(ev){ ev.preventDefault(); go(e.g ? e.g : (+e.p)+CFG.offset-1); closeDrawer(); };
    box.appendChild(a);
  });
}
function closeDrawer(){ $('drawer').classList.remove('open'); }

/* ── 全书检索 ── */
function search(q){
  if(!q){ $('dHead').textContent='目　录'; buildToc(); return; }
  var box=$('dlist'); box.innerHTML=''; $('dHead').textContent='检索：'+q;
  var found=0, scanned=0;
  msg('正在检索全书…');
  function scan(i){
    if(i>total || found>=120){ hideMsg(); if(!found){ box.innerHTML='<div class="hit">没有找到。</div>'; } return; }
    var pr = textCache[i] ? Promise.resolve(textCache[i])
      : doc.getPage(i).then(function(p){ return p.getTextContent(); })
          .then(function(tc){ var s=tc.items.map(function(x){return x.str;}).join(''); textCache[i]=s; return s; });
    pr.then(function(s){
      var k=s.indexOf(q);
      if(k>=0){
        found++;
        var d=document.createElement('div'); d.className='hit';
        var a=Math.max(0,k-16), b=Math.min(s.length,k+q.length+22);
        d.innerHTML='<b>'+(i-CFG.offset+1)+'</b>　'+s.slice(a,k).replace(/</g,'&lt;')+
          '<b>'+q.replace(/</g,'&lt;')+'</b>'+s.slice(k+q.length,b).replace(/</g,'&lt;');
        d.onclick=function(){ go(i); closeDrawer(); };
        box.appendChild(d);
      }
      scanned++;
      if(scanned%12===0){ $('msgT').textContent='正在检索全书…  '+Math.round(i/total*100)+'%'; }
      scan(i+1);
    }).catch(function(){ scan(i+1); });
  }
  scan(1);
}

/* ── 缩略图 ── */
var thumbsBuilt=false;
function buildThumbs(){
  if(thumbsBuilt) return; thumbsBuilt=true;
  var wrap=$('thumbs');
  var i=1;
  function one(){
    if(i>total) return;
    var p=i;
    doc.getPage(p).then(function(pg){
      var vp=pg.getViewport({scale:1});
      var s=150/vp.height, v=pg.getViewport({scale:s});
      var c=document.createElement('canvas');
      c.width=v.width; c.height=v.height; c.dataset.p=p;
      c.onclick=function(){ go(p); };
      wrap.appendChild(c);
      return pg.render({canvasContext:c.getContext('2d'), viewport:v}).promise;
    }).then(function(){ i++; setTimeout(one, 0); }).catch(function(){ i++; setTimeout(one,0); });
  }
  one();
}

/* ── 事件 ── */
$('btnPrev').onclick=function(){ step(-1); };
$('btnNext').onclick=function(){ step(1); };
$('pi').onchange=function(){ go((+this.value||1)+CFG.offset-1); };
$('btnToc').onclick=function(){ $('drawer').classList.toggle('open'); };
$('btnSpread').onclick=function(){ spread=!spread; this.textContent=spread?'双页':'单页'; show(); hint(spread?'双页对开':'单页'); };
$('btnVec').onclick=function(){ vector=!vector; this.classList.toggle('on',vector);
  this.textContent=vector?'矢量':'位图'; hint(vector?'矢量源渲染':'高清位图'); show(); };
$('btnZoomIn').onclick=function(){ zoom=Math.min(2.4, zoom*1.15); show(); hint('放大 '+Math.round(zoom*100)+'%'); };
$('btnZoomOut').onclick=function(){ zoom=Math.max(.5, zoom/1.15); show(); hint('缩小 '+Math.round(zoom*100)+'%'); };
$('btnThumbs').onclick=function(){ $('thumbs').classList.toggle('open'); if($('thumbs').classList.contains('open')) buildThumbs(); };
$('btnTheme').onclick=function(){ ti=(ti+1)%3; document.documentElement.className=themes[ti];
  this.textContent=['夜','日','纸'][ti]; show(); };
$('btnFull').onclick=function(){ if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); };
$('q').onkeydown=function(e){ if(e.key==='Enter'){ search(this.value.trim()); } };
$('rail').onclick=function(e){ var r=this.getBoundingClientRect();
  go(Math.round((e.clientX-r.left)/r.width*(total-1))+1); };

document.addEventListener('keydown',function(e){
  if(/input|textarea|select/i.test((e.target.tagName||''))) return;
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ step(-1); e.preventDefault(); }
  else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ step(1); e.preventDefault(); }
  else if(e.key==='Home'){ go(1); } else if(e.key==='End'){ go(total); }
  else if(e.key==='t'||e.key==='T'){ $('btnToc').click(); }
  else if(e.key==='d'||e.key==='D'){ $('btnSpread').click(); }
  else if(e.key==='v'||e.key==='V'){ $('btnVec').click(); }
  else if(e.key==='n'||e.key==='N'){ $('btnTheme').click(); }
  else if(e.key==='f'||e.key==='F'){ $('btnFull').click(); }
});
var sx=0, sy=0;
$('stage').addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$('stage').addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>52 && Math.abs(dx)>Math.abs(dy)*1.4){ step(dx<0?1:-1); }
},{passive:true});
var rt=null;
window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ show(); },160); });

/* ── 启动 ── */
function boot(){
  if(!window.pdfjsLib){ setTimeout(boot,120); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  $('btnVec').classList.add('on');
  msg('正在载入《法学学派解构入门》…');
  pdfjsLib.getDocument({url:CFG.pdf, rangeChunkSize:262144, fontExtraProperties:true, isOffscreenCanvasSupported:false, cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked:true, standardFontDataUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'}).promise.then(function(d){
    doc=d; total=d.numPages;
    buildToc();
    if(!TOC.length){ outlineToc(d).then(function(t){ if(t.length){ TOC=t; buildToc(); } }); }
    var saved=0; try{ saved=parseInt(localStorage.getItem(CFG.key)||'0',10)||0; }catch(e){}
    cur = (saved>0&&saved<=total) ? saved : 1;
    if(window.innerWidth<820) spread=false, $('btnSpread').textContent='单页';
    show(function(){ if(saved>1) hint('已回到上次读到的第 '+Math.max(1,cur-CFG.offset+1)+' 页'); });
  }).catch(function(err){
    msg('书页载入失败。可直接打开原文 PDF：'+CFG.pdf, false);
  });
}
boot();
})();
