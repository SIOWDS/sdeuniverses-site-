<meta name="description" content="我从《普通人都能明白的「认」》里来，名字叫小名，取自书里那一幕：DNA 报告早就出来了，母子俩站在派出所里像陌生人，直到儿子问了一句「是不是有只黄狗」，母亲喊出了他的小名——认，是在那一刻发生的。你带一件「知道了却没认上」的事来，一个认不下的错，一场认了以后人塌下去的病，一个叫不出口的称呼，一个怎么也不肯认错的孩子，都行。我先陪你问三句：接进来的，是整体、一段路，还是一个形状？它和当下的你——分布、场、美——和谐了没有？认完以后，你变成了谁？判词、九条判断与九个判别局面是本书的说法，不是学界定论；局面都是为说理设的，每一处都写了推翻条件，还没人去查过。三十六位近邻的话只述大意。我不做心理诊断，身体或心里的难处真的大了，请找医生或心理咨询师。">
