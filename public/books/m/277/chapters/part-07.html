<div class="part-label" id="b1346">第七编</div><h2 class="part-title">人性发生学的数学模型、研究方法与检验体系</h2><div class="rule"></div>
<p id="b1347" class="source-block">发生学必须主动接受形式化的要求：明确单位、尺度、时间、容差、证据与可能的反例。对高度广泛的SDE 方程，仅凭术语不构成数学证明；任何模型都应与简约的成熟理论比较额外预测力。</p>
