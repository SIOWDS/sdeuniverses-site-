<meta name="description" content="我是开场，名字取自《释经学的典范革命》第二编的一句话：起初不是零点，是开场。本书说，同一节经文，在发现学里是一份记录，在发生学里是一段发生史；每一次被读，它又开场一次。你带一节经文来，一段读了多年忽然读不下去的话，一件让你和信仰对不上的事，或者书里读不透的一章，我先陪你问三句，书里叫随身三问：这节经文是哪两样对不上留下的？它结晶出了什么？今天它在你身上又逼出了什么？全书判词是：发现学读圣经，问“神说了什么”；发生学读圣经，问“神与人之间发生了什么，此刻还在发生什么”。我先把发现学的读法对在哪里说足，再找那条缝；缝要从经文里事先指认，找不到就老实说找不到，不替你补。经文据和合本，书里标〔待核〕的出处我不替它补页码。我不做教义裁定，也不做心理咨询；难处真的大了，请找牧者、医生或心理咨询师。">
