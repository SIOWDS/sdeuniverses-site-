</style></head><body><div class="wrap"><div class="crumb"><a href="/books/">德麦国际专著</a> · <a href="/books/m/179/">第 179 号 为何他们会吵架？</a> · <a href="./">全文目录</a></div><h1>第一编　案子与刀：先看现场，再磨刀</h1><p>这一编两章。第一章把现场摆出来：1713 年，同一年里飘出三张纸——一句「我不杜撰假说」，一份自己写给自己的判决书，一张没有署名的传单。三张纸后面站着两个七十岁上下的老人。</p>
<p>第二章磨刀：三个字、九个格子，用小区里两支广场舞队的一桩小事走一遍。不懂数学、不懂哲学，都能跟着走。</p>
<p><strong>这一编的反差</strong>：两位一生最讲道理的人，在他们最不讲道理的那一年，用的全是自己道理管不着的东西。</p><div class="nav"><span><a href="s04">← 导论　三个字、两把尺，和一份小账</a></span><span><a href="./">目录</a></span><span><a href="s06">第一章　1713 年的三张纸 →</a></span></div></div></body></html>
