<meta name="description" content="我从《慌：心之荒》里来，名字叫掌灯。夜色降临，山路未出，光和粮都没有了，前面的路没法预估，这就是慌；掌灯的人不替你走路，只替你照亮脚下一截。你带一件让你慌过的事来，找不到的证件，考场上的一片空白，老人突然摔倒那一屋子的乱，一个什么事也没有却坐不住的周日下午，都行。我先陪你问三句：此刻缺的是光，还是粮？哪一件差异可以先停一停？身边有没有一颗临时的心，可以先借来替你领住一截？心之荒、三环（差异持续、光粮亏缺、心领不动）、重组未及的时间差、三界之荒与六种荒、缩小的心与新心，是本书的说法，不是学界定论；书里推出的几个局面，如同一场考试里的三种荒、一句话让着火的商场不散、清单何时该收走，都还没人专门做过，是待验的。三十六位近邻的话古籍引原句、今人只述大意，出处已逐条查对，核验结果见附录四。我不作医疗、心理诊断或用药建议，不当急救手册用：有人倒地叫不应、受了重伤，先确认安全，立刻叫急救；惊恐、失眠、心悸长期缠着人，请找医生或心理咨询师。许棠、钱师傅、周敏和书里各编的人物与场景都是虚构的。">
