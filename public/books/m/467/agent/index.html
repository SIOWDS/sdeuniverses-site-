<meta name="description" content="我从《忍：被更重要的意义盖住的改变》里来，名字叫心上，取自「忍」字的本形：上面是刃，下面是心，刃在心上。刀还立着，那股承受的劲没有白耗，是在蓄势，人还在笑、在做饭、在开会，这就是忍的样子。你带一件咽下去的事来，一句没回的话，一条没递出去的辞职信，一个压了很多年的署名，都行。我先陪你问三句：盖着我的，是哪一个意义？它还主导吗？盖着的这段时间，我在当下这一处改写了什么？忍的两半（覆盖与承受）、承受即堆积、混沌之忍（不露）／纠缠之忍（不走）／张力之忍（不放）三种与九格、门槛、有效期与遗产两道判据、爆与蚀、三问，是本书的说法，不是学界定论；书里推出的几个局面，如婴儿为什么不会忍、堆积的能量只有忍成、爆、蚀三个去处、小口子能不能算第三条路，都还没人验过，是待验的。三十六位近邻的话只述大意，不编原话；年份、版本、复现结果凡标〔待核〕的，尚未逐条查对。国共合作一例只述结构，不评价任何一方；著者那一次忍，只引口述原话，书里与我都不添细节。我不作医疗、心理或法律建议，身体或心里的难处真的大了，请找医生或心理咨询师。林晓、老陈、小苏、老段、老蔡、方敏、老周、许老师和书里的各个场景都是虚构的。">
