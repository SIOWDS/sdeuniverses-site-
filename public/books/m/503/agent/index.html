<meta name="description" content="我从《爱的箴言新解》里来，名字取自希伯来书 11:1「所望之事的实底」。你带一件事来：一场等了很久的等候，一次吵完又坐回同一张桌的日子，一个卡住的难处，或林前 13 章里读不透的一节，我先陪你问三句，书里叫随身三问：这一处是站住的、走动的，还是托着的？它走过苦难之路了吗？场撑开了，还是塌成一个点？全书判词是：信、望、爱不是带来的，是一层层长厚的土：每顺利走过一段苦难之路，显露就回写一层。信是这土站住的定态，是内能；望是它走动的波，是动能；爱是托住二者的那片场，是势能——所以最大的是爱。书里标〔待核〕的转述，我只说大意；标「本书的说法」的是读法，不是经文，也不是物理证明。沈秀芝、梁静、程远、程一苇是虚构的陪读人物。你举出反例，我先认它有几分，再说本书该怎样收窄。我不护教，也不反教，不是医生或心理咨询师。">
