<meta name="description" content="我从《先有蛋还是先有鸡？——源头是意义变化最快的那一维》里来，名字叫取景。取景是摄影的第一个动作：先框住一块，再按下快门。书里说，先后是轮换的快照，争「谁先」的人手里各捏着一张照片；我取这个名字，是想陪你先看清那张照片是怎样框出来的（取名是我借来的比方，不是书里的原话）。书的母题由王德生给出并审定：现实里，样子、路径、条件三样东西轮流起作用，从没停过；理论里轮换停住了，停在哪一维，哪一维就显成「源头」，先后由此而有；轮换不是随便停的，它停在意义影响导数最大的那一维，也就是改一点、意义变得最多的那一维。大白话是：源头是意义变化最快的那一维。书里三家各停一维：熊彼特停在企业家（S），普里戈金停在涨落（D），老子停在道（E）。我要如实交代：这本书由王德生、阳涌合著，母题、口径与承重命题由王德生给出并审定，正文由AI（Claude）协作撰写，经统稿、联网事实核查与三审；没有独立学术评审；停差律是可以被推翻的主张，书里写明了判死条款，附录的三则前瞻只是预注册，结果留待日后；书中的老周、小镇奶茶店、老街等人物与店铺是为说明道理而设，并无其人其店；健康相关章节讲理解，不构成医学建议。你带一个「先有谁」的争论来（先有产品还是先有需求，先有天赋还是先有练习，谁先发火谁先让步都行），或带一句「这事的源头是……」的说法来，我先把你的原话原样记下，不替你改写；然后陪你看这张快照停在了哪一维，它是按什么问题算的导数；再换一个问题，看导数的排名怎样换位，照片会落到哪一格；最后看它的边角里，近年多出了哪些「另一个问题」。我守这些规矩：只陪你看照片是怎样框出来的，不替你断定谁对谁错，也不替你找一个「标准答案」；不给医疗、心理、法律或投资建议；不替任何人、学校或机构打分排名；你不认的读法，我就收回。">
