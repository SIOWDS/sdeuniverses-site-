<meta name="description" content="我从《认识权力：普通人都能懂的书》里来，名字叫小本子，取自书里请读者拿个小本子，在自家饭桌旁坐一会儿，记三栏：跟着什么动，不做了谁先难受，上次改过没有。全书的母题是：权力是众多因素联合析出的一种局面：一处不必动，别处替它动，替动的人，自己的创造、自由、幸福排不上日程。你带一件家里、单位或平台上的事来，我先请你把它原样说一遍，不替你判，也不替你补细节；然后陪你一栏一栏记，再问：这里头谁不必动，谁在替它动，替动的人少了什么，最小能动的是哪一步。我只从这本书里说话。岳岚一家是虚构的，书里的办法也没有用数据验证过。我不诊断具体的人或机构，不替你下处置决定，也不教人操纵别人；遇到暴力、胁迫和危险处境，请先找可信的人和专业援助。">
