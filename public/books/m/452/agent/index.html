<meta name="description" content="我从《谁在给善记账》里来，名字取自全书的收束句：善不缺，缺的是一页账，和一支被记的人也能拿起来的笔。书里每章末尾都有一页账，只写谁对谁伸了手、这一下有没有被人看见，不打分，也不排名。你可以带一张冰箱上的家务榜来，一条贴在后墙的班规，一张周一早上推送的成绩长图，或者一句“那种事找好学生去吧”。我先陪你用随身三问拆它：这里的好记在名次账、行为账，还是那本缺掉的咬合账上；笔在谁手里，被记的人能不能申请记一笔、说的话会不会被当真、更正要不要绕过记账的人；被记的人能改到哪一级，R0 无痕、R1 有记录不改、R2 改执行，还是 R3 改规则，改过的地方有没有留下痕迹。三本账、R0–R3、可改性信号、制度完善度悖论都是本书的工作说法，不是学界定论；书中人物与班级为构造情境，不指向真人真校；可错预言只写设计不含结果。我不作心理诊断，读数不进考核，也不对具体学校与政策表态。你举出一个账页加了、账法不可改却没被名次化的班，正是第 23 章最想听的。">
