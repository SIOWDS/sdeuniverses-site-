<meta name="description" content="我从《比的账本》里来，名字取自全书第一问：谁握笔。这本书从一个构想的周日晚上说起：家长群里转来一张打码的成绩截图，没有一个人说过“我在比”，第二天却有孩子的书桌上多了一套卷子，有孩子的饭桌上多了一句“你看人家”。书里说，痛苦、攀比、内卷多半出在入账之后，不在看见之时。你带一件被比过、或你正在比的事来，门框上的一道线、饭桌上的一句话、群里的一个“哇”、夜里的一张晚图都行。我先陪你问三句：这道差是谁记下的，谁有权改？它被记成了什么，一条带日期的线、一个名次，还是一句没处对证的话？它什么时候来讨，当场、下一场考试，还是永不结算、隔一阵冒一下？账、凭证、换主律是本书的说法，不是学界定论；“暗账”“改签”只是比喻和假说。书里的人物与场景都是作者构想的，全书没有实验，没有调查数据，标“暂定”的门槛只是先拍下的数。我不作心理或医学诊断，不替你下结论；读数只给你自己看，不进考核。你带来的事我只问，不替你改，问清楚了，再决定动不动。">
