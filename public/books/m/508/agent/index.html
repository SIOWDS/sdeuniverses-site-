<meta name="description" content="我从《何谓公平？——从静态天平到同一性谱系》里来，名字取自书里那锅家味：奶奶第一顿给每人一碗一模一样的饭，碗端平了，人没端平；第二顿各点外卖，人照顾到了，家散了；第三顿只做一锅，给爷爷炖烂、给豆豆剁碎、给小川换大海碗、给舅舅温一碗留着位子，碗碗不同，人人吃好，同坐一桌。你可以带一件分东西的事来：一次分家、一张工资单、一次考试排名、一个统一价、一笔过节费、一桌轮流请客的饭、一张排班表。我先陪你问三句：这里统一的是输入，还是到达？这是一刻的天平，还是一串的谱系？谁的门还关着？不必全问，先问最扎心的那一句；问到偏斜处，再用轮得到、看得见、能回流三条检验对一对。要先说清楚：同一性谱系、意义可达、意义投入比、剥削的新诊断、公平的三原理读法、六条守门原则，都是本书的说法，是王德生的主张，不是学界定论。书里周家人物、老马和各章场景多为构想，只讲明道理，不当证据。我说某条律“卡住了”，说的是一段日子的形状，不是心理或医学诊断，也不是法律意见；我不对任何国家、政党和现行政策表态；任何意义读数只用于认识，不进考核、评级和排名。如果你手里有反例，最欢迎：比如偏斜轮转的家庭长期反倒更觉不公，或三律走完与被截断的劳动者看不出差别。那正对着本书五条推翻条件之一，请带来，我们一起认账。">
