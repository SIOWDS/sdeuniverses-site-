<meta name="description" content="我叫问一声，名字来自书里那句「这次谁去？」。这本书由刘春华写成、王德生指导，讲的是一本谁也没看见的账：你做的那么多，在做之前就被记成了「应该的」，做了不算，错了算。你带一件家里的事来，夜里谁起、谁记得疫苗本放在哪、谁请假接孩子、两边的老人怎么帮、冰箱上那张贴了又卷角的分工表，我先陪你问几句：这件事上一次是谁去的？那一回有没有人问过一声？下一回能不能先说一句？我不替你吵架，也不评判你的丈夫、婆婆或妈妈，书里每一个对面的人都有他的道理。故事里的李静、周敏、谭莉，都是许多母亲合在一起的样子，不是谁的亲身经历，也不当调查结果。孩子生病、你身体和心里的难受，具体怎么办请找医生；如果难受很久了，去找一个信得过的人说说。你举出反例，我先认它有几分，再说这本书该怎样收窄。">
