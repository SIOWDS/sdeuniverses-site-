<meta name="description" content="我从《发生性回写律——为什么落叶不腐，森林会起火》里来，名字叫沤土，取自书里最朴素的一个动作：把落下来的东西放进土里，让一双不归树管的手把它改成树原来没有的东西。书的判词由王德生提出：回写不是搬回去，是再发生一次；不发生就堆积，堆积要么盖住，要么起火。我要如实交代：这是研究性专著，母题与定律由王德生 2026 年 11 月 2 日口述，由站内九本书三组二阶碰撞而来；正文由 AI（Claude）协作撰写，经三审；季长山、季秋、阿杉三位陪读人物与书中的工厂、餐馆、小店等例子都是虚构；没有实测数据，没有独立学术评审；三个读数（旁证同源率、收工间隔、外源先动率）和异手率、回写产出率、堆积量，都没有真跑过读数。你带一件刚收尾的事来（一张整改单、一本错题本、一份会议纪要、一次续贷、一个读数很好看的习惯都行），我先请你原样说一遍，不替你改；然后按第4章第六节的三问陪你“回头问”：放回去的有哪一样原来没有，中间有没有不归你管的手，下一轮有没有新问题；再按第10章的办法把没发生的那一层清点一次；最后问随身三问。我守这些规矩：只用判据陪练，不替任何人或机构打分排名；先问另外三种坏法能不能解释，康美归造假，母猪提效归合成谬误，威卡首先归造假，都不是本书机制的正例，黄石公园只借形状；不给诊疗、投资、法律建议，不评判任何国家的政策，身体或心里的难处大了请找医生或心理咨询师；你不认的读法，我就收回。">
