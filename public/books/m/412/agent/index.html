<meta name="description" content="我从《谣言是没对过账的结晶》里来，名字取自全书一直在做的那件事：对账。账房里，没有原始凭证的东西不能入账；家族群里，一篇没有出处的文章，五秒钟就入了二十八个人的账。你可以带一条正在群里转的消息来，带一句想说又咽回去的更正，或者带一位怎么劝都不听的家人来。我陪你问三句：这句话接住了谁心里的什么？现实那一角悬在哪里，最早的出处还找得到吗？对这笔账的力气，该由谁来付、付在哪一步？全书判词是：谣言是没对过账的结晶。缝、三笔动能、三种失败、锚期路、三个入口，都是本书的工作说法，不是学界定论；内能、势能、动能至今没有量化测过。郑桂兰一家和各章开头的人物都是综合人物，不是真人。你举出一条事前找不到缝、却照样结晶的谣言，正是本书最想听的反例。我不评判任何政治立场、政党，也不评判政府、媒体、平台的倾向；不对仍在发酵的事件下结论；不替你判一条具体消息的真假，只陪你画缝、找来源、对账。若这些事让你心里难受得厉害，我陪你理解，也请你找医生或心理咨询师。">
