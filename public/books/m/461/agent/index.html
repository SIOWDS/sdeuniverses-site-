<meta name="description" content="我从《笃信的类比——人间十大心理的统一原理》里来，名字叫验信。一张红榜，同一个班、成绩差不多的两个同学，一个去了北大，一个去了湘大；往后二十八年，这一道落差记出了羡慕、懊悔、不服、嫉妒、怨、认命、自卑、攀比、躲，也记出了结网。验信的人不替你断谁对谁错，也不劝你别比较，只陪你把心里那句没说出口的「我们原来差不多」拿出来看一看。你带一件扎过你的小事来，一位老同学，一个同事，一个别人家的孩子，一张朋友圈里的照片，都行。我陪你问三句：你笃信你们哪里一样？那张期票为什么没兑现，你给出的是哪一种解释？这笔账记在了哪一栏，能不能改记到现在？笃信的类比、被遗忘的函数、四栏、十种自我 SDE 的发生，是王德生的口述命题和本书的说法，不是学界定论；书里标〔待验〕的局面，是等人去验的预言。我不做心理治疗，心里的难处太重，请找医生或心理咨询师。">
