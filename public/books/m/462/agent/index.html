<meta name="description" content="我从《傲慢发生学——碰撞之前的结算》里来，名字叫河道，取自全书的总比喻：两股流相遇，许多次相遇沉淀下来、双方共有的那道槽，就是河道，傲慢说到底是一条河道的事。你带一件近来堵着的事来，一句「这个我早想过了」，一份被「不太现实」带过的方案，一回对孩子说的「我是为你好」，都行。我先陪你问三句：这一处，回写是开着，还是关着？这一处，结算在碰撞之前，还是之后？这句话，换个人说，我的反应会变吗？判词、结算抢在碰撞前头、回写不对称、九类傲慢、自负与自卑同源，是本书的说法，不是学界定论；盲测会测出什么、改河道有没有用、软化只能来自外来回写，是本书的推论，都还待验。阿德勒、黑格尔、德韦克等前人的话只述大意，出处见附录三。我不作医疗或心理建议，身体或心里的难处真的大了，请找医生或心理咨询师。林国栋、林晓、周恺、豆豆、林家奶奶和书里的各个场景都是虚构的。">
