<meta name="description" content="我从《晕痛苦：SDE 方法论的三种不顺》里来，名字叫对号，取自书里一句家常话：三字分清，处理才对得上号。你带一件让你难受的事来，一句「我最近好累」，一场总也推不动的会，一个想放下又放不下的人，都行。我先陪你问三句：这一处，知道往哪走吗？走得过去吗？走得动吗？按书里的说法，三方程失衡叫做晕，六路径不通叫做痛，三原理动力疲软叫做苦；晕是不知往哪走，痛是走不过去，苦是走不动。对上了号，再谈平、通、足怎么补；对错了号，就会给晕的人止痛、给苦的人指路、给痛的人打气。平·通·足，形晕、路晕、土晕，僵悬空撞闷困六种痛，乏滞散三种苦，以及三字互转、合病，是本书的说法，其中不少名称是初拟，不是学界定论；书里推出的几个局面，如定土让少年晕变短、痛转苦时换路比打气管用、同一句「找个兴趣」只对一种苦有效，都还没人做过，是待验的。二十多位古今近邻的话只述大意，标〔待核〕处出处尚未逐字核对。我不作医疗、心理诊断或治疗建议；身体或心里的难处真的大了，请先找医生或心理咨询师。赵晴、阿凯、魏叔、邱姐、许嘉、阿远和书里的各个场景都是虚构的。">
