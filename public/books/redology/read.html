<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线阅读 · SDE红学 | SDE Universes</title>
<style>
:root{--ink:#2A0E0C;--gold:#D98A6A;--gold2:#C96A4A;--paper:#F7E9E0;--muted:#A66450}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1A0806;color:var(--paper);font-family:"Songti SC","Noto Serif SC",Georgia,serif;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,11,7,0.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(212,178,94,0.25);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;flex-wrap:wrap}
.tb-title{font-size:15px;color:var(--gold);letter-spacing:0.05em;white-space:nowrap}
.tb-title a{color:var(--muted);text-decoration:none;font-size:13px;margin-right:14px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:rgba(212,178,94,0.12);border:1px solid rgba(212,178,94,0.45);color:var(--gold);padding:7px 16px;border-radius:3px;font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:0.03em}
.btn:hover:not(:disabled){background:rgba(212,178,94,0.22)}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.pagebox{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--paper)}
.pagebox input{width:56px;background:#1A1410;border:1px solid rgba(212,178,94,0.4);color:var(--gold);padding:6px 8px;border-radius:3px;text-align:center;font-family:inherit;font-size:14px}
.pagebox .total{color:var(--muted)}
.zoom{display:flex;align-items:center;gap:4px}
.zoom .btn{padding:6px 12px}
.stage{display:flex;justify-content:center;padding:28px 16px 60px;min-height:60vh}
#canvas-wrap{position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.6);background:#fff;border-radius:2px;overflow:hidden;max-width:100%}
canvas{display:block;max-width:100%;height:auto}
.loading{text-align:center;color:var(--muted);padding:80px 20px;font-size:16px}
.spinner{width:40px;height:40px;border:3px solid rgba(212,178,94,0.25);border-top-color:var(--gold);border-radius:50%;margin:0 auto 20px;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{text-align:center;color:#E8A0A0;padding:60px 20px;line-height:1.9}
.err a{color:var(--gold)}
.navhint{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px;font-size:12px;color:var(--muted);background:linear-gradient(transparent,rgba(15,11,7,0.9));pointer-events:none}
.side-tap{position:fixed;top:64px;bottom:0;width:12%;z-index:5;cursor:pointer}
.side-tap.left{left:0}.side-tap.right{right:0}
@media(max-width:640px){.tb-title{font-size:13px}.side-tap{width:18%}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-title"><a href="/books/redology/">← 返回导读页</a>SDE红学 · 情悲发生学与空化解释学</div>
  <div class="controls">
    <button class="btn" id="prev" disabled>‹ 上一页</button>
    <div class="pagebox"><input id="pageInput" type="number" min="1" value="1"><span class="total">/ <span id="totalPages">…</span></span></div>
    <button class="btn" id="next" disabled>下一页 ›</button>
    <div class="zoom">
      <button class="btn" id="zoomOut">−</button>
      <button class="btn" id="zoomIn">＋</button>
    </div>
    <a class="btn" href="SDE-Redology-Preview.pdf" target="_blank" style="text-decoration:none">下载 PDF</a>
  </div>
</div>

<div class="stage">
  <div id="loading" class="loading"><div class="spinner"></div>正在载入试读版…<br><span style="font-size:13px">288 页 · 首次载入需要几秒</span></div>
  <div id="canvas-wrap" style="display:none"><canvas id="pdfCanvas"></canvas></div>
  <div id="error" class="err" style="display:none"></div>
</div>

<div class="side-tap left" id="tapLeft"></div>
<div class="side-tap right" id="tapRight"></div>
<div class="navhint">← → 方向键翻页 · 点击页面两侧翻页 · 可输入页码跳转</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const PDF_URL = "SDE-Redology-Preview.pdf"; // 同域相对路径，避免CORS
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDoc=null, pageNum=1, rendering=false, pending=null, scale=1.3;
const canvas=document.getElementById('pdfCanvas'), ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);

function render(num){
  rendering=true;
  pdfDoc.getPage(num).then(page=>{
    const vp=page.getViewport({scale});
    const ratio=window.devicePixelRatio||1;
    canvas.width=vp.width*ratio; canvas.height=vp.height*ratio;
    canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
    ctx.setTransform(ratio,0,0,ratio,0,0);
    page.render({canvasContext:ctx,viewport:vp}).promise.then(()=>{
      rendering=false;
      if(pending!==null){render(pending);pending=null;}
    });
  });
  $('pageInput').value=num;
  $('prev').disabled=(num<=1);
  $('next').disabled=(num>=pdfDoc.numPages);
}
function queue(num){ if(rendering) pending=num; else render(num); }
function go(n){ if(!pdfDoc)return; pageNum=Math.min(Math.max(1,n),pdfDoc.numPages); queue(pageNum); window.scrollTo({top:0,behavior:'smooth'}); }

pdfjsLib.getDocument(PDF_URL).promise.then(pdf=>{
  pdfDoc=pdf;
  $('totalPages').textContent=pdf.numPages;
  $('pageInput').max=pdf.numPages;
  $('loading').style.display='none';
  $('canvas-wrap').style.display='block';
  render(pageNum);
}).catch(err=>{
  $('loading').style.display='none';
  $('error').style.display='block';
  $('error').innerHTML='试读版暂时无法在线载入。<br>你仍可 <a href="'+PDF_URL+'" target="_blank">直接打开 / 下载 PDF</a> 阅读。<br><span style="font-size:12px;color:#8B7E5E">（'+err.message+'）</span>';
});

$('prev').onclick=()=>go(pageNum-1);
$('next').onclick=()=>go(pageNum+1);
$('tapLeft').onclick=()=>go(pageNum-1);
$('tapRight').onclick=()=>go(pageNum+1);
$('pageInput').onchange=e=>go(parseInt(e.target.value)||1);
$('zoomIn').onclick=()=>{scale=Math.min(scale+0.2,3);queue(pageNum);};
$('zoomOut').onclick=()=>{scale=Math.max(scale-0.2,0.6);queue(pageNum);};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(pageNum-1);
  if(e.key==='ArrowRight')go(pageNum+1);
});
</script>
</body>
</html>
