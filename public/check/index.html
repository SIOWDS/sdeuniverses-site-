<script>
(function(){
  var L=document.getElementById('log'); function p(s){var d=document.createElement('div');d.innerHTML=s;L.appendChild(d);}
  L.textContent='';
  window.onerror=function(m,src,ln){p('<b class="bad">运行错误:</b> '+m+' @'+(src||'')+':'+ln);};
  p('JS 运行: <b>✓</b>');
  p('浏览器 UA: '+navigator.userAgent);
  p('共享池加载: <b>'+(window.DQ?('✓ '+window.DQ.length+' 句'):'✗ 未加载')+'</b>');
  try{var d=new Date();var t=window.DQ_pickForDate(d.getFullYear(),d.getMonth()+1,d.getDate());
    p('今日抽取: <b>✓</b> '+t.map(function(q){return q.t.slice(0,12)+'…'}).join(' / '));
  }catch(e){p('<b class="bad">抽取失败:</b> '+e.message);}
  p('本页时间: '+new Date().toString());
  p('— 今日热点上线探测 —');
  function probe(url,label,mark){
    return fetch(url,{cache:'no-store'}).then(function(r){
      return r.text().then(function(tx){
        var hit = tx.indexOf(mark)>=0;
        p(label+': HTTP <b>'+r.status+'</b> · 标记'+(hit?'<b>✓ 命中</b>':'<b class="bad">✗ 未命中</b>'));
        return hit;
      });
    }).catch(function(e){p(label+': <b class="bad">请求失败</b> '+e.message); return false;});
  }
  probe('/hotspot/three-news-one-mistake/?r='+Date.now(),'① 新文章页(绕缓存)','三条新闻')
  .then(function(){return probe('/?r='+Date.now(),'② 首页(绕缓存)','three-news-one-mistake');})
  .then(function(){return probe('/','③ 首页(常规请求)','three-news-one-mistake');})
  .then(function(){p('判读: ①✓②✓③✓＝一切已上线,问题在你设备; ①✓③✗＝首页边缘缓存滞留; ①✗＝部署未含新文.');});
})();
</script>
