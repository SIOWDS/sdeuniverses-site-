<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相互参验：AI 时代亲密关系困境的发生学重判 · 在线阅读 | 婚姻幸福专栏</title>
<style>
:root{--ink:#1A1410;--gold:#D4B25E;--gold2:#B8901F;--paper:#F5EFE0;--muted:#8B7E5E}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F0B07;color:var(--paper);font-family:"Songti SC","Noto Serif SC",Georgia,serif;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,11,7,0.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(212,178,94,0.25);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;flex-wrap:wrap}
.tb-title{font-size:15px;color:var(--gold);letter-spacing:0.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tb-title a{color:var(--muted);text-decoration:none;font-size:13px;margin-right:14px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:rgba(212,178,94,0.12);border:1px solid rgba(212,178,94,0.45);color:var(--gold);padding:7px 16px;border-radius:3px;font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:0.03em}
.btn:hover:not(:disabled){background:rgba(212,178,94,0.22)}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.pagebox{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--paper)}
.pagebox input{width:56px;background:#1A1410;border:1px solid rgba(212,178,94,0.4);color:var(--gold);padding:6px 8px;border-radius:3px;text-align:center;font-family:inherit;font-size:14px}
.pagebox .total{color:var(--muted)}
.zoom{display:flex;align-items:center;gap:4px}
.zoom .btn{padding:6px 12px}
.stage{display:flex;justify-content:center;padding:28px 16px 60px;min-height:60vh}
#page-wrap{position:relative;display:inline-block;line-height:0;box-shadow:0 20px 60px rgba(0,0,0,0.6);background:#fff;border-radius:2px;overflow:hidden}
canvas{display:block}
.textLayer{position:absolute;left:0;top:0;overflow:hidden;line-height:1;opacity:1;z-index:3;text-align:initial}
.textLayer span{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(61,165,165,0.42)}
.textLayer ::-moz-selection{background:rgba(61,165,165,0.42)}
.loading{text-align:center;color:var(--muted);padding:80px 20px;font-size:16px}
.spinner{width:40px;height:40px;border:3px solid rgba(212,178,94,0.25);border-top-color:var(--gold);border-radius:50%;margin:0 auto 20px;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{text-align:center;color:#E8A0A0;padding:60px 20px;line-height:1.9}
.err a{color:var(--gold)}
.navhint{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px;font-size:12px;color:var(--muted);background:linear-gradient(transparent,rgba(15,11,7,0.9));pointer-events:none;z-index:15}
.side-tap{position:fixed;top:64px;bottom:0;width:10%;z-index:5;cursor:pointer}
.side-tap.left{left:0}.side-tap.right{right:0}
@media(max-width:640px){.tb-title{font-size:13px;max-width:38vw}.side-tap{width:14%}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-title"><a href="/marriage-happiness/">← 返回文章</a>相互参验：AI 时代亲密关系困境的发生学重判</div>
  <div class="controls">
    <button class="btn" id="prev" disabled>‹ 上一页</button>
    <div class="pagebox"><input id="pageInput" type="number" min="1" value="1"><span class="total">/ <span id="totalPages">…</span></span></div>
    <button class="btn" id="next" disabled>下一页 ›</button>
    <div class="zoom">
      <button class="btn" id="zoomOut">−</button>
      <button class="btn" id="zoomIn">＋</button>
    </div>
    <a class="btn" href="mutual-attestation.pdf?v=20260802b" target="_blank" style="text-decoration:none">下载 PDF</a>
  </div>
</div>

<div class="stage" id="stage">
  <div id="loading" class="loading"><div class="spinner"></div>正在展开长卷…<br><span style="font-size:13px">18 页 · 首次载入只需一两秒</span></div>
  <div id="page-wrap" style="display:none"><canvas id="pdfCanvas"></canvas><div class="textLayer" id="textLayer"></div></div>
  <div id="error" class="err" style="display:none"></div>
</div>

<div class="side-tap left" id="tapLeft"></div>
<div class="side-tap right" id="tapRight"></div>
<div class="navhint">← → 方向键翻页 · 点击页面两侧翻页 · 选中正文任意一句可问 WDS</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var PDF_URL = "mutual-attestation.pdf?v=20260802b";
var BOOK_TITLE = "相互参验：AI 时代亲密关系困境的发生学重判";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

var pdfDoc=null, pageNum=1, rendering=false, pending=null, baseScale=1.3, currentPageText="";
var canvas=document.getElementById('pdfCanvas'), ctx=canvas.getContext('2d');
var pageWrap=document.getElementById('page-wrap'), textLayer=document.getElementById('textLayer');
var $=function(id){return document.getElementById(id);};

// 自绘文字层：getTextContent + Util.transform 定位透明 span（全 PDF.js 版本稳定），横向按原始字宽校正
function drawTextLayer(tc, viewport){
  textLayer.innerHTML='';
  var frag=document.createDocumentFragment(), fix=[];
  tc.items.forEach(function(it){
    if(!it.str) return;
    var m=pdfjsLib.Util.transform(viewport.transform, it.transform);
    var fs=Math.hypot(m[2], m[3]);
    if(!fs) return;
    var ang=Math.atan2(m[1], m[0]);
    var sp=document.createElement('span');
    sp.textContent=it.str;
    var css='left:'+m[4].toFixed(2)+'px;top:'+(m[5]-fs).toFixed(2)+'px;font-size:'+fs.toFixed(2)+'px;';
    if(Math.abs(ang)>0.01) css+='transform:rotate('+ang.toFixed(4)+'rad);';
    sp.style.cssText=css;
    frag.appendChild(sp);
    fix.push([sp, it.width*viewport.scale, ang]);
  });
  textLayer.appendChild(frag);
  fix.forEach(function(w){
    var sp=w[0], target=w[1], ang=w[2];
    if(!target) return;
    var real=sp.getBoundingClientRect().width;
    if(real>1){ var sx=target/real; if(sx>0.1 && sx<10){ sp.style.transform=(Math.abs(ang)>0.01?('rotate('+ang.toFixed(4)+'rad) '):'')+'scaleX('+sx.toFixed(3)+')'; } }
  });
}

function render(num){
  rendering=true;
  pdfDoc.getPage(num).then(function(page){
    var avail=($('stage').clientWidth||window.innerWidth)-36;
    var vp1=page.getViewport({scale:1});
    var s=baseScale;
    if(vp1.width*s>avail && avail>120) s=avail/vp1.width;   // 适配容器宽度，避免 CSS 缩放导致文字层错位
    var vp=page.getViewport({scale:s});
    var ratio=Math.min(window.devicePixelRatio||1, 2.5);
    canvas.width=Math.floor(vp.width*ratio); canvas.height=Math.floor(vp.height*ratio);
    canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
    pageWrap.style.width=vp.width+'px'; pageWrap.style.height=vp.height+'px';
    ctx.setTransform(ratio,0,0,ratio,0,0);
    page.render({canvasContext:ctx, viewport:vp}).promise.then(function(){
      return page.getTextContent();
    }).then(function(tc){
      currentPageText=tc.items.map(function(i){return i.str;}).join(' ').replace(/\s+/g,' ').trim();
      drawTextLayer(tc, vp);
      rendering=false;
      if(pending!==null){ var p=pending; pending=null; render(p); }
    });
    $('pageInput').value=num;
    $('prev').disabled=(num<=1);
    $('next').disabled=(num>=pdfDoc.numPages);
  });
}
function queue(num){ if(rendering) pending=num; else render(num); }
function go(n){ if(!pdfDoc)return; pageNum=Math.min(Math.max(1,n),pdfDoc.numPages); queue(pageNum); window.scrollTo({top:0,behavior:'smooth'}); }

pdfjsLib.getDocument(PDF_URL).promise.then(function(pdf){
  pdfDoc=pdf;
  $('totalPages').textContent=pdf.numPages;
  $('pageInput').max=pdf.numPages;
  $('loading').style.display='none';
  $('page-wrap').style.display='inline-block';
  render(pageNum);
}).catch(function(err){
  $('loading').style.display='none';
  $('error').style.display='block';
  $('error').innerHTML='全书暂时无法在线载入。<br>你仍可 <a href="'+PDF_URL+'" target="_blank">直接打开 / 下载 PDF</a> 阅读。<br><span style="font-size:12px;color:#8B7E5E">（'+err.message+'）</span>';
});

$('prev').onclick=function(){go(pageNum-1);};
$('next').onclick=function(){go(pageNum+1);};
$('tapLeft').onclick=function(){go(pageNum-1);};
$('tapRight').onclick=function(){go(pageNum+1);};
$('pageInput').onchange=function(e){go(parseInt(e.target.value)||1);};
$('zoomIn').onclick=function(){baseScale=Math.min(baseScale+0.2,3);queue(pageNum);};
$('zoomOut').onclick=function(){baseScale=Math.max(baseScale-0.2,0.6);queue(pageNum);};
document.addEventListener('keydown',function(e){
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(e.key==='ArrowLeft')go(pageNum-1);
  if(e.key==='ArrowRight')go(pageNum+1);
});
window.addEventListener('resize',function(){clearTimeout(window._rz);window._rz=setTimeout(function(){queue(pageNum);},220);});

// —— 接入 SDE 陪读：把「当前页文本 + 页码」喂给助手，文字层让读者能选中某句作焦点 ——
window.WDS_READ = {
  title: BOOK_TITLE,
  bodyEl: function(){ return document.getElementById('page-wrap'); },
  docTextFn: function(){ return currentPageText ? ('【第 '+pageNum+' 页 / 共 '+(pdfDoc?pdfDoc.numPages:'?')+' 页】\n'+currentPageText) : ''; }
};
</script>
<script src="/taste/wds-companion/wds-read.js?v=20260817c" defer></script>

<script src="/wds-mode.js?v=20260819a" defer></script>
</body>
</html>
