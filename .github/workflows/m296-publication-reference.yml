name: M296 publication reference
on:
  push:
    branches: ['publish/m296-20261002']
    paths: ['.github/workflows/m296-publication-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/education-subject-rebirth/vendor/
      - name: Preserve the existing reader library and source reference
        run: |
          python - <<'PY'
          import pathlib,zipfile,os,urllib.request,json
          root=pathlib.Path('.');out=pathlib.Path(os.environ['RUNNER_TEMP'])/'m296-reference';out.mkdir()
          vendor=root/'public/books/education-subject-rebirth/vendor'
          files=[f for f in vendor.rglob('*') if f.is_file() and f.suffix in ['.js','.txt']]
          assert any(f.name=='pdf.min.js' for f in files)
          with zipfile.ZipFile(out/'reference.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in files:z.write(f,'vendor/'+str(f.relative_to(vendor)))
            url='https://sdeuniverses.com/students/wang-desheng/my-three-treasures/m220/my-three-treasures-reader-v3.pdf'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (M296-publication-reference)'})
              data=urllib.request.urlopen(req,timeout=35).read(24*1024*1024)
              if data.startswith(b'%PDF'):z.writestr('220-reader.pdf',data)
            except Exception as exc:print('PDF reference retrieval:',type(exc).__name__)
          print(json.dumps({'vendor_files':len(files),'no_reindex':True}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m296-vendor-and-print-reference
          path: ${{ runner.temp }}/m296-reference/reference.zip
          retention-days: 2
