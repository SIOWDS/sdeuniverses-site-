# 第 573 号《从聪明到智慧》上站后补建本书的碰撞库 rag.json（build_book_rag.py 要读全站正文，云端会话的稀疏检出读不全，故放到 Actions 里跑）。
# 只写 public/books/m/573/rag.json；跑完即可删掉本文件。
name: m573-rag-20261104
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m573-rag-20261104.yml
  workflow_dispatch:
concurrency:
  group: m573-rag
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  rag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 建碰撞库
        run: |
          pip install -q numpy scikit-learn
          test -f public/books/m/573/text/index.html
          python3 tools/build_book_rag.py 573
          python3 -c "import json;d=json.load(open('public/books/m/573/rag.json'));print({k:(len(v) if isinstance(v,(list,dict)) else v) for k,v in d.items()})"
      - name: 推回 main
        run: |
          git config user.name  "SIOWDS"
          git config user.email "wangdesheng1234567@gmail.com"
          git add public/books/m/573/rag.json
          if git diff --cached --quiet; then echo "rag 未变"; exit 0; fi
          git commit -q -m "Build collision RAG for monograph No.573 (From Cleverness to Wisdom)"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then break; fi
            git fetch -q --depth=50 origin main && git rebase -q FETCH_HEAD || { git rebase --abort; exit 1; }
            [ "$i" = 5 ] && exit 1
          done
