name: Book294 final numbering and reader acceptance p2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/book294-final-p2-20261005.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: book294-publication
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Receive exact final correction package
        run: |
          python3 - <<'PY'
          import urllib.request,pathlib,hashlib,zipfile,io,json,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'book294-p2';root.mkdir()
          url='https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-49f0-81fa-89d3-f5c2e1651781/raw?se=2026-10-05T02%3A31%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=ea5bc69b-bd14-5ac7-acd6-00c96cac2712&skoid=8cb40e9f-389f-4cf6-afaa-e5bd4c7fd98c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T01%3A14%3A51Z&ske=2026-10-06T01%3A14%3A51Z&sks=b&skv=2026-02-06&sig=Z6E9tEMxvAHoB9Dc%2BtPLjFL1%2BGrU7XkIeBPKSBXAJuI%3D'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/zip,application/octet-stream,*/*'});raw=urllib.request.urlopen(req,timeout=120).read();assert len(raw)==36204003 and hashlib.sha256(raw).hexdigest()=='0a24c27edfc26e2c998310dae010c8a389b14c360045f8a6b10b384f2f021cde'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for n in z.namelist():assert not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts
              z.extractall(root)
          for e in json.loads((root/'input-inventory.json').read_text()):
              p=root/e['path'];assert p.stat().st_size==e['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256'],e['path']
          m=json.loads((root/'book/publication-manifest.json').read_text());assert m['revision']=='20261005-p2' and m['release_sha256']=='1556736789c1841dff476bd429df57770c45bd42412769437bda26e5acddb51d'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: book294-p2-received
          path: ${{ runner.temp }}/book294-p2
          retention-days: 14
      - name: Prepare real browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify corrected PDF selector and unique appendix headings before updating live
        run: |
          python3 "${RUNNER_TEMP}/book294-p2/build-tools/browser_qa.py" "${RUNNER_TEMP}/book294-p2"
          python3 "${RUNNER_TEMP}/book294-p2/build-tools/stamp_candidate.py" "${RUNNER_TEMP}/book294-p2"
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re
          root=Path(os.environ['RUNNER_TEMP'])/'book294-p2';s=(root/'book/chapters.html').read_text()
          assert '附录五' in s and '附录六' in s
          m=json.loads((root/'book/publication-manifest.json').read_text());assert m['release_sha256']=='1556736789c1841dff476bd429df57770c45bd42412769437bda26e5acddb51d'
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/294/
            /.github/workflows/search-index.yml
      - name: Update only the known parent edition without touching catalog or other books
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,subprocess,shutil,time,datetime
          root=Path(os.environ['GITHUB_WORKSPACE']);cand=Path(os.environ['RUNNER_TEMP'])/'book294-p2';new=json.loads((cand/'book/publication-manifest.json').read_text());parent=new['parent_release_sha256']
          def git(*args,check=True):return subprocess.run(['git',*args],cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=check)
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          for attempt in range(4):
              git('fetch','--filter=blob:none','--depth=1','origin','main');git('reset','--hard','FETCH_HEAD');base=git('rev-parse','HEAD').stdout.strip();dest=root/'public/books/m/294';old=json.loads((dest/'publication-manifest.json').read_text());assert old['release_sha256']==parent,'Parent changed; refuse overwrite.'
              for e in old['files']:assert hashlib.sha256((dest/e['path']).read_bytes()).hexdigest()==e['sha256'],e['path']
              index_sha=hashlib.sha256((root/'.github/workflows/search-index.yml').read_bytes()).hexdigest();now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              shutil.copytree(cand/'book',dest,dirs_exist_ok=True);new.update(status='published',published_at=old['published_at'],revised_at=now,full_site_reindex_requested=False)
              (dest/'publication-manifest.json').write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\n')
              res=json.loads((dest/'book-reservation.json').read_text());res.update(release_sha256=new['release_sha256'],revision='20261005-p2',revised_at=now);(dest/'book-reservation.json').write_text(json.dumps(res,ensure_ascii=False,indent=2)+'\n')
              assert hashlib.sha256((root/'.github/workflows/search-index.yml').read_bytes()).hexdigest()==index_sha
              git('add','--sparse','public/books/m/294');changed=git('diff','--cached','--name-only').stdout.splitlines();assert changed and all(p.startswith('public/books/m/294/') for p in changed),changed
              git('commit','-m','Book294 final p2: number all six appendices consistently and synchronize PDF chapter navigation; preserve 72 chapters and 499 pages; no reindex')
              commit=git('rev-parse','HEAD').stdout.strip();res=git('push','origin','HEAD:main',check=False);print(res.stdout)
              if res.returncode==0:break
              if attempt==3:raise RuntimeError('Concurrent update; stopped without force push.')
              time.sleep(2)
          shutil.copy2(dest/'publication-manifest.json',cand/'book/publication-manifest.json');shutil.copy2(dest/'book-reservation.json',cand/'qa/published-reservation.json')
          (cand/'qa/publication-result.json').write_text(json.dumps({'success':True,'commit':commit,'base_commit':base,'first_publication_commit':'87114c4b5afa350ac93ac4f9254fcf43b19fc873','published_at':new['published_at'],'revised_at':now,'revision':'20261005-p2','release_sha256':new['release_sha256'],'changed_paths':changed,'catalog_unchanged_by_p2':True,'reindex_triggered':False},ensure_ascii=False,indent=2));print('FINAL_PUBLICATION_COMMIT',commit)
          PY
      - name: Verify every deployed book asset and three public bookshelves
        run: |
          python3 -u - <<'PY'
          from pathlib import Path
          import os,json,hashlib,urllib.request,time,concurrent.futures,re
          root=Path(os.environ['RUNNER_TEMP'])/'book294-p2';qa=root/'qa';m=json.loads((root/'book/publication-manifest.json').read_text());base='https://sdeuniverses.com/books/m/294/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=90) as r:return r.status,r.read()
          for i in range(40):
              try:
                  _,data=get(base+'publication-manifest.json?revision=20261005-p2');live=json.loads(data);assert live['release_sha256']==m['release_sha256'] and live['status']=='published';break
              except Exception as e:print('Waiting for final revision',i+1,str(e));time.sleep(12)
          else:raise RuntimeError('Final revision committed, deployment not yet verified.')
          pat=r'<link\s+rel="canonical"\s+href="[^"]*"\s*/?>|<meta\s+property="og:url"\s+content="[^"]*"\s*/?>'
          def verify(e):
              for attempt in range(6):
                  try:
                      status,data=get(base+e['path']);actual=hashlib.sha256(data).hexdigest();exact=actual==e['sha256'];ok=exact;kind='binary_or_static_exact'
                      if e['path'].endswith('.html'):
                          a=(root/'book'/e['path']).read_text();b=data.decode();ok=re.sub(pat,'',a)==re.sub(pat,'',b);kind='html_exact_except_existing_canonical_and_og_url_rewrite';canonical=re.findall(r'<link\s+rel="canonical"\s+href="([^"]*)"',b);og=re.findall(r'<meta\s+property="og:url"\s+content="([^"]*)"',b);assert canonical==og and len(canonical)==1 and canonical[0].startswith(base)
                      assert status==200 and ok,(e['path'],status,actual)
                      return {'path':e['path'],'status':status,'verification':kind,'passed':True,'exact_bytes_match':exact,'sha256':actual,'expected_sha256':e['sha256'],'bytes':len(data)}
                  except Exception:
                      if attempt==5:raise
                      time.sleep(8)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:results=list(pool.map(verify,m['files']))
          shelves=[]
          for url in ['https://sdeuniverses.com/books/','https://sdeuniverses.com/monographs/','https://read.sdeuniverses.com/library/']:
              status,data=get(url);assert status==200 and '西方哲学SDE发生树' in data.decode() and '/books/m/294/' in data.decode();shelves.append({'url':url,'status':status,'book294_present':True})
          report={'success':True,'revision':'20261005-p2','release_sha256':m['release_sha256'],'book_assets_verified':len(results),'html_verified':sum(e['path'].endswith('.html') for e in results),'non_html_exact_hash_match':sum(not e['path'].endswith('.html') for e in results),'only_html_change':'Existing site canonical URL normalization and corresponding og:url insertion; all other markup and text match exactly.','assets':results,'bookshelves':shelves,'reindex_triggered':False}
          (qa/'live-http-qa.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps({k:v for k,v in report.items() if k!='assets'},ensure_ascii=False,indent=2))
          PY
      - name: Verify final revision on real desktop and mobile browsers
        run: |
          python3 "${RUNNER_TEMP}/book294-p2/build-tools/browser_qa.py" "${RUNNER_TEMP}/book294-p2" "https://sdeuniverses.com/books/m/294/"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book294-p2-final-evidence
          path: ${{ runner.temp }}/book294-p2/qa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: book294-p2-complete-published-and-verified
          path: ${{ runner.temp }}/book294-p2
          retention-days: 30
