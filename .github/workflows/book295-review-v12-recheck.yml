name: Volume 295 v1.2 exact candidate reader recheck
on:
  push:
    branches: [book295-review-v12-20261002]
    paths: ['.github/workflows/book295-review-v12-recheck.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/m295-v12/
      - uses: actions/download-artifact@v4
        with:
          name: book295-v12-reviewed-candidate
          run-id: 36969653687
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/m295-candidate
      - name: Prepare reader verification
        run: |
          python -m pip install --disable-pip-version-check -q beautifulsoup4==4.13.5 PyMuPDF==1.26.4 playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Authenticate complete candidate and verify both readers
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'],'m295-candidate');book=root/'site/books/m/295'
          assert hashlib.sha256((book/'downloads/xuwu-b295-v1.2.docx').read_bytes()).hexdigest()=='aa1570677af9a384b12a62411ab9ec6f376432cac07dadca2fbf5b7be27b6a3c'
          assert hashlib.sha256((book/'downloads/xuwu-b295-reader-v1.2.pdf').read_bytes()).hexdigest()=='74690af4b6a4996a1b3ad0cd5a151692c3157a8993762702723b8efe6770ec94'
          m=json.loads((book/'publication-manifest.json').read_text())
          for name,item in m['files'].items():assert hashlib.sha256((book/name).read_bytes()).hexdigest()==item['sha256'],name
          assert m['pdfPages']==306 and m['bodyHanzi']==205114
          PY
          python tools/m295-v12/check.py "$RUNNER_TEMP/m295-candidate/site" "$RUNNER_TEMP/m295-candidate/qa"
          cp tools/m295-v12/check.py "$RUNNER_TEMP/m295-candidate/check.py"
      - name: Preserve exact candidate and successful reader verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book295-v12-verified-candidate
          retention-days: 14
          path: ${{ runner.temp }}/m295-candidate/
