name: Book11 approved cover v1.2 final reader verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/book11-cover-v12-reader-check-20261003.yml']
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book11-approved-cover-v12-candidate
          run-id: 37074240339
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/book11-cover-v12
      - name: Install browser verification tools
        run: python -m pip install -q playwright==1.55.0
      - name: Supply exact accessible cover text without changing the approved PDF
        run: |
          python - <<'PY'
          import os,pathlib,hashlib,json,subprocess
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'book11-cover-v12';b=r/'book';p=b/'assets/reader.mjs'
          m=json.loads((b/'publication.json').read_text())
          for e in m['files']:assert hashlib.sha256((b/e['path']).read_bytes()).hexdigest()==e['sha256']
          s=p.read_text();old="tc.items.map(x=>x.str).join('')";assert s.count(old)==1
          new="(pn===1?'三律治理学\\n王德生 著\\n德麦国际':tc.items.map(x=>x.str).join(''))"
          p.write_text(s.replace(old,new));subprocess.run(['node','--check',str(p)],check=True)
          for e in m['files']:
            if e['path']=='assets/reader.mjs':e['bytes']=p.stat().st_size;e['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          m['cover_accessible_text']='三律治理学 / 王德生 著 / 德麦国际'
          (b/'publication.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))
          assert hashlib.sha256((b/'downloads/book-v1.2.pdf').read_bytes()).hexdigest()=='c4213cba4690489278fa0f3633827aa45d6c307cd4bb11554bb9a7ba5ac4a1ec'
          print('Approved PDF unchanged; accessible cover text supplied from its verified title and author.')
          PY
      - name: Prepare Chinese browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Verify desktop and mobile rendering of cover, complete body and navigation
        run: |
          mkdir -p "$RUNNER_TEMP/book11-cover-test/books/m"
          ln -s "$RUNNER_TEMP/book11-cover-v12/book" "$RUNNER_TEMP/book11-cover-test/books/m/11"
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/book11-cover-test" > "$RUNNER_TEMP/book11-cover-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python "$RUNNER_TEMP/book11-cover-v12/tools/browser_check.py" http://127.0.0.1:8765/books/m/11 "$RUNNER_TEMP/book11-cover-v12/qa/browser-local"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book11-approved-cover-v12-final
          retention-days: 7
          path: ${{ runner.temp }}/book11-cover-v12/
