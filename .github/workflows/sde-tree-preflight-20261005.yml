name: SDE philosophy tree publication preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sde-tree-preflight-20261005.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install PDF inspection library
        run: pip install --quiet pymupdf
      - name: Verify number and reference without changing any book
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,base64,pathlib,hashlib,fitz
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sde-tree-preflight';root.mkdir()
          api='https://api.github.com/repos/SIOWDS/sdeuniverses-site-/'
          def gh(p):
            req=urllib.request.Request(api+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            return json.load(urllib.request.urlopen(req,timeout=60))
          ref=gh('git/ref/heads/main')['object']['sha']
          catf=gh('contents/public/books/catalog.json?ref='+ref)
          cat=json.loads(base64.b64decode(catf['content']))
          books=cat['books']
          directories=gh('contents/public/books/m?ref='+ref)
          used={int(x['name']) for x in directories if x['name'].isdigit()}
          used.update(int(b['number']) for b in books if str(b.get('number','')).isdigit())
          conflicts=[b for b in books if str(b.get('isbn','')).replace('-','')=='9798906908988' or '哲学SDE发生树' in b.get('title','').replace(' ','')]
          audit={'commit':ref,'catalog_sha':catf['sha'],'candidate':294,'candidate_vacant_in_catalog_and_directories':294 not in used,'vacant_below_300':[i for i in range(1,300) if i not in used],'existing_title_or_isbn':conflicts,'reindex_executed':False,'book_files_written':False,'reference':{}}
          for path in ['public/books/m/220/index.html','public/books/m/220/text/index.html','public/books/m/220/read.html']:
            f=gh('contents/'+path+'?ref='+ref);data=base64.b64decode(f['content']);name=path.replace('/','_');(root/name).write_bytes(data)
          url='https://sdeuniverses.com/students/wang-desheng/my-three-treasures/m220/my-three-treasures-reader-v3.pdf'
          try:
            data=urllib.request.urlopen(url,timeout=90).read();pdf=fitz.open(stream=data,filetype='pdf')
            audit['reference']={'url':url,'sha256':hashlib.sha256(data).hexdigest(),'pages':len(pdf),'page_size_pt':[pdf[0].rect.width,pdf[0].rect.height]}
            (root/'reference220-reader.pdf').write_bytes(data)
            for i in [0,1,5,12,30,60]:
              if i<len(pdf):pdf[i].get_pixmap(matrix=fitz.Matrix(1.4,1.4)).save(root/f'reference220-page-{i+1}.png')
          except Exception as e:audit['reference']={'url':url,'error':str(e)}
          (root/'preflight.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sde-tree-publication-preflight-20261005
          retention-days: 7
          path: ${{ runner.temp }}/sde-tree-preflight/
