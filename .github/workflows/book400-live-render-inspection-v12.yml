name: Book400 production rendering inspection - read only
on:
  push:
    branches: ['release/book400-earth-v12-20261008']
    paths: ['.github/workflows/book400-live-render-inspection-v12.yml']
permissions:
  contents: read
  actions: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37695713581
          name: book400-v12-scoped-candidate-acceptance
          path: ${{ runner.temp }}/book400-live-final/source
      - name: Read source worker and every actual production book file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,os,json,subprocess,hashlib,concurrent.futures,datetime,urllib.request,difflib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'book400-live-final';out=root/'live';out.mkdir(exist_ok=True)
          origin='https://sdeuniverses.com';base=origin+'/books/m/400/';release='734fee1ef18697cad79f5c1d7e15e278e79f09d53deeb389303291dde414b363'
          def get(url,path):
            path.parent.mkdir(parents=True,exist_ok=True)
            p=subprocess.run(['curl','-sS','-L','--max-time','75','--retry','1','--user-agent','Mozilla/5.0','-o',str(path),'-w','%{http_code}',url],capture_output=True,text=True)
            assert not p.returncode and p.stdout=='200',(url,p.stdout,p.stderr)
            return path.read_bytes()
          m=json.loads(get(base+'publication-manifest.json',out/'publication-manifest.json'));assert m['release_sha256']==release
          original=root/'source/payload/我材发生_第400卷_上站包/public/books/m/400'
          def verify(a):
            raw=get(base+a['path'],out/'assets'/a['path']);digest=hashlib.sha256(raw).hexdigest();item={'path':a['path'],'status':200,'bytes':len(raw),'sha256':digest,'exact':digest==a['sha256']}
            if not item['exact']:
              item['expected_sha256']=a['sha256']
              f=original/a['path']
              if f.exists() and f.suffix=='.html':
                diff=list(difflib.unified_diff(f.read_text().splitlines(),raw.decode().splitlines(),fromfile='source',tofile='production',n=2))
                dst=out/'diffs'/(a['path'].replace('/','__')+'.diff');dst.parent.mkdir(exist_ok=True);dst.write_text('\n'.join(diff))
            return item
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:assets=list(pool.map(verify,m['files']))
          assert all(a['exact'] or a['path'].endswith('.html') for a in assets),'Non-HTML artifact differs'
          entrances=[]
          for url,needle in [(origin+'/books/','data-id="m-400"'),(origin+'/monographs/','data-id="m-400"'),('https://read.sdeuniverses.com/library/','data-id="m-400"'),(origin+'/books/agent/','/books/m/400/agent/')]:
            raw=get(url,out/('entrance-'+str(len(entrances))+'.html')).decode();assert needle in raw,url;entrances.append({'url':url,'status':200,'book400_present':True})
          cat=json.loads(get(origin+'/books/catalog.json',out/'catalog.json'));entry=[b for b in cat['books'] if b.get('id')=='m-400'];assert len(entry)==1 and entry[0]['isbn']=='9798906908667'
          req=urllib.request.Request('https://api.github.com/repos/SIOWDS/sdeuniverses-site-/contents/src/worker.js?ref=941141bf00b75adc9da27a21f765189e3bfa6c13',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github.raw+json'})
          (out/'worker.js').write_bytes(urllib.request.urlopen(req,timeout=90).read())
          report={'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'production_commit':'941141bf00b75adc9da27a21f765189e3bfa6c13','release_sha256':release,'assets':assets,'entrances':entrances,'catalog_entry':entry[0],'no_reindex':True,'model_endpoint_tested':False}
          (root/'live-http-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps({'files':len(assets),'exact':sum(a['exact'] for a in assets),'html_differences':[a for a in assets if not a['exact']],'entrances':entrances},ensure_ascii=False))
          PY
      - name: Browser and PDF dependencies
        run: |
          pip -q install playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Actual production desktop and mobile reading
        run: |
          ROOT="$RUNNER_TEMP/book400-live-final"
          python "$ROOT/source/payload/我材发生_第400卷_上站包/build-tools/test_web.py" "$ROOT" "$ROOT/browser" https://sdeuniverses.com
      - name: Verify downloaded PDFs and actual vector output
        run: |
          python - <<'PY'
          import pathlib,os,json,fitz,hashlib,datetime
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'book400-live-final';pdfs=[]
          for f in (root/'live/assets/downloads').glob('*.pdf'):
            d=fitz.open(f);assert len(d)==381 and len(d.get_toc())==673
            for p in d:p.get_pixmap(matrix=fitz.Matrix(.2,.2))
            pdfs.append({'file':f.name,'pages':len(d),'bookmarks':len(d.get_toc()),'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          render=[]
          with sync_playwright() as p:
            b=p.chromium.launch(args=['--no-sandbox'])
            for width,height in [(1440,1000),(390,844)]:
              page=b.new_page(viewport={'width':width,'height':height});errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('https://sdeuniverses.com/books/m/400/read.html',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_function("document.getElementById('pt').textContent==='381'",timeout=60000)
              page.locator('#pi').fill('181');page.locator('#pi').press('Enter')
              page.wait_for_function("document.querySelector('#sL svg') && document.querySelector('#sL svg').getBoundingClientRect().width>100",timeout=60000)
              page.wait_for_timeout(2500);page.screenshot(path=str(root/f'live-vector-{width}.png'))
              h=page.locator('.top').evaluate('(e)=>e.getBoundingClientRect().height');assert h<60
              assert not page.evaluate('document.documentElement.scrollWidth>innerWidth+2')
              render.append({'width':width,'svg_rendered':True,'toolbar_height':h,'page':page.locator('#pi').input_value(),'page_errors':errors});page.close()
            b.close()
          (root/'live-pdf-and-svg-report.json').write_text(json.dumps({'pdfs':pdfs,'rendering':render,'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2));print(json.dumps({'pdfs':pdfs,'rendering':render}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book400-v12-live-rendering-acceptance
          retention-days: 5
          path: |
            ${{ runner.temp }}/book400-live-final/*.json
            ${{ runner.temp }}/book400-live-final/*.png
            ${{ runner.temp }}/book400-live-final/browser/
            ${{ runner.temp }}/book400-live-final/live/
