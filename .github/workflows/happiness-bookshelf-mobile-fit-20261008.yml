name: Final Happiness bookshelf mobile fit and acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/happiness-bookshelf-mobile-fit-20261008.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: happiness-secret-publication
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/happiness_shelf_entry_20261008.py
            /tools/build_bookshelf.py
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /public/books/bookshelf.css
            /public/books/bookshelf.js
            /public/books/catalog.json
            /public/books/agents.json
            /public/books/happiness-secret/
            /.github/workflows/search-index.yml
      - name: Prepare bounded browser dependencies
        timeout-minutes: 4
        run: |
          python3 -m pip install --quiet --timeout 25 --retries 1 beautifulsoup4 playwright
          timeout 150s python3 -m playwright install chromium
          timeout 30s sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1 install -y -qq fonts-noto-cjk || echo 'Using system fonts'
      - name: Fit the Happiness button text on mobile, preserve desktop and all other cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,runpy,subprocess,threading,time
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from urllib.request import Request,urlopen
          root=Path(os.environ['GITHUB_WORKSPACE']);pub=root/'public';qa=Path(os.environ['RUNNER_TEMP'])/'happiness-shelf-evidence';qa.mkdir(exist_ok=True)
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def git(*a):return subprocess.check_output(['git',*a],cwd=root,text=True).strip()
          def dump(n,o):(qa/n).write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n')
          protected={str(p.relative_to(root)):sha(p) for p in (pub/'books/happiness-secret').rglob('*') if p.is_file()}
          for rel in ['public/books/catalog.json','public/books/agents.json','public/books/bookshelf.js','.github/workflows/search-index.yml']:protected[rel]=sha(root/rel)
          css=pub/'books/bookshelf.css';original_css=css.read_text();marker='/* Happiness agent narrow-card label fit 20261008 */';assert marker not in original_css
          added='\n'+marker+'\n@media(max-width:560px){.book[data-id="happiness-secret"] .agent-link{display:block;white-space:normal;min-width:0;max-width:100%;text-align:center;line-height:1.7}.book[data-id="happiness-secret"] .agent-link::before{margin-right:.35em}}\n'
          css.write_text(original_css+added)
          version='20261003-bookshelf-v8-agents';new_version=version+'-happiness-r1';files=['public/books/index.html','public/monographs/index.html','public/sites/read/library/index.html','tools/build_bookshelf.py']
          for rel in files:
              p=root/rel;s=p.read_text();assert version in s and new_version not in s
              if rel.endswith('.html'):assert '幸福的奥秘：这本书的智能体「回甘」' in s
              else:assert "agent_url=b.get('agentUrl')" in s
              new=s.replace(version,new_version);assert new.replace(new_version,version)==s;p.write_text(new)
          # Reuse the real-click acceptance but require complete button text on narrow cards.
          src=(root/'tools/happiness_shelf_entry_20261008.py').read_text();old='assert style(link)==reference';assert src.count(old)==1
          src=src.replace(old,"assert width<=560 or style(link)==reference\n                assert link.evaluate('(e)=>e.scrollWidth<=e.clientWidth+1 && e.scrollHeight<=e.clientHeight+1')")
          temp=Path(os.environ['RUNNER_TEMP'])/'happiness_shelf_mobile_check.py';temp.write_text(src);m=runpy.run_path(str(temp))
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(SimpleHTTPRequestHandler,directory=str(pub)));threading.Thread(target=server.serve_forever,daemon=True).start();origin='http://127.0.0.1:'+str(server.server_port)
          try:m['check']([origin+'/books/'],'candidate-wrap',origin)
          finally:server.shutdown()
          assert all(sha(root/p)==h for p,h in protected.items())
          allowed=files+['public/books/bookshelf.css'];git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');git('add','--sparse',*allowed);assert set(git('diff','--cached','--name-only').splitlines())==set(allowed)
          git('commit','-m','Keep Happiness 回甘 bookshelf entry fully readable on narrow mobile cards; scoped CSS only; no book/PDF changes or reindex')
          for attempt in range(4):
              try:git('push','origin','HEAD:main');break
              except subprocess.CalledProcessError:
                  if attempt==3:raise
                  git('fetch','--deepen=50','origin','main');git('rebase','origin/main');assert all(sha(root/p)==h for p,h in protected.items())
          commit=git('rev-parse','HEAD');dump('publication-mobile.json',{'commit':commit,'changed_files':allowed,'pdf_and_text_unchanged':True,'reindex_triggered':False})
          def get(u):
              with urlopen(Request(u,headers={'User-Agent':'Happiness-Mobile-Entry-Acceptance'}),timeout=45) as r:return r.read()
          for attempt in range(48):
              try:
                  if marker in get('https://sdeuniverses.com/books/bookshelf.css?v='+new_version).decode() and new_version in get('https://sdeuniverses.com/books/').decode():break
              except Exception:pass
              time.sleep(8)
          else:raise RuntimeError('Latest CSS revision not visible')
          assert all(sha(root/p)==h for p,h in protected.items())
          m['check'](m['URLS'],'live-wrap')
          pdfs=[]
          for p in ['downloads/happiness-reader-v1.2.pdf','downloads/happiness-print-v1.2.pdf']:
              h=hashlib.sha256(get('https://sdeuniverses.com/books/happiness-secret/'+p)).hexdigest();assert h==sha(pub/'books/happiness-secret'/p);pdfs.append({'path':p,'sha256':h,'unchanged':True})
          dump('final-mobile-acceptance.json',{'success':True,'commit':commit,'three_bookshelves':True,'six_real_clicks':True,'mobile_label_not_clipped':True,'desktop_matches_220':True,'other_book_css_unchanged':True,'pdfs':pdfs,'reindex_triggered':False,'llm_request_sent':False})
          print('FINAL_MOBILE_AND_DESKTOP_ENTRY_ACCEPTED',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: happiness-bookshelf-final-mobile-acceptance
          path: ${{ runner.temp }}/happiness-shelf-evidence/
          retention-days: 30
