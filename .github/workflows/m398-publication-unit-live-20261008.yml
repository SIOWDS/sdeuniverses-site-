name: M398 publication unit production acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m398-publication-unit-live-20261008.yml
      - tools/m398_unit/live_verify.py
      - public/books/m/398/publication-unit.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m398-unit-production-acceptance
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/398/
            /ops/m398-unit/
            /tools/m398_unit/live_verify.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only browser checks
        run: |
          python -m pip install --quiet beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Wait for correct deployment and verify actual public assets
        run: |
          mkdir -p m398-live-qa
          set -o pipefail
          python tools/m398_unit/live_verify.py 2>&1 | tee m398-live-qa/output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m398-publication-unit-production-acceptance
          path: m398-live-qa
          retention-days: 14
