name: Volume 400 publication
on:
  push:
    branches: ['publish/m400-20261008']
    paths: ['.github/workflows/m400-publication.yml']
permissions:
  contents: read
jobs:
  integration-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Read production integration files without changing them
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests,json,hashlib
          d=Path('m400-integration');d.mkdir()
          raw='https://raw.githubusercontent.com/SIOWDS/sdeuniverses-site-/main/'
          files=['src/worker.js','public/.assetsignore','tools/build_bookshelf.py','tools/build_book_agents.py','tools/build_book_rag.py','tools/book_agent_body.html','public/books/agent/app.js','public/books/agent/app.css','public/books/agents.json','public/books/m/302/rag.json','public/books/agent/index.html','public/monographs/index.html','public/sites/read/library/index.html','public/taste/wds-companion/wds-read.js','public/wds-mode.js','public/books/bookshelf.js','public/books/bookshelf.css']
          report=[]
          for path in files:
            r=requests.get(raw+path,timeout=90)
            report.append({'path':path,'status':r.status_code,'bytes':len(r.content)})
            if r.status_code==200:
              target=d/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(r.content)
          urls={'pdf.min.js':'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdf.worker.min.js':'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js','LICENSE':'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/LICENSE'}
          for name,url in urls.items():
            r=requests.get(url,timeout=90);r.raise_for_status();target=d/'vendor'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(r.content)
            report.append({'url':url,'status':r.status_code,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
          (d/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m400-integration
          path: m400-integration/
          retention-days: 3
