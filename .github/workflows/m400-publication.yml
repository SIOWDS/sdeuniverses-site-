name: Volume 400 publication status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report publication boundary
        run: |
          echo 'Volume400 local publication assets and page QA are complete.'
          echo 'Attachment transfer was denied. No production files were installed.'
          echo 'An approved file upload must complete before candidate browser acceptance and publication.'
          echo 'This workflow is read-only and performs no publication, no global reindex, and no scheduled monitoring.'
