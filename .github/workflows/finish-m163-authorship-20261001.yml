name: Finish monograph 163 authorship
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-m163-authorship-20261001.yml']
permissions:
  contents: write
concurrency:
  group: authorship-m163
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/catalog.json
            /public/books/index.html
            /public/books/m/163/
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /tools/build_bookshelf.py
            /.github/workflows/update-m163-authorship-20261001.yml
            /.github/workflows/finish-m163-authorship-20261001.yml
      - name: Apply the guarded author update to the actual HTML fragment
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/update-m163-authorship-20261001.yml').read_text()
          marker="          python - <<'PY'\n"
          body=source.split(marker,1)[1].split('\n          PY',1)[0]
          code=textwrap.dedent(body)
          old="    assert '</head>' in t\n    t=t.replace('</head>','<meta name=\"author\" content=\"王德生、杨彼得\">\\n</head>',1)"
          new="    if '</head>' in t:\n        t=t.replace('</head>','<meta name=\"author\" content=\"王德生、杨彼得\">\\n</head>',1)"
          assert old in code
          code=code.replace(old,new,1)
          insertion='''
          from html.parser import HTMLParser
          prefix=t[:a.start()]
          class BylineParser(HTMLParser):
              def __init__(self,source):
                  super().__init__(convert_charrefs=False)
                  self.source=source;self.previous='';self.edits=[];self.context=[]
                  self.line_starts=[0]
                  for match in re.finditer('\\n',source):self.line_starts.append(match.end())
              def handle_starttag(self,tag,attrs):
                  self.context.append((tag,dict(attrs)))
              def handle_endtag(self,tag):
                  for i in range(len(self.context)-1,-1,-1):
                      if self.context[i][0]==tag:
                          self.context=self.context[:i];break
              def handle_data(self,data):
                  compact=re.sub(r'[\\s\\xa0　]+','',html.unescape(data))
                  replacement=data
                  byline_context=any('author' in attrs.get('class','').lower() or 'author' in attrs.get('id','').lower() for tag,attrs in self.context)
                  if compact=='王德生' and (self.previous in ('著者','作者','著','著者：','作者：','著者:','作者:') or byline_context):
                      replacement=data.replace('王德生','王德生、杨彼得',1)
                  elif compact in ('著者王德生','作者王德生','著者：王德生','作者：王德生','著者:王德生','作者:王德生','王德生著'):
                      replacement=data.replace('王德生','王德生、杨彼得',1)
                  if replacement!=data:
                      line,col=self.getpos();start=self.line_starts[line-1]+col
                      self.edits.append((start,start+len(data),replacement))
                  if compact:self.previous=compact
          parser=BylineParser(prefix);parser.feed(prefix)
          for start,end,replacement in reversed(parser.edits):prefix=prefix[:start]+replacement+prefix[end:]
          t=prefix+t[a.start():]
          report['structured_byline_replacements']=len(parser.edits)
          report['frontmatter_after']=prefix[:11000]
          print('STRUCTURED BYLINE REPLACEMENTS:',len(parser.edits))
          print('FRONTMATTER AFTER:',prefix[:8000])
          '''
          needle='t,n1=re.subn('
          assert needle in code
          code=code.replace(needle,textwrap.dedent(insertion)+'\n'+needle,1)
          exec(compile(code,'m163-author-update','exec'))
          PY
      - name: Regenerate and verify the three bookshelf entrances
        run: |
          python tools/build_bookshelf.py
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          book=Path('public/books/m/163')
          report=json.loads((book/'authorship-update-20261001.json').read_text())
          cat=json.loads(Path('public/books/catalog.json').read_text())
          target=next(b for b in cat['books'] if b['id']=='m-163')
          assert target['authors']==['王德生','杨彼得']
          for name,digest in report['unchanged_pdf_sha256'].items():assert hashlib.sha256((book/name).read_bytes()).hexdigest()==digest
          for path in ['public/books/index.html','public/monographs/index.html','public/sites/read/library/index.html']:
              text=Path(path).read_text(encoding='utf-8');i=text.find('人类文明史');assert i>=0
              near=text[max(0,i-1200):i+2500]
              assert '杨彼得' in near and '王德生' in near,path
          allowed={'public/books/catalog.json','public/books/index.html','public/monographs/index.html','public/sites/read/library/index.html','public/books/m/163/index.html','public/books/m/163/text/index.html'}
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)<=allowed,changed
          report['verified_bookshelves']=['/books/','/monographs/','/sites/read/library/']
          report['changed_paths']=changed
          report['source_verified']=True
          (book/'authorship-update-20261001.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Verified authors, biography, three shelves, unchanged PDFs, and limited scope.')
          PY
      - name: Commit only the author update and remove temporary workflows
        run: |
          git config user.name 'SDE Publication Build'
          git config user.email 'publication-build@users.noreply.github.com'
          rm .github/workflows/update-m163-authorship-20261001.yml .github/workflows/finish-m163-authorship-20261001.yml
          git add --sparse public/books/catalog.json public/books/index.html public/monographs/index.html public/sites/read/library/index.html public/books/m/163/index.html public/books/m/163/text/index.html public/books/m/163/authorship-update-20261001.json .github/workflows/update-m163-authorship-20261001.yml .github/workflows/finish-m163-authorship-20261001.yml
          git diff --cached --stat
          git commit -m 'Add Yang Bide as second author of monograph 163 and publish supplied biography'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve author update verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monograph-163-authorship-verification
          retention-days: 3
          path: public/books/m/163/authorship-update-20261001.json
