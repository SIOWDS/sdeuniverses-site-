name: Prepare volume 289 reviewed digital edition
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-m289-final-20261002.yml']
permissions:
  contents: read
concurrency:
  group: education-monograph-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/education-subject-rebirth/
            /public/books/catalog.json
            /tools/m289-publication-v11.py
            /tools/m289-browser-check.py
            /tools/m289-identifier-review.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded publication dependencies
        timeout-minutes: 4
        run: timeout 190s python -m pip install --disable-pip-version-check --no-input --timeout 20 --retries 1 python-docx==1.2.0 Pillow==11.3.0 beautifulsoup4==4.13.5 reportlab==4.4.4 PyMuPDF==1.26.7 playwright==1.55.0
      - name: Install Chinese typography and document renderer
        timeout-minutes: 5
        run: |
          timeout 70s sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          timeout 190s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=20 libreoffice-writer fonts-noto-cjk fonts-liberation fonts-crosextra-carlito
          fc-cache -f
      - name: Validate source and create the unambiguous digital edition
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util,json,hashlib,os,shutil
          root=Path(os.environ['RUNNER_TEMP'])/'m289-final';root.mkdir()
          src=Path('public/books/education-subject-rebirth');mf=json.loads((src/'publication-manifest.json').read_text())
          assert mf['release_sha256']=='c89c9531ddda73c38d67c7c00686742e181daf416e4b718ecbb68715c78c3770'
          for n,e in mf['files'].items():assert hashlib.sha256((src/n).read_bytes()).hexdigest()==e['sha256'],n
          spec=importlib.util.spec_from_file_location('review','tools/m289-identifier-review.py');r=importlib.util.module_from_spec(spec);spec.loader.exec_module(r)
          m=r.load('public/books/catalog.json','tools/m289-publication-v11.py',root/'build-tools')
          build=root/'build';m.cover_assets(src,build/'assets');changes=m.edit_docx(src/'downloads/education-subject-rebirth.docx',build/'education-subject-rebirth.docx',build/'assets')
          (build/'front-matter-changes.json').write_text(json.dumps(changes,ensure_ascii=False,indent=2))
          shutil.copy('tools/m289-identifier-review.py',root/'build-tools/identifier-review.py')
          check=Path('tools/m289-browser-check.py').read_text().replace('979-8-90690-365-5','待确认');(root/'build-tools/browser-check.py').write_text(check)
          print('The conflicting ISBN is withheld. Volume 289 and US$20 remain authorized.')
          PY
          mkdir -p "$RUNNER_TEMP/m289-final/build/front"
          timeout 150s libreoffice "-env:UserInstallation=file://$RUNNER_TEMP/m289-lo-final" --headless --convert-to 'pdf:writer_pdf_Export:{"PageRange":{"type":"string","value":"1-4"}}' --outdir "$RUNNER_TEMP/m289-final/build/front" "$RUNNER_TEMP/m289-final/build/education-subject-rebirth.docx"
      - name: Assemble full book and verify preserved manuscript
        run: |
          python - <<'PY'
          import importlib.util,os,json,fitz
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'m289-final';src=Path('public/books/education-subject-rebirth');build=root/'build';out=root/'site/public/books/m/289'
          def load(name,p):
            s=importlib.util.spec_from_file_location(name,p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m
          m=load('book',root/'build-tools/publication-builder.py');r=load('review',root/'build-tools/identifier-review.py')
          m.finalize_site(src,out,build,build/'front/education-subject-rebirth.pdf');audit=r.sanitize(out)
          qa=root/'qa';qa.mkdir();old=fitz.open(src/'downloads/education-subject-rebirth-print.pdf');new=fitz.open(out/'downloads/education-subject-rebirth-print.pdf')
          changed=[i+1 for i in range(333) if old[i].get_pixmap(matrix=fitz.Matrix(.6,.6),alpha=False).samples!=new[i].get_pixmap(matrix=fitz.Matrix(.6,.6),alpha=False).samples]
          assert set(changed)<={1,2,3,4,333},changed;audit['changed_render_pages']=changed
          for i in [0,1,2,3,8,26,126,163,299,332]:new[i].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(qa/f'pdf-page-{i+1}.png')
          (qa/'publication-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2));print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Verify candidate desktop and mobile readers
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python -m playwright install --with-deps chromium; fi
          python "$RUNNER_TEMP/m289-final/build-tools/browser-check.py" "$RUNNER_TEMP/m289-final/site/public" "$RUNNER_TEMP/m289-final/qa/browser"
      - name: Preserve the complete candidate for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m289-reviewed-digital-candidate
          retention-days: 7
          path: ${{ runner.temp }}/m289-final/
