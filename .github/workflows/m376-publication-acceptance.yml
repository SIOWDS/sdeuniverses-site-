name: M376 physics publication acceptance
on:
  push:
    branches: [main]
    paths:
      - 'public/books/m/376/**'
      - '.publish/m376/**'
      - '.github/workflows/m376-publication-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m376-publication-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            public/books/m/376
            public/assets/lib
            .publish/m376
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/m376-tools --no-save playwright@1.56.1
          /tmp/m376-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check the publication unit locally
        env:
          NODE_PATH: /tmp/m376-tools/node_modules
          QA_OUT: m376-qa-results
        run: |
          python3 -m http.server 8765 --directory public > /tmp/m376-server.log 2>&1 &
          node .publish/m376/qa.cjs
      - name: Verify live publication
        run: python3 .publish/m376/verify_live.py
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m376-publication-acceptance-${{ github.run_id }}
          path: m376-qa-results/
          if-no-files-found: warn
          retention-days: 14
