name: Publish Religion299 ISBN187 correction
on:
  push:
    branches: [religion-isbn187-20261002]
    paths: ['.github/workflows/religion-isbn187-publish.yml']
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      ACCEPTED_RUN: '36978155302'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/catalog.json
            /public/books/religion-genesis/
            /public/books/m/299/
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /tools/build_bookshelf.py
      - name: Require exact successful candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/SIOWDS/sdeuniverses-site-/actions/runs/36978155302',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          r=json.load(urllib.request.urlopen(req));assert r['conclusion']=='success' and r['head_sha']=='d1aef8f1854ee61e36c2093bacd124357f1860c7'
          print('Exact metadata candidate verified; new ISBN187, volume299, USD20; metadata page and covers visually reviewed.')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: religion-isbn187-candidate
          run-id: 36978155302
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/religion-isbn187-candidate
      - name: Verify reviewed manifest and install acceptance tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          p=Path(os.environ['RUNNER_TEMP'])/'religion-isbn187-candidate'
          m=json.loads((p/'book/publication-manifest.json').read_text())
          assert m['release_sha256']=='9bd4d5a423cd1c9444a47a71c2ca0d3c05fbac8db9107cf06a15fa22ab6f2000'
          assert (m['formal_volume'],m['isbn'],m['price_usd'],m['pdf_pages'])==(299,'979-8-90690-187-3',20,365)
          assert hashlib.sha256((p/'source/publish-isbn187.py').read_bytes()).hexdigest()=='5cc13e7ae899a79674cdd095c697657e846614294a494b4ced846c560b0084de'
          assert json.loads((p/'qa/latest-edition-comparison.json').read_text())['pdf_text_changed_pages']==[2]
          PY
          python -m pip install --quiet PyMuPDF==1.26.7 beautifulsoup4 requests playwright
          python -m playwright install --with-deps chromium > /tmp/isbn187-verify-install.log 2>&1
          sudo apt-get install -y -qq fonts-noto-cjk > /tmp/isbn187-fonts.log 2>&1
      - name: Apply only this book and three shelves against fresh main
        run: |
          git config user.name 'SIOWDS'
          git config user.email 'wangdesheng1234567@gmail.com'
          success=0
          for attempt in 1 2 3; do
            git fetch --filter=blob:none --depth=2 origin main
            git checkout --detach FETCH_HEAD
            python "$RUNNER_TEMP/religion-isbn187-candidate/source/publish-isbn187.py" prepare "$GITHUB_WORKSPACE" "$RUNNER_TEMP/religion-isbn187-candidate" "$RUNNER_TEMP/religion-isbn187-live"
            git add --sparse public/books/religion-genesis public/books/m/299 public/books/catalog.json public/books/index.html public/monographs/index.html public/sites/read/library/index.html
            python - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'public/books/catalog.json','public/books/index.html','public/monographs/index.html','public/sites/read/library/index.html'}
          assert paths and all(p in allowed or p.startswith(('public/books/religion-genesis/','public/books/m/299/')) for p in paths)
          assert not any('/search/' in p or p.endswith(('.ttf','.otf','.ttc','.woff','.woff2','.env')) for p in paths)
          Path(os.environ['RUNNER_TEMP'],'religion-isbn187-live','changed-paths.json').write_text(json.dumps(paths,ensure_ascii=False,indent=2))
          print('Only authorized ISBN187 metadata edition, numeric aliases and shelves; no reindex:',len(paths))
          PY
            git commit -m 'Correct Religion Genesis ISBN to 9798906901873: volume299 USD20 v1.3, unchanged prose; no reindex'
            if git push origin HEAD:main; then success=1; break; fi
            echo 'Concurrent main update: reconcile only this title on fresh main; never force-push.'
          done
          test "$success" = 1
          git rev-parse HEAD > "$RUNNER_TEMP/religion-isbn187-live/published-commit.txt"
      - name: Require actual Cloudflare deployment success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,urllib.request,json,time
          q=Path(os.environ['RUNNER_TEMP'])/'religion-isbn187-live';sha=(q/'published-commit.txt').read_text().strip()
          url='https://api.github.com/repos/SIOWDS/sdeuniverses-site-/commits/'+sha+'/check-runs'
          for attempt in range(60):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              data=json.load(urllib.request.urlopen(req));runs=[r for r in data.get('check_runs',[]) if r['name']=='Workers Builds: steep-band-faf5']
              if any(r['status']=='completed' and r['conclusion']=='success' for r in runs):break
              if any(r['status']=='completed' and r['conclusion'] in ['failure','cancelled','timed_out'] for r in runs):raise AssertionError('Cloudflare deployment failed.')
              time.sleep(12)
          else:raise AssertionError('Cloudflare did not complete in this acceptance window.')
          (q/'cloudflare-build.json').write_text(json.dumps(data,ensure_ascii=False,indent=2));print('Cloudflare deployment successful:',sha)
          PY
      - name: Verify all live files and mobile desktop active downloads
        run: python "$RUNNER_TEMP/religion-isbn187-candidate/source/publish-isbn187.py" verify "$GITHUB_WORKSPACE" "$RUNNER_TEMP/religion-isbn187-candidate" "$RUNNER_TEMP/religion-isbn187-live"
      - name: Preserve actual publication and online acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: religion-isbn187-publication-acceptance
          retention-days: 14
          path: ${{ runner.temp }}/religion-isbn187-live/
