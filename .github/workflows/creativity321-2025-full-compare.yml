name: creativity321-2025-full-compare
on:
  push:
    branches: [main]
    paths: [.github/workflows/creativity321-2025-full-compare.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.3 beautifulsoup4==4.13.4
      - run: python tools/creativity321_2025_full_compare.py
