name: Finish SIO Word back-cover full-page layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sio-word-backcover-fullbleed.yml']
permissions:
  contents: write
concurrency:
  group: publication-sio-m2
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/2/
            /.github/workflows/sio-word-backcover-fullbleed.yml
      - name: Prepare precise XML-only back-cover correction
        run: |
          python -m pip install -q lxml
          mkdir -p "$RUNNER_TEMP/sio-fullbleed-qa"
          cat > "$RUNNER_TEMP/fix-sio-word.py" <<'PY'
          from pathlib import Path
          import zipfile,copy,json,hashlib,os
          from lxml import etree as E
          b=Path('public/books/m/2');rp=b/'price-backcover-verification-v1.1.json';report=json.loads(rp.read_text());assert report['verified_live'] and report['price']==20
          p=b/'sio-ontology-v1.docx';assert hashlib.sha256(p.read_bytes()).hexdigest()==report['binary_checks'][p.name]['sha256']
          z=zipfile.ZipFile(p);entries={i.filename:(i,z.read(i.filename)) for i in z.infolist()}
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main','wp':'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing','a':'http://schemas.openxmlformats.org/drawingml/2006/main'}
          root=E.fromstring(entries['word/document.xml'][1]);text_before=root.xpath('//w:t/text()',namespaces=ns);ps=root.findall('w:body/w:p',ns);last=ps[-1];inline=last.find('.//wp:inline',ns);assert inline is not None
          q=lambda n:E.QName(ns[n.split(':')[0]],n.split(':')[1])
          anchor=E.Element(q('wp:anchor'),distT='0',distB='0',distL='0',distR='0',simplePos='0',relativeHeight='0',behindDoc='0',locked='0',layoutInCell='1',allowOverlap='1')
          E.SubElement(anchor,q('wp:simplePos'),x='0',y='0')
          for tag in ['wp:positionH','wp:positionV']:
            el=E.SubElement(anchor,q(tag),relativeFrom='page');E.SubElement(el,q('wp:posOffset')).text='0'
          E.SubElement(anchor,q('wp:extent'),cx='5486400',cy='8229600');E.SubElement(anchor,q('wp:effectExtent'),l='0',t='0',r='0',b='0');E.SubElement(anchor,q('wp:wrapNone'))
          for tag in ['wp:docPr','wp:cNvGraphicFramePr','a:graphic']:
            el=inline.find(tag,ns);assert el is not None;anchor.append(copy.deepcopy(el))
          anchor.find('wp:docPr',ns).set('descr','SIO本体论封底；定价20美元（USD 20.00）')
          for el in anchor.findall('.//a:xfrm/a:ext',ns):el.set('cx','5486400');el.set('cy','8229600')
          inline.getparent().replace(inline,anchor)
          sp=root.find('w:body/w:sectPr/w:pgMar',ns);sp.set(q('w:header'),'0');sp.set(q('w:footer'),'0');ppr=last.find('w:pPr',ns);sp=ppr.find('w:spacing',ns)
          for k,v in [('before','0'),('after','0'),('line','20'),('lineRule','exact')]:sp.set(q('w:'+k),v)
          E.SubElement(ppr,q('w:snapToGrid')).set(q('w:val'),'0')
          assert text_before==root.xpath('//w:t/text()',namespaces=ns),'Book text changed'
          entries['word/document.xml']=(entries['word/document.xml'][0],E.tostring(root,xml_declaration=True,encoding='UTF-8',standalone=True));tmp=p.with_suffix('.fixed.docx')
          with zipfile.ZipFile(tmp,'w',compression=zipfile.ZIP_DEFLATED) as out:
            for info,data in entries.values():out.writestr(info,data)
          z.close();tmp.replace(p)
          ip=b/'index.html';text=ip.read_text();assert 'sio-ontology-v1.docx?v=20261002-price20-v11' in text
          ip.write_text(text.replace('sio-ontology-v1.docx?v=20261002-price20-v11','sio-ontology-v1.docx?v=20261002-price20-v11b'))
          mpath=b/'publication-manifest.json';m=json.loads(mpath.read_text());m['word_back_cover_layout']='full-page page-relative anchor';m['word_layout_verification_pending']=True
          for f in m['files']:
            if f['path'] in ['sio-ontology-v1.docx','index.html']:
              f['size']=(b/f['path']).stat().st_size;f['sha256']=hashlib.sha256((b/f['path']).read_bytes()).hexdigest()
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          Path('.github/workflows/sio-word-backcover-fullbleed.yml').unlink(missing_ok=True)
          out=Path(os.environ['RUNNER_TEMP'])/'sio-fullbleed-qa';(out/'expected-word-sha256.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest())
          print('Only Word back-cover anchoring and its cache-busted download link changed; full manuscript text identical')
          PY
      - name: Publish only the final Word-cover layout and link
        run: |
          git config user.name 'SDE Publication Build'
          git config user.email 'publication-build@users.noreply.github.com'
          for attempt in 1 2 3; do
            python "$RUNNER_TEMP/fix-sio-word.py"
            git add --sparse public/books/m/2/sio-ontology-v1.docx public/books/m/2/index.html public/books/m/2/publication-manifest.json .github/workflows/sio-word-backcover-fullbleed.yml
            git commit -m 'Make SIO Word back cover full-page: no cropping of USD20 price or publisher; no reindex'
            if git push origin HEAD:main; then git rev-parse HEAD > "$RUNNER_TEMP/sio-fullbleed-qa/word-layout-commit.txt";break;fi
            test "$attempt" -lt 3 || exit 1
            git fetch origin main
            git reset --hard origin/main
          done
      - name: Verify the final Word file is actually served online
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,urllib.request,time,datetime,zipfile,io
          from lxml import etree as E
          b=Path('public/books/m/2');out=Path(os.environ['RUNNER_TEMP'])/'sio-fullbleed-qa';expected=(out/'expected-word-sha256.txt').read_text()
          url='https://sdeuniverses.com/books/m/2/sio-ontology-v1.docx?v=20261002-price20-v11b'
          for attempt in range(45):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'SDE-Word-Cover-Verification','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:data=r.read()
              assert hashlib.sha256(data).hexdigest()==expected
              break
            except Exception:
              if attempt==44:raise
              time.sleep(12)
          z=zipfile.ZipFile(io.BytesIO(data));root=E.fromstring(z.read('word/document.xml'));ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main','wp':'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing'}
          last=root.findall('w:body/w:p',ns)[-1];a=last.find('.//wp:anchor',ns);assert a is not None and a.find('wp:positionV',ns).get('relativeFrom')=='page'
          assert 'USD 20.00' in z.read('word/document.xml').decode()
          result={'url':url,'sha256':expected,'bytes':len(data),'online_http_status':200,'full_page_back_cover':True,'manuscript_text_unchanged':True,'price':20,'priceCurrency':'USD','reindex_requested':False,'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (out/'word-fullbleed-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Finalize the combined publication verification
        run: |
          cat > "$RUNNER_TEMP/record-sio-word.py" <<'PY'
          from pathlib import Path
          import json,os,hashlib
          b=Path('public/books/m/2');out=Path(os.environ['RUNNER_TEMP'])/'sio-fullbleed-qa';v=json.loads((out/'word-fullbleed-verification.json').read_text())
          assert hashlib.sha256((b/'sio-ontology-v1.docx').read_bytes()).hexdigest()==v['sha256']
          p=b/'price-backcover-verification-v1.1.json';r=json.loads(p.read_text());r['word_backcover_full_page_verification']=v;r['binary_checks']['sio-ontology-v1.docx']={'status':200,'bytes':v['bytes'],'sha256':v['sha256'],'matches_repository':True};p.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          p=b/'publication-manifest.json';m=json.loads(p.read_text());m['word_layout_verification_pending']=False;m['word_layout_verified_at_utc']=v['verified_at_utc'];p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          for attempt in 1 2 3;do
            python "$RUNNER_TEMP/record-sio-word.py"
            git add --sparse public/books/m/2/price-backcover-verification-v1.1.json public/books/m/2/publication-manifest.json
            git commit -m 'Verify final full-page SIO Word back cover online; USD20 price synchronized; no reindex'
            if git push origin HEAD:main;then break;fi
            test "$attempt" -lt 3 || exit 1
            git fetch origin main
            git reset --hard origin/main
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sio-final-word-fullbleed-v11
          retention-days: 7
          path: |
            ${{ runner.temp }}/sio-fullbleed-qa/
            public/books/m/2/sio-ontology-v1.docx
            public/books/m/2/price-backcover-verification-v1.1.json
