name: Book332 v2 live publication acceptance
on:
  push:
    branches: [feature/book332-v20-20261008]
    paths: ['.github/workflows/book332-v20-live.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b138cd985751d36f2fe27439bee35b14b49e980f
          path: checks
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/book332_verify_v20.py
      - uses: actions/checkout@v4
        with:
          ref: 8e43b293f6c1bd0fb81702d872c9656d6d12e88b
          path: site
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/332/
      - name: Install read-only browser and document checks
        run: |
          python -m pip install --quiet beautifulsoup4 pymupdf playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify actual public files, text, flip pages and agent loading
        run: python checks/tools/book332_verify_v20.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book332-v20-live-acceptance
          retention-days: 7
          path: |
            ${{ runner.temp }}/book332-live-acceptance/acceptance.json
            ${{ runner.temp }}/book332-live-acceptance/*.png
