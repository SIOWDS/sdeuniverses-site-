# 每日三句 · 库存自动扩充
#
# 首页「今日三句」按日期确定性地从 public/assets/daily-quotes.js 的池子里抽 3 条,
# 而 DQ_pickForDate 先抽 3 个"不同来源文章"再各取一句 —— 池子越大、来源越多,
# 每日越不重样。所以库存要持续长。
#
# 为什么用定时 Action 而不是让人每天手动跑:
#   金句是从已发表专栏正文里筛出来的承重句,tools/harvest_daily_quotes.py 只筛不写作,
#   无需大模型在环,可无人值守。定时跑 → 追加 → 提交回 main → 触发 Cloudflare 构建 → 上线。
#   与 search-index.yml 同一套"派生数据自动重建、人零操作"的路子。
#
# 抽干兜底:新料总会变少。抽取器抽不满 30 条时只追加抽到的那些并打警告,
#   绝不为凑数放低质量的句子上首页 —— 见 harvest_daily_quotes.py 的 MIN_SCORE。
#   真到长期抽不满,就是该发新专栏、或回看是否放宽筛选的信号。

name: daily-quotes

on:
  schedule:
    - cron: '0 22 * * *'      # 每天 22:00 UTC = 06:00 新加坡,天亮前把当日库存备好
  workflow_dispatch:           # Actions 页面可手动补跑一次
    inputs:
      count:
        description: '这次追加多少条'
        default: '30'
        required: false

concurrency:
  group: daily-quotes
  cancel-in-progress: false    # 每次都要跑完写回,不能被下一次取消

jobs:
  grow-pool:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 需要把新增金句推回 main

    steps:
      - uses: actions/checkout@v4

      - name: 扩充库存(默认 30 条)
        run: python3 tools/harvest_daily_quotes.py --count "${{ github.event.inputs.count || 30 }}"

      - name: 校验池子仍能被首页抽取器解析(坏了就整单失败,不推)
        run: |
          node -e '
          const fs=require("fs");
          const src=fs.readFileSync("public/assets/daily-quotes.js","utf8");
          const window={};
          new Function("window", src)(window);
          if(!Array.isArray(window.DQ)||!window.DQ.length) throw new Error("DQ 解析失败");
          const bad=window.DQ.filter(q=>!q||!q.t||!q.u||typeof q.t!=="string");
          if(bad.length) throw new Error("有 "+bad.length+" 条残缺项");
          for(const [y,m,d] of [[2026,1,1],[2026,7,22],[2026,12,31]]){
            const r=window.DQ_pickForDate(y,m,d);
            if(r.length!==3) throw new Error("DQ_pickForDate 未返回 3 条: "+y+"-"+m+"-"+d);
          }
          console.log("池子自检通过 ·", window.DQ.length, "条 /",
            new Set(window.DQ.map(q=>q.u)).size, "个来源");
          '

      - name: 有新增就提交回 main
        run: |
          if git diff --quiet -- public/assets/daily-quotes.js; then
            echo "没抽到新句(可用新料暂时枯竭),本次不提交"
            exit 0
          fi
          git config user.name "sde-quotes-bot"
          git config user.email "wangdesheng1234567@gmail.com"
          N=$(git diff -- public/assets/daily-quotes.js | grep -c '^+ {t:')
          git add public/assets/daily-quotes.js
          git commit -m "Grow the daily-quotes pool by ${N} lines

          Harvested load-bearing sentences from published columns not yet in the
          pool (breadth-first, so the by-source daily picker stays varied).
          Added by .github/workflows/daily-quotes.yml on a schedule - no human step.
          Extractor only filters existing prose, never writes new text; a quality
          floor (MIN_SCORE) means a thin-harvest day adds fewer than 30 rather
          than padding the homepage with weak lines."
          # main 可能已前进(并发提交),冲突就 rebase 重试
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒(main 已前进),rebase 后重试 $i/3"
            git pull --rebase origin main
          done
          echo "三次推送均失败" && exit 1
