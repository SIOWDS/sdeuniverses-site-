name: trigger-reindex-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reindex-once.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect-final:
    runs-on: ubuntu-latest
    steps:
      - name: Record latest repository-dispatch search-index runs
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_PATH: .reindex-final-inspection-20260811T1428Z.json
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          RUNS=$(curl --fail-with-body -sS -L "${AUTH[@]}" \
            "$API/actions/workflows/search-index.yml/runs?event=repository_dispatch&per_page=10")
          RESULT=$(jq -c '{runs: [.workflow_runs[] | {id,run_number,event,status,conclusion,created_at,updated_at,head_sha,html_url}]}' <<<"$RUNS")
          CONTENT=$(printf '%s\n' "$RESULT" | base64 -w0)
          jq -n \
            --arg message "Record final search-index run binding" \
            --arg content "$CONTENT" \
            --arg branch "main" \
            '{message:$message, content:$content, branch:$branch}' > /tmp/result.json
          curl --fail-with-body -sS -L -X PUT "${AUTH[@]}" \
            "$API/contents/$RESULT_PATH" \
            -d @/tmp/result.json >/dev/null
