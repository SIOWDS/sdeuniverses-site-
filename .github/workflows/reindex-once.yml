name: trigger-reindex-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reindex-once.yml'

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch latest search-index rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_PATH: .reindex-triggered-20260811T1418Z.txt
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body -sS -L -X POST "${AUTH[@]}" \
            "$API/dispatches" \
            -d '{"event_type":"reindex","client_payload":{"source":"latest-main-final"}}'
          CONTENT=$(printf 'repository_dispatch reindex accepted at %s\nsource_sha=%s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" | base64 -w0)
          jq -n \
            --arg message "Record final reindex dispatch acceptance" \
            --arg content "$CONTENT" \
            --arg branch "main" \
            '{message:$message, content:$content, branch:$branch}' > /tmp/marker.json
          curl --fail-with-body -sS -L -X PUT "${AUTH[@]}" \
            "$API/contents/$MARKER_PATH" \
            -d @/tmp/marker.json >/dev/null
