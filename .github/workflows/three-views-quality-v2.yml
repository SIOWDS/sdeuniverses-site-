name: three-views-quality-v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/three_views_quality_v2.py
      - tools/three_views_final_polish.py
      - tools/three_views_validate.py
      - .github/workflows/three-views-quality-v2.yml
permissions:
  contents: write
concurrency:
  group: three-views-quality-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document and browser tools
        run: |
          python -m pip install beautifulsoup4==4.13.4 pymupdf==1.26.3 Pillow==11.3.0 pypdf cryptography playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Regenerate and audit faithful long-form pages
        run: |
          python -m py_compile tools/three_views_quality_v2.py tools/three_views_final_polish.py tools/three_views_validate.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/three_views_quality_v2.py');s=p.read_text()
          old='lev=level(s)'
          new="lev=(2 if compact(s).rstrip('：:') in {'一、基本范畴的提出','二、范畴的推导与证明','三、3个基本范畴的各种形式','参考文献'} else 0) if title=='皮尔士范畴理论探析' else level(s)"
          if old in s:s=s.replace(old,new,1)
          compile(s,str(p),'exec');p.write_text(s)
          PY
          python tools/three_views_quality_v2.py
          python tools/three_views_final_polish.py
          python tools/build_search_index.py
      - name: Validate every page, anchor, image, original and source credit
        run: python tools/three_views_validate.py static
      - name: Verify desktop and mobile interactions with screenshots
        run: python tools/three_views_validate.py browser
      - name: Commit only the verified publication
        run: |
          git config user.name 'SDE Quality Publisher'
          git config user.email 'quality-publisher@users.noreply.github.com'
          git add public/three-views public/search tools/build_search_index.py tools/three_views_quality_v2.py
          if git diff --cached --quiet; then echo 'No content changes'; exit 0; fi
          git commit -m 'Refine 436 Three Views pages: readable text, complete source credits, diagrams, tested mobile reading and search'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify production entry, all 436 article pages and new source assets
        run: python tools/three_views_validate.py live
      - name: Package audited pages and receipts
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile
          dest=pathlib.Path('artifacts/three-views-quality-v2');dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(dest/'publication.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in pathlib.Path('public/three-views').rglob('*'):
                  if p.is_file() and p.suffix in {'.html','.css','.js','.json','.webp','.xml'}:z.write(p,p.as_posix())
              for name in ['three_views_longform_20260920.py','three_views_quality_v2.py','three_views_final_polish.py','three_views_validate.py','build_search_index.py']:
                  p=pathlib.Path('tools')/name
                  if p.exists():z.write(p,p.as_posix())
          PY
      - name: Preserve quality evidence and desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-views-quality-v2
          path: artifacts/three-views-quality-v2
          retention-days: 30
          if-no-files-found: ignore
