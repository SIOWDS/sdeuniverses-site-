name: three-views-quality-v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/three_views_quality_v2.py
      - tools/three_views_final_polish.py
      - .github/workflows/three-views-quality-v2.yml
permissions:
  contents: write
concurrency:
  group: three-views-quality-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document and browser tools
        run: |
          python -m pip install beautifulsoup4==4.13.4 pymupdf==1.26.3 Pillow==11.3.0 pypdf cryptography playwright
          python -m playwright install --with-deps chromium
      - name: Regenerate audited long-form pages
        run: |
          python -m py_compile tools/three_views_quality_v2.py tools/three_views_final_polish.py
          python tools/three_views_quality_v2.py
          python tools/three_views_final_polish.py
          python tools/build_search_index.py
      - name: Check every article, anchor and preserved source
        run: |
          python - <<'PY'
          import json,pathlib,urllib.parse
          from bs4 import BeautifulSoup
          root=pathlib.Path('public');out=root/'three-views/longform'
          report=json.loads((out/'report.json').read_text())
          manifest=json.loads((out/'manifest.json').read_text())
          paths=sorted(list((root/'three-views/doc').glob('*/index.html'))+list((root/'three-views/read').glob('*/index.html')))
          images=set();pdfs=set();anchors=0
          for path in paths:
              s=BeautifulSoup(path.read_text(),'html.parser')
              assert len(s.find_all('h1'))==1,path
              assert s.select_one('.prose')['data-quality-release']=='20260920-longform-v2',path
              assert path.with_name('original.html').exists(),path
              ids=[x['id'] for x in s.select('[id]')];assert len(ids)==len(set(ids)),path
              for a in s.select('a[href^="#"]'):
                  assert urllib.parse.unquote(a['href'][1:]) in ids,(path,a['href'])
                  anchors+=1
              for img in s.select('.prose img[src]'):
                  f=root/urllib.parse.unquote(img['src'].lstrip('/'));assert f.exists(),f;images.add(str(f))
              for a in s.select('a[href]'):
                  u=urllib.parse.urlsplit(a['href'])
                  if not u.netloc and u.path.startswith('/three-views/'):
                      f=root/urllib.parse.unquote(u.path.lstrip('/'))
                      assert f.is_file() or (f/'index.html').is_file(),(path,a['href'])
                      if u.path.endswith('.pdf'):pdfs.add(str(f))
              canonical=s.find('link',rel='canonical')['href'];og=s.find('meta',property='og:url')['content'];assert canonical==og,path
              schema=json.loads(s.select_one('script[type="application/ld+json"]').string);assert schema['url']==canonical,path
          catalog=BeautifulSoup((out/'index.html').read_text(),'html.parser');assert len(catalog.select('.card'))==len(manifest)
          for id in ['b121','b162']:
              s=BeautifulSoup((root/'three-views/doc'/id/'index.html').read_text(),'html.parser');assert s.select('.figure img');assert '0 字' not in s.select_one('.meta').get_text()
          for id,folder,credit in [('a009','read','杨彼得'),('a028','read','韩燕红'),('a143','read','巩丽萍'),('b215','doc','翟文颖'),('b232','doc','凤春红')]:
              s=BeautifulSoup((root/'three-views'/folder/id/'index.html').read_text(),'html.parser');assert credit in s.select_one('.meta').get_text()
          search=json.loads((root/'search/manifest.json').read_text());assert not any('/three-views/' in x['u'] and x['u'].endswith('original.html') for x in search['docs'])
          indexed={x['u']:x for x in search['docs']}
          for r in manifest:assert indexed[r['url']]['s']=='three-views',r['url']
          result={'article_pages':len(paths),'unique_catalog_entries':len(manifest),'image_files_checked':len(images),'pdf_files_checked':len(pdfs),'anchors_checked':anchors,'all_passed':True,'search_original_reader_duplicates_removed':True}
          report['static_validation']=result;(out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          pathlib.Path('artifacts/three-views-quality-v2/static-validation.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Check desktop and mobile reading interactions
        run: |
          python - <<'PY'
          import functools,http.server,json,pathlib,threading
          from playwright.sync_api import sync_playwright
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8765),functools.partial(http.server.SimpleHTTPRequestHandler,directory='public'))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          out=pathlib.Path('artifacts/three-views-quality-v2/browser');out.mkdir(parents=True,exist_ok=True)
          tests=[]
          urls=['/three-views/longform/','/three-views/doc/b020/','/three-views/read/a021/','/three-views/doc/b038/','/three-views/doc/b121/','/three-views/doc/b162/','/three-views/read/a030/']
          with sync_playwright() as p:
              b=p.chromium.launch()
              for mode,width,height in [('desktop',1440,1000),('mobile',390,844)]:
                  context=b.new_context(viewport={'width':width,'height':height},device_scale_factor=1)
                  page=context.new_page()
                  page.route('**/wds-mode.js*',lambda route:route.fulfill(status=200,body=''))
                  for url in urls:
                      page.goto('http://127.0.0.1:8765'+url,wait_until='networkidle',timeout=60000)
                      page.evaluate('localStorage.clear();document.documentElement.dataset.readingTheme="light"')
                      assert page.locator('h1').count()==1,url
                      assert page.evaluate('document.documentElement.scrollWidth <= innerWidth+1'),(mode,url,'horizontal overflow')
                      if '/longform/' not in url:
                          before=page.locator('.prose').evaluate('(e)=>parseFloat(getComputedStyle(e).fontSize)')
                          page.locator('[data-size="1"]').click()
                          after=page.locator('.prose').evaluate('(e)=>parseFloat(getComputedStyle(e).fontSize)');assert after>before,url
                          page.locator('[data-size="-1"]').click()
                          page.locator('[data-theme]').click();assert page.evaluate('document.documentElement.dataset.readingTheme')=='dark'
                          page.locator('[data-theme]').click()
                          if mode=='mobile':
                              page.locator('.mobile-toc summary').click();assert page.locator('.mobile-toc').get_attribute('open') is not None
                              page.locator('.mobile-toc summary').click()
                      else:
                          page.locator('#q').fill('教育27宫格');assert page.locator('.card:visible').count()==1
                          page.locator('#q').fill('');page.locator('#cat').select_option(label='教育智慧');assert page.locator('.card:visible').count()>0
                          page.locator('#cat').select_option('')
                      if url.endswith('/b121/'):
                          page.locator('.figure a').first.click();assert page.locator('dialog[open]').count()==1
                          page.locator('[data-zoom]').click();assert page.locator('dialog.is-zoomed').count()==1
                          page.keyboard.press('Escape');assert page.locator('dialog[open]').count()==0
                      page.evaluate('window.scrollTo(0,0)')
                      shot_name=mode+'-'+url.strip('/').replace('/','-')+'.png'
                      page.screenshot(path=str(out/shot_name))
                      tests.append({'mode':mode,'url':url,'passed':True})
                      (out/'progress.json').write_text(json.dumps(tests,ensure_ascii=False,indent=2))
                  context.close()
              b.close()
          server.shutdown()
          summary={'viewports':2,'pages_per_viewport':len(urls),'checks_passed':len(tests),'tests':tests}
          (out/'validation.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          report_path=pathlib.Path('public/three-views/longform/report.json');report=json.loads(report_path.read_text());report['browser_validation']={k:v for k,v in summary.items() if k!='tests'};report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit scoped changes without replacing concurrent work
        run: |
          git config user.name 'SDE Quality Publisher'
          git config user.email 'quality-publisher@users.noreply.github.com'
          git add public/three-views public/search tools/build_search_index.py tools/three_views_quality_v2.py
          if git diff --cached --quiet; then echo 'No content changes'; exit 0; fi
          git commit -m 'Refine 436 Three Views pages: diagram completion, complete credits, readable paragraphs, search and tested mobile UI'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify all deployed article pages
        run: |
          python - <<'PY'
          import concurrent.futures,json,pathlib,time,urllib.request
          host='https://sdeuniverses.com';root=pathlib.Path('public/three-views');out=pathlib.Path('artifacts/three-views-quality-v2')
          def get(path,method='GET'):
              req=urllib.request.Request(host+path,method=method,headers={'User-Agent':'SDE-quality-verification/2.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.read().decode('utf-8') if method=='GET' else r.status
          for attempt in range(30):
              try:
                  report=json.loads(get('/three-views/longform/report.json?quality=v2-'+str(attempt)))
                  if report.get('quality_release')=='20260920-longform-v2':break
              except Exception as e:print('Waiting for deployment',attempt,type(e).__name__)
              time.sleep(20)
          else:raise RuntimeError('GitHub publication completed; production deployment not yet verified')
          paths=sorted(list((root/'doc').glob('*/index.html'))+list((root/'read').glob('*/index.html')))
          urls=['/'+p.parent.relative_to('public').as_posix()+'/' for p in paths]
          def verify(url):
              for attempt in range(3):
                  try:
                      text=get(url+'?quality=v2-release');ok='data-quality-release="20260920-longform-v2"' in text and '在线翻阅原稿' in text
                      return {'url':url,'passed':ok}
                  except Exception as e:error=type(e).__name__+': '+str(e);time.sleep(2+attempt)
              return {'url':url,'passed':False,'error':error}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(verify,urls))
          catalog='20260920-longform-v2' in get('/three-views/longform/?quality=v2-release')
          entry='/three-views/longform/' in get('/three-views/?quality=v2-release')
          assets=[]
          for id in ['b121','b162','b038']:
              for path in (root/'doc'/id/'figures').glob('quality-v2-*.webp'):
                  url='/'+path.relative_to('public').as_posix();assets.append({'url':url,'status':get(url,method='HEAD')})
              for name in [id+'.pdf','original.html']:
                  url=f'/three-views/doc/{id}/{name}';assets.append({'url':url,'status':get(url,method='HEAD')})
          result={'quality_release':'20260920-longform-v2','entry_point_verified':entry,'catalog_verified':catalog,'article_pages_checked':len(results),'article_pages_passed':sum(x['passed'] for x in results),'failed':[x for x in results if not x['passed']],'source_and_new_assets_checked':len(assets),'source_and_new_assets_passed':sum(x['status']==200 for x in assets),'articles':results,'assets':assets}
          (out/'live-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in result.items() if k not in ['articles','assets']},ensure_ascii=False,indent=2))
          assert entry and catalog and not result['failed'] and all(x['status']==200 for x in assets)
          PY
      - name: Package audited pages and receipts
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile
          dest=pathlib.Path('artifacts/three-views-quality-v2');dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(dest/'publication.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in pathlib.Path('public/three-views').rglob('*'):
                  if p.is_file() and p.suffix in {'.html','.css','.js','.json','.webp','.xml'}:z.write(p,p.as_posix())
              for p in [pathlib.Path('tools/three_views_longform_20260920.py'),pathlib.Path('tools/three_views_quality_v2.py'),pathlib.Path('tools/three_views_final_polish.py'),pathlib.Path('tools/build_search_index.py')]:
                  if p.exists():z.write(p,p.as_posix())
          PY
      - name: Preserve quality evidence and desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-views-quality-v2
          path: artifacts/three-views-quality-v2
          retention-days: 30
          if-no-files-found: ignore
