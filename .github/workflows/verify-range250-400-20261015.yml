name: Verify volumes 250 through 400
on:
  push:
    branches: [codex/verify-range250-400-20261015]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify every available book and both shelves
        run: |
          python3 -u - <<'PY'
          import urllib.request,urllib.parse,json,re,html,hashlib,time,concurrent.futures
          root='https://sdeuniverses.com'
          def get(url):
              url=urllib.parse.urljoin(root,url)
              req=urllib.request.Request(url,headers={'User-Agent':'SDE-Publication-Verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  assert r.status==200
                  return r.read()
          for attempt in range(20):
              try:
                  audit=json.loads(get('/books/range-250-400-20261015/audit.json'))
                  assert audit['revision']=='20261015-range250-400-v1' and audit['count']==119
                  break
              except Exception as e:
                  print('Awaiting deployment',attempt+1,str(e),flush=True)
                  time.sleep(25)
          else: raise RuntimeError('Deployment unavailable')
          def check(b):
              for key in ['readingUrl','learningUrl','agentUrl']:
                  page=get(b[key]).decode('utf-8')
                  assert '<html' in page.lower(),(b['number'],key)
                  if '/books/unit-20261015-quality/app.js' in page:
                      for asset in re.findall(r'<(?:script|img)[^>]*src="([^"]+)"',page):
                          assert len(get(urllib.parse.urljoin(b[key],html.unescape(asset))))>20,(b['number'],'asset',asset)
              home=get(b['detailUrl']).decode()
              links={urllib.parse.urljoin(b['detailUrl'],html.unescape(x)) for x in re.findall(r'href=["\x27]([^"\x27]+)["\x27]',home)}
              assert all(b[k] in links for k in ['readingUrl','learningUrl','agentUrl']),(b['number'],'introduction missing entry')
              data=json.loads(get(b['dataUrl']))
              tasks=data.get('tasks') or data.get('cards') or data.get('problems') or data.get('chapters')
              assert tasks,(b['number'],'empty learning data')
              raw=get(b['sourceDocumentUrl']).decode()
              ids=set(re.findall(r'id=["\x27]([^"\x27]+)["\x27]',raw))
              for t in tasks:
                  if t.get('sourceText') and t.get('sourceHash'):
                      assert hashlib.sha256(t['sourceText'].encode()).hexdigest()==t['sourceHash'],(b['number'],'embedded chapter hash')
                  anchors=[urllib.parse.urlparse(t.get('sourceUrl') or t.get('url') or '').fragment]+[x.get('c') for x in t.get('anchors',[])]+[x.get('c') for x in t.get('ev',[])]
                  assert all(a in ids for a in anchors if a),(b['number'],'missing anchor')
              if data.get('sourceBodySha256'):
                  body=re.search(r'<body\b[^>]*>([\s\S]*)</body>',raw,re.I).group(1)
                  body=re.sub(r"""<script\b[^>]*src=["']https://static\.cloudflareinsights\.com/beacon\.min\.js[^>]*>[\s\S]*?</script>\s*""",'',body,flags=re.I)
                  assert hashlib.sha256(body.encode()).hexdigest()==data['sourceBodySha256'],(b['number'],'body hash')
              source=next((t for t in tasks if t.get('sourceData')),None)
              if source:
                  s=json.loads(get(source['sourceData']))
                  assert hashlib.sha256(s['text'].encode()).hexdigest()==source['sourceSha256'],(b['number'],'chapter hash')
              print('PASS BOOK',b['number'],b['title'],len(tasks),'learning units',flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:list(pool.map(check,audit['books']))
          for path in ['/books/','/monographs/','/sites/read/library/']:
              markup=get(path).decode()
              cards=re.findall(r'<article\b[^>]*>.*?</article>',markup,re.S)
              for b in audit['books']:
                  card=next((a for a in cards if 'data-id="'+b['id']+'"' in a),None)
                  assert card is not None,(path,b['number'],'missing card')
                  for action,key in [('read','readingUrl'),('learn','learningUrl'),('agent','agentUrl')]:
                      m=re.search(r'<a\b[^>]*data-unit-action="'+action+r'"[^>]*href="([^"]+)"',card)
                      assert m and html.unescape(m.group(1))==b[key],(path,b['number'],action)
              print('PASS SHELF',path,'119 books, 357 matching links',flush=True)
          print('ALL 119 VERIFIED; 32 number slots have no catalog book. No paid model calls.',flush=True)
          PY
