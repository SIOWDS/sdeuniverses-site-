name: Volume 295 v1.2 substantive revision candidate
on:
  push:
    branches: [book295-review-v12-20261002]
    paths: ['.github/workflows/book295-review-v12-candidate.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            public/books/m/295
            tools/m295-v12
      - name: Prepare book renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-noto-cjk
          python -m pip install --disable-pip-version-check -q python-docx==1.2.0 beautifulsoup4==4.13.5 Pillow==11.3.0 PyMuPDF==1.26.4 playwright==1.55.0
          fc-cache -f
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Authenticate source and build the complete revised edition
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/m295-candidate/site/books/m" "$RUNNER_TEMP/m295-candidate/qa"
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          src=Path('public/books/m/295')
          baseline={str(p.relative_to(src)):hashlib.sha256(p.read_bytes()).hexdigest() for p in src.rglob('*') if p.is_file()}
          Path(os.environ['RUNNER_TEMP'],'m295-candidate','source-files.json').write_text(json.dumps(baseline,indent=2))
          PY
          python tools/m295-v12/revision_data.py
          python tools/m295-v12/build.py public/books/m/295 "$RUNNER_TEMP/m295-candidate/site/books/m/295" tools/m295-v12/revision.json
          cp tools/m295-v12/revision.json "$RUNNER_TEMP/m295-candidate/revision.json"
      - name: Verify PDF structure and actual desktop/mobile reader functions
        run: python tools/m295-v12/check.py "$RUNNER_TEMP/m295-candidate/site" "$RUNNER_TEMP/m295-candidate/qa"
      - name: Preserve complete candidate and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book295-v12-reviewed-candidate
          retention-days: 14
          path: ${{ runner.temp }}/m295-candidate/
