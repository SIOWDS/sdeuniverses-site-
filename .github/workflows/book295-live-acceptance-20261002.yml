name: Book 295 production acceptance
on:
  push:
    branches: ['publish/book-295-20261002']
    paths: ['.github/workflows/book295-live-acceptance-20261002.yml']
permissions:
  contents: read
  actions: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book295-candidate-v1.1
          run-id: 36934923822
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/book295-import
      - name: Read the same approved publication package
        run: |
          python - <<'PY'
          import os,pathlib,zipfile,hashlib
          r=pathlib.Path(os.environ['RUNNER_TEMP']);files=list((r/'book295-import').rglob('book295-package.zip'));assert len(files)==1
          assert hashlib.sha256(files[0].read_bytes()).hexdigest()=='3b24485d06b8a68067b53b7d56a8a98f847c05a0084cef343cdbd11c2420b320'
          with zipfile.ZipFile(files[0]) as z:
              for n in z.namelist():assert not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts
              z.extractall(r/'book295-approved')
          (r/'book295-live').mkdir()
          PY
      - name: Wait for the published edition to reach the website
        run: |
          python - <<'PY'
          import urllib.request,json,time
          url='https://sdeuniverses.com/books/m/295/book.json'
          for attempt in range(32):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Book 295 live acceptance)','Cache-Control':'no-cache'})
                  data=json.load(urllib.request.urlopen(req,timeout=20))
                  assert data['number']==295 and data['version']=='1.1' and data['chapters']==35 and data['pdfPages']==299
                  print('Production edition is available.');break
              except Exception as e:
                  print('Waiting for deployment:',attempt+1,type(e).__name__,flush=True)
                  if attempt==31:raise
                  time.sleep(15)
          PY
      - name: Check all published files against the approved package
        run: |
          python - <<'PY'
          import os,pathlib,json,urllib.request,hashlib,re,concurrent.futures
          from html.parser import HTMLParser
          root=pathlib.Path(os.environ['RUNNER_TEMP']);pkg=root/'book295-approved';out=root/'book295-live';book=pkg/'public/books/m/295'
          class Text(HTMLParser):
              def __init__(self):super().__init__(convert_charrefs=True);self.skip=0;self.parts=[]
              def handle_starttag(self,t,a):
                  if t in ('script','style'):self.skip+=1
              def handle_endtag(self,t):
                  if t in ('script','style'):self.skip=max(0,self.skip-1)
              def handle_data(self,d):
                  if not self.skip:self.parts.append(d)
          def visible(data):
              p=Text();p.feed(data.decode('utf-8'));return re.sub(r'\s+',' ',''.join(p.parts)).strip()
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Book 295 live acceptance)'})
              with urllib.request.urlopen(req,timeout=60) as r:return r.status,r.read()
          def check(p):
              rel=p.relative_to(pkg/'public').as_posix();status,data=fetch('https://sdeuniverses.com/'+rel);local=p.read_bytes()
              if p.name=='book.json':
                  b=json.loads(data);ok=b['number']==295 and b['priceUSD']==24 and b['isbn']=='9798906903624' and b['version']=='1.1'
                  mode='publication metadata'
              elif p.suffix=='.html':ok=visible(data)==visible(local);mode='visible HTML text'
              else:ok=hashlib.sha256(data).hexdigest()==hashlib.sha256(local).hexdigest();mode='SHA256'
              return {'path':rel,'status':status,'matches':ok,'mode':mode,'bytes':len(data)}
          files=sorted(p for p in book.rglob('*') if p.is_file())
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:checks=list(pool.map(check,files))
          shelves=[]
          for u in ['https://sdeuniverses.com/books/','https://sdeuniverses.com/monographs/','https://read.sdeuniverses.com/library/']:
              status,data=fetch(u);text=data.decode('utf-8');ok='data-id="m-295"' in text and '虚无不是终点' in text
              shelves.append({'url':u,'status':status,'book295_present':ok})
          report={'book':295,'version':'1.1','files':checks,'bookshelves':shelves,'all_passed':all(x['matches'] and x['status']==200 for x in checks) and all(x['book295_present'] and x['status']==200 for x in shelves),'reindex_requested':False}
          (out/'live-files-and-bookshelves.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({'files':len(checks),'mismatches':[x for x in checks if not x['matches']],'bookshelves':shelves,'all_passed':report['all_passed']},ensure_ascii=False,indent=2));assert report['all_passed']
          PY
      - name: Prepare the reading browser
        run: |
          python -m pip install -q playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Test desktop and mobile production reading
        run: python "$RUNNER_TEMP/book295-approved/tools/browser_check.py" https://sdeuniverses.com/books/m/295/ "$RUNNER_TEMP/book295-live/browser"
      - name: Preserve production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book295-production-acceptance
          path: ${{ runner.temp }}/book295-live/
          retention-days: 14
