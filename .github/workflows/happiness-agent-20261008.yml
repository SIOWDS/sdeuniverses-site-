name: Happiness Secret dedicated agent and learning entry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/happiness-agent-20261008.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: happiness-secret-publication
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/happiness_agent_20261008.py
            /public/books/happiness-secret/
            /public/books/agent/
            /public/books/m/294/agent/index.html
            /public/books/agents.json
            /public/books/catalog.json
            /.github/workflows/search-index.yml
      - name: Prepare bounded browser dependencies
        timeout-minutes: 4
        run: |
          python3 -m pip install --quiet --timeout 25 --retries 1 beautifulsoup4 playwright
          timeout 150s python3 -m playwright install chromium
          timeout 40s sudo apt-get -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 -o Acquire::Retries=1 install -y -qq fonts-noto-cjk || echo 'Using system fonts'
      - name: Build source-bound agent, source excerpts and nine learning tasks
        run: python3 tools/happiness_agent_20261008.py build
      - name: Verify desktop and mobile before publication without using a real model key
        run: python3 tools/happiness_agent_20261008.py candidate
      - name: Publish only this agent and reconcile concurrent updates without force
        run: |
          python3 - <<'PY'
          import runpy, subprocess, json, time
          m=runpy.run_path('tools/happiness_agent_20261008.py')
          original=m['git']
          def safe_git(*args):
              if args != ('push','origin','HEAD:main'):
                  return original(*args)
              for attempt in range(4):
                  try:
                      return original(*args)
                  except subprocess.CalledProcessError:
                      if attempt == 3: raise
                      original('fetch','--deepen=50','origin','main')
                      original('rebase','origin/main')
                      data=json.loads((m['QA']/'build.json').read_text())
                      assert all(m['sha'](m['ROOT']/p)==h for p,h in data['protected_files'].items()), 'Protected book content changed concurrently; stop'
                      reg=json.loads((m['PUB']/'books/agents.json').read_text())['agents']
                      assert reg['happiness-secret']['name']=='回甘'
                      assert sum(x.get('name')=='回甘' for x in reg.values())==1
                      time.sleep(1)
          m['publish'].__globals__['git']=safe_git
          m['publish']()
          PY
      - name: Verify public files, unchanged PDFs and live user interface
        run: python3 tools/happiness_agent_20261008.py live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: happiness-agent-acceptance-20261008
          path: ${{ runner.temp }}/happiness-agent-evidence/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: happiness-agent-generated-files
          path: public/books/happiness-secret/agent/
          retention-days: 7
