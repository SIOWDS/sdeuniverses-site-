name: Publish programmatic innovation homepage entry

on:
  push:
    branches: [main]
    paths:
      - '.programmatic-innovation-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-programmatic-innovation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generated column and papers
        run: python3 tools/install_programmatic_bundle.py
      - name: Patch homepage and search section map
        run: python3 tools/publish_programmatic_innovation.py
      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/programmatic-innovation public/index.html tools/build_search_index.py
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "homepage: open 纲领创新 and publish 发生保真"
            git push
          fi
