name: journal-reading-batch-20260918
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/journal_reading_batch_20260918.py
      - tools/journal_reading_publish_20260918.py
      - tools/journal_reading_release_20260918.py
      - .github/workflows/journal-reading-batch-20260918.yml
permissions:
  contents: write
concurrency:
  group: journal-reading-batch-20260918
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/journal_reading_batch_20260918.py
            /tools/journal_reading_publish_20260918.py
            /tools/journal_reading_release_20260918.py
            /public/journals/reading/
            /public/journals/journals.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.4 beautifulsoup4==4.13.4 pymupdf==1.26.3
      - name: Build reviewed sources and enforce exact counts
        run: python tools/journal_reading_release_20260918.py
      - name: Commit only this reading batch
        run: |
          git config user.name 'SDE Reading Publisher'
          git config user.email 'reading-publisher@users.noreply.github.com'
          git add public/journals/reading public/journals/journals.js
          if git diff --cached --quiet; then echo 'No content changes'; exit 0; fi
          git commit -m 'Publish 24 licensed Chinese full texts: 109998 net body Han and 179 local source pages'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify live deployment and every source asset
        run: python tools/journal_reading_release_20260918.py live
      - name: Preserve source audit and live verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-reading-batch-20260918-review
          path: /tmp/journal-reading-batch-20260918
          if-no-files-found: ignore
