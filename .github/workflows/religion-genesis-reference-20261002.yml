name: Religion genesis reference preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/religion-genesis-reference-20261002.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read actual design PDF and reader dependencies
        run: |
          python -m pip install -q pymupdf
          python - <<'PY'
          import urllib.request,json,pathlib,re,fitz
          out=pathlib.Path('references');out.mkdir()
          def get(u):return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Religion-Genesis-Reference'}),timeout=90).read()
          for name,url in [('book220-reader.pdf','https://sdeuniverses.com/students/wang-desheng/my-three-treasures/m220/my-three-treasures-reader-v3.pdf'),('m296-read.html','https://sdeuniverses.com/books/m/296/read.html'),('m220-read.html','https://sdeuniverses.com/books/m/220/read.html')]:
              try:
                  b=get(url);(out/name).write_bytes(b);print(name,len(b))
              except Exception as e: print(name,type(e).__name__,str(e))
          p=out/'book220-reader.pdf'
          if p.exists():
              d=fitz.open(p);(out/'book220-page-sizes.json').write_text(json.dumps({'pages':len(d),'size_pt':list(d[0].rect)},indent=2))
              for i in [0,1,2,3,5,8,10,20,50,len(d)-1]:
                  if i<len(d):d[i].get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(out/f'book220-page-{i+1:03d}.png')
          raw='https://raw.githubusercontent.com/SIOWDS/sdeuniverses-site-/main/'
          for path in ['.github/workflows/publish-m288-reviewed-20261002.yml','.github/workflows/deploy-m289-reviewed-20261002.yml','tools/m288-install-reviewed-20261002.py','public/books/m/296/publication-manifest.json']:
              try:(out/path.replace('/','__').lstrip('.')).write_bytes(get(raw+path))
              except Exception as e:print(path,type(e).__name__)
          print('Read-only reference collection, no index or site changes.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: religion-genesis-live-pdf-references
          path: references/
          retention-days: 3
