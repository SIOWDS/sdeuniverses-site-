name: Volume 288 exact 353-page reviewed publication candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m288-v11-page-parity-20261002.yml']
permissions:
  contents: read
  actions: read
jobs:
  finish:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 12
    steps:
      - name: Prepare matching CJK document rendering
        timeout-minutes: 6
        run: |
          export DEBIAN_FRONTEND=noninteractive
          timeout 90s apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          timeout 210s apt-get install -y -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 git ca-certificates python3 python3-venv libreoffice-writer fonts-noto-cjk fontconfig
          python3 -m venv /tmp/m288-venv
          timeout 90s /tmp/m288-venv/bin/pip install --quiet --disable-pip-version-check --no-input --timeout 20 --retries 1 python-docx==1.2.0 PyMuPDF==1.26.4 beautifulsoup4==4.13.5
          fc-cache -f
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: tools
      - uses: actions/download-artifact@v4
        with:
          name: m288-v11-reviewed-publication-candidate
          run-id: 36968764172
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/m288-incoming
      - name: Finish appendix nine and verify every page against the reviewed layout
        run: /tmp/m288-venv/bin/python tools/m288-v11-finish-appendix.py "$RUNNER_TEMP/m288-incoming" "$RUNNER_TEMP/m288-page-final"
      - name: Gather only book files and acceptance records
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/m288-export"
          if [ -d "$RUNNER_TEMP/m288-page-final/book" ]; then cp -a "$RUNNER_TEMP/m288-page-final/book" "$RUNNER_TEMP/m288-export/"; fi
          if [ -d "$RUNNER_TEMP/m288-page-final/qa" ]; then cp -a "$RUNNER_TEMP/m288-page-final/qa" "$RUNNER_TEMP/m288-export/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m288-v11-exact-page-candidate
          retention-days: 14
          path: ${{ runner.temp }}/m288-export/
