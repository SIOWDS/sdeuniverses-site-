# Second and final verification pass: production search index.
name: verify-painless-zone-index-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-painless-zone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll the production R2 search manifest until the paper is indexed
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            echo "attempt=$attempt"
            rm -f /tmp/manifest.json
            if curl -fsSL --max-time 60 -H 'Cache-Control: no-cache' \
              'https://sdeuniverses.com/search/manifest.json?verify=20260809-89' \
              -o /tmp/manifest.json \
              && python3 - <<'PY'
          import json, sys
          p='/tmp/manifest.json'
          try:
              m=json.load(open(p, encoding='utf-8'))
          except Exception:
              sys.exit(1)
          docs=m.get('docs', [])
          hits=[d for d in docs if 'painless-zone' in str(d.get('u','')) or '制造无痛区' in str(d)]
          if not hits:
              sys.exit(1)
          print('indexed:', hits[0].get('u'), hits[0].get('t') or hits[0].get('title'))
          print('built:', m.get('built'))
          print('docs:', (m.get('counts') or {}).get('docs'))
          PY
            then
              mkdir -p deploy-verification
              if [ ! -f deploy-verification/painless-zone-20260809.txt ]; then
                echo 'status=live' > deploy-verification/painless-zone-20260809.txt
              fi
              {
                echo 'search_index=live'
                echo "index_verified_utc=$(date -u +%FT%TZ)"
                python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json', encoding='utf-8'))
          print('index_built='+str(m.get('built','')))
          print('index_docs='+str((m.get('counts') or {}).get('docs','')))
          PY
              } >> deploy-verification/painless-zone-20260809.txt
              git config user.name 'sde-live-verifier'
              git config user.email 'actions@users.noreply.github.com'
              git add deploy-verification/painless-zone-20260809.txt
              git commit -m 'Verify 学科通融之八十九 in production search index'
              git push origin HEAD:main
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for the production search index.' >&2
          exit 1
