name: Publish accepted volume282 final edition
on:
  push:
    branches: [main]
    paths: [.github/workflows/eq282-publish-final-20261008.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: volume282-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/282/
            /public/books/catalog.json
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /.publish/volume-reservations/282.json
      - uses: actions/download-artifact@v4
        with:
          name: eq282-final-edition-v1
          run-id: 37780530588
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eq282
      - name: Verify exact accepted edition and patch catalog null handling only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          r=Path(os.environ['RUNNER_TEMP'])/'eq282';b=r/'book';m=json.loads((b/'publication-manifest.json').read_text())
          assert m['release_sha256']=='083d10fa9962b8b554d4942da5fda6afbad4b58e1c497d1b71fab055b7bda3f3'
          for f in m['files']:
            data=(b/f['path']).read_bytes();assert len(data)==f['bytes'] and hashlib.sha256(data).hexdigest()==f['sha256'],f['path']
          checks=json.loads((r/'qa/candidate-browser.json').read_text());assert len(checks)==2 and all(x['pass'] and x['pages']==463 and x['full_text_chapters']==60 for x in checks)
          p=r/'build-tools/install.py';s=p.read_text();old="x.get('isbn','').replace('-','')";assert s.count(old)==1;p.write_text(s.replace(old,"str(x.get('isbn') or '').replace('-','')"))
          print('Verified 60 chapters and 251155 Han; accepted browser checks; publication bytes unchanged.')
          PY
      - name: Reconcile latest catalog and add only the authorized book
        run: python3 "$RUNNER_TEMP/eq282/build-tools/install.py" "$RUNNER_TEMP/eq282" "$GITHUB_WORKSPACE"
      - name: Verify actual public assets and three bookshelves
        run: python3 "$RUNNER_TEMP/eq282/build-tools/live_qa.py" "$RUNNER_TEMP/eq282"
      - name: Prepare public browser verification
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify actual desktop and mobile public readers
        run: python3 "$RUNNER_TEMP/eq282/build-tools/browser_qa.py" "$RUNNER_TEMP/eq282" "https://sdeuniverses.com/books/m/282/"
      - name: Preserve publication and live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eq282-final-publication-evidence-v1
          path: ${{ runner.temp }}/eq282/qa/
          retention-days: 14
