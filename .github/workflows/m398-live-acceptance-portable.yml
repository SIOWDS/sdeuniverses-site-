name: M398 final production acceptance portable
on:
  push:
    branches: ['publish/m398-judgment-genesis-20261008']
    paths: ['.github/workflows/m398-live-acceptance-portable.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare browser using existing runner libraries
        run: |
          python -m pip install --quiet --timeout 30 --retries 2 beautifulsoup4 pymupdf playwright pyyaml
          python -m playwright install chromium
      - name: Recover exact published book and receipts
        uses: actions/download-artifact@v4
        with:
          name: book398-edition-v1-publication-evidence
          run-id: 37707462677
          github-token: ${{ github.token }}
          repository: SIOWDS/sdeuniverses-site-
          path: ${{ runner.temp }}/book398
      - name: Run pinned full-content production checks
        run: |
          python - <<'PY'
          import urllib.request,yaml,subprocess,os
          url='https://raw.githubusercontent.com/SIOWDS/sdeuniverses-site-/6f02e4ae74d1670bbc27b62e84427b58cda94971/.github/workflows/m398-live-acceptance-v1.yml'
          with urllib.request.urlopen(url,timeout=60) as r:data=yaml.safe_load(r.read())
          steps=data['jobs']['verify']['steps']
          step=next(s for s in steps if s['name']=='Verify live content and all binary hashes')
          subprocess.run(step['run'],shell=True,executable='/bin/bash',check=True,env=os.environ)
          PY
      - name: Verify live desktop mobile reader and agent
        run: python "$RUNNER_TEMP/book398/build-tools/browser_qa.py" "$RUNNER_TEMP/book398" "$RUNNER_TEMP/book398/qa/live-browser" https://sdeuniverses.com
      - name: Preserve final verified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m398-final-production-acceptance-portable
          retention-days: 14
          path: ${{ runner.temp }}/book398/qa/
