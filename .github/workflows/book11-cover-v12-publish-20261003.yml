name: Book11 approved minimalist cover v1.2 publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/book11-cover-v12-publish-20261003.yml']
permissions:
  contents: write
  actions: read
  checks: read
  statuses: read
concurrency:
  group: book11-cover-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book11-approved-cover-v12-publication
          run-id: 37074923300
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/book11-cover-v12
      - name: Install isolated verification dependencies
        run: python -m pip install -q Pillow PyMuPDF beautifulsoup4 PyYAML playwright==1.55.0
      - name: Recheck every retained page and current indexing triggers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/book11-cover-v12/tools/prepare.py" "$RUNNER_TEMP/book11-cover-v12"
      - name: Supply verified accessibility text for the image cover
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,subprocess
          import pymupdf as fitz
          root=Path(os.environ['RUNNER_TEMP'])/'book11-cover-v12';book=root/'book'
          pdf=fitz.open(book/'downloads/book-v1.2.pdf');cover_text=pdf[0].get_text()
          assert ''.join(cover_text.split())=='三律治理学王德生著德麦国际'
          p=book/'assets/reader.mjs';s=p.read_text()
          old="txt.push('【第'+pn+'页】\\n'+tc.items.map(x=>x.str).join(''));"
          new="txt.push('【第'+pn+'页】\\n'+(pn===1?"+json.dumps(cover_text,ensure_ascii=False)+":tc.items.map(x=>x.str).join('')));"
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          subprocess.run(['node','--check',str(p)],check=True)
          m=json.loads((book/'publication.json').read_text())
          for e in m['files']:
            data=(book/e['path']).read_bytes();e['sha256']=hashlib.sha256(data).hexdigest();e['bytes']=len(data)
          m['cover_accessibility_text_source']='Verified text extracted from the exact approved PDF cover; body page extraction unchanged'
          (book/'publication.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))
          p=root/'tools/browser_check.py';s=p.read_text();old="   if number==1:assert '王德生' in state['text'] and '统稿审阅' not in state['text']"
          lines=["   if number==1:","    print('COVER_TEXT',repr(state['text']),flush=True)","    assert '王德生' in state['text'] and '统稿审阅' not in state['text']","    pixel=page.locator('canvas').first.evaluate('(c)=>Array.from(c.getContext(\"2d\").getImageData(8,8,1,1).data)')","    assert pixel[0]<40 and pixel[1]<50 and pixel[2]<70, pixel","    page.screenshot(path=str(out/f'{device}-reader-approved-cover.png'))"]
          assert old in s;p.write_text(s.replace(old,'\n'.join(lines)))
          PY
      - name: Prepare Chinese-capable browser
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Verify desktop and mobile cover and complete reader
        run: |
          mkdir -p "$RUNNER_TEMP/book11-cover-test/books/m"
          ln -s "$RUNNER_TEMP/book11-cover-v12/book" "$RUNNER_TEMP/book11-cover-test/books/m/11"
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/book11-cover-test" > "$RUNNER_TEMP/book11-cover-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python "$RUNNER_TEMP/book11-cover-v12/tools/browser_check.py" http://127.0.0.1:8765/books/m/11 "$RUNNER_TEMP/book11-cover-v12/qa/browser-local"
      - name: Publish only book 11 and its existing shelf cards atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/book11-cover-v12/tools/publish.py" "$RUNNER_TEMP/book11-cover-v12"
      - name: Verify Cloudflare deployment and exact live files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/book11-cover-v12/tools/verify_live.py" "$RUNNER_TEMP/book11-cover-v12"
      - name: Verify production browser readers and new cover
        run: python "$RUNNER_TEMP/book11-cover-v12/tools/browser_check.py" https://sdeuniverses.com/books/m/11 "$RUNNER_TEMP/book11-cover-v12/qa/browser-live"
      - name: Preserve publication receipts and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book11-approved-cover-v12-final
          retention-days: 7
          path: ${{ runner.temp }}/book11-cover-v12/
