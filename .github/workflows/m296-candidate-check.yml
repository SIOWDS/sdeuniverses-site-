name: M296 candidate publication check
on:
  push:
    branches: ['publish/m296-20261002']
    paths: ['.github/workflows/m296-candidate-check.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: m296-candidate-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Receive the user-authorized public book candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,time,hashlib,pathlib,urllib.request,urllib.parse,zipfile
          api='https://api.github.com/repos/SIOWDS/sdeuniverses-site-/issues/24'
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          expected='a0ab73f34a085cf119f31607114d8e26fc6ecd422f9d58f76fb0dd3230052f39'
          root=pathlib.Path(os.environ['RUNNER_TEMP']);archive=root/'m296-publication.zip'
          for _ in range(72):
            obj=json.load(urllib.request.urlopen(urllib.request.Request(api,headers=hdr),timeout=20))
            body=json.loads(obj['body']);assert obj['user']['login']=='SIOWDS' and body['volume']==296 and body['sha256']==expected
            if body.get('ready'):break
            time.sleep(5)
          else:raise RuntimeError('Publication payload not ready')
          url=body['url'];host=urllib.parse.urlparse(url).hostname
          assert urllib.parse.urlparse(url).scheme=='https' and host and host.endswith('.oaiusercontent.com')
          print('::add-mask::'+url)
          try:
            data=urllib.request.urlopen(url,timeout=90).read(25*1024*1024)
          except Exception:
            raise RuntimeError('Scoped publication download failed; no URL logged') from None
          assert len(data)==13075734 and hashlib.sha256(data).hexdigest()==expected
          archive.write_bytes(data)
          clean={'volume':296,'ready':False,'sha256':expected,'status':'Publication bytes received and verified. Temporary file link removed. Candidate QA in progress. No reindex.'}
          req=urllib.request.Request(api,data=json.dumps({'body':json.dumps(clean)}).encode(),headers={**hdr,'Content-Type':'application/json'},method='PATCH')
          urllib.request.urlopen(req,timeout=20).read()
          dest=root/'m296-payload';dest.mkdir()
          with zipfile.ZipFile(archive) as z:
            for n in z.namelist():assert not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts
            z.extractall(dest)
          print('Verified complete publication archive; no credentials or download links committed.')
          PY
      - name: Preserve verified candidate for subsequent release
        uses: actions/upload-artifact@v4
        with:
          name: m296-publication-candidate-v1
          path: ${{ runner.temp }}/m296-publication.zip
          retention-days: 2
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/catalog.json
            /public/books/index.html
            /public/books/m/296/
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /public/sitemap.xml
            /tools/build_bookshelf.py
      - name: Install candidate into isolated current checkout
        run: python "$RUNNER_TEMP/m296-payload/release-install.py" "$RUNNER_TEMP/m296-payload" "$GITHUB_WORKSPACE"
      - name: Prepare browser and Chinese fonts
        timeout-minutes: 5
        run: |
          python -m pip install -q playwright==1.55.0 beautifulsoup4
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null && ! command -v chromium-browser >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: JavaScript syntax and all publication readers
        run: |
          node --check public/books/m/296/reader.js
          python "$RUNNER_TEMP/m296-payload/browser-check.py" --root "$GITHUB_WORKSPACE/public" --out "$RUNNER_TEMP/m296-browser-qa"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m296-candidate-reader-evidence
          path: |
            ${{ runner.temp }}/m296-browser-qa/
            ${{ github.workspace }}/public/books/m/296/release-check.json
          retention-days: 2
