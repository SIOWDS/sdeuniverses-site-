name: Verify published discovery-to-genesis paper
on:
  push:
    branches: [publication/discovery-to-genesis-stage-20260918]
    paths: ['.github/workflows/verify-discovery-to-genesis.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read the public article and both navigation pages
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, time, json
          title = '从发现到发生：AI时代思考竞争力的典范转移'
          article_path = '/column/discovery-to-genesis/'
          for path in [article_path, '/today/', '/new-education/']:
              for attempt in range(3):
                  try:
                      url = 'https://sdeuniverses.com' + path
                      if attempt:
                          url += '?publication-check=70f54cc2-' + str(attempt)
                      req = urllib.request.Request(url, headers={'User-Agent':'SDE-Publication-Check/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          status = response.status
                          body = response.read()
                          final_url = response.url
                      html = body.decode('utf-8')
                      assert status == 200, str(status)
                      assert title in html, 'Published title missing'
                      record = {'url':final_url,'status':status,'bytes':len(body),'title_present':True}
                      if path == article_path:
                          record['sha256'] = hashlib.sha256(body).hexdigest()
                          record['formula_count'] = html.count('<math ')
                          record['section_count'] = html.count('<h2 ')
                          assert record['formula_count'] == 95, record
                          assert record['section_count'] == 17, record
                          assert len(body) >= 111659, record
                      else:
                          assert 'href="' + article_path + '"' in html, 'Article link missing'
                          record['article_link_present'] = True
                      print('PASS ' + json.dumps(record, ensure_ascii=False), flush=True)
                      break
                  except Exception as exc:
                      print('Attempt', attempt+1, path, type(exc).__name__, str(exc), flush=True)
                      if attempt == 2:
                          raise
                      time.sleep(5)
          print('PUBLICATION VERIFIED: complete live paper and both navigation entries.', flush=True)
          PY
