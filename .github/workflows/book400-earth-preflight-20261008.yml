name: Book400 earth-cover reference and transport preflight
on:
  push:
    branches: ['release/book400-earth-v12-20261008']
    paths: ['.github/workflows/book400-earth-preflight-20261008.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Receive approved cover and read publication references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,urllib.request,urllib.error,hashlib,json,os,re,base64
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'book400-preflight';root.mkdir()
          url='https://sdmntprseasia.oaiusercontent.com/files/00000000-4e38-8207-9770-40b662751f78/raw?se=2026-10-07T22%3A08%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=2fec226b-e93d-500b-b8af-476d72fef767&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T21%3A57%3A12Z&ske=2026-10-08T21%3A57%3A12Z&sks=b&skv=2026-02-06&sig=kNlTvUNZiqZLP1JARToPQp15EItmyjbIafa2CMk08Cg%3D'
          report={'production_written':False,'reindex_triggered':False}
          try:
            data=urllib.request.urlopen(url,timeout=50).read()
            assert hashlib.sha256(data).hexdigest()=='8d5c057b30b92eebdc8287c773c698886e58e704dad56159cf3e0526001e21f6'
            (root/'approved-cover.jpg').write_bytes(data);report['transport']='verified'
          except urllib.error.HTTPError as e: report['transport']={'http':e.code,'body':e.read(300).decode(errors='replace')}
          except Exception as e: report['transport']={'error':str(e)}
          def gh(path):
            req=urllib.request.Request('https://api.github.com/repos/SIOWDS/sdeuniverses-site-/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            return json.load(urllib.request.urlopen(req,timeout=50))
          report['main_sha']=gh('git/ref/heads/main')['object']['sha']
          def getfile(path):
            obj=gh('contents/'+path+'?ref=main')
            if obj.get('encoding')=='base64':return base64.b64decode(obj['content'])
            return urllib.request.urlopen(obj['download_url'],timeout=90).read()
          paths=['public/books/catalog.json','public/books/agents.json','tools/build_bookshelf.py','public/books/agent/index.html','public/books/m/220/index.html','public/books/m/302/index.html','.github/workflows/search-index.yml','wrangler.toml','wrangler.jsonc','package.json']
          for path in paths:
            try:
              data=getfile(path);dest=root/'repo'/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
            except Exception as e:report.setdefault('read_errors',{})[path]=str(e)
          cat=json.loads((root/'repo/public/books/catalog.json').read_text())
          report['volume400_catalog']=[b for b in cat['books'] if str(b.get('number'))=='400' or b.get('id')=='m-400']
          try:report['volume400_files']=gh('contents/public/books/m/400?ref=main')
          except urllib.error.HTTPError as e:report['volume400_directory_http']=e.code
          for vol in [220,302]:
            text=(root/f'repo/public/books/m/{vol}/index.html').read_text()
            links=re.findall(r'href=[\"\x27]([^\"\x27]+\.pdf(?:\?[^\"\x27]*)?)[\"\x27]',text)
            report[f'reference{vol}_pdf_links']=links
            for link in links[:2]:
              try:
                full=link if link.startswith('http') else 'https://sdeuniverses.com'+link
                data=urllib.request.urlopen(full,timeout=90).read();assert data[:4]==b'%PDF'
                suffix='reader' if 'reader' in full else 'print';(root/f'reference-{vol}-{suffix}.pdf').write_bytes(data)
              except Exception as e:report.setdefault('pdf_errors',[]).append({'url':link,'error':str(e)})
          for route in ['/books/m/220/','/books/m/302/','/books/m/400/']:
            try:
              response=urllib.request.urlopen('https://sdeuniverses.com'+route,timeout=45)
              report.setdefault('live_http',{})[route]=response.status
            except urllib.error.HTTPError as e:report.setdefault('live_http',{})[route]=e.code
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Render reference samples
        run: |
          pip -q install pymupdf
          python - <<'PY'
          import fitz,pathlib,os,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'book400-preflight'
          out=root/'reference-pages';out.mkdir()
          info=[]
          for f in root.glob('reference-*.pdf'):
            d=fitz.open(f);info.append({'file':f.name,'pages':len(d),'page_size':list(d[0].rect)})
            for i in [0,1,6,min(24,len(d)-1)]:d[i].get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(out/f'{f.stem}-{i+1:03}.png')
          (out/'reference-info.json').write_text(json.dumps(info,indent=2));print(json.dumps(info))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book400-earth-preflight
          retention-days: 2
          path: ${{ runner.temp }}/book400-preflight/
