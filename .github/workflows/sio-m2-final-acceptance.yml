name: Final SIO 430-page live acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sio-m2-final-acceptance.yml']
permissions:
  contents: write
  actions: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Stop obsolete raw-HTML byte comparison, not publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,os
          u='https://api.github.com/repos/SIOWDS/sdeuniverses-site-/actions/runs/36904866979/cancel'
          try:
            req=urllib.request.Request(u,data=b'',method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=20) as r:print('Stopped obsolete verification loop:',r.status)
          except urllib.error.HTTPError as e:
            if e.code!=409:raise
            print('Old verification already finished')
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/2/
            /.github/workflows/sio-m2-live-diagnostic.yml
            /.github/workflows/sio-m2-final-acceptance.yml
      - name: Prepare live acceptance tools
        run: python -m pip install -q beautifulsoup4 playwright PyMuPDF
      - name: Verify all binary files and complete HTML content
        run: |
          python - <<'PY'
          import pathlib,urllib.request,hashlib,json,concurrent.futures,datetime,os,fitz
          from bs4 import BeautifulSoup
          b=pathlib.Path('public/books/m/2');out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sio-final-qa';out.mkdir(exist_ok=True)
          base='https://sdeuniverses.com/books/m/2/';report={'book':2,'title':'SIO本体论','version':'完整编校排版版 v1.0','pages':430,'content_commit':'e8409afe8e1a2ea6d9fbfd51c23a3e47e9594cf9','cloudflare_version':'29cbc949-584b-493f-86e2-a3aaa232bc0d','reindex_requested':False,'binary_checks':{},'html_checks':{},'bookshelves':{},'original_articles_preserved':False}
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 SDE-Publication-Acceptance','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=35) as r:return r.read()
          binaries=['sio-ontology-reader-v1.pdf','sio-ontology-print-v1.pdf','sio-ontology-v1.docx','page-data.js','cover.svg','cover.png','back-cover.svg','back-cover.png']
          def verify(n):
            data=get(base+n);digest=hashlib.sha256(data).hexdigest();expected=hashlib.sha256((b/n).read_bytes()).hexdigest();assert digest==expected,n
            return n,{'status':200,'bytes':len(data),'sha256':digest,'matches_repository':True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            report['binary_checks']=dict(ex.map(verify,binaries))
            pages=dict(ex.map(verify,[f'pages/{i:04d}.webp' for i in range(1,431)]))
          report['all_page_images_verified']=len(pages);assert len(pages)==430
          (out/'page-image-checks.json').write_text(json.dumps(pages,indent=2))
          for n in ['index.html','text/index.html','read.html']:
            original=BeautifulSoup((b/n).read_text(),'html.parser');live_bytes=get(base+n);live=BeautifulSoup(live_bytes,'html.parser');(out/('live-'+n.replace('/','-'))).write_bytes(live_bytes)
            assert original.title.get_text()==live.title.get_text(),n+' title'
            a=original.find('main');c=live.find('main');assert a is not None and c is not None
            assert a.get_text(' ',strip=True)==c.get_text(' ',strip=True),n+' main content changed'
            for js in original.find_all('script'):
              if not js.get('src'):
                assert any(js.get_text()==x.get_text() for x in live.find_all('script')),n+' source script missing'
            report['html_checks'][n]={'status':200,'main_content_identical':True,'original_inline_scripts_preserved':True,'html_response_modified_by_site_canonical_injection':True}
          text=BeautifulSoup((b/'text/index.html').read_text(),'html.parser');assert len(text.select('section.chapter'))==13
          for key in ['appendix-a','appendix-b','appendix-c','memoir','references']:assert text.find(id=key)
          report['full_chapters']=13;report['appendices_verified']=['A','B','C']
          old=json.loads((b/'release-check.json').read_text())['deployment']['articles_preserved'];assert len(old)==3
          for n,digest in old.items():
            assert hashlib.sha256((b/n).read_bytes()).hexdigest()==digest
            assert b'SIO' in get(base+n)
          report['original_articles_preserved']=True
          for path in ['/books/','/monographs/','/sites/read/library/']:
            s=BeautifulSoup(get('https://sdeuniverses.com'+path),'html.parser');cards=s.select('article[data-id="m-2"]');assert len(cards)==1,path
            card=cards[0];hrefs=[a.get('href','') for a in card.find_all('a')]
            assert base+'read.html' in hrefs and base+'text/' in hrefs,path
            assert '全文可读' in card.get_text(),path
            report['bookshelves'][path]={'unique_book':True,'full_text_label':True,'flip_and_text_links':True}
          for n in ['sio-ontology-reader-v1.pdf','sio-ontology-print-v1.pdf']:
            d=fitz.open(b/n);assert len(d)==430 and len(d.get_toc())==491
          report['pdf_bookmarks']=491;report['verified_live']=True;report['verified_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          (out/'online-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Test live desktop and mobile page-turning and search
        run: |
          python - <<'PY'
          import os,pathlib,json,shutil,subprocess,sys
          from playwright.sync_api import sync_playwright
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sio-final-qa';results={};chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome:subprocess.run([sys.executable,'-m','playwright','install','--with-deps','chromium'],check=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
            for label,w,h in [('desktop',1440,1050),('mobile',390,844)]:
              ctx=browser.new_context(viewport={'width':w,'height':h});page=ctx.new_page();base='https://sdeuniverses.com/books/m/2/'
              page.goto(base,wait_until='domcontentloaded');page.wait_for_selector('h1');assert 'SIO' in page.locator('h1').inner_text();page.screenshot(path=str(out/f'{label}-detail.png'))
              page.goto(base+'text/',wait_until='domcontentloaded');assert page.locator('section.chapter').count()==13;assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
              page.goto(base+'read.html#page=1',wait_until='domcontentloaded');page.wait_for_function('document.getElementById("left").complete && document.getElementById("left").naturalWidth>0')
              page.locator('#next').click();assert int(page.locator('#page').input_value())>1
              page.locator('#page').fill('430');page.locator('#page').dispatch_event('change');page.wait_for_function('document.getElementById("left").src.includes("0430.webp") && document.getElementById("left").complete && document.getElementById("left").naturalWidth>0')
              page.screenshot(path=str(out/f'{label}-lastpage.png'));page.locator('#theme').click();page.locator('#tocBtn').click();page.locator('#q').fill('三律');page.locator('#find').click();assert page.locator('#toc button').count()>0
              results[label]={'detail':True,'full_chapters':13,'text_no_overflow':True,'next_and_last_page':True,'theme':True,'search':True};ctx.close()
            browser.close()
          report=json.loads((out/'online-verification.json').read_text());report['browser_checks']=results;(out/'online-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(results,ensure_ascii=False))
          PY
      - name: Record verified publication status and remove temporary checks
        run: |
          cat > "$RUNNER_TEMP/record-sio.py" <<'PY'
          import pathlib,json,os,hashlib
          b=pathlib.Path('public/books/m/2');out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sio-final-qa';report=json.loads((out/'online-verification.json').read_text())
          assert report['verified_live'] and report['all_page_images_verified']==430 and len(report['browser_checks'])==2
          for n,v in report['binary_checks'].items():assert hashlib.sha256((b/n).read_bytes()).hexdigest()==v['sha256'],'Concurrent book content changed'
          (b/'online-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          m=json.loads((b/'publication-manifest.json').read_text());m['deployment_status']='live-verified';m['verification_record']='online-verification.json';m['verified_at_utc']=report['verified_at_utc'];m['reindex_requested']=False
          for f in m['files']:
            p=b/f['path'];f['size']=p.stat().st_size;f['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          (b/'publication-manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))
          c=json.loads((b/'release-check.json').read_text());c['deployment'].update(status='live-verified',verification_record='online-verification.json',verified_at_utc=report['verified_at_utc']);c['live_browser_checks']=report['browser_checks'];c['live_page_images_verified']=430;c['reindex']=False
          (b/'release-check.json').write_text(json.dumps(c,ensure_ascii=False,indent=2))
          for n in ['sio-m2-live-diagnostic.yml','sio-m2-final-acceptance.yml']:(pathlib.Path('.github/workflows')/n).unlink(missing_ok=True)
          PY
          git config user.name 'SDE Publication Build'
          git config user.email 'publication-build@users.noreply.github.com'
          for attempt in 1 2 3; do
            python "$RUNNER_TEMP/record-sio.py"
            git add --sparse public/books/m/2/online-verification.json public/books/m/2/publication-manifest.json public/books/m/2/release-check.json .github/workflows/sio-m2-live-diagnostic.yml .github/workflows/sio-m2-final-acceptance.yml
            git commit -m 'Record SIO book 2 live acceptance: 430 images, exact PDFs and Word, desktop and mobile passed; no reindex'
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3 || exit 1
            git fetch origin main
            git reset --hard origin/main
          done
      - name: Preserve actual live screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sio-m2-live-acceptance-final
          retention-days: 7
          path: ${{ runner.temp }}/sio-final-qa/
