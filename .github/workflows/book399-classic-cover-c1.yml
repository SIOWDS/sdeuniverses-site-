name: Volume399 classical education cover update c1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/book399-classic-cover-c1.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: book399-publication
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare bounded document and browser verification
        run: |
          python -m pip install --quiet beautifulsoup4 lxml pymupdf playwright
          python -m playwright install --with-deps chromium
      - name: Receive exact authorized cover update
        run: |
          python - <<'PY'
          import pathlib,hashlib,zipfile,io,os
          from playwright.sync_api import sync_playwright,Error
          url='https://sdmntprseasia.oaiusercontent.com/files/00000000-7a5c-8207-8f0a-51c429ae3d73/raw?se=2026-10-07T23%3A35%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=a6714096-9739-54ed-a0db-8602b1b14ef1&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T21%3A57%3A13Z&ske=2026-10-08T21%3A57%3A13Z&sks=b&skv=2026-02-06&sig=om%2Bj%2BMGU5i1/VKZbZu1r15S3CJIzFwlQBMs5Q6ZYeDs%3D'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'book399-cover-c1';p.mkdir()
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True);page=browser.new_page(accept_downloads=True)
            with page.expect_download(timeout=90000) as d:
              try:page.goto(url,wait_until='domcontentloaded',timeout=60000)
              except Error as e:
                if 'Download is starting' not in str(e) and 'ERR_ABORTED' not in str(e):raise
            download=d.value;assert download.failure() is None;download.save_as(str(p/'received.zip'));browser.close()
          raw=(p/'received.zip').read_bytes()
          assert len(raw)==6340412 and hashlib.sha256(raw).hexdigest()=='b4b4f51f4208bd443f7a62e072136917643502743c7e81261705a76abb4ff304'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            for n in z.namelist():
              assert not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts
              assert not n.endswith(('.ttf','.ttc','.otf','.woff','.woff2','.env'))
            z.extractall(p)
          (p/'received.zip').unlink()
          print('Exact cover update authenticated; 6340412 bytes.')
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/399/
            /public/books/catalog.json
            /public/books/agents.json
            /public/books/agent/
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /public/students/putao/index.html
            /public/students/putao/works/index.html
      - name: Apply cover without replacing manuscript or other books
        run: python "$RUNNER_TEMP/book399-cover-c1/apply.py" "$RUNNER_TEMP/book399-cover-c1" "$GITHUB_WORKSPACE"
      - name: Candidate desktop mobile and PDF reader verification
        run: python "$RUNNER_TEMP/book399-cover-c1/browser_qa.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/book399-cover-c1/qa/candidate-browser"
      - name: Reconcile latest main and commit only authorized changes
        run: python "$RUNNER_TEMP/book399-cover-c1/publish.py" "$RUNNER_TEMP/book399-cover-c1" "$GITHUB_WORKSPACE"
      - name: Verify live cover PDF Word and all fifty content units
        run: python "$RUNNER_TEMP/book399-cover-c1/live.py" "$RUNNER_TEMP/book399-cover-c1"
      - name: Verify production browser views
        run: python "$RUNNER_TEMP/book399-cover-c1/browser_qa.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/book399-cover-c1/qa/live-browser" https://sdeuniverses.com
      - name: Preserve publication and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book399-classic-cover-c1-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/book399-cover-c1/qa/
            ${{ runner.temp }}/book399-cover-c1/local-qa.json
