name: M393 live asset diagnostics and reader checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m393-live-diagnostics-20261008.yml']
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m393-published-v12-exact-package
          run-id: 37740785395
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/m393-final
      - name: Compare every deployed asset and preserve mismatches
        run: |
          python3 - <<'PY'
          import pathlib,os,json,hashlib,urllib.request,concurrent.futures,difflib,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m393-final';book=root/'site/public/books/m/393';out=root/'qa/live-diagnostics';out.mkdir(parents=True,exist_ok=True)
          m=json.loads((book/'publication-manifest.json').read_text());base='https://sdeuniverses.com/books/m/393/'
          def fetch(url):
              for n in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'m393-publication-diagnostics','Cache-Control':'no-cache'}),timeout=60) as r:return r.read(),r.status,dict(r.headers),r.url
                  except Exception:
                      if n==2:raise
                      time.sleep(2)
          def check(e):
              try:
                  raw,status,headers,url=fetch(base+e['path']+'?edition='+m['release_id']);same=hashlib.sha256(raw).hexdigest()==e['sha256']
                  result={'path':e['path'],'status':status,'bytes':len(raw),'expected_bytes':e['bytes'],'actual_sha256':hashlib.sha256(raw).hexdigest(),'expected_sha256':e['sha256'],'exact':same,'content_type':headers.get('Content-Type'),'url':url}
                  if not same:
                      p=out/'mismatches'/e['path'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw)
                      if e['path'].endswith(('.html','.js','.css','.json','.txt','.svg')):
                          delta='\n'.join(difflib.unified_diff((book/e['path']).read_text().splitlines(),raw.decode('utf-8',errors='replace').splitlines(),fromfile='expected',tofile='served'))
                          p.with_name(p.name+'.diff.txt').write_text(delta);result['diff_excerpt']=delta[:4000]
                      result['headers']=headers
                  return result
              except Exception as e2:return {'path':e['path'],'error':str(e2),'exact':False}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex: results=list(ex.map(check,m['files']))
          shelves=[]
          for url in ['https://sdeuniverses.com/books/','https://sdeuniverses.com/monographs/','https://read.sdeuniverses.com/library/']:
              raw,status,headers,final=fetch(url+'?m393='+m['release_id']);s=raw.decode();shelves.append({'url':url,'status':status,'m393_cards':s.count('data-id="m-393"'),'title_found':m['title'] in s})
          result={'release_id':m['release_id'],'exact':sum(r['exact'] for r in results),'total':len(results),'mismatches':[r for r in results if not r['exact']],'shelves':shelves,'all_results':results}
          (out/'report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print(json.dumps({k:v for k,v in result.items() if k!='all_results'},ensure_ascii=False,indent=2))
          PY
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Public desktop and mobile interaction checks
        run: python3 "$RUNNER_TEMP/m393-final/build-tools/browser_qa.py" "$RUNNER_TEMP/m393-final" --live
      - name: Preserve content and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m393-live-diagnostics-20261008
          path: ${{ runner.temp }}/m393-final/qa
          retention-days: 30
