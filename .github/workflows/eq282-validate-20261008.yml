name: Volume282 retained edition validation
on:
  push:
    branches: [codex/eq-ontology-20261008]
    paths: [.github/workflows/eq282-validate-20261008.yml]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eq282-exact-candidate-v1
          run-id: 37779304362
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eq282
      - name: Prepare browser and PDF tools
        run: |
          python3 -m pip install --quiet playwright beautifulsoup4 pymupdf
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Validate exact assets and complete sixty-chapter text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,re,hashlib,pymupdf
          from bs4 import BeautifulSoup
          r=Path(os.environ['RUNNER_TEMP'])/'eq282';b=r/'book';(r/'qa').mkdir(exist_ok=True)
          m=json.loads((b/'publication-manifest.json').read_text());assert m['release_sha256']=='e7ec595280bf60907a7e19cc58d68041d13c2ecc7d210a8f3275985156b0e945'
          for f in m['files']:
            p=b/f['path'];assert p.stat().st_size==f['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==f['sha256'],f['path']
          d=pymupdf.open(b/'downloads/eq-ontology-reader-v1.pdf');assert len(d)==463 and len(d.get_toc())==683
          records=json.loads((b/'audit/chapter-audit.json').read_text());assert len(records)==60 and sum(x['body_han'] for x in records)==251155
          for c in records:
            a=BeautifulSoup((b/'chapters'/('%03d.html'%c['chapter'])).read_text(),'html.parser').select_one('article.chapter');n=sum(len(re.findall(r'[\u3400-\u4dbf\u4e00-\u9fff]',p.get_text())) for p in a.select('p'));assert n==c['body_han'],c['chapter']
          (r/'qa/text-pdf-validation.json').write_text(json.dumps({'pass':True,'chapters':60,'body_han':251155,'pages':463,'bookmarks':683,'isbn':'979-8-90690-481-2','volume':282,'price_usd':24,'release_sha256':m['release_sha256']},ensure_ascii=False,indent=2))
          PY
      - name: Check desktop and mobile full text and actual flip-reader
        run: python3 "$RUNNER_TEMP/eq282/build-tools/browser_qa.py" "$RUNNER_TEMP/eq282"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eq282-validated-evidence-v1
          path: ${{ runner.temp }}/eq282/qa/
          retention-days: 14
