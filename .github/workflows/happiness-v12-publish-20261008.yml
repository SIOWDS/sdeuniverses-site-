name: Update Happiness Secret v1.2 and verify public readers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/happiness-v12-publish-20261008.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: happiness-secret-publication
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Resume previously verified exact v1.2 package
        uses: actions/download-artifact@v4
        with:
          name: happiness-v12-received-candidate
          run-id: 37662393142
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/happiness-v12
      - name: Recheck immutable inventory
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'happiness-v12'
          for e in json.loads((root/'input-inventory.json').read_text()):
              p=root/e['path'];assert p.stat().st_size==e['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256'],e['path']
          print('EXACT_V12_INVENTORY_VERIFIED')
          PY
      - name: Prepare browser with bounded dependency installation
        timeout-minutes: 4
        run: |
          python3 -m pip install --quiet --timeout 25 --retries 1 playwright beautifulsoup4
          timeout 150s python3 -m playwright install chromium
          timeout 45s sudo apt-get -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 -o Acquire::Retries=1 install -y -qq fonts-noto-cjk || echo 'Use existing system fonts; the PDF includes its own fonts'
      - name: Accept v1.2 desktop and mobile readers before publication
        timeout-minutes: 5
        run: python3 "${RUNNER_TEMP}/happiness-v12/build-tools/browser_qa.py" "${RUNNER_TEMP}/happiness-v12"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/happiness-secret/
            /public/books/catalog.json
            /public/books/agents.json
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /tools/build_bookshelf.py
            /.github/workflows/search-index.yml
      - name: Update exact book and shelf metadata, retain other books and old PDF bytes
        run: python3 "${RUNNER_TEMP}/happiness-v12/build-tools/publish.py" "${RUNNER_TEMP}/happiness-v12" "${GITHUB_WORKSPACE}"
      - name: Verify exact live edition, all assets and three bookshelves
        run: python3 "${RUNNER_TEMP}/happiness-v12/build-tools/live_http_qa.py" "${RUNNER_TEMP}/happiness-v12"
      - name: Exercise public desktop and mobile PDF readers
        run: python3 "${RUNNER_TEMP}/happiness-v12/build-tools/browser_qa.py" "${RUNNER_TEMP}/happiness-v12" "https://sdeuniverses.com/books/happiness-secret/"
      - name: Preserve publication and live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happiness-v12-live-evidence
          path: ${{ runner.temp }}/happiness-v12/qa
          retention-days: 30
