name: reindex-563-572-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reindex-563-572-once.yml

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the existing R2 search-index workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/dispatches" -f event_type=reindex
