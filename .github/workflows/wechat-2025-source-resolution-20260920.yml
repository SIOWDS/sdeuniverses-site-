name: wechat-2025-source-resolution-20260920
on:
  push:
    branches: [main]
    paths: [.github/workflows/wechat-2025-source-resolution-20260920.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.3 beautifulsoup4==4.13.4
      - run: python tools/wechat_2025_source_resolution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-2025-source-resolution
          path: artifacts/wechat-2025-resolution
          retention-days: 7
