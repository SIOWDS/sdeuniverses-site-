name: Book294 final visual acceptance 20261005
on:
  push:
    branches: [main]
    paths: ['.github/workflows/book294-visual-acceptance-20261005.yml']
permissions:
  contents: read
  actions: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book294-verified-candidate-20261005
          run-id: 37253941490
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/book294-final
      - name: Preserve source and fix only the observed image aspect ratio
        run: |
          python3 - <<'PY'
          import pathlib,os,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'book294-final'
          m=json.loads((root/'book/publication-manifest.json').read_text());assert m['release_sha256']=='aeeb402df77d0be7f38ab5323d1aec0d10501a4d48292acf8423c979cefd927d'
          for item in m['files']:
              p=root/'book'/item['path'];assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
          for relative in ['book/assets/site.css','build-tools/build_site.py']:
              p=root/relative;s=p.read_text();assert '.hero img{width:220px;max-width:65vw;' in s;s=s.replace('.hero img{width:220px;max-width:65vw;','.hero img{width:220px;max-width:65vw;height:auto;');p.write_text(s)
          p=root/'build-tools/browser_qa.py';s=p.read_text();needle="done('homepage_metadata_and_layout')";assert needle in s;s=s.replace(needle,"assert page.locator('.hero img').evaluate('e=>Math.abs(e.getBoundingClientRect().width/e.getBoundingClientRect().height-e.naturalWidth/e.naturalHeight)<0.005');done('homepage_metadata_and_layout')");p.write_text(s)
          (root/'qa/visual-corrections.json').write_text(json.dumps({'correction':'Set responsive cover height:auto to preserve its intrinsic aspect ratio.','pdf_changed':False,'docx_changed':False,'source_text_changed':False,'no_reindex':True},indent=2))
          PY
      - name: Prepare browser with Chinese system fonts
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Recheck full interaction and generate final screenshots
        run: |
          python3 "${RUNNER_TEMP}/book294-final/build-tools/browser_qa.py" "${RUNNER_TEMP}/book294-final"
          python3 "${RUNNER_TEMP}/book294-final/build-tools/stamp_candidate.py" "${RUNNER_TEMP}/book294-final"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book294-final-visual-evidence
          path: ${{ runner.temp }}/book294-final/qa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: book294-final-accepted
          path: ${{ runner.temp }}/book294-final
          retention-days: 14
