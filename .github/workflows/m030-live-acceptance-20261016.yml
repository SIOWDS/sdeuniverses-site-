name: Monograph 030 production acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m030-live-acceptance-20261016.yml'
      - 'public/books/m/30/**'
      - 'public/books/catalog.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Verify GitHub sources and final page routes
        run: |
          python3 - <<'PY'
          import urllib.request, time, json, pathlib, hashlib, os
          base='https://sdeuniverses.com'
          endpoints={
            '/books/m/30/':('三位一体出版','归跑','978-1-970820-47-8'),
            '/books/m/30/read.html':('八十四','read.html'),
            '/books/m/30/text/':('第一章','第八十四章','方法论补充校核来源'),
            '/books/m/30/agent/learning.html':('八十四章','unit/learning.json'),
            '/books/m/30/unit/learning.json':('"taskCount": 84','"agentName": "归跑"'),
            '/books/m/30/agent/':('归跑','BOOK_AGENT'),
            '/books/m/30/publication-unit.json':('"unitId": "m-30"','"learningTasks": 84')
          }
          out=[]
          success=False
          for attempt in range(42):
              row={"attempt":attempt+1,"result":{}}
              for path, markers in endpoints.items():
                  url=base+path+'?m030v='+str(int(time.time()))+str(attempt)
                  req=urllib.request.Request(url,headers={'User-Agent':'SDE-M030-Publication-Acceptance/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
                  try:
                      with urllib.request.urlopen(req,timeout=17) as response:
                          body=response.read().decode('utf-8','replace')
                          missing=[m for m in markers if m not in body]
                          row['result'][path]={'status':response.status,'bytes':len(body.encode()),'ok':not missing,'missing':missing,'sha256':hashlib.sha256(body.encode()).hexdigest()}
                  except Exception as e:
                      row['result'][path]={'ok':False,'error':str(e)[:200]}
              out.append(row)
              score=sum(v.get('ok',False) for v in row['result'].values())
              print('attempt',attempt+1,'endpoints_passed',score,'of',len(endpoints),json.dumps(row['result'],ensure_ascii=False)[:2000],flush=True)
              if score==len(endpoints):
                  success=True
                  break
              time.sleep(11)
          result={'productionAccepted':success,'checks':len(endpoints),'attempts':out}
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'m030-live-acceptance.json'
          p.write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print('ACCEPTANCE_RESULT',success,'RESULT_FILE',p,flush=True)
          if not success:raise SystemExit('Production site still does not match monograph 030 version')
          PY
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m030-live-acceptance-20261016
          path: ${{ runner.temp }}/m030-live-acceptance.json
          retention-days: 14
