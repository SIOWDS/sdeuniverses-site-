name: Volume 288 v1.1 production reader and author-page acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m288-v11-live-reader-check-20261002.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare bounded browser verification
        timeout-minutes: 4
        run: |
          timeout 90s python -m pip install --quiet playwright==1.55.0 Pillow
          timeout 60s sudo apt-get update -qq
          timeout 90s sudo apt-get install -y -qq fonts-noto-cjk
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then timeout 120s python -m playwright install --with-deps chromium; fi
      - name: Test actual production pages and the complete refined PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,os,shutil,time,urllib.request
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageStat
          base='https://sdeuniverses.com/books/m/288/';out=Path(os.environ['RUNNER_TEMP'])/'m288-v11-browser';out.mkdir()
          for i in range(30):
              try:
                  req=urllib.request.Request(base+'edition.json?check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  e=json.load(urllib.request.urlopen(req,timeout=20))
                  if e.get('pdfPages')==353 and '1.1' in e.get('digitalEdition',''):break
              except Exception as err:print('Waiting for updated edition',str(err),flush=True)
              time.sleep(12)
          else:raise RuntimeError('v1.1 is not yet deployed')
          reports=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('chromium') or shutil.which('google-chrome'),headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              for name,w,h in [('desktop',1365,950),('mobile',390,844),('narrow',320,740)]:
                  page=browser.new_page(viewport={'width':w,'height':h});errors=[];page.on('pageerror',lambda err:errors.append(str(err)))
                  r=page.goto(base,wait_until='networkidle',timeout=60000);assert r.status==200
                  assert page.locator('h1').inner_text().replace('\n','')=='陈凤讲波伏娃普通人都能懂'
                  assert '979-8-90690-433-1' in page.locator('main').inner_text() and 'US$20.00' in page.locator('main').inner_text()
                  assert all(t in page.locator('#author').inner_text() for t in e['authorBiography'])
                  assert page.locator('.cover').evaluate('(e)=>e.complete&&e.naturalWidth>0')
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  page.screenshot(path=str(out/f'{name}-detail.png'),full_page=True)
                  page.goto(base+'chapters.html',wait_until='networkidle');assert page.locator('.toc li').count()==103
                  page.locator('#tocSearch').fill('第四十五章');assert page.locator('.toc li:visible').count()==1
                  page.locator('.toc li:visible a').click();page.wait_for_url('**/text/#ch45');page.wait_for_load_state('networkidle');page.evaluate('document.fonts.ready');page.wait_for_timeout(1500)
                  assert page.locator('section.chapter').count()==68 and page.locator('section.appendix').count()==13
                  assert page.locator('[data-source-paragraph]').count()==3190
                  assert 0<=page.locator('#ch45 h3').bounding_box()['y']<h
                  shot=out/f'{name}-chapter45.png';page.screenshot(path=str(shot));assert sum(ImageStat.Stat(Image.open(shot).convert('RGB')).stddev)>20
                  old=page.locator('body').evaluate('(e)=>getComputedStyle(e).fontSize');page.locator('#fontPlus').click();assert old!=page.locator('body').evaluate('(e)=>getComputedStyle(e).fontSize')
                  page.locator('#theme').click();assert page.locator('html').get_attribute('class')=='dark';page.screenshot(path=str(out/f'{name}-dark.png'))
                  page.locator('#theme').click();page.locator('#fontMinus').click()
                  page.goto(base+'text/#appendix09',wait_until='networkidle');page.evaluate('document.fonts.ready');page.locator('table').nth(2).scroll_into_view_if_needed();page.wait_for_timeout(500)
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1');page.screenshot(path=str(out/f'{name}-table.png'))
                  page.goto(base+'text/#ch68',wait_until='networkidle');page.evaluate('document.fonts.ready');page.wait_for_timeout(1000)
                  assert 0<=page.locator('#ch68 h3').bounding_box()['y']<h
                  page.screenshot(path=str(out/f'{name}-deep-anchor.png'))
                  page.goto(base+'read.html',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("document.querySelector('#pt')?.textContent.trim()==='353'",timeout=90000)
                  page.wait_for_function("document.querySelector('#msg')?.classList.contains('hide')",timeout=90000)
                  page.wait_for_timeout(1000);page.screenshot(path=str(out/f'{name}-pdf-cover.png'))
                  assert page.locator('canvas').first.evaluate('(c)=>c.width>0&&c.height>0')
                  page.locator('#btnNext').click();page.wait_for_timeout(800);assert int(page.locator('#pi').input_value())>1
                  page.locator('#pi').fill('4');page.locator('#pi').press('Enter');page.wait_for_timeout(1000);page.screenshot(path=str(out/f'{name}-pdf-author.png'))
                  page.locator('#pi').fill('282');page.locator('#pi').press('Enter');page.wait_for_timeout(1000);page.screenshot(path=str(out/f'{name}-pdf-table.png'))
                  reports.append({'viewport':name,'width':w,'new_biography':True,'chapters':68,'appendices':13,'source_blocks':3190,'font_and_theme':True,'chapter_and_deep_anchor_visible':True,'horizontal_overflow':False,'pdf_pages':353,'pdf_render_and_page_change':True,'runtime_errors':errors,'pass':not errors})
                  page.close()
              browser.close()
          result={'volume':288,'edition':'1.1','checked_at':datetime.now(timezone.utc).isoformat(),'reports':reports,'read_only':True,'reindex_requested':False}
          (out/'browser-report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print(json.dumps(result,ensure_ascii=False,indent=2));assert all(x['pass'] for x in reports)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m288-v11-live-reader-acceptance
          retention-days: 14
          path: ${{ runner.temp }}/m288-v11-browser/
