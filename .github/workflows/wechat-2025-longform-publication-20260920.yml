name: wechat-2025-longform-publication-20260920
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wechat-2025-longform-publication-20260920.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: wechat-2025-longform-publication-20260920
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read already-verified public source editions
        uses: actions/download-artifact@v4
        with:
          name: wechat-2025-source-resolution
          run-id: 35518083196
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/source-resolution
      - name: Install native text, table and browser tools
        run: |
          python -m pip install beautifulsoup4==4.13.4 pymupdf==1.26.3 Pillow==11.3.0 playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Apply source-preserving quality fixes and enforce source hashes
        run: |
          python -m py_compile tools/wechat_2025_longform.py tools/wechat_2025_publish_20260920.py tools/wechat_2025_final_quality.py
          python tools/wechat_2025_final_quality.py prepare
          python tools/wechat_2025_publish_20260920.py build
          python tools/wechat_2025_final_quality.py finish
      - name: Test desktop and mobile reading and filters
        run: python tools/wechat_2025_publish_20260920.py browser
      - name: Publish only this column and preserve concurrent changes
        run: |
          git config user.name 'SDE WeChat Publisher'
          git config user.email 'wechat-publisher@users.noreply.github.com'
          git add public/wechat-picks tools/wechat_2025_longform.py tools/wechat_2025_publish_20260920.py
          git rm -f --ignore-unmatch tools/wechat-2025-book-bridge-compact.b64
          if git diff --cached --quiet; then echo 'No publication changes'; exit 0; fi
          git commit -m 'Publish 56 verified WeChat full texts, 11 new annual entries, original source access and tested reading UI'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify all deployed article bodies and annual entry points
        run: python tools/wechat_2025_publish_20260920.py live
      - name: Preserve exact publication and QA evidence
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,zipfile
          out=pathlib.Path('artifacts/wechat-2025-publication');out.mkdir(parents=True,exist_ok=True)
          pieces=sorted(pathlib.Path('tools/wechat-2025-payload').glob('bridge-*.b64'))
          import hashlib
          (out/'transport-hashes.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_text().strip().encode()).hexdigest() for p in pieces},indent=2))
          with zipfile.ZipFile(out/'publication.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in pathlib.Path('public/wechat-picks').rglob('*'):
                  if p.is_file():z.write(p,p.as_posix())
              for p in pathlib.Path('tools').glob('wechat_2025_*.py'):z.write(p,p.as_posix())
              for p in pathlib.Path('tools/wechat-2025-payload').glob('*'):
                  if p.is_file():z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-2025-longform-publication
          path: artifacts/wechat-2025-publication
          retention-days: 30
          if-no-files-found: ignore
