name: SIO publication live URL diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sio-m2-live-diagnostic.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check current public responses
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,hashlib,json,concurrent.futures,pathlib,time
          base='https://sdeuniverses.com';paths=['/books/m/2/','/books/m/2/index.html','/books/m/2/text/','/books/m/2/read.html','/books/m/2/sio-ontology-reader-v1.pdf','/books/m/2/pages/0001.webp','/books/m/2/pages/0430.webp','/books/']
          def check(p):
            out={'path':p}
            try:
              req=urllib.request.Request(base+p+'?sio_probe=430',headers={'User-Agent':'Mozilla/5.0 SDE-Publication-Verification','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=r.read();out.update(status=r.status,url=r.url,headers=dict(r.headers),bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),first_bytes=data[:300].decode('utf-8','replace'))
              rp='public'+p+('index.html' if p.endswith('/') else '')
              with urllib.request.urlopen('https://raw.githubusercontent.com/SIOWDS/sdeuniverses-site-/e8409afe8e1a2ea6d9fbfd51c23a3e47e9594cf9/'+rp,timeout=20) as r:raw=r.read()
              out['repository_sha256']=hashlib.sha256(raw).hexdigest();out['same_as_repository']=raw==data
            except Exception as e:
              out['error']=repr(e)
              if isinstance(e,urllib.error.HTTPError):out['response_body']=e.read(2000).decode('utf-8','replace')
            return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:results=list(ex.map(check,paths))
          pathlib.Path('sio-live-diagnostic.json').write_text(json.dumps(results,ensure_ascii=False,indent=2));print(json.dumps(results,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sio-live-url-diagnostic
          path: sio-live-diagnostic.json
          retention-days: 3
