name: M373 biology publication acceptance
on:
  push:
    branches: [main]
    paths:
      - 'public/books/m/373/**'
      - '.publish/m373/**'
      - '.github/workflows/m373-publication-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m373-publication-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/373/
            /public/books/index.html
            /public/books/catalog.json
            /public/monographs/index.html
            /public/assets/lib/
            /public/taste/wds-companion/wds-read.js
            /public/wds-mode.js
            /public/books/m/400/text/appendix-3/
            /public/books/m/395/chapters/ch10.html
            /.publish/m373/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tasks, source fingerprints, links and JavaScript
        run: python3 .publish/m373/check_static.py
      - name: Check stream status handling without provider calls
        run: node .publish/m373/check_core.cjs
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/m373-tools --no-save playwright@1.56.1
          /tmp/m373-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify local publication and learning workflow with mocked model transport
        env:
          NODE_PATH: /tmp/m373-tools/node_modules
          QA_OUT: m373-qa-results
          TEST_ORIGIN: http://127.0.0.1:8733
          QA_READING: '1'
        run: |
          python3 -m http.server 8733 --bind 127.0.0.1 --directory public > /tmp/m373-server.log 2>&1 &
          node .publish/m373/qa.cjs
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m373-publication-acceptance-${{ github.run_id }}
          path: |
            m373-qa-results/
            .publish/m373/static-report.json
            .publish/m373/core-report.json
          if-no-files-found: warn
          retention-days: 14
