name: Happiness book publication preflight 20261007
on:
  push:
    branches: [main]
    paths: ['.github/workflows/happiness-preflight-20261007.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect publication templates and current catalogue without changing site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request, pathlib, json, os, base64
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'happiness-preflight';root.mkdir()
          api='https://api.github.com/repos/SIOWDS/sdeuniverses-site-/'
          def get(path):
            req=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            return json.load(urllib.request.urlopen(req,timeout=40))
          def save(path):
            try:
              obj=get('contents/'+path+'?ref=main'); data=base64.b64decode(obj['content'])
              p=root/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
            except Exception as e: print('OPTIONAL_FILE_UNAVAILABLE',path,type(e).__name__)
          for path in ['public/books/catalog.json','public/books/index.html','public/monographs/index.html','tools/build_bookshelf.py','package.json','wrangler.toml','wrangler.jsonc','public/books/m/220/index.html','public/books/m/220/read.html','public/books/m/220/text/index.html','public/books/m/302/index.html','public/books/m/302/read.html','public/books/m/302/text/index.html']:
            save(path)
          for directory in ['.github/workflows','tools','public/books/m/220','public/books/m/302']:
            entries=get('contents/'+directory+'?ref=main')
            out=root/(directory.replace('/','_')+'_listing.json');out.write_text(json.dumps(entries,ensure_ascii=False,indent=2))
            if directory=='.github/workflows':
              for entry in entries:
                if entry['type']=='file':save(entry['path'])
          catalog=json.loads((root/'public/books/catalog.json').read_text())
          matches=[b for b in catalog['books'] if '幸福的奥秘' in b.get('title','') or b.get('isbn','').replace('-','')=='9781970820140']
          print('HAPPINESS_CATALOG_MATCHES',json.dumps(matches,ensure_ascii=False))
          print('READ_ONLY_PREFLIGHT_COMPLETE_NO_REINDEX')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: happiness-publication-preflight
          path: ${{ runner.temp }}/happiness-preflight/
          retention-days: 3
