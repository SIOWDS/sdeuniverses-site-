name: Book294 ten images live verification
on:
  push:
    branches: ['qa/book294-ten-images-20261005']
    paths: ['.github/workflows/book294-ten-image-live-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install inspection tools
        run: |
          python3 -m pip install --quiet pillow pymupdf beautifulsoup4 playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Fetch and inspect actual public pages, images and PDF
        run: |
          python3 -u - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          from PIL import Image,ImageChops,ImageStat
          from bs4 import BeautifulSoup
          import json,os,hashlib,io,fitz
          root=Path(os.environ['RUNNER_TEMP'])/'book294-image-check';root.mkdir();base='https://sdeuniverses.com/books/m/294/'
          def get(url):
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}),timeout=90) as r:return r.status,r.read(),r.headers.get('Content-Type','')
          report={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'base_url':base,'production_changes':False,'reindex_triggered':False,'pages':{},'images':[]}
          soups={}
          for key,suffix in [('home',''),('gallery','figures.html'),('tree','tree.html'),('text','text/'),('reader','read.html')]:
              status,raw,ct=get(base+suffix);(root/(key+'.html')).write_bytes(raw);soup=BeautifulSoup(raw,'html.parser');soups[key]=soup
              report['pages'][key]={'url':base+suffix,'http_status':status,'title':soup.title.get_text() if soup.title else None,'figure_count':len(soup.select('figure[id^="fig"]')),'image_count':len(soup.select('img')),'svg_count':len(soup.select('svg')),'gallery_links':[{'label':a.get_text(' ',strip=True),'href':urljoin(base+suffix,a['href'])} for a in soup.select('a[href]') if 'figures' in a['href']]}
          _,raw,_=get(base+'publication-manifest.json');manifest=json.loads(raw);(root/'live-manifest.json').write_bytes(raw);report['revision']=manifest.get('revision');report['release_sha256']=manifest.get('release_sha256')
          figures=soups['gallery'].select('figure[id^="fig"]');assert len(figures)==10, len(figures)
          def inspect(f):
              img=f.select_one('img');url=urljoin(base+'figures.html',img['src']);status,raw,ct=get(url);im=Image.open(io.BytesIO(raw));im.load();out=root/'images'/Path(url).name;out.parent.mkdir(exist_ok=True);out.write_bytes(raw)
              return {'id':f['id'],'title':f.select_one('figcaption b').get_text(strip=True),'url':url,'http_status':status,'content_type':ct,'width':im.width,'height':im.height,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'decoded':True,'in_full_text':soups['text'].select_one('#'+f['id']) is not None,'local_image':str(out.relative_to(root))}
          with ThreadPoolExecutor(max_workers=4) as pool:report['images']=list(pool.map(inspect,figures))
          assert len({x['sha256'] for x in report['images']})==10,'Duplicate images'
          pdf_name=manifest['pdf_filename'];pdf_url=urljoin(base,'downloads/'+pdf_name);status,raw,ct=get(pdf_url);(root/'live-book.pdf').write_bytes(raw);doc=fitz.open(stream=raw,filetype='pdf')
          report['pdf']={'url':pdf_url,'http_status':status,'pages':len(doc),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          candidates={}
          for page in doc:
              for img in page.get_images(full=True):
                  xref=img[0]
                  if img[2]<500 or img[3]<700:continue
                  if xref not in candidates:
                      im=Image.open(io.BytesIO(doc.extract_image(xref)['image'])).convert('RGB');candidates[xref]={'pages':[],'small':im.resize((64,90))}
                  candidates[xref]['pages'].append(page.number+1)
          for item in report['images']:
              target=Image.open(root/item['local_image']).convert('RGB').resize((64,90));scores=[]
              for xref,c in candidates.items():
                  score=sum(ImageStat.Stat(ImageChops.difference(target,c['small'])).mean)/(3*255);scores.append((score,xref))
              score,xref=min(scores);item['pdf_visual_match_error']=round(score,6);item['pdf_physical_pages']=candidates[xref]['pages'];item['pdf_image_match']=score<0.015
              for pn in item['pdf_physical_pages']:
                  dest=root/'pdf-pages'/f'{item["id"]}-page-{pn:03d}.png';dest.parent.mkdir(exist_ok=True);doc[pn-1].get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(dest)
          report['all_ten_in_pdf']=all(i['pdf_image_match'] for i in report['images']);report['all_ten_in_full_text']=all(i['in_full_text'] for i in report['images']);report['tree_nodes']=len(soups['tree'].select('svg a[data-node]'))
          (root/'http-pdf-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False,indent=2));assert report['all_ten_in_pdf'] and report['all_ten_in_full_text']
          PY
      - name: Scroll every live image on desktop and mobile and verify reader
        run: |
          python3 -u - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import os,json
          root=Path(os.environ['RUNNER_TEMP'])/'book294-image-check';report=json.loads((root/'http-pdf-report.json').read_text());base=report['base_url'];checks=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for name,size in [('desktop',{'width':1365,'height':960}),('mobile',{'width':390,'height':844})]:
                  page=browser.new_page(viewport=size,device_scale_factor=1);errors=[];page.on('pageerror',lambda e:errors.append(str(e)));page.goto(base+'figures.html',wait_until='networkidle',timeout=90000)
                  items=[]
                  for item in report['images']:
                      image=page.locator('#'+item['id']+' img');image.scroll_into_view_if_needed();image.evaluate('e=>e.decode()');state=image.evaluate('e=>({loaded:e.complete&&e.naturalWidth>0,naturalWidth:e.naturalWidth,naturalHeight:e.naturalHeight,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height})');assert state['loaded'];assert abs(state['width']/state['height']-state['naturalWidth']/state['naturalHeight'])<0.005;items.append({'id':item['id'],**state})
                      if name=='desktop':page.locator('#'+item['id']).screenshot(path=str(root/(item['id']+'-online.png')))
                  overflow=page.evaluate('document.documentElement.scrollWidth>innerWidth+2');assert not overflow
                  page.locator('#fig01').scroll_into_view_if_needed();page.screenshot(path=str(root/(name+'-gallery.png')));page.goto(base+'tree.html',wait_until='networkidle',timeout=90000);page.screenshot(path=str(root/(name+'-tree.png')))
                  checks.append({'device':name,'all_ten_loaded':True,'no_horizontal_overflow':not overflow,'images':items,'javascript_errors':errors})
                  page.close()
              page=browser.new_page(viewport={'width':1365,'height':1050});page.goto(base+'read.html',wait_until='networkidle',timeout=90000);page.wait_for_timeout(7000);page.screenshot(path=str(root/'online-reader.png'));report['reader_browser_text']=page.locator('body').inner_text()[:2000];report['reader_canvas_count']=page.locator('canvas').count();page.close();browser.close()
          report['browser']=checks;report['success']=True;(root/'verification-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          lines=['# 第294号：线上十幅发生树图复核','', '检查时间（UTC）：'+report['checked_at_utc'],'版本：'+str(report['revision']),'', '主站图集：'+base+'figures.html', '图集与全文各含10幅图；十张图片分别下载成功并解码；十张均在桌面和手机滚动到位后正常加载；长宽比正常，没有横向溢出。','', 'PDF共'+str(report['pdf']['pages'])+'页。下表为实际PDF物理页码，不是目录推算。','', '|图号|标题|图片尺寸|PDF物理页|状态|','|---|---|---|---|---|']
          for i in report['images']:lines.append('|'+i['id']+'|'+i['title']+'|'+str(i['width'])+'×'+str(i['height'])+'|'+','.join(map(str,i['pdf_physical_pages']))+'|正常|')
          lines+=['','“发生树”页面：'+str(report['pages']['tree']['image_count'])+'个img图片，'+str(report['pages']['tree']['svg_count'])+'幅SVG，'+str(report['tree_nodes'])+'个哲学节点。它与十幅彩图图集是不同页面。','发生树页通往图集的链接：'+json.dumps(report['pages']['tree']['gallery_links'],ensure_ascii=False),'','本次仅核验，未更改线上书籍，未触发reindex。']
          (root/'线上十幅图复核报告.md').write_text('\n'.join(lines));print('\n'.join(lines))
          PY
      - name: Save live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book294-ten-images-current-live-evidence
          path: ${{ runner.temp }}/book294-image-check
          retention-days: 7
