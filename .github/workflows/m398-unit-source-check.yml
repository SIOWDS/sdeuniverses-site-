name: M398 publication unit source check
on:
  push:
    branches: [sde/m398-publication-unit-20261008]
    paths: [.github/workflows/m398-unit-source-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/worker.js
            /public/books/bookshelf.css
            /public/books/bookshelf.js
            /public/sites/read/library/index.html
            /tools/build_bookshelf.py
            /tools/happiness_publication_unit_20261008.py
            /wrangler.jsonc
      - name: Save scoped service and shelf source only
        run: |
          mkdir -p /tmp/m398-service
          cp -a src public tools /tmp/m398-service/
          cp wrangler.jsonc /tmp/m398-service/
          git rev-parse HEAD > /tmp/m398-service/base-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m398-publication-unit-service
          path: /tmp/m398-service
          retention-days: 7
