name: inspect-reindex-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reindex-once.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Record current repository workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_PATH: .reindex-inspection-20260811T1416Z.json
        run: |
          set -u
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          HTTP=$(curl -sS -L -o /tmp/runs.json -w '%{http_code}' "${AUTH[@]}" "$API/actions/runs?per_page=40")
          RESULT=$(jq -cn \
            --arg http "$HTTP" \
            --rawfile body /tmp/runs.json \
            '{http:$http, payload:(try ($body|fromjson) catch $body)}')
          CONTENT=$(printf '%s\n' "$RESULT" | base64 -w0)
          jq -n \
            --arg message "Record current GitHub Actions state" \
            --arg content "$CONTENT" \
            --arg branch "main" \
            '{message:$message, content:$content, branch:$branch}' > /tmp/inspection.json
          curl --fail-with-body -sS -L -X PUT "${AUTH[@]}" \
            "$API/contents/$RESULT_PATH" \
            -d @/tmp/inspection.json >/dev/null
