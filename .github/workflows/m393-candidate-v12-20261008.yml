name: M393 v1.2 candidate browser acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m393-candidate-v12-20261008.yml']
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Receive exact authorized publication candidate
        run: |
          python3 - <<'PY'
          import pathlib,os,urllib.request,hashlib,zipfile,io,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m393-final';root.mkdir()
          url='https://sdmntprjapaneast.oaiusercontent.com/files/00000000-c54c-8209-8239-1f79e55812e5/raw?se=2026-10-08T06%3A35%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=f6555d5e-0a51-5a9c-9f25-63df9db49e2c&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T23%3A38%3A33Z&ske=2026-10-08T23%3A38%3A33Z&sks=b&skv=2026-02-06&sig=JTBtEJ4rn6tFSEXGrGdOlmoHEJu%2Brh1hfNoZLNzKYD0%3D'
          raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=120).read()
          assert len(raw)==13021625 and hashlib.sha256(raw).hexdigest()=='168c667bc67e1e36b25dcd34039b9befb9c98e075b5e2556eeae08c387d0b123'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for n in z.namelist():assert not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts
              z.extractall(root)
          for e in json.loads((root/'input-inventory.json').read_text()):
              p=root/e['path'];assert p.stat().st_size==e['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256'],e['path']
          print('EXACT_CANDIDATE_RECEIVED',len(raw),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m393-v12-exact-candidate
          path: ${{ runner.temp }}/m393-final
          retention-days: 14
      - name: Install real browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Desktop mobile and all vector pages
        run: python3 "$RUNNER_TEMP/m393-final/build-tools/browser_qa.py" "$RUNNER_TEMP/m393-final"
      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m393-v12-candidate-browser-evidence
          path: ${{ runner.temp }}/m393-final/qa
          retention-days: 30
