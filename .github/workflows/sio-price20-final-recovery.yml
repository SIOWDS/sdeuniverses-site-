name: Final SIO USD20 back-cover acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sio-price20-final-recovery.yml']
permissions:
  contents: write
concurrency:
  group: publication-sio-m2
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/2/
            /.github/workflows/sio-word-backcover-fullbleed.yml
            /.github/workflows/sio-price20-final-recovery.yml
      - name: Prepare Chinese browser typography and precise document tools
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install -q lxml beautifulsoup4 playwright PyMuPDF
          fc-cache -f
          mkdir -p "$RUNNER_TEMP/sio-price20-final"
      - name: Prepare minimal correction with manuscript safeguards
        run: |
          cat > "$RUNNER_TEMP/final-sio-patch.py" <<'PY'
          from pathlib import Path
          import zipfile,copy,json,hashlib,os
          from lxml import etree as E
          from bs4 import BeautifulSoup
          b=Path('public/books/m/2');out=Path(os.environ['RUNNER_TEMP'])/'sio-price20-final'
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          before={str(p.relative_to(b)):h(p) for p in b.rglob('*') if p.is_file()}
          assert h(b/'sio-ontology-v1.docx')=='d23292f790775898272900b0a59e8d4ebdeacf535a08e4a0d4700825e2c22a9f','Concurrent Word change requires reconciliation'
          assert h(b/'text/index.html')=='6620c987c8a54d59ee7b016dbb00e428a57375266e45a4d948aeb417f46c65a4'
          chapters={}
          for name in ['text/index.html','sio-ontology-portable.html']:
            p=b/name;s=BeautifulSoup(p.read_text(),'html.parser');oldchapters=[str(x) for x in s.select('section.chapter')];assert len(oldchapters)==13
            covers=s.select('#back-cover');assert len(covers)==2
            old=[x for x in covers if x.name=='div' and 'backcover' in x.get('class',[])];assert len(old)==1 and len(old[0].select('img'))==1 and not old[0].get_text(strip=True)
            old[0].decompose();assert len(s.select('#back-cover'))==1 and len(s.select('#back-cover img'))==1
            assert 'USD 20.00' in s.select_one('#back-cover').get_text()
            assert oldchapters==[str(x) for x in s.select('section.chapter')]
            chapters[name]=hashlib.sha256(''.join(oldchapters).encode()).hexdigest();p.write_text(str(s),encoding='utf-8')
          p=b/'sio-ontology-v1.docx';z=zipfile.ZipFile(p);entries={i.filename:(i,z.read(i.filename)) for i in z.infolist()}
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main','wp':'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing','a':'http://schemas.openxmlformats.org/drawingml/2006/main'}
          root=E.fromstring(entries['word/document.xml'][1]);text_before=root.xpath('//w:t/text()',namespaces=ns);last=root.findall('w:body/w:p',ns)[-1];inline=last.find('.//wp:inline',ns);assert inline is not None
          q=lambda n:E.QName(ns[n.split(':')[0]],n.split(':')[1])
          a=E.Element(q('wp:anchor'),distT='0',distB='0',distL='0',distR='0',simplePos='0',relativeHeight='0',behindDoc='0',locked='0',layoutInCell='1',allowOverlap='1')
          E.SubElement(a,q('wp:simplePos'),x='0',y='0')
          for tag in ['wp:positionH','wp:positionV']:
            el=E.SubElement(a,q(tag),relativeFrom='page');E.SubElement(el,q('wp:posOffset')).text='0'
          E.SubElement(a,q('wp:extent'),cx='5486400',cy='8229600');E.SubElement(a,q('wp:effectExtent'),l='0',t='0',r='0',b='0');E.SubElement(a,q('wp:wrapNone'))
          for tag in ['wp:docPr','wp:cNvGraphicFramePr','a:graphic']:
            el=inline.find(tag,ns);assert el is not None;a.append(copy.deepcopy(el))
          a.find('wp:docPr',ns).set('descr','SIO本体论封底；定价20美元（USD 20.00）')
          for el in a.findall('.//a:xfrm/a:ext',ns):el.set('cx','5486400');el.set('cy','8229600')
          inline.getparent().replace(inline,a);sp=root.find('w:body/w:sectPr/w:pgMar',ns);sp.set(q('w:header'),'0');sp.set(q('w:footer'),'0')
          ppr=last.find('w:pPr',ns);sp=ppr.find('w:spacing',ns)
          for k,v in [('before','0'),('after','0'),('line','20'),('lineRule','exact')]:sp.set(q('w:'+k),v)
          E.SubElement(ppr,q('w:snapToGrid')).set(q('w:val'),'0')
          assert text_before==root.xpath('//w:t/text()',namespaces=ns)
          entries['word/document.xml']=(entries['word/document.xml'][0],E.tostring(root,xml_declaration=True,encoding='UTF-8',standalone=True));tmp=p.with_suffix('.fixed.docx')
          with zipfile.ZipFile(tmp,'w',compression=zipfile.ZIP_DEFLATED) as zz:
            for info,data in entries.values():zz.writestr(info,data)
          z.close();tmp.replace(p)
          p=b/'index.html';text=p.read_text();assert 'sio-ontology-v1.docx?v=20261002-price20-v11' in text
          p.write_text(text.replace('sio-ontology-v1.docx?v=20261002-price20-v11','sio-ontology-v1.docx?v=20261002-price20-v11b'))
          p=b/'publication-manifest.json';m=json.loads(p.read_text());m.update(word_back_cover_layout='full-page page-relative anchor',deployment_status='final-backcover-awaiting-live-verification')
          for f in m['files']:
            target=b/f['path'];f['size']=target.stat().st_size;f['sha256']=h(target)
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          changed=[n for n in before if h(b/n)!=before[n]]
          assert set(changed)=={'text/index.html','sio-ontology-portable.html','sio-ontology-v1.docx','index.html','publication-manifest.json'},changed
          safety={'price':20,'priceCurrency':'USD','unchanged_chapter_count':13,'word_text_unchanged':True,'chapter_digests':chapters,'changed_files':changed,'all_pdf_and_page_image_bytes_unchanged':True,'reindex_requested':False}
          (out/'final-patch-safety.json').write_text(json.dumps(safety,ensure_ascii=False,indent=2))
          for name in ['sio-word-backcover-fullbleed.yml','sio-price20-final-recovery.yml']:(Path('.github/workflows')/name).unlink(missing_ok=True)
          print(json.dumps(safety,ensure_ascii=False))
          PY
      - name: Publish only duplicate-cover removal and the full-page Word-cover fix
        run: |
          git config user.name 'SDE Publication Build'
          git config user.email 'publication-build@users.noreply.github.com'
          for attempt in 1 2 3;do
            python "$RUNNER_TEMP/final-sio-patch.py"
            git add --sparse public/books/m/2/text/index.html public/books/m/2/sio-ontology-portable.html public/books/m/2/sio-ontology-v1.docx public/books/m/2/index.html public/books/m/2/publication-manifest.json .github/workflows/sio-word-backcover-fullbleed.yml .github/workflows/sio-price20-final-recovery.yml
            git diff --cached --stat
            git commit -m 'Finalize SIO USD20 back cover: unique HTML cover section and full-page Word artwork; all chapters unchanged; no reindex'
            if git push origin HEAD:main;then git rev-parse HEAD > "$RUNNER_TEMP/sio-price20-final/content-commit.txt";break;fi
            test "$attempt" -lt 3 || exit 1
            git fetch origin main
            git reset --hard origin/main
          done
      - name: Verify actual current website, files, PDF pages and three shelves
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,urllib.request,time,datetime,concurrent.futures,zipfile
          from bs4 import BeautifulSoup
          from lxml import etree as E
          import pymupdf as fitz
          b=Path('public/books/m/2');out=Path(os.environ['RUNNER_TEMP'])/'sio-price20-final';base='https://sdeuniverses.com/books/m/2/';rev='20261002-price20-v11b'
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 SDE-Book-Acceptance','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          for attempt in range(42):
            try:
              s=BeautifulSoup(get(base+'?v='+rev),'html.parser');assert s.select_one('a[href="sio-ontology-v1.docx?v='+rev+'"]')
              t=BeautifulSoup(get(base+'text/?v='+rev),'html.parser');assert len(t.select('#back-cover'))==1
              data=get(base+'sio-ontology-v1.docx?v='+rev);assert hashlib.sha256(data).hexdigest()==hashlib.sha256((b/'sio-ontology-v1.docx').read_bytes()).hexdigest()
              break
            except Exception as e:
              if attempt==41:raise
              time.sleep(12)
          report={'book':2,'title':'SIO本体论','version':'1.1','release_id':rev,'price':20,'priceCurrency':'USD','reindex_requested':False,'content_commit':(out/'content-commit.txt').read_text().strip(),'preserved_thirteen_chapters':True,'binary_checks':{},'html_checks':{},'bookshelves':{}}
          for name in ['index.html','text/index.html','read.html','sio-ontology-portable.html']:
            live=BeautifulSoup(get(base+name+'?v='+rev),'html.parser');local=BeautifulSoup((b/name).read_text(),'html.parser');assert live.find('main').get_text(' ',strip=True)==local.find('main').get_text(' ',strip=True)
            if name!='read.html':
              assert len(live.select('#back-cover'))==1 and 'USD 20.00' in live.select_one('#back-cover').get_text()
            if name in ['text/index.html','sio-ontology-portable.html']:assert len(live.select('section.chapter'))==13 and len(live.select('#back-cover img'))==1
            report['html_checks'][name]={'status':200,'main_content_identical':True,'back_cover_section_unique':name!='read.html'}
          assert 'USD 20.00' in s.select_one('[data-book-price]').get_text();ld=json.loads(s.find('script',attrs={'type':'application/ld+json'}).string);assert ld['offers']['price']=='20.00' and ld['offers']['priceCurrency']=='USD'
          names=['back-cover.png','back-cover.svg','sio-ontology-reader-v1.pdf','sio-ontology-print-v1.pdf','sio-ontology-v1.docx','page-data.js','pages/0002.webp','pages/0005.webp','pages/0430.webp']
          def check(n):
            raw=get(base+n+'?v='+rev);expected=hashlib.sha256((b/n).read_bytes()).hexdigest();assert hashlib.sha256(raw).hexdigest()==expected,n
            return n,{'status':200,'bytes':len(raw),'sha256':expected,'matches_repository':True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:report['binary_checks']=dict(ex.map(check,names))
          for n in ['sio-ontology-reader-v1.pdf','sio-ontology-print-v1.pdf']:
            pdf=fitz.open(b/n);assert len(pdf)==430 and len(pdf.get_toc())==491 and 'USD 20.00' in pdf[1].get_text() and 'USD 20.00' in pdf[-1].get_text()
          z=zipfile.ZipFile(b/'sio-ontology-v1.docx');xml=z.read('word/document.xml');assert 'USD 20.00' in xml.decode() and '不另定价格' not in xml.decode();assert z.read('word/media/image2.png')==(b/'back-cover.png').read_bytes()
          x=E.fromstring(xml);ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main','wp':'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing'};a=x.findall('w:body/w:p',ns)[-1].find('.//wp:anchor',ns);assert a is not None and a.find('wp:positionV',ns).get('relativeFrom')=='page'
          for url in ['https://sdeuniverses.com/books/','https://sdeuniverses.com/monographs/','https://read.sdeuniverses.com/library/']:
            soup=BeautifulSoup(get(url+'?v='+rev),'html.parser');cards=soup.select('article[data-id="m-2"]');assert len(cards)==1 and '定价20美元' in cards[0].get_text()
            report['bookshelves'][url]={'single_book_record':True,'price_visible':True}
          catalog=json.loads(get('https://sdeuniverses.com/books/catalog.json?v='+rev));book=next(v for v in catalog['books'] if v['id']=='m-2');assert book['price']==20 and book['priceCurrency']=='USD' and book['backCoverUrl']
          report.update(pdf_pages=430,pdf_bookmarks=491,pdf_publication_price=True,pdf_back_cover_page=430,word_price_and_back_cover=True,word_back_cover_full_page=True,verified_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          (out/'price-backcover-verification-v1.1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Verify real desktop and mobile back-cover reading
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,shutil,subprocess,sys
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['RUNNER_TEMP'])/'sio-price20-final';base='https://sdeuniverses.com/books/m/2/';rev='20261002-price20-v11b';results={}
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome:subprocess.run([sys.executable,'-m','playwright','install','--with-deps','chromium'],check=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
            for name,w,h in [('desktop',1440,1050),('mobile',390,844)]:
              ctx=browser.new_context(viewport={'width':w,'height':h});page=ctx.new_page()
              page.goto(base+'?v='+rev,wait_until='domcontentloaded');page.wait_for_selector('[data-book-price]');assert 'USD 20.00' in page.locator('[data-book-price]').inner_text()
              page.screenshot(path=str(out/f'{name}-price.png'))
              page.get_by_role('link',name='查看封底',exact=True).click();assert page.locator('#back-cover').count()==1
              page.locator('#back-cover-image').scroll_into_view_if_needed();page.wait_for_function('document.getElementById("back-cover-image").complete && document.getElementById("back-cover-image").naturalWidth===1200')
              assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2');page.locator('#back-cover').screenshot(path=str(out/f'{name}-cover-gallery.png'))
              page.goto(base+'text/?v='+rev+'#back-cover',wait_until='domcontentloaded');assert page.locator('section.chapter').count()==13 and page.locator('#back-cover').count()==1 and page.locator('#back-cover img').count()==1
              page.locator('#back-cover img').scroll_into_view_if_needed();page.wait_for_function('document.querySelector("#back-cover img").complete && document.querySelector("#back-cover img").naturalWidth===1200')
              assert 'USD 20.00' in page.locator('#back-cover').inner_text();assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
              page.locator('#back-cover').screenshot(path=str(out/f'{name}-fulltext-back-cover.png'))
              page.goto(base+'read.html?v='+rev+'#page=430',wait_until='domcontentloaded')
              page.wait_for_function('window.SIO_BOOK && window.SIO_BOOK.price===20 && document.getElementById("left").src.includes("0430.webp") && document.getElementById("left").complete && document.getElementById("left").naturalWidth>0')
              page.screenshot(path=str(out/f'{name}-reader-back-cover.png'))
              results[name]={'price_visible':True,'back_cover_section_unique':True,'detail_back_cover_visible':True,'text_back_cover_visible':True,'reader_back_cover_page':430,'no_horizontal_overflow':True};ctx.close()
            browser.close()
          f=out/'price-backcover-verification-v1.1.json';report=json.loads(f.read_text());report['browser_checks']=results;report['verified_live']=True;f.write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(results,ensure_ascii=False))
          PY
      - name: Record successfully verified publication
        run: |
          cat > "$RUNNER_TEMP/record-sio-final.py" <<'PY'
          from pathlib import Path
          import os,json,hashlib
          b=Path('public/books/m/2');out=Path(os.environ['RUNNER_TEMP'])/'sio-price20-final';r=json.loads((out/'price-backcover-verification-v1.1.json').read_text());assert r['verified_live'] and len(r['browser_checks'])==2
          for n,v in r['binary_checks'].items():assert hashlib.sha256((b/n).read_bytes()).hexdigest()==v['sha256'],'Concurrent book content changed'
          (b/'price-backcover-verification-v1.1.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          p=b/'publication-manifest.json';m=json.loads(p.read_text());m.update(deployment_status='live-verified',verification_record='price-backcover-verification-v1.1.json',verified_at_utc=r['verified_at_utc'],price=20,priceCurrency='USD',reindex_requested=False,word_layout_verification_pending=False);p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          p=b/'release-check.json';c=json.loads(p.read_text());c.setdefault('deployment',{}).update(status='live-verified',verification_record='price-backcover-verification-v1.1.json',verified_at_utc=r['verified_at_utc']);c['price_backcover_browser_checks']=r['browser_checks'];c['word_back_cover_full_page']=True;c['reindex']=False;p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          PY
          for attempt in 1 2 3;do
            python "$RUNNER_TEMP/record-sio-final.py"
            git add --sparse public/books/m/2/price-backcover-verification-v1.1.json public/books/m/2/publication-manifest.json public/books/m/2/release-check.json
            git commit -m 'Record successful SIO USD20 back-cover verification: two browsers, all formats, three shelves; no reindex'
            if git push origin HEAD:main;then break;fi
            test "$attempt" -lt 3 || exit 1
            git fetch origin main
            git reset --hard origin/main
          done
      - name: Save final verified files and live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sio-usd20-backcover-final-v11
          retention-days: 7
          path: |
            ${{ runner.temp }}/sio-price20-final/
            public/books/m/2/sio-ontology-v1.docx
            public/books/m/2/sio-ontology-reader-v1.pdf
            public/books/m/2/sio-ontology-print-v1.pdf
            public/books/m/2/back-cover.png
            public/books/m/2/back-cover.svg
            public/books/m/2/sio-ontology-portable.html
            public/books/m/2/price-backcover-verification-v1.1.json
