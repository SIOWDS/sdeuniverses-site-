name: Finish SIO book 2 publication with exact page geometry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-sio-m2-20261002.yml']
permissions:
  contents: write
concurrency:
  group: publication-sio-m2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare verified publication scripts
        run: |
          python -m pip install -q Pillow PyMuPDF playwright PyYAML
          python - <<'PY'
          import urllib.request,hashlib,pathlib,os,yaml
          url='https://raw.githubusercontent.com/SIOWDS/sdeuniverses-site-/13b185f9d360a29fa078484490a22808157c104a/.github/workflows/publish-sio-m2-20261002.yml'
          data=urllib.request.urlopen(url,timeout=30).read()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='02ca3b11a4a55a3ddd909445fdf918580d0cfc5b'
          w=yaml.safe_load(data);dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'sio-steps';dest.mkdir()
          scripts=[s['run'] for s in w['jobs']['publish']['steps'] if 'run' in s]
          assert len(scripts)==7
          for i,s in enumerate(scripts):
            s=s.replace("assert im.size==(864,1296);im.verify()", "assert im.size==tuple(fitz.open(b/'sio-ontology-reader-v1.pdf')[i-1].rect.transform(fitz.Matrix(2,2)).irect[2:]);im.verify()")
            s=s.replace('rm -f .github/workflows/publish-sio-m2-20261002.yml','rm -f .github/workflows/publish-sio-m2-20261002.yml .github/workflows/finish-sio-m2-20261002.yml')
            s=s.replace('public/sites/read/library/index.html .github/workflows/publish-sio-m2-20261002.yml','public/sites/read/library/index.html .github/workflows/publish-sio-m2-20261002.yml .github/workflows/finish-sio-m2-20261002.yml')
            (dest/f'{i}.sh').write_text(s)
          print('Pinned publication code verified; only geometry and temporary-workflow cleanup corrected')
          PY
      - name: Authenticate the exact complete publication payload
        run: bash -e "$RUNNER_TEMP/sio-steps/1.sh"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/catalog.json
            /public/books/index.html
            /public/books/m/2/
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /tools/build_bookshelf.py
            /.github/workflows/publish-sio-m2-20261002.yml
            /.github/workflows/finish-sio-m2-20261002.yml
      - name: Install book and merge only its existing catalogue record
        run: bash -e "$RUNNER_TEMP/sio-steps/2.sh"
      - name: Verify all 430 pages against actual PDF geometry
        run: bash -e "$RUNNER_TEMP/sio-steps/3.sh"
      - name: Publish narrow commit without reindex
        run: bash -e "$RUNNER_TEMP/sio-steps/4.sh"
      - name: Verify deployed files and three bookshelf entrances
        run: bash -e "$RUNNER_TEMP/sio-steps/5.sh"
      - name: Verify live desktop and mobile reading
        run: bash -e "$RUNNER_TEMP/sio-steps/6.sh"
      - name: Preserve verification and recoverable publication files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sio-m2-430-final-publication-verification
          retention-days: 7
          path: |
            ${{ runner.temp }}/sio-m2-qa/
            ${{ runner.temp }}/sio-m2-publication-commit.txt
            ${{ runner.temp }}/sio-m2-payload/
            public/books/m/2/release-check.json
            public/books/m/2/publication-manifest.json
