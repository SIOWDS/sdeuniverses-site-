name: SDE ontology reader vendor assets
on:
  push:
    branches: [sde-ontology-complete-20261008]
    paths: [.github/workflows/sde-ontology-reader-vendor-20261008.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch reference reader PDF rendering distribution
        run: |
          mkdir -p "$RUNNER_TEMP/reader-vendor"
          python - <<'PY'
          import urllib.request,pathlib,os,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'reader-vendor';result=[]
          for name in ['pdf.min.js','pdf.worker.min.js']:
              url='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/'+name
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              raw=urllib.request.urlopen(req,timeout=90).read();assert len(raw)>100000
              (root/name).write_bytes(raw);result.append({'file':name,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'source':url})
          (root/'vendor-manifest.json').write_text(json.dumps(result,indent=2))
          print('Reference PDF renderer retrieved. New book reader must set isEvalSupported=false.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sde-ontology-reader-vendor-20261008
          path: ${{ runner.temp }}/reader-vendor/
          retention-days: 14
