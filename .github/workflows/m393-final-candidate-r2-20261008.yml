name: M393 final candidate r2 acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m393-final-candidate-r2-20261008.yml']
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Receive exact final candidate
        run: |
          python3 - <<'PY'
          import pathlib,os,urllib.request,hashlib,zipfile,io,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m393-final';root.mkdir()
          url='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-143c-8211-8999-362fd0bb9199/raw?se=2026-10-08T06%3A49%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=24ec223f-8c62-5d19-a3e4-df43d4ef505a&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T22%3A33%3A20Z&ske=2026-10-08T22%3A33%3A20Z&sks=b&skv=2026-02-06&sig=5ou3PVoT0xuXbWFyId0uY6ixRpn7okd5l%2B3PcQCyNh4%3D'
          raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=120).read()
          assert len(raw)==13288655 and hashlib.sha256(raw).hexdigest()=='45c7a60510f89d40288cc281ac67f747700a328c67ff7e10f9aa95175c3f8fbd'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for n in z.namelist():assert not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts
              z.extractall(root)
          for e in json.loads((root/'input-inventory.json').read_text()):
              p=root/e['path'];assert p.stat().st_size==e['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256'],e['path']
          assert json.loads((root/'site/public/books/m/393/publication-manifest.json').read_text())['release_id']=='8a7dd1cce9d9516776aa3d6944d481dccc797b5ef525a5ae1843a59a5ba2ed21'
          print('EXACT_FINAL_CANDIDATE_RECEIVED',len(raw),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m393-final-v12-r2-exact-candidate
          path: ${{ runner.temp }}/m393-final
          retention-days: 14
      - name: Install real browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Desktop mobile and all 344 vector pages
        run: python3 "$RUNNER_TEMP/m393-final/build-tools/browser_qa.py" "$RUNNER_TEMP/m393-final"
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m393-final-v12-r2-browser-evidence
          path: ${{ runner.temp }}/m393-final/qa
          retention-days: 30
