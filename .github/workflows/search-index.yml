# 站内搜索索引 · 自动重建
#
# 为什么挂在 push 上而不是"打开搜索页时"：
#   索引是派生数据，只有内容变了它才会过期，而内容只在 push 那一刻变。
#   访客打开搜索页一万次，站里一个字都不会变 —— 挂在"打开"上等于重算一万次同一个结果。
#   对所有访客完全相同的东西 = 预先生成、直接调用（第二铁律第一类）。
#
# 【2026-07-29 改】上面这套"push 即重建"跑了两个月，代价浮出水面：索引是 218MB 的生成物，
#   每重建一次就整份重排，git 只能一版一版存。2202 个提交里 1027 个是它，仓库涨到 4GB、
#   每天再涨 250-780MB，眼看撞 GitHub 的 5GB 硬线。而**索引只有最后一版有用**——
#   前面每一版在被下一版取代的那一秒就作废了，却永远留在历史里。
#   故改为**每天重建一次**（凌晨 2 点新加坡时间 = 18:00 UTC），外加随时可手动跑。
#   代价是新文章最长等一天才进站内搜索——发了重要的一批不想等，就去 Actions 页面点一次
#   Run workflow。换来的是重建从每天 55-83 次降到 1 次，九成九的速朽副本不再写进历史。
#   （根治是把索引搬出 git 走 R2，读取侧已上线 commit e5d2753，写入侧待办。）
#
# 学员排名不跟着停：roster.json 只有 126KB，churn 可忽略，已拆到 roster.yml 继续随 push 自动跑。
#
# 坐标必须与索引同跑，不能拆成两步：sde-coords.json 按文档编号存，
# 索引一重建编号就重排，旧坐标会把 ×2 检索加分喂给错误的文章 —— 比不打坐标更糟。

name: search-index

on:
  schedule:
    # 每天 18:00 UTC = 次日 02:00 新加坡时间。挑站上最静的时段，
    # 撞不上任何人发文，重建完当天白天就已在线。
    # GitHub 的定时任务在整点高峰会被排队推迟几分钟到几十分钟，对每天一次的活儿无所谓。
    - cron: '0 18 * * *'
  workflow_dispatch:                 # 想提前跑：Actions 页面 → search-index → Run workflow

concurrency:
  group: search-index
  cancel-in-progress: true           # 连续 push 时只有最后一次的索引有意义

jobs:
  reindex:
    runs-on: ubuntu-latest
    permissions:
      contents: read                 # 索引改上 R2，不再推回 main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # build_roster 的发表日期兜底靠 git 首次提交日；
                                    # 浅克隆下只有一个提交，缺“发表于”戳的页面会被
                                    # 统一压成运行当天，虚高活跃分与排名。

      - name: 装 pdftotext（专著正文靠它抽，缺了 PDF 就进不了索引）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 重建索引
        run: python3 tools/build_search_index.py

      - name: 重打 SDE 坐标（必须紧跟重建，编号已重排）
        run: python3 tools/label_sde_coords_rules.py

      - name: 完整性自检（孤儿块/空块/无正文文档/孤儿坐标键，有一个就失败）
        run: |
          python3 - <<'EOF'
          import json, os, sys
          SD = 'public/search'
          man = json.load(open(f'{SD}/manifest.json'))
          docs = {d['i'] for d in man['docs']}
          bad = []
          seen = set()
          # 大栏目会被生成器切成 books-1 / books-2 …，分片名以 manifest 的 files 为准，
          # 不能由 key 拼出来（早期版本这样写，栏目一分片自检就整片报缺失）。
          for s in man['sections']:
              for f in s.get('files') or [s['key']]:
                  p = f"{SD}/shard-{f}.json"
                  if not os.path.exists(p):
                      bad.append(f"分片缺失 {p}"); continue
                  for c in json.load(open(p))['chunks']:
                      seen.add(c['d'])
                      if c['d'] not in docs: bad.append(f"孤儿块 -> doc {c['d']}")
                      if not c.get('t', '').strip(): bad.append(f"空块 in {f}")
          for d in man['docs']:
              if d['i'] not in seen: bad.append(f"无正文块的文档 {d['u']}")
          for k in json.load(open(f'{SD}/sde-coords.json')):
              if int(k) not in docs: bad.append(f"孤儿坐标键 {k}")
          if bad:
              print("索引自检失败：", *dict.fromkeys(bad[:20]), sep="\n  ")
              sys.exit(1)
          c = man['counts']
          print(f"自检通过 · {c['docs']} 篇 / {c['chunks']} 块 / {c['chars']:,} 字")
          EOF

      - name: 过期兜底自检（重建后必须不再过期，否则说明筛选规则与生成器脱节）
        run: python3 tools/build_search_index.py --check

      # ===== 写入侧：索引不再进 git，改上 R2 =====
      # 次序是硬的：上面两道自检全过，才允许碰桶。坏索引进了桶就是线上答案被污染，
      # 而 R2 一旦有 search/ 前缀的对象就永远压过 ASSETS，回滚只能靠快照。
      # 凭证是 Object Read & Write、只绑 sdeuniverses-pdf 的 R2 令牌，建不了桶也删不了桶。
      - name: 上传索引到 R2（search/ 覆盖 + search-snap/<日期>/ 快照）
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2.23 起默认给每次 PUT 打 x-amz-checksum-CRC64NVME 头，R2 对没实现的
          # 校验算法会回 501 NotImplemented。when_required = 只在协议要求时才算，关掉这层默认。
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          EP=https://d3ea22f828ce19cf113a457ceba2c930.r2.cloudflarestorage.com
          B=s3://sdeuniverses-pdf
          SNAP=$(date -u +%F)

          # index.html 是搜索页面本身，照旧走 ASSETS，绝不能进桶
          # （IDX_KEYS 也不认它，进了也读不到，只会白占空间）
          aws s3 sync public/search/ "$B/search/" \
            --endpoint-url "$EP" --delete --exclude "index.html" --only-show-errors
          echo "线上那份已更新"

          # 快照不加 --delete，也不覆盖既有日期；保留期交给桶上的 Object Lifecycle Rule
          # （search-snap/ 前缀 30 天过期）。这是 git 缺的那个能力：能忘。
          aws s3 sync public/search/ "$B/search-snap/$SNAP/" \
            --endpoint-url "$EP" --exclude "index.html" --only-show-errors
          echo "快照 search-snap/$SNAP/ 已留存"

      - name: 核对桶里的对象数与本地分片数一致
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          EP=https://d3ea22f828ce19cf113a457ceba2c930.r2.cloudflarestorage.com
          LOCAL=$(find public/search -type f -name '*.json' | wc -l)
          REMOTE=$(aws s3 ls s3://sdeuniverses-pdf/search/ --recursive \
                     --endpoint-url "$EP" | grep -c '\.json$')
          echo "本地 $LOCAL 个 json · 桶里 $REMOTE 个"
          [ "$LOCAL" -eq "$REMOTE" ] || { echo "对象数不一致，上传不完整"; exit 1; }
          # 抓一个必存在的文件回读，确认它在桶里是完整可解析的（防止传上去的是半截文件）
          aws s3 cp s3://sdeuniverses-pdf/search/manifest.json /tmp/m.json \
            --endpoint-url "$EP" --only-show-errors
          python3 -c 'import json;c=json.load(open("/tmp/m.json"))["counts"];print("回读 manifest 成功 ·",c["docs"],"篇 /",c["chunks"],"块")'

      # 【下一步】确认本工作流连续跑通后，再把 public/search/ 从 git 里删掉
      #   （现在留着只作过渡期兜底：桶里没有对象时 Worker 会静默回落 ASSETS）。
      #   删掉工作树只是止血，历史里那 1027 个旧版本要另挑静默窗口用 filter-repo 按路径剔除。
