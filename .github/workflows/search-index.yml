# 2026-10-01 用户决定：索引每天更新一次，以控制全量入库的 Durable Objects 写入费用。
# 北京时间 23:20 开始：构建与坐标 → R2 上传/校验 → IndexMemory 同步。
# 【2026-10-02 硬性规定】不接受任何手动触发，也不接受 push/repository_dispatch：只有每天一次的定时任务。
#   已删除 workflow_dispatch（Actions 页面不再有 Run workflow 按钮）。任何人、任何对话、任何出版流程都不得绕开；
#   要改这条规矩，只能由王德生本人明确下令后修改本文件。
# 新发布内容随下一次每日任务进入检索，不在出版或检索请求中另行 reindex。

name: search-index

on:
  schedule:
    - cron: '20 15 * * *'   # 北京时间 23:20；GitHub 调度可能稍有延迟

concurrency:
  group: search-index
  cancel-in-progress: false          # 不让重复点击取消正在上传的唯一一轮

jobs:
  reindex:
    # 出版工作流不得使用 GITHUB_TOKEN 顺手触发；只保留每日定时（2026-10-02 起连手动按钮也取消）。
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # 【2026-08-19 加】整个 job 一道总闸。此前**一步都没有超时**，于是 2026-08-19 那趟
    # 卡在 apt 上挂了二十分钟还在挂——而 concurrency 是 search-index 独一份，
    # 它挂着就等于把这条产线整条占住，谁也看不出它在等什么。
    # 实测一趟 4.5–6 分钟，25 分钟给足了余量：宁可红一趟去重跑，不要无声地挂着。
    # 【2026-08-30 改 45】上面那笔账已经过期：文档涨到 5,563 篇之后，光 search/ 那一趟 sync 就要 12 分钟
    #   （run 1178 实测），当天第一趟还要再传一份快照 ⇒ 6 分钟构建 ＋ 两趟各 12 分钟 ＞ 25 分钟。
    #   08-29 三趟定时（1179/1180/1181）全部在「上传索引」那一步被这条总闸掐成 cancelled——
    #   线上那份多半已同步完、只是快照传到一半，但三趟连红没人看得出是超时不是坏索引。
    #   放到 45 分钟，并在上传那一步把 aws cli 并发从默认 10 提到 32（下面那一步的 aws configure）。
    timeout-minutes: 45
    permissions:
      contents: read                 # 索引改上 R2，不再推回 main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1            # 本工作流只读工作树：build_search_index.py 与
                                    # label_sde_coords_rules.py 都不碰 git 历史
                                    # （前者的 subprocess 只用来调 pdftotext）。
                                    # 拉全史要十三分钟——那是 roster.yml 的需求，
                                    # 它靠首次提交日兜底发表日期，那边必须留 fetch-depth: 0。

      - name: 检查今天是否已更新（北京时间每天最多一次）
        id: daily
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: python3 tools/search_index_daily.py check

      - name: 装 pdftotext（专著正文靠它抽，缺了 PDF 就进不了索引）
        if: steps.daily.outputs.run == 'true'
        # 【2026-08-19 加固】这一步原来是光秃秃一行 apt，**没有超时也没有重试**。
        # 当天两趟重建（run 1148／1149）都卡死在这里：1148 挂了 20 分钟，我只能靠再发一次
        # repository_dispatch 用 cancel-in-progress 把它顶掉——PAT 没有 actions:write，掐不动。
        # apt 镜像连不上是 runner 侧的常事，不该让整条索引产线陪着无限期挂着。
        # 三条加固：① runner 自带就直接用（多数 ubuntu 镜像本来就有 poppler-utils，
        # 跑得通就一次 apt 都不必打）；② 连不上就退避重试三次；③ 整步 6 分钟硬超时，
        # 让它**快点红**——红了能重跑，挂着谁也不知道它在等什么。
        timeout-minutes: 6
        run: |
          if command -v pdftotext >/dev/null 2>&1; then
            echo "runner 自带 pdftotext：$(pdftotext -v 2>&1 | head -1)"
            exit 0
          fi
          for i in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; then
              echo "第 $i 次装上了"; exit 0
            fi
            echo "第 $i 次没装上（多半是 apt 镜像连不上），20 秒后再试"; sleep 20
          done
          echo "::error::装不上 poppler-utils —— 专著 PDF 的正文会进不了索引，本趟停在这里，别把半份索引传上去"
          exit 1

      # 【2026-10-02 加】PDF 迁出仓库后（tools/pdf_offload.py，台账 ops/pdf-offload/ledger.tsv），
      #   专著 PDF 不在工作树里了；不取回来，build_search_index.py 就抽不到它们的正文、整批掉出索引。
      #   取不回来就红——宁可红一趟，也别把缺了专著正文的半份索引传上去。
      - name: 按台账从 R2 取回已迁出的 PDF（索引要抽正文）
        if: steps.daily.outputs.run == 'true'
        timeout-minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -f ops/pdf-offload/ledger.tsv ]; then
            pip install -q --upgrade --user boto3 botocore
            python3 tools/pdf_offload.py rehydrate
          else
            echo "还没有迁出过 PDF，跳过"
          fi

      - name: 重建索引
        if: steps.daily.outputs.run == 'true'
        run: python3 tools/build_search_index.py

      - name: 重打 SDE 坐标（必须紧跟重建，编号已重排）
        if: steps.daily.outputs.run == 'true'
        run: python3 tools/label_sde_coords_rules.py

      - name: 完整性自检（孤儿块/空块/无正文文档/孤儿坐标键，有一个就失败）
        if: steps.daily.outputs.run == 'true'
        run: |
          python3 - <<'EOF'
          import json, os, sys
          SD = 'public/search'
          man = json.load(open(f'{SD}/manifest.json'))
          docs = {d['i'] for d in man['docs']}
          bad = []
          seen = set()
          # 大栏目会被生成器切成 books-1 / books-2 …，分片名以 manifest 的 files 为准，
          # 不能由 key 拼出来（早期版本这样写，栏目一分片自检就整片报缺失）。
          for s in man['sections']:
              for f in s.get('files') or [s['key']]:
                  p = f"{SD}/shard-{f}.json"
                  if not os.path.exists(p):
                      bad.append(f"分片缺失 {p}"); continue
                  for c in json.load(open(p))['chunks']:
                      seen.add(c['d'])
                      if c['d'] not in docs: bad.append(f"孤儿块 -> doc {c['d']}")
                      if not c.get('t', '').strip(): bad.append(f"空块 in {f}")
          for d in man['docs']:
              if d['i'] not in seen: bad.append(f"无正文块的文档 {d['u']}")
          for k in json.load(open(f'{SD}/sde-coords.json')):
              if int(k) not in docs: bad.append(f"孤儿坐标键 {k}")
          if bad:
              print("索引自检失败：", *dict.fromkeys(bad[:20]), sep="\n  ")
              sys.exit(1)
          c = man['counts']
          print(f"自检通过 · {c['docs']} 篇 / {c['chunks']} 块 / {c['chars']:,} 字")
          EOF

      - name: 过期兜底自检（重建后必须不再过期，否则说明筛选规则与生成器脱节）
        if: steps.daily.outputs.run == 'true'
        run: python3 tools/build_search_index.py --check

      # 【2026-10-02】内容没变就不上传、不同步。此前 manifest 的 built 时间戳每趟都变，
      #   于是即使一篇文章没发，每天也整份重传 R2、整库重写 DO（约百万行/趟，超出部分 $1/百万行）。
      #   指纹排除 built 之外的一切都参与；上传与同步都成功之后才记录指纹。
      - name: 内容指纹（与已发布索引完全一致则跳过上传与同步）
        id: content
        if: steps.daily.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: python3 tools/search_index_daily.py content

      # ===== 写入侧：索引不再进 git，改上 R2 =====
      # 次序是硬的：上面两道自检全过，才允许碰桶。坏索引进了桶就是线上答案被污染，
      # 而 R2 一旦有 search/ 前缀的对象就永远压过 ASSETS，回滚只能靠快照。
      # 凭证是 Object Read & Write、只绑 sdeuniverses-pdf 的 R2 令牌，建不了桶也删不了桶。
      - name: 上传索引到 R2（search/ 覆盖 + search-snap/<日期>/ 快照）
        if: steps.daily.outputs.run == 'true' && steps.content.outputs.changed == 'true'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2.23 起默认给每次 PUT 打 x-amz-checksum-CRC64NVME 头，R2 对没实现的
          # 校验算法会回 501 NotImplemented。when_required = 只在协议要求时才算，关掉这层默认。
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          EP=https://d3ea22f828ce19cf113a457ceba2c930.r2.cloudflarestorage.com
          B=s3://sdeuniverses-pdf
          SNAP=$(date -u +%F)
          # 【2026-08-30】五千多个小对象逐个 HEAD＋PUT，默认并发 10 要 12 分钟一趟；提到 32 并发、队列放大，
          #   一趟压到几分钟，当天第一趟（search/ ＋ 快照两趟）才装得进总闸。R2 吃得下这个并发。
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.max_queue_size 10000

          # index.html 是搜索页面本身，照旧走 ASSETS，绝不能进桶
          # （IDX_KEYS 也不认它，进了也读不到，只会白占空间）
          aws s3 sync public/search/ "$B/search/" \
            --endpoint-url "$EP" --delete --exclude "index.html" --only-show-errors
          echo "线上那份已更新"

          # 快照每天只留一份：键名按日期，同一天再跑只是把同一批键覆盖一遍，
          # 留不下新东西，却要再烧约 2000 次写操作。
          # 【2026-08-02 改】原先靠 GITHUB_EVENT_NAME != push 来判"这趟该不该留快照"。
          #   改成一天两趟后那个判断就失效了（两趟都是 schedule，会各留一次、翻倍）。
          #   现在直接问桶：当天那份快照在不在。这样与触发方式脱钩——定时、手动、
          #   repository_dispatch 混着来也只留第一份，多跑几趟都不会翻倍。
          # 判据取 manifest.json 是否存在：它是快照里必有的一件；真传到一半 sync 会非零退出，
          #   set -e 会把整步弄红，不会留下一份没人发现的半截快照。
          # 不加 --delete，也不覆盖别的日期；保留期交给桶上的 Object Lifecycle Rule
          # （search-snap/ 前缀 30 天过期）。这是 git 缺的那个能力：能忘。
          if aws s3 ls "$B/search-snap/$SNAP/manifest.json" --endpoint-url "$EP" >/dev/null 2>&1; then
            echo "当日快照 search-snap/$SNAP/ 已存在，跳过（每天只留一份）"
          else
            aws s3 sync public/search/ "$B/search-snap/$SNAP/" \
              --endpoint-url "$EP" --exclude "index.html" --only-show-errors
            echo "快照 search-snap/$SNAP/ 已留存"
          fi

      - name: 核对桶里的对象数与本地分片数一致
        if: steps.daily.outputs.run == 'true' && steps.content.outputs.changed == 'true'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          EP=https://d3ea22f828ce19cf113a457ceba2c930.r2.cloudflarestorage.com
          LOCAL=$(find public/search -type f -name '*.json' | wc -l)
          REMOTE=$(aws s3 ls s3://sdeuniverses-pdf/search/ --recursive \
                     --endpoint-url "$EP" | grep -c '\.json$')
          echo "本地 $LOCAL 个 json · 桶里 $REMOTE 个"
          [ "$LOCAL" -eq "$REMOTE" ] || { echo "对象数不一致，上传不完整"; exit 1; }
          # 抓一个必存在的文件回读，确认它在桶里是完整可解析的（防止传上去的是半截文件）
          aws s3 cp s3://sdeuniverses-pdf/search/manifest.json /tmp/m.json \
            --endpoint-url "$EP" --only-show-errors
          python3 -c 'import json;c=json.load(open("/tmp/m.json"))["counts"];print("回读 manifest 成功 ·",c["docs"],"篇 /",c["chunks"],"块")'

      - name: 同步检索数据库（上传成功后一次，等待完成）
        if: steps.daily.outputs.run == 'true' && steps.content.outputs.changed == 'true'
        timeout-minutes: 8
        run: python3 tools/search_index_daily.py sync

      - name: 记录内容指纹（上传与同步都成功之后才记）
        if: steps.daily.outputs.run == 'true' && steps.content.outputs.changed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: python3 tools/search_index_daily.py record
