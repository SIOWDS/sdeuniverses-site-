name: Happiness bookshelf agent entry and real click acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/happiness-bookshelf-agent-entry-20261008.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: happiness-secret-publication
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/happiness_shelf_entry_20261008.py
            /tools/build_bookshelf.py
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /public/books/bookshelf.css
            /public/books/bookshelf.js
            /public/books/catalog.json
            /public/books/agents.json
            /public/books/happiness-secret/
            /.github/workflows/search-index.yml
      - name: Prepare bounded browser dependencies
        timeout-minutes: 4
        run: |
          python3 -m pip install --quiet --timeout 25 --retries 1 beautifulsoup4 playwright
          timeout 150s python3 -m playwright install chromium
          timeout 40s sudo apt-get -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 -o Acquire::Retries=1 install -y -qq fonts-noto-cjk || echo 'Using system fonts'
      - name: Add the standard named-agent entry only to the Happiness card
        run: python3 tools/happiness_shelf_entry_20261008.py patch
      - name: Compare 220 style and verify real desktop/mobile clicks before publishing
        run: python3 tools/happiness_shelf_entry_20261008.py candidate
      - name: Publish three card entries and the durable generator rule without reindex
        run: python3 tools/happiness_shelf_entry_20261008.py publish
      - name: Verify all three live bookshelves, six real clicks and unchanged PDFs
        run: python3 tools/happiness_shelf_entry_20261008.py live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: happiness-bookshelf-entry-acceptance
          path: ${{ runner.temp }}/happiness-shelf-evidence/
          retention-days: 30
