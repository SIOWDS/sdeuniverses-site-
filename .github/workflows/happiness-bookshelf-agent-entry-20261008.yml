name: Happiness current bookshelf layout inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/happiness-bookshelf-agent-entry-20261008.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /.github/workflows/
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /public/books/bookshelf.css
            /public/books/bookshelf.js
            /public/books/catalog.json
      - run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import os,json,shutil
          root=Path(os.environ['GITHUB_WORKSPACE']);qa=Path(os.environ['RUNNER_TEMP'])/'shelf-current';qa.mkdir()
          for rel in ['public/books/index.html','public/monographs/index.html','public/sites/read/library/index.html']:
              p=root/rel;soup=BeautifulSoup(p.read_text(),'html.parser'); print('SHELF',rel)
              for sel in ['[data-id="happiness-secret"]','[data-number="220"]','[data-number="302"]']:
                  n=soup.select_one(sel);print('CARD',sel,str(n))
              q=qa/rel;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
          for rel in ['public/books/bookshelf.css','public/books/bookshelf.js','public/books/catalog.json']:
              q=qa/rel;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(root/rel,q)
          for directory in ['tools','.github/workflows']:
              for p in (root/directory).rglob('*'):
                  if p.suffix not in ('.py','.js','.yml','.yaml','.sh') or not p.is_file():continue
                  s=p.read_text(errors='replace')
                  if 'class="book-top"' in s or '20261008-v8' in s or ('bookshelf' in p.name and 'card(' in s):
                      print('PRODUCER',str(p.relative_to(root)))
                      lines=s.splitlines();indices=[i for i,l in enumerate(lines) if 'book-top' in l or 'agentUrl' in l or '20261008-v8' in l or 'def card' in l]
                      for i in indices[:8]:print('CODE',i+1,'\n'.join(lines[max(0,i-3):i+4])[:2400])
                      q=qa/p.relative_to(root);q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
          print('READ_ONLY_INSPECTION_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: happiness-current-bookshelf-source
          path: ${{ runner.temp }}/shelf-current/
          include-hidden-files: true
          retention-days: 3
