name: Finalize monograph 163 byline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-m163-byline-20261001.yml']
permissions:
  contents: write
concurrency:
  group: authorship-m163
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/163/text/index.html
            /public/books/m/163/authorship-update-20261001.json
            /.github/workflows/finalize-m163-byline-20261001.yml
      - name: Correct only the fulltext header and author metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,html,datetime,hashlib
          p=Path('public/books/m/163/text/index.html')
          original=p.read_text(encoding='utf-8')
          headings=[m for m in re.finditer(r'<h([1-6])\b[^>]*>(.*?)</h\1>',original,re.I|re.S) if html.unescape(re.sub(r'<[^>]+>','',m.group(2))).strip()=='作者介绍']
          assert len(headings)==1
          boundary=headings[0].start()
          prefix=original[:boundary];body=original[boundary:]
          replacements=[('全文网页版 · 全书 · 王德生 著 · 德麦国际出版社。','全文网页版 · 全书 · 王德生、杨彼得 著 · 德麦国际出版社。'),('发生对发现的替代　·　王德生 著　·　全书','发生对发现的替代　·　王德生、杨彼得 著　·　全书')]
          for old,new in replacements:
              if old in prefix:
                  assert prefix.count(old)==1
                  prefix=prefix.replace(old,new,1)
              else:
                  assert new in prefix,old
          if 'name="author"' not in prefix:
              marker='<meta charset="utf-8">'
              assert prefix.count(marker)==1
              prefix=prefix.replace(marker,marker+'<meta name="author" content="王德生、杨彼得">',1)
          assert '<meta name="author" content="王德生、杨彼得">' in prefix
          assert '王德生 著' not in prefix
          updated=prefix+body
          assert updated[len(prefix):]==body
          assert '杨彼得 · 第二作者' in body and '1970年生，山西万荣人' in body
          p.write_text(updated,encoding='utf-8')
          reportpath=Path('public/books/m/163/authorship-update-20261001.json')
          report=json.loads(reportpath.read_text(encoding='utf-8'))
          report.pop('frontmatter_after',None)
          report['fulltext_byline_verified']=True
          report['fulltext_meta_author_verified']=True
          report['fulltext_byline']='发生对发现的替代 · 王德生、杨彼得 著 · 全书'
          report['fulltext_body_unchanged_by_final_header_patch']=True
          report['fulltext_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          report['final_header_check_at']=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')
          reportpath.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Verified: both fulltext bylines, author metadata, second-author biography; all body content retained.')
          PY
      - name: Commit the focused update and remove the temporary workflow
        run: |
          git config user.name 'SDE Publication Build'
          git config user.email 'publication-build@users.noreply.github.com'
          rm .github/workflows/finalize-m163-byline-20261001.yml
          git add --sparse public/books/m/163/text/index.html public/books/m/163/authorship-update-20261001.json .github/workflows/finalize-m163-byline-20261001.yml
          git diff --cached --stat
          git commit -m 'Verify Wang Desheng and Yang Bide byline throughout monograph 163 web edition'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Check the current live page without assuming deployment completion
        run: |
          python - <<'PY'
          import urllib.request,json
          checks={}
          for url in ['https://sdeuniverses.com/books/m/163/','https://sdeuniverses.com/books/m/163/text/']:
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'SDE-Authorship-Verification/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=25) as response:
                      text=response.read().decode('utf-8')
                      checks[url]={'status':response.status,'both_authors':'王德生、杨彼得' in text,'biography':'1970年生，山西万荣人' in text}
              except Exception as e:
                  checks[url]={'error':str(e)}
          print('LIVE_AUTHORSHIP_CHECK='+json.dumps(checks,ensure_ascii=False))
          PY
