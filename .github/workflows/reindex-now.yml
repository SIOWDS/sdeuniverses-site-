name: reindex-now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reindex-now.yml'

permissions:
  actions: read
  contents: write

jobs:
  dispatch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dispatch current-main reindex and verify completion
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_PATH: .reindex-now-result-20260812T000215Z.json
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          TARGET_SHA="$GITHUB_SHA"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail-with-body -sS -L -X POST "${AUTH[@]}" \
            "$API/dispatches" \
            -d '{"event_type":"reindex","client_payload":{"source":"reindex-now-20260812T000215Z"}}'

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUNS=$(curl --fail-with-body -sS -L "${AUTH[@]}" \
              "$API/actions/workflows/search-index.yml/runs?event=repository_dispatch&per_page=20")
            RUN_ID=$(jq -r --arg sha "$TARGET_SHA" \
              '((.workflow_runs | map(select(.head_sha == $sha)) | sort_by(.created_at) | last) // {}) | .id // empty' \
              <<<"$RUNS")
            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done
          [[ -n "$RUN_ID" ]] || { echo "No reindex run found for $TARGET_SHA" >&2; exit 1; }

          STATUS=""
          RUN=""
          for _ in $(seq 1 180); do
            RUN=$(curl --fail-with-body -sS -L "${AUTH[@]}" "$API/actions/runs/$RUN_ID")
            STATUS=$(jq -r '.status' <<<"$RUN")
            [[ "$STATUS" == "completed" ]] && break
            sleep 10
          done
          [[ "$STATUS" == "completed" ]] || { echo "Reindex run $RUN_ID timed out" >&2; exit 1; }

          RESULT=$(jq -c '{id,run_number,event,status,conclusion,created_at,updated_at,head_sha,html_url}' <<<"$RUN")
          CONTENT=$(printf '%s\n' "$RESULT" | base64 -w0)
          jq -n \
            --arg message "Record verified reindex result" \
            --arg content "$CONTENT" \
            --arg branch "main" \
            '{message:$message,content:$content,branch:$branch}' > /tmp/result.json
          curl --fail-with-body -sS -L -X PUT "${AUTH[@]}" \
            "$API/contents/$RESULT_PATH" \
            -d @/tmp/result.json >/dev/null

          echo "$RESULT"
          [[ "$(jq -r '.conclusion' <<<"$RUN")" == "success" ]]
