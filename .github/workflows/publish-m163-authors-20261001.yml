name: Monograph 163 live publication verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-m163-authors-20261001.yml
permissions:
  contents: read
concurrency:
  group: publication-m163-authors
  cancel-in-progress: false
jobs:
  verify-live-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/163/
            /public/books/catalog.json
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
      - name: Install HTML inspection dependency
        run: python -m pip install -q beautifulsoup4==4.13.4
      - name: Verify actual public author credits and published asset bytes
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,difflib,hashlib,json,os,re,urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup
          qa=Path(os.environ['RUNNER_TEMP'])/'m163-live';qa.mkdir()
          base=Path('public/books/m/163')
          manifest=json.loads((base/'publication-check-20261001.json').read_text())
          bio=json.loads((base/'authorship-update-20261001.json').read_text())['biography']
          norm=lambda s:re.sub(r'\s+','',s)
          author='王德生、杨彼得'
          stamp='20261001-authors'
          def get(item):
              path,expected=item
              url='https://sdeuniverses.com/'+path.removeprefix('public/')
              if url.endswith('/index.html'):url=url[:-10]
              if url.endswith(('.pdf','.jpg')):url+='?v='+stamp
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'SDE-M163-Live-Verification'})
              with urllib.request.urlopen(req,timeout=60) as r:data=r.read();status=r.status;headers=dict(r.headers);final=r.url
              actual=hashlib.sha256(data).hexdigest()
              record={'path':path,'url':url,'final_url':final,'status':status,'sha256':actual,'exact_source_match':actual==expected,'checks':{}}
              if path.endswith('.html'):
                  live=data.decode('utf-8');source=Path(path).read_text()
                  soup=BeautifulSoup(live,'html.parser')
                  for node in soup(['script','style']):node.decompose()
                  text=soup.get_text(' ',strip=True)
                  label=path.replace('/','_')
                  (qa/label).write_text(live)
                  (qa/(label+'.diff.txt')).write_text(''.join(difflib.unified_diff(source.splitlines(True),live.splitlines(True),fromfile='source',tofile='delivered'))[:120000])
                  if path.endswith('m/163/index.html'):
                      record['checks']={'author_order':author in norm(text),'second_author_biography':norm(bio) in norm(text),'updated_pdf_link':('civilization-history.pdf?v='+stamp) in live,'updated_cover_link':('cover.jpg?v='+stamp) in live}
                  elif path.endswith('m/163/text/index.html'):
                      prefix=text.split('目录',1)[0]
                      record['visible_header']=prefix[:500]
                      record['checks']={'header_author_order':author in norm(prefix),'second_author_biography':norm(bio) in norm(text),'updated_cover_link':('cover.jpg?v='+stamp) in live}
                  elif path.endswith('m/163/read.html'):
                      record['checks']={'updated_viewer_pdf':('civilization-history-reader.pdf?v='+stamp) in live}
                  else:
                      cards=[]
                      for a in soup.find_all('a',href=True):
                          if '/books/m/163/' not in a['href']:continue
                          for node in a.find_parents(['article','li','div']):
                              t=node.get_text(' ',strip=True)
                              if len(t)<6000 and '人类文明史' in t and '王德生' in t:
                                  cards.append(t);break
                      record['book_cards']=list(dict.fromkeys(cards))
                      record['checks']={'target_card_found':bool(cards),'second_author_on_target_cards':bool(cards) and all('杨彼得' in s for s in cards),'updated_cover_link':('/books/m/163/cover.jpg?v='+stamp) in live}
                  record['verified']=all(record['checks'].values())
              else:
                  record['verified']=actual==expected
                  if path.endswith('.json'):
                      (qa/'live-catalog.json').write_bytes(data)
              return record
          records=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              futures={pool.submit(get,item):item[0] for item in manifest['published_files_sha256'].items()}
              for future in concurrent.futures.as_completed(futures):
                  try:records.append(future.result())
                  except Exception as e:records.append({'path':futures[future],'verified':False,'error':str(e)})
          records.sort(key=lambda r:r['path'])
          result={'book':manifest['title'],'book_number':163,'authors':manifest['authors'],'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'production_content_commit':'0787a34ef348ce612623c028e489fb76725d5348','complete':all(r['verified'] for r in records),'records':records}
          (qa/'live-publication-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result['complete'],'One or more live publication checks failed; see exact records.'
          PY
      - name: Preserve the live responses and publication verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monograph-163-live-verification
          retention-days: 3
          path: ${{ runner.temp }}/m163-live/
