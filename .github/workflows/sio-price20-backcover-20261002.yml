name: SIO book 2 price USD20 and back-cover update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sio-price20-backcover-20261002.yml']
permissions:
  contents: write
concurrency:
  group: publication-sio-m2
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/books/m/2/
            /public/books/catalog.json
            /public/books/index.html
            /public/monographs/index.html
            /public/sites/read/library/index.html
            /tools/build_bookshelf.py
            /tools/maintenance/sio_price20_backcover_20261002.py
            /.github/workflows/sio-price20-backcover-20261002.yml
      - name: Prepare typography and file-validation tools
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-arphic-gbsn00lp
          python -m pip install -q Pillow PyMuPDF fonttools lxml beautifulsoup4 cairosvg playwright
          fc-cache -f
          cp tools/maintenance/sio_price20_backcover_20261002.py "$RUNNER_TEMP/update-sio-book.py"
          mkdir -p "$RUNNER_TEMP/sio-price20-qa"
      - name: Update only the authorized price, back cover, and associated entrances
        run: |
          git config user.name 'SDE Publication Build'
          git config user.email 'publication-build@users.noreply.github.com'
          for attempt in 1 2 3; do
            python "$RUNNER_TEMP/update-sio-book.py" "$GITHUB_WORKSPACE/public/books/m/2" "$RUNNER_TEMP/sio-price20-qa" "$GITHUB_WORKSPACE"
            rm -f tools/maintenance/sio_price20_backcover_20261002.py .github/workflows/sio-price20-backcover-20261002.yml
            git add --sparse public/books/m/2 public/books/catalog.json public/books/index.html public/monographs/index.html public/sites/read/library/index.html tools/maintenance/sio_price20_backcover_20261002.py .github/workflows/sio-price20-backcover-20261002.yml
            git diff --cached --stat
            git commit -m 'Set SIO volume 2 price to USD20, display back cover and update PDFs/Word; preserve all 13 chapters; no reindex'
            if git push origin HEAD:main; then git rev-parse HEAD > "$RUNNER_TEMP/sio-price20-qa/content-commit.txt"; break; fi
            test "$attempt" -lt 3 || exit 1
            git fetch origin main
            git reset --hard origin/main
          done
      - name: Verify the actual deployed price and exact binary documents
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,urllib.request,time,datetime,concurrent.futures,zipfile,io
          from bs4 import BeautifulSoup
          import fitz
          from PIL import Image
          root=Path('public/books/m/2');out=Path(os.environ['RUNNER_TEMP'])/'sio-price20-qa';base='https://sdeuniverses.com/books/m/2/';rev='20261002-price20-v11'
          report={'book':2,'version':'1.1','release_id':rev,'price':20,'priceCurrency':'USD','reindex_requested':False,'content_commit':(out/'content-commit.txt').read_text().strip(),'binary_checks':{},'html_checks':{},'bookshelves':{},'preserved_thirteen_chapters':True}
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 SDE-Price-BackCover-Verification','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          for attempt in range(48):
            try:
              s=BeautifulSoup(get(base+'?v='+rev),'html.parser')
              assert 'USD 20.00' in s.select_one('[data-book-price]').get_text()
              assert s.select_one('#back-cover-image')
              ld=json.loads(s.find('script',attrs={'type':'application/ld+json'}).string);assert ld['offers']['price']=='20.00' and ld['offers']['priceCurrency']=='USD'
              break
            except Exception as e:
              if attempt==47:raise
              time.sleep(12)
          names=['back-cover.png','back-cover.svg','sio-ontology-reader-v1.pdf','sio-ontology-print-v1.pdf','sio-ontology-v1.docx','page-data.js','pages/0002.webp','pages/0005.webp','pages/0430.webp']
          def binary(n):
            data=get(base+n+'?v='+rev);expected=hashlib.sha256((root/n).read_bytes()).hexdigest();assert hashlib.sha256(data).hexdigest()==expected,n
            return n,{'status':200,'bytes':len(data),'sha256':expected,'matches_repository':True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:report['binary_checks']=dict(ex.map(binary,names))
          for n in ['index.html','text/index.html','read.html','sio-ontology-portable.html']:
            live=BeautifulSoup(get(base+n+'?v='+rev),'html.parser');source=BeautifulSoup((root/n).read_text(),'html.parser')
            assert live.find('main').get_text(' ',strip=True)==source.find('main').get_text(' ',strip=True),n
            assert '不另定价格' not in live.get_text() and '未另定价格' not in live.get_text(),n
            report['html_checks'][n]={'status':200,'main_content_identical':True}
          for url in ['https://sdeuniverses.com/books/','https://sdeuniverses.com/monographs/','https://read.sdeuniverses.com/library/']:
            soup=BeautifulSoup(get(url+'?v='+rev),'html.parser');cards=soup.select('article[data-id="m-2"]');assert len(cards)==1,url
            assert '定价20美元' in cards[0].get_text(),url
            report['bookshelves'][url]={'single_book_record':True,'price_visible':True}
          cat=json.loads(get('https://sdeuniverses.com/books/catalog.json?v='+rev));b=next(x for x in cat['books'] if x['id']=='m-2');assert b['price']==20 and b['priceCurrency']=='USD' and b['backCoverUrl']
          for n in ['sio-ontology-reader-v1.pdf','sio-ontology-print-v1.pdf']:
            pdf=fitz.open(root/n);assert len(pdf)==430 and len(pdf.get_toc())==491
            assert 'USD 20.00' in pdf[1].get_text() and 'USD 20.00' in pdf[-1].get_text()
          z=zipfile.ZipFile(root/'sio-ontology-v1.docx');xml=z.read('word/document.xml').decode();assert 'USD 20.00' in xml and '不另定价格' not in xml
          assert z.read('word/media/image2.png')==(root/'back-cover.png').read_bytes()
          report.update(pdf_pages=430,pdf_bookmarks=491,pdf_publication_price=True,pdf_back_cover_page=430,word_price_and_back_cover=True,verified_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          (out/'price-backcover-verification-v1.1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Verify real desktop and mobile back-cover display
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,shutil,subprocess,sys
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['RUNNER_TEMP'])/'sio-price20-qa';base='https://sdeuniverses.com/books/m/2/';results={}
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome:subprocess.run([sys.executable,'-m','playwright','install','--with-deps','chromium'],check=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
            for name,w,h in [('desktop',1440,1050),('mobile',390,844)]:
              ctx=browser.new_context(viewport={'width':w,'height':h});page=ctx.new_page()
              page.goto(base+'?v=20261002-price20-v11',wait_until='domcontentloaded');page.wait_for_selector('[data-book-price]');assert 'USD 20.00' in page.locator('[data-book-price]').inner_text()
              page.screenshot(path=str(out/f'{name}-price.png'),full_page=False)
              page.get_by_role('link',name='查看封底',exact=True).click();page.locator('#back-cover-image').scroll_into_view_if_needed()
              page.wait_for_function('document.getElementById("back-cover-image").complete && document.getElementById("back-cover-image").naturalWidth===1200')
              assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
              page.locator('#back-cover').screenshot(path=str(out/f'{name}-cover-gallery.png'))
              page.goto(base+'text/?v=20261002-price20-v11#back-cover',wait_until='domcontentloaded');assert page.locator('section.chapter').count()==13
              page.locator('#back-cover img').scroll_into_view_if_needed();page.wait_for_function('document.querySelector("#back-cover img").complete && document.querySelector("#back-cover img").naturalWidth===1200')
              assert 'USD 20.00' in page.locator('#back-cover').inner_text()
              page.goto(base+'read.html?v=20261002-price20-v11#page=430',wait_until='domcontentloaded')
              page.wait_for_function('window.SIO_BOOK && window.SIO_BOOK.price===20 && document.getElementById("left").src.includes("0430.webp") && document.getElementById("left").complete && document.getElementById("left").naturalWidth>0')
              page.screenshot(path=str(out/f'{name}-reader-back-cover.png'))
              results[name]={'price_visible':True,'detail_back_cover_visible':True,'text_back_cover_visible':True,'reader_back_cover_page':430,'no_horizontal_overflow':True};ctx.close()
            browser.close()
          f=out/'price-backcover-verification-v1.1.json';report=json.loads(f.read_text());report['browser_checks']=results;report['verified_live']=True;f.write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(results,ensure_ascii=False))
          PY
      - name: Record final live verification without changing manuscript or index
        run: |
          cat > "$RUNNER_TEMP/record-sio-price.py" <<'PY'
          from pathlib import Path
          import os,json,hashlib
          b=Path('public/books/m/2');out=Path(os.environ['RUNNER_TEMP'])/'sio-price20-qa';r=json.loads((out/'price-backcover-verification-v1.1.json').read_text());assert r['verified_live']
          for n,v in r['binary_checks'].items():assert hashlib.sha256((b/n).read_bytes()).hexdigest()==v['sha256'],'Concurrent content changed: '+n
          (b/'price-backcover-verification-v1.1.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          p=b/'publication-manifest.json';m=json.loads(p.read_text());m.update(deployment_status='live-verified',verification_record='price-backcover-verification-v1.1.json',verified_at_utc=r['verified_at_utc'],price=20,priceCurrency='USD',reindex_requested=False);p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          p=b/'release-check.json';c=json.loads(p.read_text());c.setdefault('deployment',{}).update(status='live-verified',verification_record='price-backcover-verification-v1.1.json',verified_at_utc=r['verified_at_utc']);c['price_backcover_browser_checks']=r['browser_checks'];c['reindex']=False;p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          PY
          for attempt in 1 2 3; do
            python "$RUNNER_TEMP/record-sio-price.py"
            git add --sparse public/books/m/2/price-backcover-verification-v1.1.json public/books/m/2/publication-manifest.json public/books/m/2/release-check.json
            git commit -m 'Record SIO USD20 and back-cover live verification: web, PDF, Word, three shelves, desktop and mobile; no reindex'
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3 || exit 1
            git fetch origin main
            git reset --hard origin/main
          done
      - name: Preserve verification and revised reader files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sio-price20-backcover-v11
          retention-days: 7
          path: |
            ${{ runner.temp }}/sio-price20-qa/
            public/books/m/2/sio-ontology-v1.docx
            public/books/m/2/sio-ontology-reader-v1.pdf
            public/books/m/2/sio-ontology-print-v1.pdf
            public/books/m/2/back-cover.png
            public/books/m/2/back-cover.svg
            public/books/m/2/price-backcover-verification-v1.1.json
