name: bootstrap-who-may-finish-v2-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-who-may-finish-v2.yml'

permissions:
  contents: write
  actions: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the final publisher activation script
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/activate_final_publisher.py <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib

          root = Path('.')
          stage = root / '.publish' / 'who-may-finish-v2'
          parts = sorted(stage.glob('workflow*.b64'))
          if len(parts) != 3:
              raise SystemExit(f'Expected 3 workflow parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != '9fcb4503ca134f893161c49661e92a39dd7fbbfdb75ca2dadba701f1ae4f1ec1':
              raise SystemExit('Publisher workflow compressed hash mismatch')
          raw = bz2.decompress(compressed)
          if len(raw) != 27107 or hashlib.sha256(raw).hexdigest() != '49c48d04c6c7838bfb4da9ced2b9f2162385fa51839bc3f53793d45fab2d2db5':
              raise SystemExit('Publisher workflow source hash mismatch')
          text = raw.decode('utf-8')
          text = text.replace('on:\n  push:', 'on:\n  workflow_dispatch:\n  push:', 1)
          target = root / '.github' / 'workflows' / 'publish-who-may-finish-v2.yml'
          target.write_text(text, encoding='utf-8')
          for p in parts:
              p.unlink()
          bootstrap = root / '.github' / 'workflows' / 'bootstrap-who-may-finish-v2.yml'
          if bootstrap.exists():
              bootstrap.unlink()
          print(f'Activated {target} ({target.stat().st_size} bytes)')
          PY

      - name: Commit the publisher on the freshest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SDE Publication Bot'
          git config user.email 'actions@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/activate_final_publisher.py
            git add -A
            git diff --cached --check
            git commit -m 'Activate final Must-Read publisher for 王德生'
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" -eq 1

      - name: Dispatch the final publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 3
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/SIOWDS/sdeuniverses-site-/actions/workflows/publish-who-may-finish-v2.yml/dispatches \
              -d '{"ref":"main"}')
            if [ "$code" = 204 ]; then
              echo 'Final publisher dispatched.'
              exit 0
            fi
            cat /tmp/dispatch.out || true
            sleep 3
          done
          exit 1
