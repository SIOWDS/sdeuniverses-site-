<text x="162" y="330" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC',sans-serif" font-size="30" fill="#C9A857" letter-spacing="10">金句</text><text x="162" y="400" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">稳定不是起点，而是差异洪流与特征纠缠共同压出的阶</text><text x="162" y="484" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">段性成果。</text><text x="162" y="618" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">十篇文章，一条从「为什么」到「怎么做」的链：先讲发生学为什么必然出现，再立底</text><text x="162" y="678" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">盘、写引擎、给出回写的闭环。</text><text x="162" y="764" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">最后把同一台发动机用到思想创新、欲望、抑郁、无为与慢性病上。</text><text x="162" y="880" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="36" fill="#C9A857">知识的完成度，在发生链条是否可复写。</text>
