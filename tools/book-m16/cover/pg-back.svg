<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 2400" width="1700" height="2400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1A34"/>
<stop offset="0.72" stop-color="#1B3158"/><stop offset="1" stop-color="#172B4E"/></linearGradient>
<pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.7" fill="#FFFFFF" fill-opacity="0.07"/></pattern>
<radialGradient id="halo"><stop offset="0" stop-color="#C9A857" stop-opacity="0.30"/><stop offset="0.55" stop-color="#C9A857" stop-opacity="0.09"/>
<stop offset="1" stop-color="#C9A857" stop-opacity="0"/></radialGradient></defs>
