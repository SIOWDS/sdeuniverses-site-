<text x="162" y="330" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC',sans-serif" font-size="30" fill="#C9A857" letter-spacing="10">要句</text><text x="162" y="400" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">真理不是先摆在那里、等实践去验证的东西；它在实践</text><text x="162" y="484" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">里生成。</text><text x="162" y="618" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">我们习惯把实践当作检验真理、落实良知的手段。本书把这个安排倒过来：所谓检验，</text><text x="162" y="678" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">是把两次发生放在一起比较，留下在变化里依然站得住的东西。</text><text x="162" y="764" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">以 SIO 本体论与意义三律为地基，全书讲方法怎样生成、技术怎样配合、工具怎样参</text><text x="162" y="824" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">与意义的发生，再放进课堂、医学、生产力与商业里去用。五编二十一章。</text><text x="162" y="940" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="36" fill="#C9A857">实践不是理论的仆人，而是它的源头。</text>
<line x1="162" y1="2045" x2="700" y2="2045" stroke="#C9A857" stroke-width="2.5" stroke-opacity="0.8"/>
<text x="162" y="2110" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">德麦国际出版社 · Demai International Press</text>
