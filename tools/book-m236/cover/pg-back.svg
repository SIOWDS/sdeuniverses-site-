<circle cx="1455" cy="330" r="118" fill="none" stroke="#C9A857" stroke-width="3" stroke-opacity="0.5"/>
<circle cx="1455" cy="330" r="10" fill="#C9A857" fill-opacity="0.8"/>
<text x="162" y="330" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC',sans-serif" font-size="30" fill="#C9A857" letter-spacing="10">要句</text><text x="162" y="400" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">创造力不是天才的独角戏，而是结构的产物。</text><text x="162" y="534" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">为什么人类文明可以在同一层级上循环千年，又在最近两百年突然起飞？为什么瑞士钟</text><text x="162" y="594" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">表业把精益求精做到极致，却错过了石英革命？为什么 AI 正在接管人类的问题求解，</text><text x="162" y="654" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">却不能自动产生创造？</text><text x="162" y="740" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">本书提出：创造力的发生，是从「六步法」到「九步法」的维度跃迁。六步法是问题求</text><text x="162" y="800" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">解的基本引擎；九步法在其上新增迭代、分化、升维。没有六步，九步是空中楼阁；没</text><text x="162" y="860" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">有后三步，六步是原地踏步。</text><text x="162" y="946" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">论证跨越个体认知、制造业、国家发展与文明分型，并破除灵感说、年轻说、天赋论三</text><text x="162" y="1006" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">个创造力神话。十一编三十九章，五份附录。</text><text x="162" y="1122" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="36" fill="#C9A857">人在两头，AI 在中间。</text>
<line x1="162" y1="2045" x2="700" y2="2045" stroke="#C9A857" stroke-width="2.5" stroke-opacity="0.8"/>
<text x="162" y="2110" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">德麦国际出版社 · Demai International Press</text>
<text x="162" y="2165" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">德麦国际专著第 236 号</text>
<text x="162" y="2220" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">定价 US$50.00</text>
