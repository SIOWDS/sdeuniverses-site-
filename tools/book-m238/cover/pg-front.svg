<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 2400" width="1700" height="2400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1A34"/>
<stop offset="0.72" stop-color="#1B3158"/><stop offset="1" stop-color="#172B4E"/></linearGradient>
<pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.7" fill="#FFFFFF" fill-opacity="0.07"/></pattern>
<radialGradient id="halo"><stop offset="0" stop-color="#C9A857" stop-opacity="0.30"/><stop offset="0.55" stop-color="#C9A857" stop-opacity="0.09"/>
<stop offset="1" stop-color="#C9A857" stop-opacity="0"/></radialGradient></defs>
<rect width="1700" height="2400" fill="url(#bg)"/><rect width="1700" height="2400" fill="url(#dots)"/>
<circle cx="1054" cy="1440" r="640" fill="url(#halo)"/>
<circle cx="1054" cy="1440" r="505" fill="none" stroke="#C9A857" stroke-width="3" stroke-opacity="0.42"/>
<svg x="554.0" y="940.0" width="1000" height="1000" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
<circle cx="500" cy="470" r="455" fill="none" stroke="#C9A857" stroke-width="3" stroke-opacity="0.45"/>
<!-- 龙：一圈被斩开的盘绕，缺口在右上 -->
<path d="M783,148 A372,372 0 1 0 872,372" fill="none" stroke="#58BDCA" stroke-width="5" stroke-dasharray="3 20" stroke-linecap="round" stroke-opacity="0.8"/>
<!-- SIO：主体—互动—客体，三个节点围成一个整体 -->
<g fill="none" stroke="#EFE8D6" stroke-linejoin="round">
<polygon points="500,290 673,590 327,590" stroke-width="9"/>
<polygon points="500,350 621,560 379,560" stroke-width="3" stroke-opacity="0.45"/>
</g>
<g fill="#0C1A34" stroke="#EFE8D6" stroke-width="7">
<circle cx="500" cy="290" r="19"/><circle cx="673" cy="590" r="19"/><circle cx="327" cy="590" r="19"/>
</g>
<!-- 特征：差异稳定下来的那一点 -->
<circle cx="500" cy="490" r="62" fill="none" stroke="#C9A857" stroke-width="3" stroke-opacity="0.55"/>
<circle cx="500" cy="490" r="34" fill="none" stroke="#C9A857" stroke-width="3" stroke-opacity="0.8"/>
<circle cx="500" cy="490" r="15" fill="#C9A857"/>
<!-- 刀：一道自右上斜贯的金色刀锋，穿过龙的缺口 -->
<path d="M840,110 L548,430 L520,470 L506,442 L810,98 Z" fill="#C9A857" fill-opacity="0.92"/>
<line x1="840" y1="110" x2="520" y2="470" stroke="#EFE8D6" stroke-width="3" stroke-opacity="0.9" stroke-linecap="round"/>
<g stroke-linecap="round" fill="none">
<line x1="300" y1="860" x2="700" y2="860" stroke="#C9A857" stroke-width="9"/>
<line x1="350" y1="900" x2="650" y2="900" stroke="#EFE8D6" stroke-width="6" stroke-opacity="0.85"/>
<line x1="400" y1="936" x2="600" y2="936" stroke="#58BDCA" stroke-width="5" stroke-opacity="0.85"/>
</g>
</svg>
