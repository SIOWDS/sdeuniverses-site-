<circle cx="1455" cy="330" r="10" fill="#C9A857" fill-opacity="0.8"/>
<text x="162" y="330" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC',sans-serif" font-size="30" fill="#C9A857" letter-spacing="10">要句</text><text x="162" y="400" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">特征不是发现的，而是发生的。</text><text x="162" y="534" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">两千年来，西方哲学把「特征」——这是甜的、这是红的、这是硬的——当成固有物：有</text><text x="162" y="594" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">人否认它，有人冻结它，有人把它虚无化。</text><text x="162" y="680" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">本书六篇论文提出特征律：当主体—互动—客体整体的差异稳定下来，意识同一性必然</text><text x="162" y="740" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">生成，这就是特征。以此为刀，从亚里士多德、康德、黑格尔到尼采与后现代，逐一解</text><text x="162" y="800" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">构，并给出可操作的刀法。</text><text x="162" y="886" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">六篇八十九章，另有各篇摘要、结论、后记与附论。</text><text x="162" y="1002" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="36" fill="#C9A857">屠龙已毕，真理重生。</text>
<line x1="162" y1="2045" x2="700" y2="2045" stroke="#C9A857" stroke-width="2.5" stroke-opacity="0.8"/>
<text x="162" y="2110" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">德麦国际出版社 · Demai International Press</text>
<text x="162" y="2165" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">德麦国际专著第 238 号</text>
<text x="162" y="2220" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">定价 US$25.00</text>
