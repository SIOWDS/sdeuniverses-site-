<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1004px;height:1418px;overflow:hidden;font-family:"Noto Serif CJK SC",serif;color:#f4ecd8;
background:radial-gradient(ellipse 70% 42% at 50% 60%,#2a3f72 0%,#1a2c57 45%,#121f42 100%);position:relative}
.series{position:absolute;right:96px;top:92px;text-align:right;font-family:"Noto Sans CJK SC",sans-serif;font-size:15px;letter-spacing:.32em;color:#b9b2a0;line-height:1.7}
.pre{position:absolute;left:96px;top:150px;font-size:34px;letter-spacing:.12em;color:#efe7d2}
.title{position:absolute;left:92px;top:200px;font-size:92px;font-weight:700;letter-spacing:.06em;color:#fbf6e8}
.sub{position:absolute;left:96px;top:340px;font-size:23px;line-height:1.75;color:#d9b866;letter-spacing:.05em}
.rule{position:absolute;left:96px;top:440px;width:92px;border-top:2.5px solid #c9a24f}
svg{position:absolute;left:0;top:470px}
.labels{position:absolute;top:1130px;left:0;width:1004px}
.lab{position:absolute;width:200px;text-align:center;font-size:22px;color:#f1e8d0;font-weight:700}
.lab small{display:block;font-size:14px;color:#c9a24f;font-weight:400;margin-top:6px;letter-spacing:.2em}
.lab i{display:block;width:8px;height:8px;border-radius:50%;background:#c9a24f;margin:0 auto 12px}
.author{position:absolute;left:96px;top:1232px;font-size:27px;letter-spacing:.18em;color:#f2ead6}
.pub{position:absolute;left:96px;top:1300px;font-family:"Noto Sans CJK SC",sans-serif;font-size:19px;font-weight:700;color:#d9b866;letter-spacing:.1em}
.pub span{display:block;font-weight:400;font-size:13px;color:#9e977f;letter-spacing:.08em;margin-top:6px}
</style></head><body>
<div class="series">SDE UNIVERSES<br>德麦国际专著 · 第 509 号</div>
<div class="pre">儒家思想体系的</div>
<div class="title">六路径大解构</div>
<div class="sub">从1到N的发展之道<br>到0到1的典范发生之道</div>
<div class="rule"></div>
<svg width="1004" height="660" viewBox="0 0 1004 660">
 <defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e6c56f" stop-opacity=".42"/><stop offset="100%" stop-color="#e6c56f" stop-opacity="0"/></radialGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c9a24f"/></marker>
 </defs>
 <g transform="translate(502,320)">
  <circle r="300" fill="none" stroke="#c9a24f" stroke-opacity=".28" stroke-width="1"/>
  <circle r="262" fill="none" stroke="#c9a24f" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 7"/>
  <circle r="170" fill="url(#glow)"/>
  <!-- hexagon of six paths -->
  <g id="hex" fill="none" stroke="#c9a24f" stroke-width="1.6" stroke-opacity=".85">
   <polygon points="0,-210 181.9,-105 181.9,105 0,210 -181.9,105 -181.9,-105"/>
  </g>
  <!-- inner triangle S D E -->
  <g stroke="#e9d28e" stroke-width="1.4" fill="none" stroke-opacity=".7">
   <polygon points="0,-92 79.7,46 -79.7,46"/>
  </g>
  <!-- plum blossom at centre -->
  <g transform="rotate(-18)">
   <g fill="#e2bf62" fill-opacity=".92">
    <ellipse cx="0" cy="-26" rx="15" ry="20"/>
    <ellipse cx="0" cy="-26" rx="15" ry="20" transform="rotate(72)"/>
    <ellipse cx="0" cy="-26" rx="15" ry="20" transform="rotate(144)"/>
    <ellipse cx="0" cy="-26" rx="15" ry="20" transform="rotate(216)"/>
    <ellipse cx="0" cy="-26" rx="15" ry="20" transform="rotate(288)"/>
   </g>
   <circle r="11" fill="#1a2c57"/><circle r="5" fill="#f5e2a6"/>
  </g>
  <!-- S D E nodes -->
  <g font-family="Noto Serif CJK SC" font-size="26" font-weight="700" fill="#fbf3dc" text-anchor="middle">
   <circle cx="0" cy="-92" r="19" fill="#1a2c57" stroke="#e9d28e" stroke-width="1.6"/><text x="0" y="-83">S</text>
   <circle cx="79.7" cy="46" r="19" fill="#1a2c57" stroke="#e9d28e" stroke-width="1.6"/><text x="79.7" y="55">D</text>
   <circle cx="-79.7" cy="46" r="19" fill="#1a2c57" stroke="#e9d28e" stroke-width="1.6"/><text x="-79.7" y="55">E</text>
  </g>
  <!-- six path labels on hexagon vertices -->
  <g font-family="Noto Sans CJK SC" font-size="17" fill="#e7d9b0" text-anchor="middle" letter-spacing="2">
   <circle cx="0" cy="-210" r="6" fill="#c9a24f"/><text x="0" y="-228">S→D→E</text>
   <circle cx="181.9" cy="-105" r="6" fill="#c9a24f"/><text x="250" y="-100">S→E→D</text>
   <circle cx="181.9" cy="105" r="6" fill="#c9a24f"/><text x="250" y="111">E→S→D</text>
   <circle cx="0" cy="210" r="6" fill="#c9a24f"/><text x="0" y="242">E→D→S</text>
   <circle cx="-181.9" cy="105" r="6" fill="#c9a24f"/><text x="-250" y="111">D→E→S</text>
   <circle cx="-181.9" cy="-105" r="6" fill="#c9a24f"/><text x="-250" y="-100">D→S→E</text>
  </g>
  <!-- the new one: a small bud breaking out of the circle -->
  <path d="M 196,-196 C 228,-232 252,-246 282,-262" fill="none" stroke="#c9a24f" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#ar)"/>
  <g transform="translate(296,-270)"><circle r="9" fill="none" stroke="#f5e2a6" stroke-width="1.6"/><circle r="3.5" fill="#f5e2a6"/></g>
 </g>
</svg>
<div class="labels">
 <div class="lab" style="left:152px"><i></i>1到N<small>发展</small></div>
 <div class="lab" style="left:402px"><i></i>六路径<small>先后</small></div>
 <div class="lab" style="left:652px"><i></i>0到1<small>发生</small></div>
</div>
<div class="author">WDS博士　著</div>
<div class="pub">德麦国际出版社<span>Demai International Press</span></div>
</body></html>
