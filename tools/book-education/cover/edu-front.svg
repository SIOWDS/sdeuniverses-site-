  <path d="M842 92 L856 128 L894 130 L864 154 L874 192 L842 170 L810 192 L820 154 L790 130 L828 128 Z" fill="#58BDCA"/>
  <!-- 层与层之间的虚线箭头 -->
  <g stroke="#58BDCA" stroke-width="4" stroke-dasharray="6 12" stroke-linecap="round" fill="none" stroke-opacity="0.8">
    <path d="M300 780 L300 690"/><path d="M640 420 L700 330"/>
  </g>
  <path d="M288 700 L300 676 L312 700 Z" fill="#58BDCA" fill-opacity="0.8"/>
</svg>
<text x="162" y="400" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="62" font-weight="bold" fill="#EFE8D6" letter-spacing="4">普通人都能明白的</text>
