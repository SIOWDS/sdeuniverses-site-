<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- 下层：一串脚印（细的那一层，一步一步） -->
  <g fill="#EFE8D6" fill-opacity="0.85">
    <ellipse cx="190" cy="842" rx="15" ry="27" transform="rotate(-12 190 842)"/>
    <ellipse cx="248" cy="808" rx="15" ry="27" transform="rotate(-12 248 808)"/>
    <ellipse cx="312" cy="846" rx="15" ry="27" transform="rotate(-12 312 846)"/>
    <ellipse cx="372" cy="812" rx="15" ry="27" transform="rotate(-12 372 812)"/>
    <ellipse cx="436" cy="850" rx="15" ry="27" transform="rotate(-12 436 850)"/>
    <ellipse cx="496" cy="816" rx="15" ry="27" transform="rotate(-12 496 816)"/>
  </g>
  <line x1="120" y1="900" x2="880" y2="900" stroke="#EFE8D6" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round"/>
  <!-- 中层：一条金色的路往上走，路上一只车轮（工具接管下面一层） -->
  <path d="M120 720 C 330 700, 520 600, 640 470 S 820 250, 880 210" fill="none" stroke="#C9A857" stroke-width="16" stroke-linecap="round"/>
  <path d="M120 720 C 330 700, 520 600, 640 470 S 820 250, 880 210" fill="none" stroke="#0C1A34" stroke-width="3" stroke-dasharray="22 20"/>
  <g transform="translate(560 548)">
    <circle r="58" fill="none" stroke="#C9A857" stroke-width="10"/>
    <circle r="11" fill="#C9A857"/>
    <g stroke="#C9A857" stroke-width="5">
      <line x1="0" y1="-52" x2="0" y2="52"/><line x1="-52" y1="0" x2="52" y2="0"/>
      <line x1="-37" y1="-37" x2="37" y2="37"/><line x1="-37" y1="37" x2="37" y2="-37"/>
    </g>
  </g>
  <!-- 上层：一个站着的人，望向更上面（人往上走一层） -->
  <g stroke="#EFE8D6" stroke-width="9" stroke-linecap="round" fill="none">
    <circle cx="742" cy="232" r="26" fill="#EFE8D6" stroke="none"/>
    <line x1="742" y1="262" x2="742" y2="352"/>
    <line x1="742" y1="290" x2="706" y2="326"/>
    <line x1="742" y1="290" x2="782" y2="252"/>
    <line x1="742" y1="352" x2="716" y2="408"/>
    <line x1="742" y1="352" x2="770" y2="406"/>
  </g>
  <!-- 最上：一颗青色的星（定标准、担后果） -->
  <path d="M842 92 L856 128 L894 130 L864 154 L874 192 L842 170 L810 192 L820 154 L790 130 L828 128 Z" fill="#58BDCA"/>
  <!-- 层与层之间的虚线箭头 -->
  <g stroke="#58BDCA" stroke-width="4" stroke-dasharray="6 12" stroke-linecap="round" fill="none" stroke-opacity="0.8">
    <path d="M300 780 L300 690"/><path d="M640 420 L700 330"/>
  </g>
  <path d="M288 700 L300 676 L312 700 Z" fill="#58BDCA" fill-opacity="0.8"/>
</svg>
