<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 2400" width="1700" height="2400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1A34"/>
<stop offset="0.72" stop-color="#1B3158"/><stop offset="1" stop-color="#172B4E"/></linearGradient>
<pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.7" fill="#FFFFFF" fill-opacity="0.07"/></pattern>
<radialGradient id="halo"><stop offset="0" stop-color="#C9A857" stop-opacity="0.30"/><stop offset="0.55" stop-color="#C9A857" stop-opacity="0.09"/>
<stop offset="1" stop-color="#C9A857" stop-opacity="0"/></radialGradient></defs>
<rect width="1700" height="2400" fill="url(#bg)"/><rect width="1700" height="2400" fill="url(#dots)"/>
<text x="162" y="330" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC',sans-serif" font-size="30" fill="#C9A857" letter-spacing="10">判词</text><text x="162" y="400" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">旧教育看见了人要会想，却把「会想」当成一个人全包；</text><text x="162" y="484" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">新教育要把它拆成两层：机器接管下面那一层，人站到</text><text x="162" y="568" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">上面那一层，会合成，能评判评判者，敢定标准、担后</text><text x="162" y="652" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="52" font-weight="bold" fill="#EFE8D6">果。</text><text x="162" y="786" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">孩子拍下一道题发给会说话的机器，三秒钟，步骤出来了。学校还教什么？本书的回答</text><text x="162" y="846" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">是：机器接管的不是「想」的全部，是「想」的下面那一层。</text><text x="162" y="932" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">车来了，腿退出走路，人进入交通那一层。从算盘、文字、计算器到会说话的机器，人</text><text x="162" y="992" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">与工具的关系，历来是层级的分化与提升。本书讲学生—AI 复合思维体、思维颗粒度、</text><text x="162" y="1052" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">合成与元判断，讲判断也分两层，讲链条停在定标准、担后果上，再落到课堂、考试、</text><text x="162" y="1112" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="34" fill="#D9D3C3">老师和不同年龄的孩子。</text><text x="162" y="1228" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="36" fill="#C9A857">坐车跑得快，不等于腿练好了。</text>
<line x1="162" y1="2045" x2="700" y2="2045" stroke="#C9A857" stroke-width="2.5" stroke-opacity="0.8"/>
<text x="162" y="2110" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">德麦国际出版社 · Demai International Press</text>
<text x="162" y="2165" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">德麦国际专著第 263 号</text>
<text x="162" y="2220" font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif" font-size="30" fill="#D9D3C3">定价 US$20.00</text>
